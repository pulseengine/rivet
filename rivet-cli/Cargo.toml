[package]
name = "rivet-cli"
description = "CLI for SDLC artifact traceability, validation, and serving"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rivet"
path = "src/main.rs"

# REQ-202 / #456: the validate/list/commit-check hot path must be buildable
# without the web + MCP + LSP stack. `default` keeps all three on, so
# `cargo install rivet` and the released binary are byte-for-byte unchanged;
# `cargo build -p rivet-cli --no-default-features` yields the minimal
# traceability core (parser + validate + list + commit checks). `serve` embeds
# an MCP HTTP endpoint (`crate::mcp::RivetServer`), so it enables `mcp`.
[features]
default = ["serve", "mcp", "lsp"]
mcp = ["dep:rmcp", "dep:tokio"]
serve = ["mcp", "dep:axum", "dep:tower-http", "dep:notify"]
# `lsp` enables `serve`: the LSP hover-preview reuses the shared HTML renderer
# (`crate::render`), whose component/context types still live in the `serve`
# module. Fully decoupling render from serve so LSP needn't pull the web stack
# is tracked as #104; until then lsp ⊇ serve.
lsp = ["serve", "dep:lsp-server", "dep:lsp-types"]
wasm = ["rivet-core/wasm"]

[dependencies]
rivet-core = { path = "../rivet-core" }
clap = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
etch = { path = "../etch" }
petgraph = { workspace = true }
urlencoding = { workspace = true }
lsp-server = { version = "0.7", optional = true }
lsp-types = { version = "0.97", optional = true }
rowan = { workspace = true }
notify = { version = "7", optional = true }
rmcp = { version = "1.3.0", features = ["server", "transport-io", "macros", "transport-streamable-http-server"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
sha2 = { workspace = true }
rmcp = { version = "1.3.0", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
