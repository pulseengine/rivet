  # ── REQ-067: F7 — document the architectural commitment ───────────────
  - id: REQ-067
    type: requirement
    title: "cross-repo doc topic must name the two parallel systems and when each applies"
    status: draft
    description: |
      Until DD-067 is decided, integrators have no documented basis to
      pick between `externals:` (git-based federated graph) and
      `external-anchor` + `cited-source` (content-hash anchored
      document). The cross-repo doc topic talks only about the first;
      the schema-cited-sources doc topic talks only about the second.
      The just-shipped `rivet supplier pull` (the federation handshake)
      is mentioned only in `rivet supplier --help` — F11.

      Until the architectural commitment is made, the doc must:
        (a) acknowledge both mechanisms exist,
        (b) describe when each applies (decision tree: supplier is rivet
            and you want git federation → externals; supplier is
            non-rivet OR you only need a single document anchor →
            external-anchor),
        (c) link to DD-067 as the open architectural decision,
        (d) include the AoU-X7 register entry: "the integrator picks
            exactly one of the two cross-repo mechanisms per cross-link
            and documents the choice".

      When DD-067 lands one way or the other, this requirement closes
      and the deprecation/removal work begins.

      Related design decision: see [[DD-067]] for the architectural
      commitment to be made.
      Acceptance:
        - Run `rivet docs cross-repo`.
        - Verify the output contains all three substrings:
          "externals:", "external-anchor", and "supplier pull".
        - Verify the output contains a decision-rule section header
          (e.g., "When to use which") with at least three sentences
          of guidance covering supplier-is-rivet vs supplier-is-not-rivet.
        - Verify the output cites DD-067 (or the artifact that
          replaces it) by ID.
        - When DD-067 lands one direction or the other, this REQ
