  # ── REQ-062: F2 — validate must not lie about failed parses ───────────
  - id: REQ-062
    type: requirement
    title: "rivet validate must surface skipped artifact files as Errors, not stderr-only WARNs"
    status: draft
    description: |
      `rivet validate` currently emits `[WARN  rivet_core::formats::generic]
      skipping ...: YAML parse error: unknown field ...` to stderr while
      reporting `Result: PASS (0 warnings)` to stdout. The skipped files
      are not counted in `errors`, `warnings`, or `diagnostics[]` in
      either the text or JSON output. The Cederqvist principle (and
      ISO 26262-8 §11.4.5.3 by extension): a tool whose error-detection
      layer reports the inverse of ground truth cannot stand as TD1.

      The fix MUST:
        - promote any skipped artifact file to an Error-severity
          Diagnostic counted in `errors[]` with `rule: artifact-parse-error`,
        - exit non-zero when any file in a configured source path failed
          to parse,
        - reflect this in both text and `--format json` output.

      Sub-case F2a: user wrote wrong-shape artifact YAML (e.g., one
      artifact per file without `artifacts:` wrapper). Surfaces with
      "unknown field 'id'".

      Sub-case F2b: project legitimately has non-artifact YAML in the
      configured source path (feature models, variant configs, binding
      manifests). Rivet's own repo trips on this with 140 stderr WARNs
      from `artifacts/{bindings,feature-model,variants/*}.yaml`. The fix
      must distinguish "could not parse" (Error) from "is not an
      artifact-file and shouldn't have been considered" (silently
      excluded or whitelisted via rivet.yaml).

      Evidence:
        - docs/research/cross-git-repo-investigation.md §2 F2 (dogfood
          observation: 140 WARNs on Rivet's own repo)
        - /tmp/rivet-cross-git/findings.md F2 (reproducer)
        - /tmp/rivet-cross-git/personas/01-pragmatic-maintainer.md
          ("if rivet validate can ever PASS while files in the project
           failed to parse, the tool is lying")
        - /tmp/rivet-cross-git/personas/02-tuv-auditor.md
          ("a green PASS over a parse that failed is the same defect
           as a green PASS over a safety case that failed")
        - /tmp/rivet-cross-git/personas/04-first-time-user.md
          (real first-time-user trust loss)

      Verification: oracle-gated test in
      `rivet-cli/tests/cli_commands.rs` that asserts a project with
      one wrong-shape file (a) reports a parse-error Diagnostic in
      `--format json`, (b) exits non-zero, (c) refuses to claim PASS.
      Acceptance:
        - Create a project with one well-formed artifact YAML and one
          malformed (top-level `id:` instead of `artifacts:` wrapper).
        - Run `rivet validate --format json`.
        - Verify exit code 1, `result: FAIL`, `errors >= 1`, and at
          least one entry in `diagnostics[]` with `rule:
          artifact-parse-error` whose `message` names the malformed
          file.
        - On Rivet's own repo (F2b reproducer), the pre-existing 140
          stderr "no frontmatter" WARNs must either become counted
          diagnostics or be excluded by an explicit `artifact_file:
          false` / per-format dispatcher.
    tags: [validate, p0, cross-org, seooc, cederqvist]
    fields:
      priority: must
      category: functional
      baseline: v0.11.0-track
    links:
      - type: derives-from
        target: FEAT-135
    provenance:
      created-by: ai-assisted
      model: claude-opus-4-7
      timestamp: 2026-05-19T18:30:00Z

  # ── REQ-063: F1 — broken safety-critical presets ──────────────────────
  - id: REQ-063
    type: requirement
    title: "rivet init must not silently produce non-validating projects for safety-critical presets"
    status: draft
    description: |
      `rivet init --preset {do-178c, en-50128, iec-61508, iec-62304}`
      exits 0 and writes `rivet.yaml` with `schemas: [common, <name>]`
      but the schema is neither embedded in the binary nor written to
      disk. The next `rivet validate` fails with `Schema error: schema
      '<name>' not found on disk or as embedded schema`. The broken set
      is exactly the four safety-critical industry-standard presets;
      the five working presets (dev, aspice, stpa, cybersecurity, aadl)
      are demo/dogfood quality.

      The First-Time User persona's reaction captures the user-perceived
      consequence: "If I were cynical I'd say the demo presets work and
      the production presets don't."

      Fix options (any one suffices):
        (a) embed the four schemas in the binary like the working five,
        (b) write them to `./schemas/<name>.yaml` during init,
        (c) refuse init with `--preset <unimplemented>` and produce a
            helpful error naming what is implemented today.

      Option (c) is the lowest-cost honest fix. Option (a) is the right
      long-term move once the schemas exist; option (b) is a sensible
      middle ground if file-on-disk is acceptable. Until any one ships,
      AoU-X5 in docs/rivet-is-not.md must explicitly state that these
      four presets are not for new compliance work.

      Evidence:
        - /tmp/rivet-cross-git/findings.md F1 (preset-by-preset reproducer)
        - /tmp/rivet-cross-git/personas/04-first-time-user.md
          (real first-30-minute failure)
        - /tmp/rivet-cross-git/personas/01-pragmatic-maintainer.md
          ("turns a sales demo into a lawsuit")
      Acceptance:
        - For each of {do-178c, en-50128, iec-61508, iec-62304}: in a
          fresh tempdir, run `rivet init --preset <name>` then
          `rivet validate`.
        - If option (a) or (b) was chosen: validate exits 0 on a
          freshly initialised project for all four presets.
        - If option (c) was chosen: `rivet init --preset <broken>`
          itself exits non-zero with a message naming the implemented
          presets.
        - Current baseline: all four fail with `Schema error: schema
          '<name>' not found on disk or as embedded schema`. Any of
          (a) / (b) / (c) closes this REQ.
    tags: [init, preset, safety-critical, p1]
    fields:
      priority: must
      category: functional
      baseline: v0.11.0-track
    links:
      - type: derives-from
        target: FEAT-135
    provenance:
      created-by: ai-assisted
