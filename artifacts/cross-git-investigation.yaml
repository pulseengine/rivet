  # ── REQ-069: Producer-side commands ───────────────────────────────────
  - id: REQ-069
    type: requirement
    title: "rivet supplier publish + producer-readable manifest for the producer-side cross-org story"
    status: draft
    description: |
      Every cross-org command in v0.10.1 is consumer-side: `supplier list`,
      `supplier check`, `supplier pull`. There is no `supplier publish`,
      no `supplier sign`, no producer-readable manifest a supplier can
      attach to a PO that downstream consumers ingest.

      The Producer persona's headline finding: "Ship `rivet supplier
      publish` before you ship one more consumer-side feature. Producers
      need a command that hashes, signs, and emits a manifest WE can
      attach to a PO, independent of whether the consumer is running
      Rivet at all."

      The Producer's drafted AoU (file:
      /tmp/rivet-cross-git/personas/06-supplier-producer.md) is the
      template Rivet does not yet ship:

        ACME-shipped artifacts are delivered as a sha256-pinned file
        plus a published manifest. Consumers assume obligations:
          (a) validate received sha256 against ACME's published manifest
              before ingestion,
          (b) run rivet validate in ACME's published baseline before
              raising defects,
          (c) treat derives-from-external as the contractually-meaningful
              boundary,
          (d) any warning ACME shipped in the published manifest is
              in-scope for audit — absence in consumer-side validate
              does not constitute absence of warnings.

      MUST design and ship (in this order):
        (i)  A producer-side manifest format covering: artifact list,
             per-artifact sha256, baseline-validate-state-at-publish-time,
             contract reference, signature (sigstore keyless preferred,
             matching the v0.10.1 release-signing precedent).
        (ii) `rivet supplier publish` command that emits the manifest.
        (iii) Consumer-side `rivet supplier verify <manifest>` that
              cross-checks every linked external-anchor against the
              producer's published state.

      Until this lands, every cross-org Rivet integration is a
      single-sided contract drafted by the consumer alone.
    tags: [supplier, producer, federation, phase-3]
    fields:
      priority: must
      category: functional
      baseline: v0.11.0-track
