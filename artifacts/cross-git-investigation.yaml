  # ── REQ-065: F6 — warning propagation across cross-repo boundary ──────
  - id: REQ-065
    type: requirement
    title: "rivet validate must expose supplier diagnostics via opt-in cross_repo_diagnostics"
    status: draft
    description: |
      `rivet validate` on the consumer does NOT surface the supplier's
      diagnostics. ACME has 3 warnings + 1 info in its standalone
      validate; Pulse (which links to ACME via BOTH `externals:` AND
      `external-anchor`/`cited-source`) reports `cross_repo_broken: 0`
      and no ACME diagnostics. The consumer's green PASS is independent
      of the supplier's internal state — the Cederqvist function-signature
      cliff transposed across an organisational boundary.

      This is the SEooC-defining finding of the investigation. Four of
      six personas (Pragmatic, Auditor, Submodules Migrant, Producer)
      converge on the same prescription:

        (a) document this categorically as AoU-X1 in docs/rivet-is-not.md
            (the integrator runs validate on every linked external in CI;
            Rivet does not propagate supplier diagnostics across the
            boundary),
        (b) ship a `--with-externals-validate` flag that, when set, runs
            validate in each external and surfaces diagnostics under a
            new `cross_repo_diagnostics` array in `--format json`,
        (c) keep the default behaviour (no propagation) because the
            cross-repo run has different performance characteristics —
            but make the trade-off explicit, not implicit.

      Producer-tension to record: this propagation is good for auditors
      (transparency) and uncomfortable for producers (internal warnings
      shipped to customers). The Safety Manual must name the tension
      and let each contract specify the policy.

      Evidence:
        - /tmp/rivet-cross-git/logs/s3-warnings.log (the empirical proof
          of non-propagation: ACME stdout vs Pulse stdout)
        - /tmp/rivet-cross-git/personas/02-tuv-auditor.md (AoU draft)
        - /tmp/rivet-cross-git/personas/06-supplier-producer.md
          (the producer-tension framing)
      Acceptance:
        - Set up two projects: supplier (with 3 deliberate validation
          warnings on its own artifacts) and consumer (linked to
          supplier via both `externals:` AND `external-anchor`).
        - Run `rivet validate --with-externals-validate --format
          json` in the consumer.
        - Verify the JSON output contains a key
          `cross_repo_diagnostics` with array length >= 3.
        - Verify each entry carries fields: `source_project`,
          `source_artifact_id`, `severity`, `message`, `rule`.
        - Default behaviour (no `--with-externals-validate` flag)
          MUST remain unchanged — no propagation, no performance
          regression on single-repo validate.
    tags: [validate, cross-repo, seooc-aou, p1]
    fields:
      priority: must
