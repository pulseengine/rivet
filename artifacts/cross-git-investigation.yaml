  # ── DD: the architectural commitment (F7) ─────────────────────────────
  - id: DD-067
    type: design-decision
    title: Pick one cross-repo mechanism for v1.0
    status: draft
    description: |
      Rivet currently ships two parallel cross-repo mechanisms with no
      documented relationship (F7):

        (a) `externals:` in rivet.yaml + `rivet sync` + prefixed IDs
            (e.g. `acme:WIDGET-1`). Pin = git SHA via `rivet lock`.
            Supplier must be a rivet repo.
        (b) `external-anchor` artifact + `cited-source` typed field +
            `rivet supplier pull`. Pin = sha256 of file contents.
            Supplier-agnostic (works for ReqIF, PDF, OSLC sources).

      The Federation Architect persona's analysis (file:
      /tmp/rivet-cross-git/personas/03-federation-architect.md) lays
      out the choice: of four typical OEMs only one could ever consume
      `externals:` — three out of four ship ReqIF/Polarion/Excel. The
      git-aware federated graph is the wrong abstraction for
      cross-organisational work; content-hash pinning on a delivered
      artifact is what the DIA actually contracts on.

      The Submodules Migrant persona (file: 05-*.md) corroborates:
      "Two parallel cross-repo systems with no documented relationship
      is exactly the kind of thing that made me reject the last three
      submodules-replacements."

      Recommendation under review: keep `external-anchor` + `cited-source`
      as the canonical cross-repo primitive; deprecate `externals:` over
      v0.11 (doc topic removed) → v0.12 (`legacy: true` in schema) →
      v1.0 (removed entirely). The rivet-to-rivet case becomes "a
      supplier publishes a manifest of anchors and the consumer
      subscribes" — same primitive, generalised.

      Counter-arguments to weigh:
        - `externals:` powers the existing cross-repo doc topic and the
          v0.10.x dogfood tests. Removing it affects internal use.
        - The "supplier publishes a manifest of anchors" generalisation
          is not designed yet; it would be REQ-NEW work, not just
          deletion.
        - Some integrators are already on `externals:` and will resist
          deprecation. The mitigation is a long sunset window and a
          documented migration recipe.

      Decision required by: v0.11.0 planning. Until decided, REQ-067 below
      tracks the documentation gap as a stop-the-press AoU.
    rationale: |
      The two-mechanism status quo is the OSLC failure mode the
      Federation Architect persona named directly: ship the second
      mechanism, claim it supersedes the first, keep both alive forever
      because somebody depends on the old one. Three of four canonical
      OEMs cannot consume the git-based `externals:` model; only
      content-hash pinning fits ReqIF, Polarion, and Excel-via-SFTP
      suppliers. The architect's recommendation (delete `externals:`
      over v0.11 → v1.0) is therefore not aesthetic preference but
      operational necessity for cross-org work that is not
      rivet-to-rivet. Counter-argument: the existing dogfood + the
      cross-repo doc topic depend on `externals:` and removal cost is
      not zero. Holding the decision open until v0.11.0 planning gives
      time to draft the supplier-publishes-anchor-manifest replacement.
    tags: [cross-org, architecture, deprecation]
    fields:
      decision-status: proposed
      decision-date: 2026-05-19
      decision-maker: project-lead
