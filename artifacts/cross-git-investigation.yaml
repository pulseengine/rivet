  # ── REQ-068: F8 — supplier pull must refuse on drift ──────────────────
  - id: REQ-068
    type: requirement
    title: "rivet supplier pull must refuse-and-error on sha256 mismatch against a prior stamp"
    status: draft
    description: |
      `rivet supplier pull <anchor>` currently accepts new supplier
      bytes silently, overwriting the local cache and exiting 0 (S2
      reproducer in /tmp/rivet-cross-git/logs/s2-drift.log). The new
      sha256 appears in the output but with no DRIFT header, no error
      severity, no exit-code change. By contrast,
      `rivet validate --strict-cited-sources` correctly fails on the
      same drift.

      The asymmetry is the bug: pull (the side that brings the new bytes
      INTO the cache) silently accepts them; validate (the side that
      observes them after the fact) refuses. Pull must be the
      authorisation point; validate is the verification point.

      Fix MUST:
        (a) Detect when `pull` would overwrite a previously-stamped
            cache entry with new bytes whose sha256 contradicts the
            stamp.
        (b) Refuse and exit non-zero with an error naming the prior
            hash, the new hash, and the supplier identity.
        (c) Provide `--accept-drift` flag for explicit auditor override
            (auditor accepts the new bytes are intentional supplier
            revision; equivalent to re-stamping).

      Producer-side concern (persona 6): without this, the consumer's
      CI can quietly pull a different version of an ACME-shipped
      document and ACME's stamp never enters the conversation. That is
      the cryptographic-verifiability failure that destroys cross-org
      audit trails.

      Evidence:
        - /tmp/rivet-cross-git/logs/s2-drift.log (silent overwrite,
          exit 0, new hash with no header)
        - /tmp/rivet-cross-git/personas/02-tuv-auditor.md
          ("destructive operation masquerading as a fetch")
        - /tmp/rivet-cross-git/personas/06-supplier-producer.md
          (producer-side liability)
      Acceptance:
        - In a project with one external-anchor pulled and stamped
          with sha256 X, mutate the supplier file so its bytes
          now hash to Y != X.
        - Run `rivet supplier pull <anchor>` without flags.
        - Verify exit code non-zero with an error message naming
          both X and Y and the supplier identity (org + contract).
        - Run `rivet supplier pull <anchor> --accept-drift`.
        - Verify exit 0, cache updated to Y, and the anchor's
          `last-synced` field refreshed.
        - Lock the regression with a fixture in
          `rivet-cli/tests/cli_commands.rs` in the
          `supplier_pull_*` family.
    tags: [supplier-pull, drift, cryptographic-verifiability, p2]
    fields:
      priority: must
      category: functional
      baseline: v0.11.0-track
    links:
      - type: derives-from
        target: FEAT-135
    provenance:
      created-by: ai-assisted
      model: claude-opus-4-7
      timestamp: 2026-05-19T18:30:00Z

  # ── REQ-069: Producer-side commands ───────────────────────────────────
  - id: REQ-069
    type: requirement
    title: "rivet supplier publish + producer-readable manifest for the producer-side cross-org story"
    status: draft
    description: |
      Every cross-org command in v0.10.1 is consumer-side: `supplier list`,
      `supplier check`, `supplier pull`. There is no `supplier publish`,
      no `supplier sign`, no producer-readable manifest a supplier can
      attach to a PO that downstream consumers ingest.

      The Producer persona's headline finding: "Ship `rivet supplier
      publish` before you ship one more consumer-side feature. Producers
      need a command that hashes, signs, and emits a manifest WE can
      attach to a PO, independent of whether the consumer is running
      Rivet at all."

      The Producer's drafted AoU (file:
      /tmp/rivet-cross-git/personas/06-supplier-producer.md) is the
      template Rivet does not yet ship:

        ACME-shipped artifacts are delivered as a sha256-pinned file
        plus a published manifest. Consumers assume obligations:
          (a) validate received sha256 against ACME's published manifest
              before ingestion,
          (b) run rivet validate in ACME's published baseline before
              raising defects,
          (c) treat derives-from-external as the contractually-meaningful
              boundary,
          (d) any warning ACME shipped in the published manifest is
              in-scope for audit — absence in consumer-side validate
              does not constitute absence of warnings.

      MUST design and ship (in this order):
        (i)  A producer-side manifest format covering: artifact list,
             per-artifact sha256, baseline-validate-state-at-publish-time,
             contract reference, signature (sigstore keyless preferred,
             matching the v0.10.1 release-signing precedent).
        (ii) `rivet supplier publish` command that emits the manifest.
        (iii) Consumer-side `rivet supplier verify <manifest>` that
              cross-checks every linked external-anchor against the
              producer's published state.

      Until this lands, every cross-org Rivet integration is a
      single-sided contract drafted by the consumer alone.
      Acceptance:
        - `rivet supplier publish --help` returns subcommand help
          (not "unrecognized subcommand").
        - Running `rivet supplier publish --out manifest.yaml` on a
          project with one or more external-anchors emits a YAML
          manifest containing: per-artifact sha256,
          baseline-validate-state-at-publish-time, contract
          reference, optional sigstore signature path.
        - `rivet supplier verify <manifest>` run from a consumer's
          project returns exit 0 when the consumer's local
          supplier-cache matches the manifest's hashes, non-zero
          otherwise.
        - Documentation: a `rivet docs supplier-publish` topic
          exists and walks through the producer → consumer
          handshake end-to-end.
