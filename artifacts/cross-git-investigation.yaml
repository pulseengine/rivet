  # ── REQ-066: F4 — cited-source missing from external-anchor schema ────
  - id: REQ-066
    type: requirement
    title: "external-anchor schema must declare cited-source field (one-line schema edit)"
    status: draft
    description: |
      Every `external-anchor` artifact with a `cited-source` (the shape
      `rivet supplier pull` requires) emits at validate time:

        INFO: [ANCHOR-X] field 'cited-source' is not defined in schema
              for type 'external-anchor'

      The artifact type built for cross-org references does not declare
      the field that enables federation. Fix: one-line addition to
      `schemas/common.yaml` under the `external-anchor` type's field
      list, naming `cited-source` with `type: mapping`, `required: false`,
      and a description pointing at `rivet docs schema-cited-sources`.

      This is the cheapest fix in the entire change list. Ship it as a
      standalone PR; closes a per-artifact noise diagnostic that affects
      every cross-org integration.

