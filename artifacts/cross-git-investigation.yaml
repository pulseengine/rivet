  # ── REQ-064: F5 — derives-from-external must parse end-to-end ─────────
  - id: REQ-064
    type: requirement
    title: "derives-from-external link must parse structured-target mapping end-to-end"
    status: draft
    description: |
      The `derives-from-external` link type (shipped via #292 with
      structured target `{org, contract, doc-id, last-synced, sha256,
      anchor}`) is silently demoted to `derives-from` with zero targets
      when used in production validate. Reproducer S4 of the
      investigation: a sw-req with a `derives-from-external` mapping
      target yields `ERROR: link 'derives-from' requires at least 1
      target, found 0`. The schema knows about the link type; the
      yaml_hir extractor does not handle the mapping shape outside of
      the #292 unit-test fixture.

      The TÜV Auditor persona's framing: "the v0.10.1 release notes
      claim derives-from-external carries the structured payload; the
      test bed shows the parser silently demotes the link... fix the
      parser or retract the claim; both are acceptable, silence is not."

      The Producer persona's downstream consequence: "consumer follows
      the published design doc, writes the link against my artifact,
      gets an ERROR that names the wrong link type, and sends me an
      angry email at 16:30 on a Friday."

      Fix MUST: ensure `rivet validate` correctly identifies and
      processes `derives-from-external` links with structured targets
      such that (a) the link type is preserved, (b) the anchor field of
      the structured target is used for graph navigation, (c) the full
      structured payload survives in `Link.external`.

      Verification: cross-repo integration test using the test-bed
      fixture shape from /tmp/rivet-cross-git/pulse-integrator/.
