  - id: REQ-327
    type: requirement
    title: "rivet cannot state what a release contains, so its notes are hand-written and its supply-chain evidence goes unrecorded"
    status: verified
    description: "Maintainer request, designed and grounded 2026-09-06. A release is currently described by hand: scope is re-typed from the release-scope query into CHANGELOG prose, and the notes have drifted from that query twice, caught only by diffing them mechanically. Meanwhile the release produces evidence that nothing records. AUTHORITATIVE GROUNDING: Automotive SPICE PAM v4.1 (VDA QMC), process SPL.2 Product Release, whose purpose is to control the release of a product to the intended customer. BP5 requires release approval before delivery; BP6 requires that each release is accompanied by a release note. Information item 11-03 Release note is the specification this feature should implement rather than anything invented here. It IDENTIFIES the set of functionalities provided, limitations in relation to the committed scope, known non-conformities, application parameters, configurations and variants, unique name and version of the release, added or removed functionalities, changed or improved functionalities, and documentation of resolved non-conformities. It INCLUDES intended area and environment of usage, impact to other components linked to the release, upstream or downstream compatibility, copyright and license information, result of verification and validation measures, approval for delivery by responsible roles, and dependencies to other linked products. Two of the four sections chosen with the maintainer BEFORE reading the PAM turn out to be mandated rather than optional: limitations in relation to the committed scope is the notes-versus-query diff already run by hand, and known non-conformities is the residuals section. The standard treats declared gaps as first-class release-note content, which is why a mock-up over real v0.36.0 data had an ABSENCE as its highest-signal line — external references, 0 of 10 declared. Three elements were missed and rivet already produces evidence for each: copyright and license information from the Cargo Deny licenses gate, configurations and variants from the existing variant subsystem, and approval by responsible roles from the existing review-signoff oracle which enforces reviewer identity distinct from author identity per GP 2.1.7 and GP 2.2.4. SECOND FINDING: rivet already ships supply-chain.yaml with a complete release model its own releases do not use — release-artifact (artifact-name, version, digest, signing-status of signed/unsigned/verified, artifact-type, contains sbom-component), build-attestation, and vulnerability (cve-id, severity, cvss-score, vuln-status, remediation). Every field maps to something v0.36.0 produced and discarded: a CycloneDX SBOM, a cosign bundle with pem and sig, per-asset SHA256 digests verified by hand, and fifteen cargo-audit ignore entries which are declared-unresolved vulnerabilities each carrying a written rationale. DECISION, maintainer, 2026-09-06: rivet EMITS release-artifact and vulnerability artifacts per release rather than only reporting over them, so its own supply-chain evidence becomes part of the trace and supply-chain.yaml is dogfooded by its author. More work, and considerably more honest. Linkage reuses the existing cited-source base field (uri, kind of file/url/github/oslc/reqif/polarion, sha256, last-checked) rather than a new directive; oslc and polarion cover Jira and DOORS. Links are NEVER inferred — an artifact without a cited-source renders as an explicit gap, because regexing issue numbers out of prose would both miss a Jira ticket and invent links from stray text. Output reuses the templates override pattern (embedded default, copy-to-project, diff for drift). BLOCKER to fix first: rivet list --format json exposes only id, links, status, title, type and the release field, so the mock-up had to parse raw YAML for cited-source and provenance and scrape coverage --tests text for evidence lines. NOT MODELLED anywhere yet, also produced by SPL.2: 11-04 product release package, 13-06 delivery evidence, 13-13 product release approval, and 18-06 product release criteria — the last being the conditions to be satisfied prior to authorizing delivery, which is what the release readiness query already computes informally. rivet is the first consumer. IMPLEMENTED 2026-09-09 as `rivet release notes <version> [--since <ref>] [--format markdown|text|json]`, scoped to what the trace can already answer: identification, functionalities provided grouped by artifact type, limitations in relation to the committed scope taken from the release-readiness predicate already used by `release status`, result of verification measures, and the commits since a base ref whose trailers name an artifact in this release. The note ENDS by naming the eight 11-03 elements rivet does not yet compute, each with the evidence it would have to come from, because a release note that silently omits a required element is worse than one that declares the gap — the same doctrine that made an ABSENCE the highest-signal line of the original mock-up. The supply-chain half of this requirement, emitting release-artifact and vulnerability artifacts per release, is NOT in this change and remains open. TWO DEFECTS IN THE FIRST VERSION OF THIS FEATURE, both caught before merge and both worth recording because they are the failure modes this project keeps rediscovering. FIRST, the note computed verification evidence from `verifies` backlinks alone, and therefore reported all four delivered v0.37.0 artifacts as having no evidence while every one of them is status verified — because this repository verifies almost entirely through `// rivet: verifies` source markers. That is #788 and REQ-329 reproduced in a third surface on the first attempt, in a document intended as release evidence, and it is exactly the hazard REQ-333 names when it requires the review to be computed once in rivet-core rather than per surface. Evidence is now the union of links and markers, and the note prints the two counts SEPARATELY so the asymmetry is visible rather than averaged away. SECOND, the changes section rendered every `#N` token in a commit subject as closes #N. Under squash-merge a subject's `#N` is usually the PULL REQUEST, not an issue, and the two cannot be told apart from the text; asserting closure would have fabricated a claim inside a compliance record. They are now reported as refs. THIRD, and the reason the first two matter: the initial regression test for the marker fix PASSED against a deliberately reverted links-only implementation. Its assertions — that the output contains the phrase source marker, and does not contain a specific no-evidence string — are both satisfied by the broken version, whose failure message itself reads neither a verifies link nor a source marker and which routes the artifact down a different branch entirely. The negative control failing to redden is what exposed it; the assertions now name the positive outcome and the exact per-kind counts, and reddening was re-confirmed. EVIDENCE CORRECTION 2026-09-09, found while auditing what actually discharges this requirement. The test named `release_notes_never_claims_an_issue_was_closed` was VACUOUS: it invoked `release notes` with no `--since`, so the changes section never rendered at all, and its assertion that the output does not contain 'closes #' passed on empty output. Proven by negative control — reverting the source from 'refs' back to 'closes' left the test GREEN. So the no-false-closure guarantee, which is the property that keeps a fabricated claim out of a release record, had no coverage whatsoever while appearing to have some. That is worse than no test, because a reader auditing the trace sees a marker and a plausible test name and stops looking; the vacuous test was therefore DELETED rather than repaired. Replaced by two tests over a real git fixture — `git init`, a base commit carrying `Trace: skip`, then a squash-merge-shaped subject `fix(thing): repair the thing (#42) (#77)` with a `Fixes: REQ-001` trailer. That shape is deliberate and is the whole point: #42 is an issue and #77 is the pull request, they are indistinguishable from the subject text alone, and the note must therefore report both as refs and assert closure of neither. The first test asserts the section RENDERS before asserting anything about its contents, which is the specific step whose absence made the old test vacuous; the second asserts a commit naming no artifact in this release is excluded. The new test reddens when 'refs' is reverted to 'closes' while the old one did not, which is what establishes the difference. Note for future audits: mapping a marker to a plausibly-named test is NOT sufficient to judge evidence, because that is exactly the check this defect passed. Only running the negative control finds this class."
    release: v0.37.0
    tags: [release, traceability, supply-chain, aspice]
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-09-06T00:00:00Z
  - id: REQ-329
    type: requirement
    title: "coverage link rules cannot see source markers, so the same evidence reads 0 percent and 100 percent in two views (#788)"
    status: verified
    description: "Reported from varve (#788). Plain `rivet coverage` reported the requirement-verification rule at 0 percent while `coverage --tests` reported 100 percent for the same requirements, from the same evidence. The link rule counts graph-level verifies backlinks from artifact-store test artifacts; a source marker is not a backlink, so it is invisible to that rule — while `rivet verify` accepts exactly those markers as sufficient evidence to advance a requirement to verified. Two views of one evidence set up to 100 points apart, with nothing telling a release gate or dashboard it is reading the narrower one. Reproduced on a minimal fixture (1/1 versus 0/1) and on rivet's own repository, where the rule reports 8.9 percent and the marker view reports 37.9 percent. Deliberately NOT fixed by folding markers into the rule, which is one of the two options the reporter offered: that would silently move a number that --fail-under gates on. Fixed by making the gap visible, which is what this tool already does for empty scopes (#808), unchecked cross-refs (#854) and unmodelled rules (REQ-320) — plain coverage now names the requirements counted as uncovered that DO carry marker evidence and points at the marker view. On rivet's own repository it names 98 of them. Scoped to rules whose link type is verifies: a marker is a verifies claim and says nothing about a satisfies backlink, so an unscoped note would announce marker evidence for rules a marker can never satisfy. That scoping was missing in the first implementation and was found only because a negative control failed to redden — the unscoped version reported 2 where the rule reported 1, and the assertion that caught it had to be written before the control meant anything."
    release: v0.37.0
