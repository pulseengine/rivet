  - id: REQ-343
    type: requirement
    title: "the runner-liveness probe runs on ubuntu-latest, so it cannot report during the hosted starvation it exists to detect (#927)"
    status: verified
    description: "Observed live 2026-09-09T22:30Z. The probe was itself QUEUED for ten minutes on ubuntu-latest while twelve self-hosted runners sat entirely idle (online=12 busy=0), and the condition it was queued behind is GitHub-hosted starvation — which is one of the five failure modes it exists to detect. A monitor that shares the failure mode it monitors is blind exactly when it is needed. Confirmed at runner-liveness.yml line 52, runs-on ubuntu-latest. THE OBVIOUS FIX IS NOT OBVIOUSLY RIGHT, which is why this is proposed rather than implemented. Moving the probe to self-hosted would make it immune to hosted starvation but blind to a self-hosted pool outage, which per the workflow's own header is the mode it primarily exists to catch. A single-runner-class probe cannot detect its own class's failure, so the choice is which blindness to accept. THE FALLBACK PATTERN THIS REPOSITORY ALREADY USES DOES NOT APPLY. ci.yml pairs a self-hosted job with an unconditional hosted mirror (traceability-hosted-fallback), which works because both run. A needs-based conditional fallback CANNOT work for this case: a starved job stays QUEUED rather than failing, so a dependent job waits on it forever instead of falling through. Two unconditional probe jobs would both work, but they race on creating the tracking issue, which is located by an HTML marker comment and would be created twice if both probes fire simultaneously. Workflow-level concurrency does not solve it either — the group serialises runs, not jobs within a run, and a starved run holding a non-cancelling group slot could deadlock a self-hosted twin behind it. ARGUMENT FOR SELF-HOSTED, recorded because it is not the intuitive answer: the two modes are not equally silent. #855 moved CI Gate and all eleven of its needs to self-hosted, so a self-hosted outage now blocks EVERY merge and is loud by construction — a maintainer discovers it within one pull request. Hosted starvation blocks only advisory jobs and the release workflows, which are ubuntu-latest only, so it is silent until a release is attempted and then blocks it. A probe should watch the mode that does not announce itself. On that reasoning self-hosted is the better placement despite being counterintuitive, and the self-hosted outage would be covered by the merge gate rather than by the probe. This is an architecture decision about what the alarm is FOR and should be made deliberately rather than defaulted into. DECIDED 2026-09-10 by the maintainer: self-hosted. The probe now runs on [self-hosted, linux, x64, light], accepting blindness to a self-hosted outage in exchange for coverage of hosted starvation, on the reasoning recorded above — a self-hosted outage blocks every merge through CI Gate and announces itself within one pull request, whereas hosted starvation is invisible until a release is attempted. The rationale is written into the workflow header beside the runs-on so the next reader does not have to reconstruct why the counterintuitive placement was chosen. A GENUINE RISK SURFACED WHILE IMPLEMENTING, and it would have turned this fix into a worse defect than the one it repairs. The probe is built entirely from `gh` calls, and `gh` ships preinstalled on GitHub-hosted images but NOT on this fleet: a survey of every workflow found that no self-hosted job in the repository used `gh` before this change, so its presence could not be assumed. Moving the probe without checking would have traded blind during hosted starvation for blind always — an alarm that is silently dead is worse than one that is merely wrong, because nothing distinguishes it from an alarm with nothing to report. Handled with two steps mirroring the zola guard already in ci.yml: install `gh` into RUNNER_TEMP when absent, needing no sudo and persisting nothing on the host, then ASSERT it is on PATH and fail loudly with a message naming the cause if it is not. Both directions negative-controlled locally — the assertion exits 0 with `gh` present and exits 1 emitting the error when PATH is reduced to /usr/bin:/bin. Note that `jq`, which diagnose.sh depends on, IS already proven available on self-hosted light, since the YAML Lint job runs diagnose_test.sh there. UNVERIFIED UNTIL IT RUNS: whether `gh` is already present on the Hetzner runners, and therefore whether the install path is exercised at all. The guard covers both cases, so the first scheduled run answers it either way."
