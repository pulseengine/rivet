  - id: REQ-140
    type: requirement
    title: "Generic-YAML load is inconsistent across commands: validate loads a file that list/get/export silently drop"
    status: draft
    description: |
      Surfaced while verifying issue #353 against current `main` (the silent
      file-skip of #353 part 1 is already fixed by REQ-062). A file with an
      `artifacts:` list AND an unknown sibling top-level key (the reporter's
      `traceability.yaml` with `loss-coverage:`) is handled inconsistently:

        * `rivet list` / `get` / `export` build the store via the strict
          `load_artifacts` adapter (serde `deny_unknown_fields`) and DROP the
          whole file — its artifacts are invisible to these commands.
        * `rivet validate` builds its store via the lenient
          `yaml_hir::extract_schema_driven` path, which tolerates the unknown
          key and LOADS the artifacts — then ALSO reports the same file as
          `artifact-parse-error` "failed to parse".

      So the same project yields different artifact sets depending on the
      command, and `validate` simultaneously validates an artifact (REQ-2)
      and declares its file unparseable — a contradictory signal. Verified
      empirically: `rivet list` shows only REQ-1; `rivet validate` shows
      REQ-2 as a loaded (mis-typed) artifact plus the parse-error.

      This is a design decision (which parser is canonical, and is the
      tolerant behaviour intended?) — flagging for the maintainer rather than
      unilaterally picking. The fix should make every command agree, on the
      loud-fail side: a file that can't be cleanly parsed as artifacts should
      be treated identically everywhere (either all load-and-warn, or all
      drop-and-error), never load in one command and vanish in another.

      Acceptance:
        - For a fixture file with `artifacts:` + an unknown sibling key,
          `rivet list --format json` and the set `rivet validate` type-checks
          contain the SAME artifact IDs.
        - `rivet validate` does not both load an artifact and report its
          source file as failed-to-parse.
    tags: [bug, consistency, loud-fail, parser, user-reported, issue-353, needs-maintainer-decision]
    fields:
      priority: should
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-062

  - id: REQ-141
    type: requirement
    title: "rivet modify --where <filter>: query-driven bulk status/field set in one race-free pass"
    status: implemented
    description: |
      Feature ask from GitHub issue #353 (dogfooding meld). Bringing a real
      project's requirement statuses in line with shipped code meant a bulk
      `draft`/`planned` -> `implemented` flip, and the only tool was a shell
      loop of per-ID `rivet modify` invocations — which the reporter found
      silently no-op'd under redirection (a suspected reload/rewrite race
      between rapid-succession subprocesses).

      Add `rivet modify --where '<s-expr>' --set-status … ` (and any other
      `--set-*`): select every artifact matching the same s-expression filter
      `rivet query` uses, and apply the change in a SINGLE in-process pass —
      load once, validate every target up front (all-or-nothing), then write
      each affected file once. Because it never re-spawns a subprocess per ID,
      it cannot race the way the shell loop could. `--where` is mutually
      exclusive with a positional `<ID>` (clap-enforced). `--dry-run` previews
      the match set without writing. An empty match set is a loud no-op
      ("no artifacts match the --where filter") so silence is never read as
      success. Reuses the existing `sexpr_eval` engine (design on existing
      patterns, not a new filter dialect).

      Acceptance:
        - `rivet modify --where '(= status "draft")' --set-status implemented
          --dry-run` lists the matching IDs and leaves every file byte-identical.
        - Without `--dry-run` the same command flips exactly the matching
          artifacts (non-matches untouched) and prints "modified N artifacts".
        - `rivet modify <ID> --where '…'` is rejected (mutually exclusive).
        - A `--where` matching nothing prints "no artifacts match" and exits 0.
    tags: [cli, modify, bulk, agent-ux, dx, loud-fail, user-reported, issue-353]
    fields:
      priority: should
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-007

  - id: REQ-142
    type: requirement
    title: "s-expr filter parse error shows the common field-equality example"
    status: implemented
    description: |
      Self-reported via GitHub issue #381 (dogfooding). The s-expression
      filter dialect (shared by `query`, `list --filter`, `export --filter`,
      `modify --where`) puts an OPERATOR in head position, but the single most
      common first attempt is `(status "draft")` — field name in head — which
      fails with `unknown form 'status'`. The error listed every supported
      head form but showed no example of the correct `(= field "value")`
      shape, costing every first-time author (human or agent) a failed
      round-trip + a grep through the test files to discover it.

      The `unknown head symbol` note now states the head is an operator (not a
      field name) and shows the field-equality form inline:
      `(= status "draft")` / `(and (= type "requirement") (has-tag "safety"))`.
      Because the note is generated once in `sexpr_eval`, the improvement
      reaches every command that parses a filter. The `export --filter` help
      also gained an example (it previously had none, unlike `list`/`query`).

      Acceptance:
        - `rivet list --filter '(status "draft")'` (or any command) prints a
          note containing `(= status "draft")`.
        - `cargo test -p rivet-core --lib
          sexpr_eval::tests::parse_error_unknown_head_surfaces_note` passes
          (asserts the example is present).
    tags: [dx, agent-ux, discoverability, sexpr, user-reported, issue-381]
    fields:
      priority: should
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-007

  - id: REQ-143
    type: requirement
    title: "External artifact refs with a hyphenated prefix (kebab project slug) must resolve, not 404"
    status: implemented
    description: |
      User-reported (0.14.0). Browsing `/artifacts/linc-mesh:A-AVTP-STREAM` in
      serve returned "Artifact does not exist", and external `prefix:ID` refs
      with a hyphenated prefix were unresolved in document rendering, even
      though the artifact existed in the external project.

      Root cause: `externals::parse_artifact_ref` required the prefix to be
      PURELY `is_ascii_lowercase()` — no hyphens. A kebab-case project slug
      like `linc-mesh` failed the check, so the ref fell through to
      `ArtifactRef::Local("linc-mesh:A-AVTP-STREAM")` and was looked up as a
      local id (404). But externals are stored as `<prefix>:<id>` with that
      same hyphenated prefix, so the parse no longer round-tripped its own
      stored form. Every external whose prefix contained a hyphen was
      unreachable in serve detail view and in document link resolution.

      Fix: accept a kebab-case slug prefix — starts with a lowercase letter,
      then lowercase letters / digits / hyphens. `parse_artifact_ref` is the
      single shared gate (serve detail handler + document link rendering both
      delegate to it), so one fix restores both surfaces. The Kani
      round-trip proof was updated to the new contract.

      Acceptance:
        - `parse_artifact_ref("linc-mesh:A-AVTP-STREAM")` returns
          `External { prefix: "linc-mesh", id: "A-AVTP-STREAM" }`.
        - A ref whose prefix does not start with a lowercase letter (e.g.
          `H-1:2`) stays `Local`.
        - `cargo test -p rivet-core --lib externals::tests` passes.
    tags: [bug, externals, serve, regression, user-reported, v0.14.0]
    fields:
      priority: must
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-085

  - id: REQ-144
    type: requirement
    title: "Source-view artifact-id linking must match whole tokens, not substrings"
    status: implemented
    description: |
      User-reported. In the source view, an artifact id that is a SUBSTRING of
      another id gets wrongly linked. Example: a doc carrying
      `doc-id: SDV-BCM-SWR-001` also has an artifact `SWR-001` in the store;
      because matching uses `str::contains`, `SWR-001` is detected inside
      `SDV-BCM-SWR-001`, producing a spurious link. For a traceability tool
      this is a correctness bug — a phantom trace edge.

      Location: `rivet-cli/src/render/source.rs` lines ~841 and ~856 use
      `line.contains(id.as_str())`. The fix is a whole-token match: an id only
      matches when it is delimited by non-`[A-Za-z0-9-]` characters (ids
      contain hyphens, so hyphen is part of the token, not a delimiter).

      Acceptance:
        - A source line containing `SDV-BCM-SWR-001` does NOT produce a link
          to a shorter artifact `SWR-001` that is merely a substring.
        - A line containing the exact id `SWR-001` (surrounded by whitespace /
          punctuation) still links to it.
        - Regression test in source.rs covers the substring vs whole-token case.
    tags: [bug, source-view, traceability, correctness, user-reported]
    fields:
      priority: should
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-092

  - id: REQ-145
    type: requirement
    title: "Test-results import: honor a rivet_tc_id property for the testcase artifact id"
    status: implemented
    description: |
      User-reported. When importing JUnit-style test results, rivet derives
      the testcase artifact id from `classname` + `name` (the
      `format!("{}.{}", classname, name)` fallback in
      `rivet-core/src/junit.rs::artifact_id_for`), so the link to the intended
      artifact does not resolve. The user records an explicit id per testcase:
      a `rivet_tc_id` property (e.g. value `SYS-VER-058`) and wants rivet to
      use it.

      The JUnit parser does not currently read `<property>` children of
      `<testcase>` (the `ParsedCase` struct has no properties field; the
      element is silently ignored). Add: parse `<property>` children, and in
      `artifact_id_for` add a highest-priority tier that returns the
      `rivet_tc_id` property value when present, before the existing
      classname/name heuristics.

      Acceptance:
        - A testcase (classname `com.x.Y`, name `t`) carrying a `rivet_tc_id`
          property of `SYS-VER-058` imports with artifact id `SYS-VER-058`,
          not `com.x.Y.t`.
        - A testcase with no such property keeps the current classname/name
          behaviour (back-compatible).
        - Parser test covers the property-present and property-absent cases.
    tags: [feature, test-results, junit, import, traceability, user-reported]
    fields:
      priority: should
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-101

  - id: REQ-146
    type: requirement
    title: "Salsa validate path must evaluate status-gate validation-rules (parity with the direct path)"
    status: implemented
    description: |
      Surfaced verifying issue #355 Finding 3 ("rivet validate and rivet check
      gaps-json disagree"). `rivet validate` runs the incremental salsa path
      (`db::validate_all`), which evaluated structural rules (phases 1-7) and
      conditional rules (phase 8) but NOT the status-gate `validation-rules`
      (phase 9 — the `(implies …)` V-model promotion gates). The direct
      `validate::validate*` path (used by `rivet check gaps-json` and
      `rivet validate --direct`) DID evaluate them. Result: the default
      `rivet validate` silently PASSED a project with a status-gate violation
      that `gaps-json`/`--direct` correctly FAILED — a validation soundness
      gap, since the default surface under-reported.

      Fix: `db::validate_all` and `validate_all_with_extras` now also call
      `validate::evaluate_validation_rules` against the same materialized
      store/schema/graph, so every validation surface agrees.

      Acceptance:
        - On a project whose schema declares a `validation-rules` status gate
          that an artifact violates, `rivet validate` (default/salsa) and
          `rivet validate --direct` report the SAME error count, both
          including the gate diagnostic.
        - `cargo test -p rivet-core --lib
          db::tests::validation_rules_evaluated_in_validate_all` passes.
    tags: [bug, validation, salsa, soundness, consistency, issue-355]
    fields:
      priority: must
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-029

  - id: REQ-147
    type: requirement
    title: "Coverage diagnostics say HOW to satisfy a missing backlink, not just what's missing"
    status: implemented
    description: |
      User-reported via #350. Marking a sw-req `implemented` then running
      `rivet validate` produced "should be verified..." / "missing:
      <types>" diagnostics that named WHAT was missing but not HOW to satisfy
      it — which link type connects the artifacts, and that the listed types
      attach via a specific incoming link. The reporter reverse-engineered the
      required shape from an unrelated link-target rejection ("a whole
      detour").

      Two complementary, schema-agnostic improvements:
        1. The `required-backlink` coverage diagnostic now appends the
           incoming link type and the allowed source types, e.g. "… — needs an
           incoming `verifies` link from one of [sw-verification,
           unit-verification, sw-integration-verification]".
        2. The `Lifecycle coverage gaps` summary now points at
           `rivet validate --explain <ID>`, which lists each rule's
           satisfied/MISSING state with the exact incoming link + source types
           (and any alternates).

      Acceptance:
        - On a sw-req with no verification backlink, `rivet validate` output
          for the coverage rule contains "needs an incoming `verifies` link
          from one of [...]".
        - When lifecycle gaps are present, the validate output prints a
          "run `rivet validate --explain <ID>`" pointer.
        - `cargo test -p rivet-core --lib validate::tests` passes.
    tags: [dx, agent-ux, diagnostics, guidance, traceability, user-reported, issue-350]
    fields:
      priority: should
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-125

  - id: REQ-148
    type: requirement
    title: "Schema-consistency check: flag a required-backlink rule whose from-types cannot form the link"
    status: implemented
    description: |
      Surfaced verifying #350 against the aspice schema. The coverage rule
      `swe1-has-verification` declares `source-type: sw-req`,
      `required-backlink: verifies`, `from-types: [sw-verification,
      unit-verification, sw-integration-verification]` — but the link-target
      rules only permit `sw-verification` to `verifies` a `sw-req`
      (unit-verification verifies sw-detail-design; sw-integration-verification
      verifies sw-arch-component/sw-detail-design). So two of the three
      advertised satisfiers can never actually form the backlink, which is
      exactly why the reporter authored a forbidden unit-verification→sw-req
      link and got rejected.

      Add a schema-consistency meta-check (sibling of
      `conditional-rule-consistency`) that flags a `required-backlink` rule
      whose `from-types` include an artifact type that no link-type / rule
      permits to form `<required_backlink>` to the rule's `source-type`. This
      catches the "advertises an unsatisfiable satisfier" class in ANY schema.
      Care needed: target constraints live in both link-type defs and per-type
      link-fields, and the inverse-name convention applies — implement
      conservatively to avoid false positives (prefer false-negatives).

      Note: whether the aspice `from-types` is itself wrong (ASPICE intent:
      SWE.6 sw-verification verifies sw-reqs; unit/integration verify design
      layers) is a maintainer/compliance-semantics call, tracked on #350/#355,
      separate from this generic check.

      Acceptance:
        - A schema with a `required-backlink` rule listing a from-type that
          cannot form the link emits a `coverage-rule-consistency` diagnostic
          naming the rule, the unsatisfiable from-type, and the link.
        - A schema whose from-types are all linkable emits no such diagnostic.
        - Unit test covers both cases.
    tags: [validation, schema-consistency, meta-check, dx, issue-350, issue-355]
    fields:
      priority: should
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-004

  - id: REQ-149
    type: requirement
    title: "Document the recipe for extending a built-in artifact type with project fields"
    status: implemented
    description: |
      User-reported via #350 (suggestion 4): a project's artifacts carried a
      `crate:` field the built-in ASPICE `sw-req` doesn't declare, producing
      37+ `INFO: field 'crate' is not defined in schema` advisories that
      drowned the actionable diagnostics. The reporter asked for "an easy
      per-project field extension... without forking the schema."

      Verified the mechanism already exists: `Schema::merge` /
      `ArtifactTypeDef::merge_in_place` union `fields` by name across schemas
      sharing a type name, so a project-local schema re-declaring the built-in
      type with only the extra field — registered AFTER the built-in in
      `rivet.yaml` `project.schemas` — adds the field without forking.
      Confirmed empirically: with such an extension the `crate` INFO
      disappears; without it the INFO is present. It was simply undocumented.

      Documented in docs/schemas.md ("Extending a built-in artifact type with
      project fields"), with the copy-pasteable recipe and the
      `--min-severity warning` alternative; also corrected the
      "Schema merging behavior" note (artifact types merge fields by name,
      they don't replace wholesale).

      Acceptance:
        - docs/schemas.md contains the "Extending a built-in artifact type"
          recipe (project-local schema re-declaring the type + registering it
          after the built-in).
        - `rivet docs check` PASS.
    tags: [docs, dx, schema, user-reported, issue-350, duplicate-of-req-134]
    fields:
      priority: should
      category: documentation
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-010
      - type: traces-to
        target: REQ-134

  - id: REQ-150
    type: requirement
    title: "rivet add should warn when a new artifact closely duplicates an existing one"
    status: draft
    description: |
      Self-found while dogfooding (this loop). `mutate::validate_add`
      rejects a duplicate `id` but does nothing about a duplicate
      *intent*: an author can file a requirement whose title/description
      restates an existing one and rivet accepts it silently. I did
      exactly this — REQ-149 ("Document the recipe for extending a
      built-in artifact type…") duplicated the pre-existing REQ-134
      ("Per-project field extension for built-in schema types…"); only an
      `rivet list` audit a day later surfaced it. For an agent-driven
      workflow (the explicit use case — agents file findings as
      artifacts) this is a recurring trap: the backlog silently accretes
      near-duplicates.

      Add a discovery aid at add time (and/or a `validate` advisory): when
      a new artifact's title/keywords strongly overlap an existing
      artifact of the same type, surface it — "similar to REQ-134: '…'
      — file anyway?" / an INFO diagnostic listing near-duplicate pairs.
      Design questions to settle: the similarity signal (shared title
      tokens vs an edit-distance threshold — must avoid noise on
      legitimately-distinct short titles), advisory vs blocking, and
      whether it runs in `add`, `validate`, or both. Conservative default:
      non-blocking advisory; never reject.

      Acceptance:
        - Filing an artifact whose title shares a high fraction of
          significant tokens with an existing same-type artifact prints a
          "similar to <ID>" advisory (non-blocking).
        - Distinct artifacts (low token overlap) produce no advisory.
        - A unit test covers the duplicate-detected and distinct cases.
    tags: [dx, agent-ux, mutate, duplicate-detection, dogfooding, self-found]
    fields:
      priority: could
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-007

  - id: REQ-151
    type: requirement
    title: "Global --quiet flag: suppress the WARN log preamble for scripted/agent use"
    status: implemented
    description: |
      User-reported via #353 (feature ask): every rivet invocation can emit
      WARN-level log lines before a command's real output (e.g. "could not
      load externals: …", and previously per-file skip notices), which is
      noise for scripted/agent consumption — especially combined with
      `--format json`. There was a `-v/--verbose` flag to raise the log
      level but no way to lower it below the default `warn`.

      Add a global `-q/--quiet` flag (mutually exclusive with `--verbose`)
      that sets the log filter to `error`, suppressing the WARN preamble
      while leaving a command's own stdout and hard-error reporting intact.
      Pairs with `--format json` for clean machine-consumable output.

      Acceptance:
        - `rivet --quiet <cmd>` emits no `WARN`-level log lines on stderr for
          a project that otherwise would (e.g. a misconfigured external),
          while the command's stdout is unchanged.
        - Hard errors (e.g. an unparseable rivet.yaml) are still reported
          under `--quiet`.
        - `cargo test -p rivet-cli --test cli_commands quiet_suppresses` passes.
    tags: [cli, dx, agent-ux, logging, quiet, user-reported, issue-353]
    fields:
      priority: should
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-007

  - id: REQ-152
    type: requirement
    title: "rivet matrix must not silently render an all-empty matrix as 'no traceability'"
    status: implemented
    description: |
      Self-found while dogfooding. `rivet matrix --from <X> --to <Y>` defaults
      to `--direction backward` and auto-detects the link type
      (backward→`verifies`). For a FORWARD relationship like
      `design-decision --satisfies--> requirement`, the defaults produce an
      all-`(none)` matrix — falsely reading as "no traceability" — even though
      every design-decision satisfies a requirement. For a traceability tool,
      a silent empty matrix that contradicts reality is a dangerous
      false-negative (loud-fail register).

      Verified: `matrix --from design-decision --to requirement` (defaults)
      shows every row `(none)`; `--link satisfies --direction forward` shows
      the real `DD-001 -> REQ-006` … links.

      Fix (additive, no behaviour change to valid matrices): when the matrix
      is all-empty (sources exist, zero links), emit an actionable hint on
      stderr. If the opposite direction would surface links, name it
      precisely ("… 0 via 'satisfies' (backward), but 67 do with
      `--direction forward` — the relationship runs the other way"); otherwise
      point at `rivet schema show <from>` / `--link`. A matrix with links
      emits no hint.

      Acceptance:
        - `rivet matrix --from design-decision --to requirement --link
          satisfies` (default backward) prints a stderr hint naming
          `--direction forward`.
        - The same with `--direction forward` (which has links) prints no hint.
        - `cargo test -p rivet-cli --test cli_commands
          matrix_empty_emits_direction_hint` passes.

      Follow-up (filed separately): inferring the direction from the link
      type's declared source/target so the default just works, rather than
      hinting after an empty result.
    tags: [cli, matrix, traceability, loud-fail, dx, dogfooding, self-found]
    fields:
      priority: should
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-007

  - id: REQ-153
    type: requirement
    title: "rivet impact --since must load the baseline through the canonical loader (not a bespoke parser)"
    status: implemented
    description: |
      Self-found while dogfooding (GitHub issue #403). `rivet impact --since
      HEAD~5` on the rivet repo reported 503 changed + 354 added (1207 total)
      when the only real change was ~7 new REQs in requirements.yaml — the
      output was misleading to the point of useless.

      Root cause: `load_baseline_from_git` reconstructed the baseline with a
      bespoke per-file parser (`parse_yaml_content` + `GenericYamlWrapper`)
      that (a) only handled a couple of source formats and silently skipped
      the rest (→ spurious "added") and (b) represented artifacts differently
      from the live `load_artifacts` adapter, so `impact::content_hash`
      differed for unchanged artifacts (→ every loaded baseline artifact
      "changed"). A third, inconsistent parse path — the REQ-140 family.

      Fix: materialise the ref's tracked tree via `git archive <ref> | tar`
      into a temp dir and load it through `rivet_core::load_project_full`
      (the SAME `load_artifacts`-per-source path the live store uses), then
      diff. The bespoke `parse_yaml_content` / `git_show_file` /
      `git_ls_tree_files` helpers + `GenericYamlWrapper` were deleted.

      Verified: `impact --since HEAD~5` now reports 3 changed (the real
      requirements.yaml edits) + 7 added (3 new REQs + 4 externals) instead
      of 503/354.

      Acceptance:
        - On a 2-commit fixture (one artifact edited, one added, one
          untouched), `rivet impact --since HEAD~1 --format json` reports
          exactly the edited id under `changed` and the new id under `added`;
          the untouched artifact appears in neither.
        - `cargo test -p rivet-cli --test cli_commands
          impact_since_reports_only_real_changes` passes.

      Residual (separate, smaller): externals are in the live store but not
      loaded into the baseline by `load_project_full`, so external `prefix:id`
      artifacts still show as "added". Tracked for follow-up.
    tags: [bug, impact, parser-consistency, loud-fail, dogfooding, self-found, issue-403]
    fields:
      priority: must
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-140

  - id: REQ-154
    type: requirement
    title: "Enumeration commands (list/stats) must loudly report sources skipped by parse errors, not silently return fewer artifacts"
    status: implemented
    description: |
      Self-found while triaging GitHub issue #353 (an agent driving rivet on
      the `meld` project). A single stray top-level key in an artifact file
      (`unknown field 'loss-coverage', expected 'artifacts'`) causes the
      ENTIRE file — including its valid `artifacts:` list — to be dropped from
      the graph, and the only signal is a `log::warn!` preamble line.

      `rivet validate` already handles this correctly: it surfaces the file as
      a hard `artifact-parse-error` ERROR diagnostic (verified). The gap is the
      enumeration commands: `rivet list` prints "0 artifacts" and `rivet stats`
      its counts with NO indication that a whole source was dropped. An agent
      that pipes the WARN preamble to /dev/null (or runs under a future
      `--quiet`) silently operates on a partial graph — a loud-fail (F2)
      violation for the read path. Issue #353 explicitly asks to "surface
      skipped sources in the validate/stats summary (e.g. '1 source skipped')".

      Fix: after loading, `list` and `stats` re-scan sources for
      `SkipKind::ParseError` skips (the existing REQ-062
      `load_artifacts_with_skips` channel) and, if any, print a concise loud
      block to stderr naming each dropped file + the parse error and pointing
      at `rivet validate`. Emitted regardless of log level (it signals data
      loss, not noise).

      Acceptance:
        - In a project whose `generic-yaml` source contains a file with a
          valid `artifacts:` list plus one unknown top-level key, `rivet list`
          exits 0 but prints to stderr a line matching
          `source(s) skipped` naming that file; `rivet stats` does likewise.
        - A project with no skipped sources prints no such block (no
          regression in the clean case).
        - `cargo test -p rivet-cli --test cli_commands
          list_reports_parse_error_skipped_sources` passes.
    tags: [bug, loud-fail, ux, dogfooding, self-found, issue-353]
    fields:
      priority: should
      category: functional
    links:
      - type: traces-to
        target: REQ-062

  - id: REQ-155
    type: requirement
    title: "prose-mention-without-typed-link must suppress when no schema-valid link type connects the two artifact types"
    status: implemented
    description: |
      From a cross-project agent report on issue #353 (the `sigil` project,
      "finding B"). After an agent edited a `cybersecurity-design` artifact's
      description to mention "UCA-4" as rationale, `rivet validate` raised:

        WARN: [CD-22] prose mentions 'UCA-4' but no typed link to it;
              add a link in `links:` or remove the mention

      Two defects:
        1. Unactionable remediation. `cybersecurity-design` only permits
           `satisfies -> cybersecurity-req`; the schema defines NO link type
           that could connect a design to a `uca`. The advised fix ("add a
           link in `links:`") is therefore impossible — the warning can only
           ever be cleared by rewording prose.
        2. False-trace pressure. The prose "UCA-4" referred to a local STPA
           report's numbering, but `UCA-4` happens to resolve to an
           unrelated artifact. Following the warning's advice would have
           created a wrong, fabricated trace link.

      Fix: in the prose-mention pass, suppress the diagnostic when the
      project schema permits no link type whose `source-types` allows the
      mentioning artifact's type AND whose `target-types` allows the
      mentioned artifact's type. A link type with empty `source-types` /
      `target-types` means "any -> any", so permissive schemas are
      unaffected; only fully-constrained schemas ever trigger suppression.
      When a link IS schema-valid, the warning fires unchanged.

      Acceptance:
        - In a schema whose only link type is `design -> requirement`, a
          `design` artifact whose prose mentions both a `uca` (unlinkable)
          and a `requirement` (linkable) yields exactly ONE
          prose-mention-without-typed-link warning — for the requirement,
          not the uca.
        - `cargo test -p rivet-core --lib
          prose_mention_suppressed_when_no_schema_valid_link_type` passes,
          and the existing `prose_mention_*` tests still pass.
        - `rivet validate` on the rivet repo still PASS.
    tags: [bug, diagnostics, false-positive, ux, dogfooding, issue-353]
    fields:
      priority: should
      category: functional
    links:
      - type: traces-to
        target: REQ-004

  - id: REQ-156
    type: requirement
    title: "Single chokepoint for schema-level consistency checks so salsa and --direct cannot diverge"
    status: implemented
    description: |
      Self-found while landing REQ-148 (#410). Adding a schema-level
      consistency check (one that inspects the schema, not artifacts) required
      hand-registering the same call in THREE validation entrypoints:
      `validate::validate_with_externals_and_variant` (direct path) and the two
      salsa queries in `db.rs` (`evaluate_conditional_rules`,
      `evaluate_conditional_rules_with_extras`). If a future check is added to
      only some sites, `rivet validate` (salsa, the default) and
      `validate --direct` silently disagree — the exact divergence class
      REQ-146 just fixed for status-gate rules.

      Fix: hoist all schema-level consistency checks behind a single
      `Schema::consistency_diagnostics()` method (conditional-rule dup/overlap
      + coverage-rule reachability). All three entrypoints now call exactly
      that one method, so a new check is a one-line edit there that cannot be
      partially applied. Pure refactor — diagnostic output is unchanged.

      Acceptance:
        - All three validation entrypoints call `schema.consistency_diagnostics()`
          and nothing calls `check_conditional_consistency` /
          `check_coverage_rule_consistency` directly outside that method and
          tests.
        - `rivet validate` and `rivet validate --direct` on the rivet repo
          produce identical Result lines (PASS, same warning count).
        - Unit test asserts `consistency_diagnostics()` surfaces BOTH a
          conditional-rule-consistency and a coverage-rule-consistency
          diagnostic for a schema that trips each.
        - `cargo test -p rivet-core` green; `rivet validate` on the rivet repo
          still PASS.
    tags: [refactor, validation, salsa-parity, maintainability, dogfooding, self-found, issue-410]
    fields:
      priority: should
      category: functional
    links:
      - type: traces-to
        target: REQ-146

  - id: REQ-157
    type: requirement
    title: "rivet validate must emit the per-file parse-error skip WARN once, not twice"
    status: implemented
    description: |
      From GitHub issue #406 (self-found while dogfooding REQ-154). `rivet
      validate` printed the per-file `skipping <file>: YAML parse error …`
      WARN twice for a single malformed `generic-yaml` source. Root cause:
      `cmd_validate` loads the project once via `ProjectContext::load`
      (load_artifacts -> import_generic_directory -> WARN #1), then re-scans
      every source with `load_artifacts_with_report` for the REQ-075
      duplicate-id / REQ-062 skip pass, which calls `load_artifacts` again ->
      a second `import_generic_directory` -> WARN #2.

      Decision (maintainer, on #406): option A (narrow) — kill the duplicate on
      the validate path only; leave the per-file WARN intact for other
      commands (get/trace/matrix/export still rely on it and aren't covered by
      `warn_parse_error_skips()`).

      Fix: thread a `warn_skips: bool` into `GenericYamlAdapter` /
      `import_generic_directory`; add `load_artifacts_quiet` +
      `load_artifacts_with_report_quiet` (the public `load_artifacts` signature
      is untouched). `cmd_validate`'s re-scan uses the quiet report loader, so
      the WARN fires once (from the initial load) but the skips/duplicates —
      and the hard `artifact-parse-error` / `duplicate-artifact-id` ERROR
      diagnostics derived from them — are unchanged.

      Acceptance:
        - On a fixture with one malformed `generic-yaml` source,
          `rivet validate 2>&1 | grep -c "skipping ./…/reqs.yaml"` returns 1
          (was 2).
        - The hard `artifact-parse-error` ERROR still fires and `Result: FAIL`.
        - `list`/`stats` REQ-154 skip-summary unaffected; rivet repo validate
          still PASS.
        - `cargo test -p rivet-cli --test cli_commands
          validate_emits_single_skip_warn_for_malformed_source` passes.
    tags: [bug, ux, noise, dogfooding, self-found, issue-406]
    fields:
      priority: should
      category: functional
    links:
      - type: traces-to
        target: REQ-062

  - id: REQ-158
    type: requirement
    title: "Detect near-duplicate intent: flag same-type artifacts with highly similar titles"
    status: implemented
    description: |
      From GitHub issue #397: `rivet add` rejects a duplicate *id* but nothing
      flags a duplicate *intent* — two artifacts that say the same thing under
      different ids — so a long-lived backlog accretes near-duplicate
      requirements.

      Signal (bounded + explainable, per the bounded-composite-score doctrine):
      Jaccard overlap of significant title tokens (lowercase, alphanumeric
      split, stopwords + sub-3-char tokens removed), in [0,1]. Threshold 0.6,
      empirically calibrated against the rivet repo's own 158 requirements,
      which produce ZERO pairs at 0.6 (1 at 0.5) — the default does not flood a
      well-differentiated backlog.

      Two surfaces, one shared `rivet_core::similarity` implementation so they
      can't disagree:
        - `rivet validate` emits a `near-duplicate-intent` INFO diagnostic for
          each same-type, non-external artifact pair at/above threshold
          (within-type O(n^2), titles tokenized once). INFO never blocks. Lives
          in the shared `validate_structural*` pass so it runs on both the
          salsa and --direct paths (same-surface parity).
        - `rivet add` emits a non-blocking `note:` when the new title is similar
          to an existing same-type artifact, then adds anyway.

      Acceptance:
        - In a project with REQ-1/REQ-2 (near-identical titles) and REQ-3
          (distinct), `rivet validate --direct --format json` yields exactly
          one `near-duplicate-intent` diagnostic, on REQ-2; REQ-3 is not named.
        - `rivet add` with a title similar to an existing same-type artifact
          prints a `note: intent is N% similar to …` to stderr and still
          succeeds; a distinct title prints no note.
        - The rivet repo's 158 `requirement`s produce zero
          `near-duplicate-intent` diagnostics; across all types the repo
          surfaces only true-positive pairs (e.g. two `feature`s sharing a
          title), all INFO, so `rivet validate` still PASS.
        - `cargo test -p rivet-core --lib similarity` and `cargo test -p
          rivet-cli --test cli_commands near_duplicate_intent_validate_and_add`
          pass.

      Deferred (noted on #397): per-rule `allow:` suppression in rivet.yaml —
      rivet has no general diagnostic-suppression config yet; INFO severity
      keeps the diagnostic non-disruptive until that infra exists.
    tags: [feature, validation, backlog-hygiene, dx, issue-397]
    fields:
      priority: should
      category: functional
    links:
      - type: traces-to
        target: REQ-004

  - id: REQ-159
    type: requirement
    title: "Store::iter() order is nondeterministic — provide a deterministic iter_sorted() and document the footgun"
    status: implemented
    description: |
      Self-found while landing REQ-158 (#415). `Store::iter()` returns
      `HashMap::values()`, whose order varies per process. Any caller that
      produces stable output or selects one representative among ties over
      `store.iter()` is silently nondeterministic — which is exactly how the
      REQ-158 `rivet add` near-duplicate note picked REQ-1 locally but REQ-2 in
      CI (same code, different hash seed), making the proptest job flaky on main
      until #414 added an explicit tie-break.

      Minimal, non-breaking hardening: document on `iter()` that order is
      unspecified and add `Store::iter_sorted()` (ascending by id) so the
      deterministic path is the easy one. Migrating existing
      `store.iter().collect::<Vec>()` output sites and the larger "back the
      store with an ordered map" option are deferred to #415 (each needs a
      per-site audit; some already sort downstream).

      Acceptance:
        - `Store::iter_sorted()` yields artifacts ascending by `id` regardless
          of insertion order.
        - `iter()`'s doc-comment states the order is nondeterministic and
          points at `iter_sorted()`.
        - `cargo test -p rivet-core --lib iter_sorted_is_deterministic_by_id`
          passes; `rivet validate` on the rivet repo still PASS.
    tags: [refactor, determinism, footgun, dogfooding, self-found, issue-415]
    fields:
      priority: should
      category: functional
    links:
      - type: traces-to
        target: REQ-158

