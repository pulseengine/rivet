  - id: REQ-345
    type: requirement
    title: "601 of 706 artifacts carry no release field, so 165 pieces of unstarted work are invisible to every readiness query"
    status: verified
    description: "Measured 2026-09-10 while diagnosing why issues from April sat untouched while September issues were fixed within days. The cause is not neglect and not missing tracking. It is that `release:` is optional and mostly absent, and `rivet release status` can only see artifacts that carry one. TOTAL 706 artifacts; 601 have NO release field, which is 85 percent; of those 601, 165 are status draft or proposed. That is 165 pieces of genuinely unstarted work that no readiness query can surface, because every such query is scoped to a release. The issue board reads as fifteen open items while that population sits outside it. WORKED EXAMPLE: #104, open since 2026-04-02, is tracked by REQ-059. REQ-059 is draft with no release. Nothing was ever decided about it — not deferred, not rejected, not scheduled — because nothing ever asked. Five months of silence produced by a missing field rather than by a judgement. The same shape covers #107, #557 and the crates.io cluster. NOT A CALL TO SCOPE EVERYTHING. Many of the 601 are approved or implemented artifacts from before release scoping existed, and 290 are approved hazard-analysis and design artifacts for which a release field would be meaningless. The 165 draft/proposed ones are the actionable population, and even there the right outcome for most is `backlog` — an explicit statement that this is not scheduled — rather than a version. The point is that `backlog` is a DECISION and absence is not; absence merely looks like one from a distance. CANDIDATE MECHANISMS, in cost order: report the unscoped draft/proposed count in `rivet release status` so it is visible beside the scoped set; add a `rivet release unscoped` query listing them; or make the absence a validate-time warning for draft/proposed artifacts only, which is the loudest and the most likely to be ignored if it fires on 165 items at once. Prefer the first — it puts the number in front of whoever is already asking about a release, which is exactly when the question matters. IMPLEMENTED 2026-09-10 by the recommended route: `rivet release status` now reports the unscoped draft/proposed count beside the scoped set, in both text and JSON, as `unscoped_unstarted`. That puts the number in front of whoever is already asking about a release, which is the moment it matters, rather than requiring anyone to go looking for it. SCOPE OF THE COUNT IS DELIBERATE AND NARROWER THAN THE HEADLINE FIGURE. Only draft and proposed artifacts are counted. An approved or implemented artifact carrying no release is finished work from before scoping existed, and a release field on it would mean nothing — counting those would report a number nobody can act on, which is the defect class this requirement exists to avoid rather than reproduce. Negative-controlled: removing the status filter counts three instead of two in the fixture and reddens the JSON assertion. IT IS INFORMATION, NOT A GATE. The cuttable verdict is untouched — a release whose own scope is ready stays ready regardless of unscoped work elsewhere, because that work is by definition not part of this release. Negative-controlled in that direction too: making unscoped_unstarted block the verdict reddens the guard. Adding 161 items to a release's blocking set would make the gate unpassable and would be read as noise within a day. VERIFIED against this repository's own store, which is where the finding came from: rivet reports 161 and an independent count over every artifact file agrees at 161. NOTE THE NUMBER MOVED, from the 165 recorded when this was filed. That is not drift in the measurement — it is the scoping work done since, where REQ-059, REQ-247, REQ-250, REQ-252 and DD-074 were given release fields and therefore left the unscoped population. The count going down as artifacts get decided about is the behaviour wanted; a figure that never moved would be the suspicious one."
