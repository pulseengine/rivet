  - id: REQ-084
    type: requirement
    title: "Verus proof CI must fail loudly when its Nix install fails — a continue-on-error proof job that verifies nothing is a silent failure"
    status: draft
    description: |
      The Verus Proofs CI job (.github/workflows/ci.yml) installs Nix
      via DeterminateSystems/nix-installer-action, then runs
      `bazel test //verus:rivet_specs_verify`. The job is
      `continue-on-error: true` — intentionally soft-gated, because
      Verus has an open SMT proof gap (ci.yml lines 555-558).

      On the self-hosted runner (`[self-hosted, linux, x64, lean-mem]`,
      NoNewPrivileges=true, no sudo) the `nix-installer` binary
      escalates via `sudo` and fails; the `Install Nix` step errors and
      `Verify Verus specs` is then SKIPPED. Because the job is
      `continue-on-error`, the workflow stays green. Net effect: the
      Verus proof job has been verifying nothing while reporting no
      blocking failure — the F2 silent-failure class. A proof job that
      is not proving anything is worse than a red one.

      Confirmed 2026-05-21 on PR #311 run 26246893086: the Verus job
      step sequence was `failure Install Nix` -> `skipped Verify Verus
      specs`.

      Pinning the action + `determinate: false` (shipped in v0.11.1)
      fixed the Rocq job on ubuntu-latest but cannot fix Verus: no
      version of `nix-installer-action` installs Nix without root. The
      durable fix is to run the Verus (and Rocq) Bazel/Nix jobs in a
      rootless `nixos/nix` container — Nix pre-installed in the image,
      no installer, no daemon, no sudo, no unpinned-action drift
      surface.

      Unblocker (2026-05-23): smithy runner9 is now podman-capable —
      `podman_userns: true`, `NoNewPrivileges=0`,
      `ProtectKernelTunables=false` deployed and verified live
      (`podman run nixos/nix@sha256:fd7a5c67... nix --version` returns
      `nix (Nix) 2.24.9`). GHA label set is
      `[self-hosted, Linux, X64, hetzner, rust-cpu, podman]`. The
      Verus job can switch `runs-on:` to include the `podman` label
      and drive the Bazel/Nix work through rootless podman against
      `docker.io/nixos/nix`; per the smithy note, "the flag is one
      line per runner — trivial to expand" if contention on runner9
      becomes a concern. The rivet implementation should follow the
      `spar` validation of the same pattern (sequential, so we inherit
      a tested approach rather than co-debug two repos in parallel).

      Acceptance:
        - The Verus CI job's `Verify Verus specs` step actually
          executes — assert it is not `skipped` in the job step list.
        - Environment breakage (Nix/toolchain unavailable) makes the
          job FAIL visibly, distinct from a soft-gated proof result:
          `continue-on-error` must not be able to mask a job that
          never ran the verifier.
        - A completed Verus job's `verus-test-log` artifact contains a
          real Verus solver result.
        - The Verus job's `runs-on:` targets the `podman` label
          (scoped to a podman-capable runner) and Nix work runs inside
          a `nixos/nix` rootless container — no `nix-installer-action`
          and no host-installed Nix.
    tags: [ci, verus, silent-failure, f2-family, nix]
    fields:
      priority: should
      category: non-functional
      baseline: v0.12.0-track
    links:
      - type: derives-from
        target: FEAT-135

  - id: REQ-087
    type: requirement
    title: "rivet export --single-page and --filter must actually narrow output for large projects, not silently emit the full artifact set"
    status: draft
    description: |
      Empirical observation on a 5120-artifact rivet project (2026-05-23):
      `rivet export --html --single-page` still produces all per-artifact
      pages instead of a single document, and `--filter '<s-expr>'`
      emits the full artifact set rather than the filtered subset. The
      flag help text claims semantics the implementation does not
      deliver — the F2 silent-failure class catalogued by
      REQ-078..082.

      Verified plausible in the code: `--single-page` is wired through
      `cmd_export` -> `cmd_export_html` (rivet-cli/src/main.rs:7976,
      8000-8017, calling `rivet_core::export::render_single_page`); but
      something in the path either ignores the flag for the multi-page
      generator that also runs, or the renderer falls back to per-page
      output for input sizes above a threshold. The user observed both
      flags non-functional on the 5120-artifact project.

      Acceptance:
        - `rivet export --html --single-page --out single.html` on a
          5000+ artifact project produces ONE HTML file at the given
          path, not a directory tree of per-artifact pages.
        - `rivet export --html --filter '<s-expr>' --out tree/` on a
          5000+ artifact project produces only the artifacts that match
          the s-expr (verified by counting files in `tree/artifacts/`).
        - If a requested flag combination cannot be honoured on a given
          input, the exporter errors loudly with a clear message — it
          must not silently emit "default" output that contradicts the
          user's flags.
        - Regression test in `rivet-cli/tests/` driving the real binary
          against a small fixture exercising both flags.
    tags: [export, html, silent-failure, f2-family]
    fields:
      priority: should
      category: functional
      baseline: v0.13.0-track
    links:
      - type: derives-from
        target: FEAT-135
      - type: traces-to
        target: REQ-078

  - id: REQ-088
    type: requirement
    title: "rivet export HTML must not embed the full CSS/JS framework per page — extract to shared assets so large exports are usable"
    status: draft
    description: |
      Each rendered per-artifact HTML page embeds the full CSS + JS
      framework inline: `<style>{fonts_css}{css}</style>` and
      `<script>{mermaid_js}</script>` (rivet-cli/src/main.rs:8142-8143),
      with `MERMAID_JS = include_str!("../assets/mermaid.min.js")` —
      mermaid.min.js alone is ~3MB. 4000+ artifact pages times ~3MB
      = ~13 GB by construction; the user measured exactly that.

      The fix is well-bounded: extract the framework into a single
      `_assets/` directory under the export root and reference it from
      each page via relative `<link rel="stylesheet" href="...">` /
      `<script src="...">`. Per-page payload drops to ~50KB
      (artifact-specific markup only); total export of a 5000-artifact
      project should land at ~50-100 MB uncompressed.

      Acceptance:
        - `rivet export --html` on a 5000-artifact project produces
          exactly one copy of every shared asset (mermaid.min.js, base
          CSS, fonts) under `<out>/_assets/`, and per-artifact pages
          reference them by relative URL.
        - Total uncompressed export size on a 5000-artifact project
          is ≤ 100 MB.
        - A randomly-sampled per-artifact page renders correctly when
          opened directly from disk (the relative paths resolve).
        - Regression test asserts the per-page byte budget (e.g.
          `assert!(per_page_bytes < 100_000)` for a representative
          artifact).
    tags: [export, html, performance, bloat, audit]
    fields:
      priority: should
      category: non-functional
      baseline: v0.13.0-track
    links:
      - type: traces-to
        target: REQ-087

  - id: REQ-089
    type: requirement
    title: "Diagnostics must be identical across the VSIX extension, `rivet serve`, and `rivet validate` — no per-frontend divergence"
    status: draft
    description: |
      Empirical observation against v0.11.1: the VS Code extension
      (vscode-rivet) surfaced different warnings than `rivet serve` or
      `rivet validate` for the same project. There is no integration
      test asserting the three rendering paths agree on the diagnostic
      set. A user fixing what the VSIX shows may still have unsurfaced
      `rivet validate` errors that gate CI — itself an F2-class
      silent failure on the QA surface.

      The structural fix: all three frontends consume the same
      diagnostic-producing function (`validate::validate` and friends);
      no frontend re-implements or filters diagnostics independently.
      An integration test that runs the three paths over a fixture
      project and diffs the diagnostic SET (rule, severity,
      artifact_id, message-prefix) enforces this.

      Acceptance:
        - For a fixture project with a known mix of errors / warnings /
          infos, an integration test extracts diagnostics from:
          (a) `rivet validate --format json`,
          (b) `rivet serve` and scraping the validate page, and
          (c) the VSIX extension's published diagnostics (LSP-style
          test or a headless VS Code extension test).
          The three sets must match by (rule, severity, artifact_id,
          message-prefix).
        - Any per-frontend filtering (e.g. severity threshold display)
          is explicit and documented in the diagnostic-emission API,
          not buried in the frontend.
        - The same shared diagnostic function powers all three.
    tags: [vsix, serve, validate, silent-failure, f2-family, qa, consistency]
    fields:
      priority: should
      category: non-functional
      baseline: v0.13.0-track
    links:
      - type: derives-from
        target: FEAT-135

  - id: REQ-090
    type: requirement
    title: "GitHub Release attaches a compliance bundle (~51 MB: documents + coverage + matrix + validate + ReqIF), not the per-artifact HTML drilldown"
    status: draft
    description: |
      The v0.12.0 GitHub Release attached HTML navigation shells
      (~7 MB, useless without the per-artifact pages) and not the
      rendered specifications + machine-importable ReqIF auditors
      actually need. The audit content map for a 5120-artifact project:

      - 51 MB bundle = `documents/` (44 rendered specs with resolved
        artifact tables — ID/Type/Title/Status per reference) +
        `coverage/` + `matrix/` + `validate/` + `stpa/` +
        `eu-ai-act/` + `graph/` + `index.html` + `ReqIF` (XML, OMG
        standard, importable into DOORS / Polarion / codeBeamer).
        Auditors get full review material; fits a GitHub release
        artifact.
      - Per-artifact HTML drilldown (~13 GB once REQ-088's bloat is
        fixed, ~50 MB) is overkill for compliance review — the doc
        tables already show ID/Type/Title/Status for every
        referenced artifact.

      Acceptance:
        - The release workflow produces a single bundled tarball
          (e.g. `rivet-compliance-bundle-vX.Y.Z.tar.gz`) containing
          documents/, coverage/, matrix/, validate/, stpa/,
          eu-ai-act/, graph/, index.html, plus the project's
          ReqIF + generic-yaml export.
        - The tarball is attached to the GitHub Release.
        - The per-artifact `artifacts/` HTML tree is NOT in the
          tarball (until REQ-088's CSS/JS dedup lands, including it
          balloons the bundle; even after REQ-088 it's still optional
          drilldown, not compliance evidence).
        - A README in the tarball documents what each directory is and
          how to import the ReqIF.
        - The release workflow change is gated on REQ-088 landing
          first — until per-page assets are de-duplicated, the
          per-artifact pages can't be cleanly included anyway.
    tags: [release, packaging, compliance, audit, reqif]
    fields:
      priority: should
      category: non-functional
      baseline: v0.13.0-track
    links:
      - type: traces-to
        target: REQ-088
      - type: traces-to
        target: REQ-005

  - id: REQ-091
    type: requirement
    title: "rowan-yaml salsa parser silently drops flush-left artifacts from the default validate path"
    status: draft
    description: |
      Default `rivet validate` (the salsa-incremental path with the
      `rowan-yaml` feature enabled, the default) drops artifacts
      written in YAML's flush-left list style from its grading. The
      artifact is loaded by other paths (`rivet list`, lifecycle
      coverage, validate `--direct`) and the artifact file parses
      cleanly via `parse_generic_yaml`, but the rowan parser
      (`yaml_hir::extract_schema_driven`, the default salsa load
      path) returns ZERO artifacts and ZERO diagnostics for the same
      file. The link graph the validator should grade is invisible.

      Discovered via clean-room verification of a parallel agent's
      bug report (sphinx-needs importer corpus — Python tool 2507
      warnings, Rust port 488 — the 2019 gap is exactly the lost
      grading). The agent attributed the bug to
      `GenericYamlAdapter::export` / `parse_generic_yaml`; probe
      reproduced their fixture and FALSIFIED that attribution —
      `parse_generic_yaml` returns 1 link for both fixtures,
      identical link_type/target. The real failure is in
      `yaml_hir::extract_schema_driven`:

        Fixture (flush.yaml, 7 lines):
          artifacts:
          - id: COMP_REQ__FLUSH__A
            type: comp-req
            title: Flush-left
            status: approved
            links:
            - type: satisfies
              target: FEAT_REQ__NOPE__DANGLE

        extract_schema_driven(...) -> artifacts: 0, diagnostics: 0   ← bug
        parse_generic_yaml(...)    -> 1 artifact, 1 link             ← fine
        rivet list                 -> 1 artifact, 1 link             ← fine
        rivet validate (default)   -> no link errors for FLUSH       ← bug
        rivet validate --direct    -> link errors for both           ← fine

      A contributing factor: `extract_links_via_serde` (the rowan
      parser's fallback) silently returns `Vec::new()` on
      `serde_yaml::from_str` parse error — F2 silent-failure ethos
      violation. Even the fallback can't surface "I tried to parse
      links and couldn't."

      Impact: any project using generic-yaml whose artifacts use
      flush-left lists (which is exactly what serde_yaml's
      `to_string` emits — so rivet's own
      `GenericYamlAdapter::export` produces files rivet's default
      validate cannot fully grade) silently loses link-graph
      validation in CI.

      Bug-doc + 2-file fixture authored by the parallel agent:
      `docs/design/rivet-link-parse-bug.md` +
      `docs/design/rivet-link-parse-bug-fixture/` (on the
      `feat/import-results-sphinx-needs` branch). Description is
      attribution-corrected here.

      Acceptance:
        - `yaml_hir::extract_schema_driven` returns 1 artifact + 1
          link for the flush.yaml fixture (identical to indent.yaml).
        - Default `rivet validate` (salsa + rowan-yaml) emits the
          broken-link ERROR for COMP_REQ__FLUSH__A — same as
          `rivet validate --direct` does today.
        - `extract_links_via_serde`'s parse-error branch emits a
          parse diagnostic instead of `Vec::new()` (loud-fail).
        - Regression test in `rivet-core/tests/` driving
          `extract_schema_driven` directly with both fixture shapes,
          asserting identical artifact + link counts.
        - The parallel agent's sphinx-needs port corpus, re-graded
          after the fix, matches the Python reference's ~2500
          warnings (the falsification gate the agent's handoff
          described).
    tags: [yaml, rowan, salsa, validate, silent-failure, f2-family]
    fields:
      priority: must
      category: functional
      baseline: v0.13.1-track
    links:
      - type: derives-from
        target: FEAT-135

  - id: REQ-092
    type: requirement
    title: "Per-source-line traceability linker — Eclipse S-CORE source_code_linker equivalent"
    status: draft
    description: |
      Eclipse S-CORE ships `score_source_code_linker` — a tool that
      scans source files for inline comments of the shape
      `// req-Id: <id>` and emits per-line traceability records
      linking that source location to the named requirement (need).
      Rivet has `rivet commits` (REQ-051), which links per-commit via
      trailers (`Implements:`, `Refs:`, `Fixes:`, `Verifies:`).
      Different granularity: per-line vs per-commit; both auditable.

      For projects converging from S-CORE → rivet (the Eclipse S-CORE
      sphinx-needs importer landing in the parallel agent's PR is one
      such case), a per-source-line linker closes the granularity gap
      and lets one tool surface both kinds of evidence under the
      existing traceability rules.

      Proposed shape (subject to design):

      - `rivet source-link` — new subcommand. Scans source paths
        configured in `rivet.yaml` for `// rivet: <req-id>`
        comments (marker configurable; default `// rivet:` to avoid
        colliding with S-CORE's `// req-Id:` until a migration story
        exists). Emits a per-line traceability artifact set: file,
        line range, linked artifact-id, comment text.
      - Output integrates with existing traceability — the per-line
        evidence shows up in `rivet validate`'s coverage metrics and
        the matrix view, indistinguishable from a per-commit link
        once aggregated by target.
      - Optional `--marker '// req-Id:'` switch lets a downstream
        project consume S-CORE-style comments without migration.

      Acceptance:
        - `rivet source-link` on a project with `// rivet: <req-id>`
          comments in tracked source files emits artifacts naming
          file / line / linked artifact-id.
        - `rivet validate` after `source-link` counts those per-line
          links toward the same coverage metrics as commit-trailer
          links (REQ-051 family).
        - `--marker '// req-Id:'` ingests S-CORE-style comments.
        - Malformed markers (`// rivet: NOTASHAPE`, missing ID,
          duplicate per line) emit diagnostics — never silent skip.
        - A worked example added under `examples/source-link/`.
    tags: [traceability, source-link, eclipse-score, parity, new-capability]
    fields:
      priority: should
      category: functional
      baseline: v0.14.0-track
    links:
      - type: traces-to
        target: REQ-051

  - id: REQ-093
    type: requirement
    title: "Implement the FUTURE oracles — asil-decomposition, coverage-threshold, method-table-compliance — turn the ISO 26262 narrative into mechanical checks"
    status: draft
    description: |
      The schema declares three oracles today (`asil-decomposition`,
      `coverage-threshold`, `method-table-compliance`) but their
      evaluators are FUTURE stubs — `rivet validate` parses the
      pipeline declaration and never fires. 10-persona review row A1
      (Hess, ISO 26262 assessor): "your schema parses pipelines that
      don't fire." Until they fire, the per-ASIL rigour rivet claims
      is narrative, not mechanical.

      Acceptance:
        - `asil-decomposition` oracle: ISO 26262-9 decomposition
          rules implemented and exercised. Fixture: an ASIL-D parent
          decomposed into two children must satisfy the allowed
          pairs (ASIL-B + ASIL-B, ASIL-A + ASIL-C, …). Non-conforming
          pair -> ERROR; conforming pair -> silent.
        - `coverage-threshold` oracle: per-rule coverage % computed
          against a declared minimum; below-threshold -> ERROR
          naming (rule, observed, required).
        - `method-table-compliance` oracle: ISO 26262 Part 6
          Tables 9 / 10 / 11 encoded; missing required method at the
          declared ASIL -> ERROR.
        - Each oracle has at least one passing fixture and one
          failing fixture in `rivet-core/tests/`.
        - `rivet docs schema/...` no longer renders these as FUTURE.
    tags: [oracle, iso-26262, qualification, falsification, persona-review]
    fields:
      priority: must
      category: functional
      baseline: v0.14.0-track
    links:
      - type: derives-from
        target: REQ-004

  - id: REQ-094
    type: requirement
    title: "Reproducible-build oracle + sigstore-signed release verification — `rivet release-verify`"
    status: draft
    description: |
      A tool whose output IS compliance evidence needs verifiable
      releases. v0.10.x added sigstore-keyless signing of
      `SHA256SUMS` via cosign — the production side is done. The
      missing leg is the consumer side: `rivet release-verify <tag>`
      rebuilds the release artifacts from a fresh checkout, hashes
      the output, verifies the sigstore bundle against the GitHub
      OIDC identity, and refuses if any step disagrees. 10-persona
      row A4 — two of three rivet reviewers (Hess, Whittaker) flagged
      release-channel integrity as the blocking gap.

      Acceptance:
        - `rivet release-verify v0.13.0` rebuilds, hashes, fetches
          the sigstore bundle, runs `cosign verify-blob` with the
          documented identity regex, and exits 0 iff every hash
          matches and the signature verifies against the workflow's
          OIDC identity.
        - Tampered `SHA256SUMS`, missing signature, wrong identity,
          or non-reproducible build each fail loudly with the named
          mismatch.
        - A CI job runs `release-verify` on the most-recent tag
          periodically and gates merge to `main` if it fails.
        - Documented via `rivet docs release-verify`.
    tags: [release, sigstore, supply-chain, qualification, persona-review]
    fields:
      priority: must
      category: non-functional
      baseline: v0.14.0-track
    links:
      - type: derives-from
        target: REQ-068

  - id: REQ-095
    type: requirement
    title: "`cargo build` invokes `rivet validate` for crates declaring `rivet.yaml` — born-compliant at the compile step"
    status: draft
    description: |
      Today `rivet validate` fires on commit (pre-commit hook + CI).
      The MBSE-mandatory principle says the model drives the build,
      not sits alongside it. Bringing validation INTO the build
      closes the window between "edited an artifact" and "noticed
      the artifact is broken": today that window is one commit;
      tomorrow it is one `cargo build`. 10-persona row B1; Carrasco
      named it as the biggest MBSE-philosophy win and the realisation
      of the "born-compliant" framing.

      Acceptance:
        - A `build.rs` in `rivet-cli` (or a `cargo` subcommand
          wrapper) detects `rivet.yaml` and runs `rivet validate`.
        - Non-zero validate -> the build fails.
        - Opt-out env var (`RIVET_SKIP_VALIDATE_ON_BUILD=1`) for
          bootstrap / circular cases; default ON.
        - Build-time validation result is cached by content hash so
          incremental builds stay fast.
        - Integration test: a project with a deliberately broken
          artifact YAML fails `cargo build` with the validate
          diagnostic; fixing the artifact unblocks the build.
    tags: [mbse, build, cargo, validate, persona-review]
    fields:
      priority: should
      category: functional
      baseline: v0.14.0-track
    links:
      - type: derives-from
        target: REQ-004

  - id: REQ-096
    type: requirement
    title: "SACM 2.x typed safety-case schema with deductive-sufficiency mechanisation"
    status: draft
    description: |
      Rivet ships a safety-case schema today but stops at *structural*
      traceability — every workproduct has a chain of links — without
      enforcing the *deductive sufficiency* obligations a safety case
      claims. 10-persona row A2 (Dubois, safety researcher):
      "compliance trace ≠ safety case." Promoting the schema to OMG
      SACM 2.x's claim / argument / evidence shape + a mandatory
      `supported_by` cardinality lets `rivet validate` enforce "every
      hazard mitigated, every AoU discharged, every derived
      requirement traced to its analysis origin."

      Acceptance:
        - `schemas/sacm.yaml` declares `claim`, `argument`,
          `evidence` artifact types with the SACM 2.x link
          vocabulary (`supported_by`, `in_context_of`,
          `decomposed_into`, …).
        - Traceability rule: every ASIL-B+ workproduct is reachable
          from a `root_claim`-typed claim via `supported_by`.
        - Traceability rule: every `hazard` has a `mitigated_by`
          path to at least one `safety_requirement`.
        - Traceability rule: every `assumption_of_use` has a
          matching `discharged_by` link in the consumer's project
          (cross-repo via the REQ-085 mechanism).
        - Worked example under `examples/safety-case/` carrying a
          minimal but non-trivial SACM tree.
    tags: [sacm, safety-case, assurance, schema, persona-review]
    fields:
      priority: should
      category: functional
      baseline: v0.15.0-track
    links:
      - type: derives-from
        target: REQ-002

  - id: REQ-097
    type: requirement
    title: "DO-330 tool-qualification artifacts (TQP / TOR / TVCP / TCI / TAS) as a typed schema, dogfooded by rivet itself"
    status: draft
    description: |
      10-persona row A6 (Whittaker, DO-178C/DO-330 reviewer): "rivet's
      TCL-2 narrative is honest, but there is no DO-330 *shape* —
      TQP / TOR / TVCP / TCI / TAS are absent." A TCL-2 *tool* has
      those artifacts in typed form; a TCL-2 *narrative* does not.
      Filing them in `schemas/do-178c.yaml` and dogfooding the tool's
      own qualification dossier under that schema turns the TQL claim
      from "asserted" to "a falsifiable graph state."

      Acceptance:
        - `schemas/do-178c.yaml` declares the five artifact types:
          `tool_qualification_plan` (TQP),
          `tool_operational_requirements` (TOR),
          `tool_verification_cases_and_procedures` (TVCP),
          `tool_configuration_index` (TCI),
          `tool_accomplishment_summary` (TAS).
        - Required link cardinalities encoded:
          TQP -> TOR(+), TOR -> TVCP(+), TVCP -> TCI(1),
          TAS -> TQP(1).
        - `artifacts/qualification/` carries rivet's *own* TQP /
          TOR / TVCP / TCI / TAS — dogfood demonstrates that the
          tool's qualification artifacts validate cleanly under the
          tool itself.
        - `rivet docs do-178c` topic added with the layering
          explanation.
    tags: [do-178c, qualification, schema, dogfood, persona-review]
    fields:
      priority: should
      category: functional
      baseline: v0.14.0-track
    links:
      - type: derives-from
        target: REQ-004

  - id: REQ-098
    type: requirement
    title: "Independence-of-verification-layers oracle — refuse `product-of-miss-rates` claims when layers share too much code"
    status: draft
    description: |
      The single most-repeated complaint of the 10-persona panel
      (row A3, Hess + Whittaker): Kani, Verus, Rocq, proptest, and
      `rivet validate` all share the `Artifact` model and the YAML
      parser. The "product of miss rates" argument that justifies
      claiming "TCL-2 because we have N independent verification
      layers" collapses if the shared parser has a bug — common-mode
      failure. The oracle: rivet declares each verification layer's
      Rust dep graph, walks the intersection, and refuses to claim
      "independent layer" when shared-code count exceeds a
      configurable threshold.

      Acceptance:
        - `rivet validate --check-independence` reads a manifest of
          declared verification layers (Kani / Verus / Rocq /
          proptest / direct validate / salsa validate) and their
          entry-point crates.
        - Computes the transitive-dep intersection of any two
          declared-as-independent layers.
        - Emits ERROR if intersection exceeds the configured
          threshold (default: 0 shared *parsing* code; small-N
          shared *types* allowed and documented).
        - The TCL dossier's independence claim links to the oracle's
          last passing run as evidence.
    tags: [independence, verification, qualification, oracle, persona-review]
    fields:
      priority: should
      category: non-functional
      baseline: v0.14.0-track
    links:
      - type: derives-from
        target: REQ-051

  - id: REQ-099
    type: requirement
    title: "`rivet_apply` MCP tool — idempotency keys + atomic transactions + auto-reload + post-state diagnostics"
    status: draft
    description: |
      10-persona row A5 / C6 (Krishnamurthy, AI engineer): "MCP catalog
      is small + typed + orthogonal — good. Mutation→reload is manual,
      no batch, no idempotency = retry pain at scale." An agent fleet
      replaying a failed batch today produces duplicates; an agent
      without a reload tool sees stale state. `rivet_apply` is a
      single mutator tool that takes a JSON-patch + idempotency key,
      applies atomically, runs `rivet validate` on the post-state, and
      returns both the diff and the diagnostics — so agents don't have
      to coordinate three calls per mutation.

      Acceptance:
        - `rivet_apply(patch, idempotency_key)` MCP tool: replay with
          the same key is a verified no-op (returns the same response
          shape as the first call).
        - Atomic: failure rolls the artifact back; the YAML file is
          either fully-changed or untouched.
        - Auto-reload: the MCP server's cached state is invalidated
          on apply.
        - Response includes the post-apply `rivet validate`
          diagnostics — agents see the consequence of the change
          without a follow-up call.
        - `rivet validate` gains an audit-log check that detects
          idempotency-key violations across past applies (REQ-082
          F2 ethos extended to mutation).
    tags: [mcp, agent, idempotency, mutation, persona-review]
    fields:
      priority: must
      category: functional
      baseline: v0.14.0-track
    links:
      - type: derives-from
        target: FEAT-010

  - id: REQ-100
    type: requirement
    title: "`externals: kind: source` — track non-rivet upstreams (eclipse-score, sphinx-needs, DOORS exports, plain code repos) without the missing-rivet.yaml warning"
    status: draft
    description: |
      Today every external in `rivet.yaml` is assumed to be a rivet
      project, so `rivet sync` (and downstream loaders) try to read
      the external's `rivet.yaml` and emit a WARN when it is absent.
      A converter scenario like the eclipse-score import pulls 20+
      upstream repos that are deliberately not rivet projects — by
      design, they ship sphinx-needs / DOORS-exports / plain code,
      not `rivet.yaml`. The current behaviour emits 58 WARN lines of
      pure noise in that workflow.

      Generalises beyond eclipse-score: any fork tracking a DOORS
      export, a sphinx-needs project, or a plain source repo that
      feeds a converter or a source-linker wants the same shape.

      Design:
        - Add an optional `kind:` field to each entry under
          `externals:`. Two enum values:
          - `rivet` (default — current behaviour: loads the
            external's `rivet.yaml`, may emit
            assumption-of-use / discharged-by reconciliation, etc.).
          - `source` (NEW — `rivet sync` clones to the same on-disk
            location but loaders skip the `rivet.yaml` read attempt;
            no WARN; no rivet-project bookkeeping).
        - Scope: ~20 LoC in `rivet-core/src` plus the schema entry.
        - `rivet validate` rejects an unknown `kind:` value with a
          named-enum error (no silent fallback to `rivet`).

      Acceptance:
        - Fixture: a `rivet.yaml` declaring `externals: foo:
          { git: ..., kind: source }` syncs and validates cleanly,
          with ZERO `missing rivet.yaml` warnings for `foo`.
        - Fixture: omitting `kind:` defaults to `rivet` and
          preserves today's behaviour exactly — a missing
          `rivet.yaml` still surfaces (regression test).
        - Fixture: an unknown `kind:` value (e.g. `kind: roboms`)
          produces an ERROR diagnostic that names both the bad value
          and the enum domain.
        - Documented under `rivet docs externals`.

      Note: the slot REQ-100 was deliberately left free earlier
      after dropping the v1.0-readiness REQ proposal; this
      orthogonal request happily reuses the number.
    tags: [externals, sync, converter, non-rivet-upstream, ergonomics]
    fields:
      priority: should
      category: functional
      baseline: v0.13.x-track
    links:
      - type: traces-to
        target: REQ-051

  - id: REQ-101
    type: requirement
    title: "Artifact-driven verification gate — `rivet verify` matches approved artifacts to convention-named tests"
    status: draft
    description: |
      Land the artifact-driven verification-gate pattern that meld
      already runs (`tools/post_verification_comment.py`, ~50 LoC)
      as a first-class `rivet verify` subcommand.

      The gate inverts the usual "run tests, check exit code" loop:
      the artifact list is the worklist, the test is the evidence,
      and the absence of a matching test is a discrete diagnostic
      row (MISSING), not silence. Same traceability shape as
      REQ-051 (commit trailer demands link) and the schema's
      required-fields gates — the model demands a test, and CI
      falsifies the obligation mechanically.

      Pattern (per artifact A where A.status = approved and the
      schema's `verification-template` is set on A's type):

          glob  = expand(template, A.id)   # REQ-001 -> test_req_001_*
          tests = discover(glob)           # via configured runner
          if tests == []:        bucket(A) = MISSING
          elif any(t.failed):    bucket(A) = FAILED
          else:                  bucket(A) = PASSED

      Schema extension (composes on existing `ArtifactTypeDef` per
      the reuse-binding-patterns guidance, NOT a new directive):

        - id: requirement
          verification-template: "test_{id_lower_underscored}_*"

      The field is optional; types without it are excluded from the
      gate (e.g. decisions, features that have no executable
      evidence).

      Runner is shell-injectable via `rivet.yaml`
      (default `cargo test --no-fail-fast`) so pytest / nextest /
      bazel / ctest work without rivet learning each.

      Outputs:
        - `--format pr-comment` — markdown grouped by bucket with
          source-of-truth footer (byte-comparable to meld);
        - `--format json` — machine-readable, dashboard-ingestible;
        - `--format yaml --out artifacts/results/` — written into the
          existing `ResultStore` so `rivet results show` surfaces it
          without modification.

      Gate: exit code 1 if any artifact is FAILED or MISSING; 0
      otherwise.

      NOT an oracle in `rivet validate`: validate is read-only over
      YAML. `verify` executes tests and belongs in its own command.

      Acceptance:
        - `rivet verify --help` lists the subcommand.
        - Schema fixture with `verification-template:
          "test_{id_lower_underscored}_*"` on the `requirement`
          type + one approved REQ-X with a matching passing test
          makes `rivet verify` exit 0 and report 1/1 PASSED.
        - Removing the test makes `rivet verify` exit 1 with REQ-X
          in the MISSING bucket — the absence is a row, not silence.
        - Making the test fail makes `rivet verify` exit 1 with
          REQ-X in the FAILED bucket.
        - Types without `verification-template` (e.g. decisions) are
          excluded from the worklist and not counted.
        - `rivet verify --format pr-comment` emits markdown with
          PASSED / FAILED / MISSING sections + a footer naming the
          source-of-truth file(s) and the template — byte-comparable
          to meld's reference output on the meld corpus.
        - `rivet verify --format yaml --out artifacts/results/`
          writes a `ResultStore`-loadable file consumed by
          `rivet results show` without modification.
        - Runner command is overridable via `rivet.yaml`
          (`verify.runner`) — a pytest project sets it once, no
          code change.
        - Worked example under `examples/verify/` + GitHub Action
          snippet under `docs/ci/` wrapping
          `rivet verify --format pr-comment | gh pr comment`.
    tags: [verification, gate, ci, mbse, traceability, meld-parity, new-capability]
