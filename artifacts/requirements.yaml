  - id: REQ-353
    type: requirement
    title: yaml_cst has no FlowMapping node, so flow-style YAML is dropped with no parse error
    status: implemented
    description: "Found by REQ-348 differential gate, and it is the precondition REQ-346 could not have landed without. yaml_cst had a FlowSequence node and no FlowMapping. A flow-mapped value therefore produced neither a mapping nor an error — the data was simply not there. On rivet own corpus that silently cost the provenance of 18 artifacts: serde read provenance on 205 of the 321 artifacts in requirements.yaml and rowan on 195, the gap being exactly that file flow-style share, while both paths reported 321 artifacts. A loss invisible to anything counting artifacts. An artifact written ITSELF as a flow mapping was worse still: rowan returned nothing at all for it. THE FIX IS DELIBERATELY SMALL. Brace tokens mirror the bracket tokens that already existed, and parse_flow_mapping emits a Mapping node — the same kind a block mapping produces, with MappingEntry, Key and Value children — rather than a distinct FlowMapping kind, so every HIR walker gained flow support without knowing flow exists. A separate kind would have meant each consumer that forgot to handle it silently reads nothing, which is the failure being fixed. The tree stays lossless: braces and commas are kept as tokens, so the style is recoverable and the text round-trips. Flow entry values terminate at a comma or closing brace rather than at end of line, which is the whole difference from the block form, and each is wrapped in its own Value node so that scalar_text sibling collection stops at the entry boundary instead of swallowing the rest of the mapping into the first value. Flow mappings nest in flow mappings, in flow sequences, and as sequence items. TWO FINDINGS FROM THE NEGATIVE CONTROLS, both of which would otherwise have shipped. Removing the opening brace from lex_plain_scalar break bytes was caught by no test. The standing rule is that a surviving mutant means the assertion is missing, but probing both lexer variants side by side showed the opposite: the break byte was WRONG. A block mapping whose KEY contains a brace lexed as four tokens and emitted two spurious diagnostics, expected colon after mapping key and expected mapping key found LBrace. Removing it fixes that and shrinks the lexer change to two token arms; a test written to cover the mutant would have frozen a bug in place. The same probe showed a flow mapping inside a flow SEQUENCE producing three unexpected-token errors, because parse_flow_sequence recursed for a nested bracket but let a brace fall to the error arm. Both are fixed and each is caught by exactly the test that claims it. EVIDENCE. The oracle was written first and watched go red: the proptest generator in differential_yaml.rs was widened to emit provenance in both flow and block style and to compare it, and proptest shrank the failure to the corpus shape exactly. Eleven unit tests live IN yaml_cst.rs rather than in tests/, because the mutation gate runs --lib and cannot see integration tests, and five deliberate mutations of the new code each redden only the test that names them. The corpus gate moved from 24 agree and 2 differ to 26 agree and 0 differ, and refused to go quietly green on the way: it is pinned to a count, so closing the gap reddened it and forced this record rather than a silent re-baseline."
    release: v0.38.0
    tags: [yaml, parser, weak-green]
