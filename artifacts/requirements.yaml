  - id: REQ-354
    type: requirement
    title: the runner-liveness probe measures queue LATENCY, not liveness, and its one correct answer is unreachable without a scope the token cannot have
    status: implemented
    description: "The workflow is named Runner Liveness and its own header calls queued-run age the authoritative signal that directly measures the symptom. Queued age is LATENCY, not liveness, and the two need opposite responses: a saturated pool and a dead pool both show jobs stuck in queued. THE RIGHT ANSWER EXISTED AND HAD NO PATH TO IT. classify_stall already emits label-saturated, but reaching it requires the runner list, which requires the administration scope, which is not grantable to GITHUB_TOKEN. So every SCHEDULED probe 403s on that lookup and short-circuits at runners-unknown, which is an alarm. The classifier was correct and unreachable. Scale of the consequence, measured 2026-09-11: 95 closed and 2 open issues carry the title of this alert. THE FIX NEEDS NO NEW SCOPE, because liveness is observable from the jobs API the probe already reads. If a job requiring labels L is IN PROGRESS, a runner carrying at least L exists and is working; any queued job whose labels are a SUBSET of L is therefore waiting behind a live runner rather than behind an outage. The check is required of EVERY queued job rather than any, so a mix where some labels have live siblings and others have none still alarms and a real outage cannot hide behind one unrelated running job. When it cannot be shown for all, the answer is exactly what it was before. THE MODE IS DELIBERATELY DISTINCT from label-saturated rather than reusing it. That mode means capable runners exist and none is idle, established from the runner list, and its caller reports per-label idle counts read from that same list. Reached by the new path the list is absent, so reusing it would print idle by label none and imply an empty pool — the precise false alarm being removed. queue-behind-live-runners names what was actually observed. IT IS A NOTICE, NOT A PROBLEM, on the same grounds as dependency-blocked: the workflow charter, in its own words, is that when the pool goes offline every gate queues forever with no fallback and no alarm. A pool with jobs actively running on the labels the queued jobs need is not that condition. This stays inside the alarm charter rather than widening or narrowing it, and it is one line to reverse. WORKED EXAMPLE, the shape that filed the 96 alerts and the reason issue 940 was closed the same day: a 16-shard mutation matrix against 4 lean-mem runners serializes into four waves by construction, so shards queue past the 30-minute threshold every night. Measured at the time of the alert: org runners total 12, online 12, busy 12; the lean-mem label at 4 runners and 4 busy, running exactly 4 shards with 5 queued behind them. Nothing was down and every runner was working. EVIDENCE. The oracle was written first and watched go red on exactly one case, the saturation case, with all four controls already green: nothing running on those labels must still alarm, a running sibling on OTHER labels proves nothing, a readable offline pool still outranks the jobs signal, and dependency waits still short-circuit ahead of everything. Four mutations of the new code each redden only the controls that name the property — weakening every to any, weakening superset to any overlap, counting queued jobs as live, and running the check when the runner list is readable. NOTE THE RELATIONSHIP TO REQ-351, which is NOT resolved here. That requirement proposes scoping the probe to CI Gate needs, which changes WHICH jobs the alarm watches and is a monitoring-policy call for the maintainer. This one changes nothing about which jobs are watched; it stops the probe calling a demonstrably live pool dead."
    release: v0.38.0
    tags: [ci, monitoring, weak-green]
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-09-11T11:17:03Z

  - id: REQ-355
    type: requirement
    title: rivet get renders neither release nor provenance — the single-artifact inspector hides two first-class fields
    status: implemented
    description: "rivet get is the single-artifact inspector — the command that answers what is the state of this artifact — and BOTH of its output branches are hand-rolled allowlists, the same shape as mutate render_artifact_yaml, where a field not explicitly emitted is silently dropped. The text branch rendered id, type, title, status, description, tags, fields, links and incoming links. The JSON branch rendered command, id, type, title, status, description, tags, links, incoming_links and fields. NEITHER rendered release or provenance, both of which are first-class Artifact struct fields, and neither has for as long as those fields have existed. THIS IS NOT COSMETIC AND IT HAS ALREADY COST WORK. REQ-348 own record names it: the comparison could not be completed because rivet get does not render provenance at all, confirmed by a control against REQ-346 which carries provenance and showed none. The inspector could not show the field the investigation needed, so the equivalence question was left open rather than answered either way; it was settled later only by writing a differential gate that bypassed the CLI entirely. The release omission is the same failure in the other dimension: release is what release readiness is queried on, so a scoped artifact looked unscoped in the one view a person is most likely to check. THE FIX IS STRUCTURAL RATHER THAN TWO PRINT STATEMENTS, because adding two lines leaves the next field to be dropped just as silently. cmd_get now destructures Artifact with a pattern carrying no rest-pattern, so a field added to the model breaks this build until someone decides how get should present it. That decision can still be to show nothing; it just has to be made rather than defaulted into. Verified as a compile-time oracle: removing provenance from the pattern yields error E0027, pattern does not mention field provenance. Text output gains a Release line printed unconditionally next to Status, because an artifact with no release is backlog and that is a fact worth showing rather than a line worth hiding, plus a Provenance block and a variant-overrides summary. JSON output gains release and provenance as null rather than omitted when unset, so a consumer can tell no release apart from this build does not report release. EVIDENCE. The oracle was written first and its VACUITY GUARD fired before the assertions did: the test reads release from get --format json rather than asserting on a literal, and that read failed, which is how the JSON branch was found to carry the same omission rather than only the text branch being at fault. Five negative controls, each reddening on the specific claim: dropping the Release line reddens on the label; printing the label with a hardcoded dash reddens on the value; dropping the Provenance block reddens on its label; dropping release from JSON reddens the vacuity guard; and removing a field from the destructuring pattern fails the build."
    tags: [cli, evidence, weak-green]
