  - id: REQ-112
    type: requirement
    title: "cmd_commits excludes externals while cmd_validate includes them, creating inconsistent artifact counts"
    status: draft
    description: |
      Bug-hunt finding (git-remote-semantics, 3/3 lens-confirmed).

      cmd_commits loads ONLY local artifacts from config.sources and
      does not load externals, while cmd_validate (via ProjectContext)
      loads both local and external artifacts when configured. This
      means artifact counts, link validation, and unimplemented/orphan
      classification differ between `rivet commits` and `rivet
      validate` for projects with externals.

      Evidence: cmd_commits (line 10329-10335): loops through
      config.sources ONLY and builds store with local artifacts. Does
      not call load_all_externals() like cmd_validate does (line 4965,
      5029, 5498). The known_ids set (line 10337) thus excludes all
      cross-repo prefix:ID artifacts, so any commit referencing those
      IDs will be classified as 'broken' by commits but valid by
      validate.

      Location: /Users/r/git/pulseengine/rivet/rivet-
      cli/src/main.rs:10328-10335

      Acceptance:
        - In a project with externals declared in rivet.yaml: (1) Run
      `rivet commits` on a range where commits reference `prefix:ID`
      artifacts from externals. (2) Commits will report these as
      'broken refs' because the externals were never loaded. (3) Run
      `rivet validate` on the same source—it loads externals and
      validates the same cross-repo references successfully. The two
      commands count differently.
        - the inconsistency/incorrectness above is resolved and a
      regression test pins the corrected behaviour.
    tags: [bug-hunt, report-consistency, git-remote-semantics, oracle-verified]
    fields:
      priority: should
      category: functional
      baseline: v0.14.0-track
    links:
      - type: traces-to
        target: REQ-004

  - id: REQ-113
    type: requirement
    title: "resolve_external_dir returns unsynced cache_dir path for git externals without checking if sync has been performed"
    status: draft
    description: |
      Bug-hunt finding (git-remote-semantics, 3/3 lens-confirmed).

      resolve_external_dir returns cache_dir/<prefix> for git
      externals (line 315) without verifying the directory has been
      synced (i.e., .git exists). If sync has not been run, code that
      calls resolve_external_dir will silently use a non-existent
      path. Additionally, when --local is used during sync (setting
      use_path=true, line 104), the symlink/copy at cache_dir is
      created, but resolve_external_dir has no way to know if --local
      was used, so downstream code cannot distinguish between a git
      clone (current HEAD) vs a local symlink (working-tree state).

      Evidence: Line 315 returns cache_dir.join(&ext.prefix)
      unconditionally for git externals. No check for .git or error if
      the path doesn't exist. Compare to verify_baseline() (line 778)
      which explicitly checks ext_dir.exists() before proceeding.
      Additionally, sync_external with use_path=true (line 106)
      creates a symlink or copy, but the SEMANTICS are never
      recorded—downstream code using resolve_external_dir cannot tell
      if it's looking at a cached clone or an uncommitted working
      tree.

      Location: /Users/r/git/pulseengine/rivet/rivet-
      core/src/externals.rs:302-317

      Acceptance:
        - (1) Declare a git external without running `rivet sync`. (2)
      Call any code that uses resolve_external_dir, e.g.,
      detect_version_conflicts (line 660). It will return a cache_dir
      path that doesn't exist. (3) Try to read an artifact from that
      path—fails with ENOENT or similar. Additionally: (1) Run `rivet
      sync --local` to use a local path external. (2) Later, code
      calls resolve_external_dir—it returns the same symlink target
      regardless of whether --local was used. (3) The resolved path
      points to a working tree (uncommitted changes visible) but this
      semantic is not exposed to callers, so they don't know if the
      artifacts they loaded include unstaged changes.
        - the inconsistency/incorrectness above is resolved and a
      regression test pins the corrected behaviour.
    tags: [bug-hunt, report-consistency, git-remote-semantics, oracle-verified]
    fields:
      priority: could
      category: functional
      baseline: v0.14.0-track
    links:
      - type: traces-to
        target: REQ-004

  - id: REQ-114
    type: requirement
    title: "sync_external uses --local heuristic (use_path = ext.path.is_some() && local_only) but remote-sourced code ignores local_only context, reporting state inconsistently"
    status: draft
    description: |
      Bug-hunt finding (git-remote-semantics, 2/3 lens-confirmed).

      sync_external silently prefers ext.path over ext.git when
      local_only=true (line 104), skipping the git fetch/clone
      entirely. But the lockfile (rivet.lock) records the git URL and
      commit SHA for all externals, regardless of whether they were
      synced locally. This means rivet.lock may claim an external is
      at commit ABC, but it was actually synced from a local --local
      path that is ahead/behind ABC. The dashboard/audit sees what's
      in rivet.lock (git SHAs) and reports that as the truth, not
      realizing the resolved directory may have diverged.

      Evidence: Line 104: use_path = ext.path.is_some() && (local_only
      || ext.git.is_none()). When true, git fetch/clone is skipped
      entirely (lines 168-291 are not executed). But generate_lockfile
      (line 579) always calls git_head_sha on the resolved directory,
      which for a --local-synced path points to a symlink/copy—if the
      underlying working tree has unpushed commits, the lockfile
      records a local-only SHA, not the remote upstream. Then any tool
      reading rivet.lock thinks that SHA is canonical, when really
      it's just the working tree state.

      Location: /Users/r/git/pulseengine/rivet/rivet-
      core/src/externals.rs:104 + rivet-cli/src/main.rs:10934

      Acceptance:
        - (1) Have a git external with
      ext.git='https://github.com/org/repo' and ext.path='../local-
      checkout'. (2) Make a commit in ../local-checkout that's not
      pushed. (3) Run `rivet sync --local`. (4) Run `rivet lock` (or
      sync records it)—it captures the local-only commit SHA into
      rivet.lock. (5) Clone the repo elsewhere; run `rivet sync`
      without --local—it fetches from the remote, which doesn't have
      that local commit. Now the two clones have different SHAs in
      their lockfiles for the same external, both created by the same
      rivet workflow.
        - the inconsistency/incorrectness above is resolved and a
      regression test pins the corrected behaviour.
    tags: [bug-hunt, report-consistency, git-remote-semantics, oracle-verified]
    fields:
      priority: could
      category: functional
      baseline: v0.14.0-track
    links:
      - type: traces-to
        target: REQ-004

  - id: REQ-115
    type: requirement
    title: "Zola export emits absolute artifact links that break in subdirectories"
    status: implemented
    description: |
      Bug-hunt finding (path-url-leakage, 3/3 lens-confirmed).

      Artifact links in Zola markdown export begin with `/` which
