  - id: REQ-349
    type: requirement
    title: "make the consolidated YAML/artifact layer consumable by varve and other org tools — blocked on publishing the rowan fork, which is the thing varve declined"
    status: proposed
    description: "Maintainer instruction, 2026-09-10, planning v0.38.0 as a YAML maintenance and technical-debt release: ensure the result can be handed off to varve as well. THE NEED IS CONCRETE AND ALREADY DOCUMENTED. Per #930, varve wanted to parse its own artifacts for a traceability gate, REQ-TRACEGATE-001, considered adding a YAML crate, found the options were an unmaintained one or a fork, and wrote the gate in Python instead rather than take either. So the demand is real and was declined for a specific reason, which constrains what a handoff can look like. THE BLOCKER, FOUND WHILE PLANNING THIS AND NOT OBVIOUS FROM THE OUTSIDE: rivet's lossless CST at yaml_cst.rs is built on rowan, using GreenNodeBuilder and implementing rowan::Language, and rivet pins rowan to a FORK — pulseengine/rowan, branch fix/miri-soundness-v3. That fork is permanent by design, not transitional: the Cargo.toml rationale records that rust-analyzer/rowan pull requests 210, 211 and 212 were all closed UNMERGED because the maintainer intends a full rowan rewrite, so the fork stands until that lands. crates.io forbids git dependencies in published crates. THEREFORE handing rivet's parser to varve today means handing it a git dependency on a permanent maintenance fork, which is materially the fork option varve already turned down. A plan that did not notice this would not have executed. PREREQUISITE, WHICH IS NOT THE YAML WORK: REQ-252 already exists and covers publishing the git-only dependency closure, spar plus the rowan fork, to crates.io; REQ-250 covers publishing rivet itself; DD-074 records the decision to publish under rivet-sdlc-* names because the obvious names are squatted. All three sit at backlog. The handoff chain is REQ-252 first, then a publishable extraction, and nothing in v0.38.0 changes that ordering. WHAT SHOULD BE BUILT ANYWAY, because it is useful independent of publication and does not wait on it: draw the crate boundary during the consolidation rather than after. #930 argues the valuable shared artifact is the MODEL — the schema types and link semantics every consumer re-derives — rather than the parser, and the three-implementation finding in REQ-348 supports that: the parser is a means, the artifact model is the org-specific part worth owning. Consolidating REQ-346 and REQ-348 onto one path should therefore land behind a boundary that could become a crate, with no rivet-CLI types leaking across it, so extraction later is a move rather than a rewrite. HONEST INTERIM FOR VARVE, worth offering rather than leaving it waiting on a chain it does not control: a git dependency on a sibling org repository is a different organisational proposition from forking an abandoned third-party crate, even though neither is publishable. If varve is willing to take that, the handoff can precede REQ-252. That is varve's call and should be asked rather than assumed, since the Python gate it wrote already works and the cost of waiting may be lower than the cost of a git dependency it did not want. Cross-repo scope: the decision belongs with the maintainer and varve together, not in this repository alone. DECIDED 2026-09-10 by the maintainer: the rowan fork is OURS, and that settles it. The objection recorded above conflated two different things. varve declined forking an abandoned THIRD-PARTY crate and owning code it had no stake in; depending on a sibling repository inside the same organisation, maintained by the same people, with a written rationale for why the fork exists and a stated end condition, is a different proposition entirely. The handoff therefore does NOT wait on crates.io publication, and the interim offered above is the chosen path rather than a fallback: varve can depend on the org's rowan by git while publication proceeds separately. Publishing rowan is taken as the NEXT piece of work rather than a prerequisite, so REQ-252 moves out of backlog and is scheduled. What remains true from the analysis is the crate boundary: the consolidation in REQ-346 and REQ-348 should land behind a boundary with no rivet-CLI types crossing it, so that extraction is later a move rather than a rewrite, and so varve consumes the artifact model rather than reaching into rivet internals. That is worth doing during the consolidation regardless of when publication lands."
