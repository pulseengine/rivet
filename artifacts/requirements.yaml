  - id: REQ-276
    type: requirement
    title: "serve/export color-contrast audit — fix low-contrast (white on light grey) to WCAG AA (customer request)"
    status: verified
    description: "Customer-reported: white text on the light-grey background reads poorly. Audit the render/styles.rs palette (--bg #f5f5f7 grey, --surface #fff, --text-secondary #6e6e73) and every fixed color pair for WCAG AA (>=4.5:1 body text, >=3:1 large/UI) — white (#fff) on #f5f5f7 is ~1.05:1 and fails. Raise the failing pairs (darken text / adjust surface) without a full redesign, keeping the PulseEngine look. Applies to both serve and the static/compliance export (shared styles.rs). Add a small contrast check or documented palette rationale so it doesn't regress. MEASURED 2026-08-19 against the live palette in rivet-cli/src/render/styles.rs, which still carries the cited values (--bg #f5f5f7, --surface #fff, --text-secondary #6e6e73, --text #1d1d1f). 5 of 14 checked pairs fail WCAG AA body text at 4.5:1. The reported pair is confirmed and is the worst: white on --bg measures 1.09:1 (the issue estimated ~1.05). But it is NOT the most pervasive defect — the accent colour #3a86ff, used for LINKS, measures 3.20:1 on --bg and 3.48:1 on --surface, so every link in serve and export fails AA body text. White on accent is also 3.48:1, which passes the 3:1 UI threshold but fails 4.5:1 if the button label is body-size. Border #e5e5ea on --surface is 1.26:1 but is decorative and likely exempt. Passing comfortably: body text 15.46:1 and 16.83:1, secondary text 4.66:1 and 5.07:1, sidebar 6.72:1, and all three result colours between 5.07:1 and 6.08:1 — so this is a targeted fix to the accent and to any white-on-bg usage, not a redesign. ACCEPTANCE is therefore mechanical rather than visual: every body-text pair >= 4.5:1 and every UI/large pair >= 3:1, asserted by a unit test that computes relative luminance over the palette constants. That test is the regression guard the requirement already asks for, and it means this requirement can reach `verified` on evidence rather than on someone eyeballing a screenshot. RESOLVED 2026-08-21. Accent moved #3a86ff -> #2059b8 and accent-hover #2568d6 -> #18458d, hue preserved; 27 translucent rgba washes reshaded to the new rgb so tints match the colour they tint; `.stat-orange` darkened #e67e22 -> #c66c1d. Six unit tests in rivet-cli/src/render/styles.rs assert the palette, parsing hex values OUT OF the live CSS constant rather than copying them, so a stylesheet edit cannot drift away from its own audit. Three findings the original audit did not have. (1) The reported pair does NOT occur: no element paints white text on --bg. What a reader saw is the white label on the primary button at 3.48:1 and links at 3.20:1 — both real, both fixed. (2) Accent text sits on rgba(accent,.08/.12) washes in id chips, inline mono tags and source-line highlights; composited, three of those pairs measured 4.08-4.42:1 and failed. A naive fg/bg audit cannot see them because the background is translucent rather than a palette variable, so the test composites alpha. (3) `.stat-orange` measured 2.85:1 on --surface, failing even the 3:1 large-text bar, which the requirement's own audit missed. Also removed the drift class behind (2) and (3): five hand-copied hex literals of the accent lived outside the CSS in stats.rs, source.rs, doc_linkage.rs and serve/layout.rs, still painting the old blue after the palette moved. A single `styles::ACCENT_HEX` is now the source of truth, one test asserts the CSS agrees with it, and a static scan fails if the retired value reappears — negative-controlled by injecting it and confirming the scan goes red. Verified in rendered output, not just in source: `rivet export --format html` and `rivet serve` both emit --accent #2059b8 with zero retired references."
    release: v0.35.0
    provenance:
      created-by: ai-assisted
