  - id: REQ-338
    type: requirement
    title: "release readiness counts externals, so a version label shared with another project makes a release permanently uncuttable (#907)"
    status: verified
    description: "Reported from kiln (#907) while cutting v0.5.0. `rivet release status <VERSION>` aggregated artifacts across linked external projects, so when another repository happened to use the SAME version string its artifacts entered this project's readiness query. Concretely: all five kiln-owned artifacts were verified, and the release still read NOT cuttable because three gale requirements merely shared the label v0.5.0 — gale being on its own release timeline, which kiln cannot and should not verify or modify. The gate could therefore never go green no matter what kiln did, because the answer depended on another project's schedule. That pushes a maintainer toward either ignoring the gate, which defeats it, or hand-filtering the output, which is exactly the grep-the-YAML habit the tool exists to remove. Version strings collide readily across a multi-repo toolchain; v0.5.0 is about as common a label as exists. FIX per the reporter's own preferred option: externals are excluded from the verdict and reported in a clearly separated informational section, so cross-repo visibility — genuinely useful — is kept while the cuttable answer reflects only what this project controls. External artifacts carry a `prefix:ID` id, which is the same discriminator `rivet stamp` already applies; this makes the two commands agree rather than introducing a third convention. A new `external` array appears in the JSON output and a labelled section in the text output, both stating explicitly that they are not part of the verdict. SECOND SITE, FOUND BY WRITING THE TEST AND WORSE THAN THE REPORTED ONE: `rivet release notes` (REQ-327) had just shipped with the identical scoping and therefore listed an external project's unverified requirement as THIS release's WITHHELD SCOPE. Release status merely blocked a verdict; the note actively stated a falsehood about another project's work inside a document whose purpose is release evidence, under the ASPICE 11-03 heading limitations in relation to the committed scope. The reported issue and this one share a cause and are fixed together. Note the pattern this makes visible for the third time in two releases — #788 for coverage, REQ-327's own marker-blindness, and now this: the same question answered independently in two places drifts, and the drift is silent. Both call sites now apply the same filter, but the durable fix is REQ-333's requirement that a view be computed once in rivet-core and rendered rather than recomputed. Negative-controlled: all three tests were red before the change, with `cuttable: false` and `sup:REQ-EXT-1` appearing in `not_verified` and in `withheld` respectively."
    release: v0.37.0
    tags: [release, externals, cross-repo, weak-green]
