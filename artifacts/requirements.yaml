  - id: REQ-294
    type: requirement
    title: "Silent empty load: config typos and empty sources score green (#808)"
    status: verified
    description: "For a compliance tool, `validate` PASS and `coverage` 100% on a zero-artifact load is the worst failure direction. Reproducer shows two independent triggers: (case 1) a `generic-yaml` file with a near-miss root key (`requirements:` where `artifacts:` was expected) silently classifies as a non-artifact file; (case 2) a mis-keyed `sources:` (e.g. `typo_sources:`) at the top level of `rivet.yaml` disables every input, leaving the configured-sources loop with nothing to iterate — so the per-source `empty-source` diagnostic never fires either. Fix: (a) new `artifact-root-key-near-miss` diagnostic naming both the file and the offending key when a single-root-key generic-yaml file uses a plausible artifact-plural typo; (b) new `empty-source` diagnostic when a configured source yields zero artifacts; (c) new `unknown-config-key` diagnostic when `rivet.yaml` carries a top-level key outside the `ProjectConfig` schema (warning by default; hard-fail via `deny_unknown_fields` breaks legitimate downstream carrying of their own top-level keys like sigil's `schemas-path:`); (d) new `no-sources` diagnostic when the config declares zero sources at all — the case-2 gap the per-source loop cannot see, and also the plain `sources: []` case; (e) all four new diagnostics are Warning by default, Error under `--strict`; (f) `coverage` renders `n/a` (never `100.0%`) for zero-denominator rules, with a new `--strict-empty` flag that exits non-zero on empty load and `--fail-under` that also fails on empty load; (g) JSON output emits `null` percentages plus an `empty_scope: bool` field on every rule, closure entry, and the overall block so machine consumers can tell a satisfied gate from an empty one."
