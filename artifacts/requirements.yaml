      timestamp: 2026-09-10T00:00:00Z
  - id: REQ-352
    type: requirement
    title: "a CI gate cannot be evidence: the marker scanner reads neither config files nor .github, so REQ-343 and REQ-347 had no route to verified"
    status: verified
    description: "Found 2026-09-10 while trying to advance two implemented artifacts whose evidence IS a CI gate. `rivet verify` accepts an incoming verifies link or a source marker and nothing else, and REQ-343, the liveness probe's runs-on, and REQ-347, the cargo-deny advisories check, are both configuration changes with no test to carry one. Placing a marker where the evidence actually lives turned out to be impossible for two independent reasons, and the second was only found because the first fix did not work. FIRST: detect_language had no entry for yml, yaml or toml, so scan_file returned before any pattern ran. That is the identical gap #870 and REQ-319 fixed for shell, whose own code comment records that a shell gate could never be evidence for a requirement. Config files use the same hash comment convention as Python and shell, so the pattern itself was never the obstacle. SECOND, and invisible until the first was fixed: scan_directory skips every entry whose name starts with a dot, so .github was never reached. Markers were placed in ci.yml and runner-liveness.yml, the tests passed, and `coverage --tests` still reported No test markers found for both requirements — which is what exposed it. .github is a real source directory in every GitHub repository and workflows are where CI gates live; it is now exempted while every other dot-dir, .git in particular, stays skipped because it is not source and is enormous. ATTRIBUTION IS DELIBERATELY NOT GUESSED. Config markers return None from find_enclosing_function and fall back to file:line. The catch-all regex matches `function name(`, which appears inside a YAML run block, so falling through would attribute a workflow marker to a shell helper several steps away — a plausible wrong name, which is exactly the shape of REQ-326's misattribution. An unambiguous ci.yml:657 is better evidence than a confident wrong one. THE SECOND TEST FOR THAT GUARD WAS INITIALLY VACUOUS and is worth recording. Its fixture contained no shell block, so the catch-all had nothing to match and returned None regardless; removing the guard changed nothing and the negative control stayed green. The fixture now contains a `function helper()` inside a `run: |` block — the actual hazard — and removing the guard now reddens with the marker attributed to helper. A guard tested against a document that cannot exercise the hazard is not tested. VERIFIED end to end: with markers placed on the cargo-deny check step and the probe's runs-on, `rivet coverage --tests` reports REQ-343 with 1 test marker and REQ-347 with 1 test marker, where both previously reported none. Both halves negative-controlled — removing the extension entry reddens two cases, restoring the blanket dot-skip reddens the .github case. THE PR-DIFF MUTATION GATE CAUGHT A GAP IN THIS CHANGE, which is worth recording because it landed in a change whose whole subject is guards tested against fixtures that cannot exercise them. Exempting .github turned the skip into a three-way condition — skip_dot or name equals target or name equals node_modules — and the gate reported one surviving mutant at test_scanner.rs:344:49, replacing the second or with and. The .github and .git tests cover the dot branch; nothing exercised the other two. Scanning target would walk build artefacts and could surface markers from vendored source, so the skip is load-bearing and was untested. Covered now, and negative-controlled by applying the mutant: both skipped directories become visible and the test reddens. The new test carries its own POSITIVE control — a real source file whose marker must be found — so the two skip assertions cannot pass on a scanner that simply found nothing, which is the vacuity shape this session kept hitting. NOTE ON THE CLASSIFIER: tools/ci-diagnose classify_failure reported this job as setup-failed, which is wrong. The mutation run itself succeeded and the check-surviving-mutants step failed afterwards, leaving later steps skipped, and the heuristic reads any skipped step after a failure as a setup problem. That is the sibling defect already noted against REQ-325 and it is now observed a second time; the classification would have sent a reader to the wrong place had the finding not been read directly."
