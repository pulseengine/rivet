    provenance:
      created-by: ai-assisted
      model: claude-opus-4-8
      timestamp: 2026-08-19T00:00:00Z

  - id: REQ-301
    type: requirement
    title: "Two coverage surfaces contradict each other: --tests reports 100% while the link rule reports 0% (#788, #787)"
    status: proposed
    description: "Reported against rivet 0.32.0 on pulseengine/varve v0.5.0. All 12 requirements are `status: verified`, advanced by `rivet verify` on the strength of `// rivet: verifies` source markers, and `rivet coverage --tests` reports 12/12 = 100 percent. The `requirement-verification` link rule reports 0 percent for the same 12 requirements. Both numbers are printed by the same tool about the same artifacts; at most one can be right, and a reader has no way to tell which. For a compliance tool the disagreement is worse than either number being wrong on its own, because it means neither can be cited. Paired with #787, which is plausibly the mechanism or part of it: `coverage --tests` attributes a `// rivet: verifies` marker to the PRECEDING helper fn rather than the FOLLOWING `#[test]` fn, so the marker set it counts may not be the set a reader believes it counted. Deliver: (1) root-cause the attribution bug in the marker scanner and fix it to bind to the next test-like item, not the previous item; (2) decide and document which surface is authoritative — link-based coverage or marker-based `--tests` — and make the non-authoritative one say so in its output rather than presenting a bare competing percentage; (3) a regression fixture holding both surfaces on the same artifact set so they can never silently diverge again. Same family as REQ-294 and the v0.33.0 gate work: a number that cannot be trusted is worse than an absent one."
    release: backlog
    provenance:
      created-by: ai-assisted
      model: claude-opus-4-8
      timestamp: 2026-08-19T00:00:00Z

  - id: REQ-302
    type: requirement
    title: "Overlapping sources make every id collide with itself — 184 phantom errors masked 6 real ones (#746)"
    status: verified
    description: "Found while auditing spar's artifact set. When two configured `sources[]` paths overlap (one nested inside another, or the same tree reached twice), every artifact is loaded twice and `duplicate-artifact-id` fires against itself. On spar this produced 184 phantom errors which MASKED 6 genuine ones — the failure mode that matters, since a wall of false errors is functionally identical to no error reporting at all, and it actively caused a wrong number to be reported. Second, independent item in the same report: diagnostic output order is non-deterministic, so two runs over an unchanged tree produce different orderings and report diffing is useless — which is precisely how a compliance workflow detects drift between baselines. Fix: dedupe overlapping source paths at load time so each file is read once, and impose a total order on diagnostics before rendering. PR #759 carries the fix; it predates this artifact, which is being filed retroactively because the issue had no typed home and was therefore invisible to release planning."
    release: v0.34.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-4-8
      timestamp: 2026-08-19T00:00:00Z

  - id: REQ-303
    type: requirement
    title: "serve: /api/v1/artifacts silently truncates at limit=1000 while the repo holds 1017 (#832)"
    status: implemented
    description: "`/api/v1/artifacts` caps `limit` at `.min(1000)` (rivet-cli/src/serve/api.rs:459, again at :630). This repo now holds 1017 artifacts, so a client asking for everything receives 1000 rows with no indication that 17 were dropped. Measured: `total: 1017, returned: 1000`. A cap is fine; a SILENT cap is not — the response carries `total` next to a short array, so the data needed to detect truncation is present but nothing marks the payload as partial, and every consumer reading `artifacts` as the full set is quietly wrong. Two consequences are already visible: serve_integration.rs:569 asserts `externals_unscoped > 0` on `origin=all&limit=1000`, i.e. it assumes that window contains every artifact (it passes today only because the externals happen to sort into positions 0-3); and before #746/#759 the ordering was non-deterministic, so WHICH 17 fell off the end varied run to run. Fix in order of value: (1) emit `truncated: true` (or `returned` alongside `total`) whenever `artifacts.len() < total` so consumers can fail loudly; (2) keep the window deterministic so truncation is at least reproducible; (3) decide the cap deliberately — either document 1000 as a paging boundary with a working offset/cursor, or let `limit=0`/`limit=all` mean no cap on the machine-readable endpoint. Step 1 alone converts this from silent to detectable. Verified NOT to affect the export path: `rivet export --format generic-yaml` emits 1017 of 1017."
    release: v0.35.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-08-20T00:00:00Z

  - id: REQ-304
    type: requirement
    title: "ci: the Test job can produce no JUnit XML and still report success — three stacked silencers (#833)"
    status: implemented
    description: "The `Test` job's evidence step (.github/workflows/ci.yml:414-428) is named `Run tests (JUnit XML output)` and can satisfy none of that name while going green, because three independent silencers sit in a row: (1) `cargo install cargo-nextest --locked 2>/dev/null || true` swallows an install failure twice, by discarding stderr and by discarding the exit code, so a registry outage or an MSRV bump is indistinguishable from success; (2) the `else` branch falls back to `cargo test --all`, which emits no JUnit XML and drops the `ci` profile's `retries = 2` and `fail-fast = false` — silently removing the flake protection #494 added; (3) the upload step then carries `if-no-files-found: ignore`, so the missing artifact is not an error. Each silencer is individually defensible and their composition is not. Same family as #293, where `continue-on-error: true` on release.yml's `build-test-evidence` hid a real failure across four releases, each shipping a compliance bundle with no test evidence. Fix: install via `taiki-e/install-action` (already used for this exact tool in the Proptest job and in release.yml, so this makes three jobs consistent rather than introducing anything new), run nextest unconditionally, and flip `if-no-files-found` to `error` — that last is the part that makes the evidence claim checkable. The fix is only real if the gate can then go red, so whoever lands it must negative-control it: point the tool or the path at something nonexistent and confirm the job FAILS rather than skipping."
    release: v0.35.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-08-20T00:00:00Z

  - id: REQ-305
    type: requirement
    title: "ci: Proptest (extended) runs cargo test without nextest retries, so the documented serve race reddens it (#835)"
    status: implemented
    description: "`.config/nextest.toml` carries `retries = 2` specifically because the serve/integration tests bind ports and spin up a server, so under CI parallelism one occasionally loses a timing/port race. The `Proptest (extended)` job runs those same tests under 10x load (`PROPTEST_CASES: 1000`, the worst case for that race) via `cargo test --all` — not nextest, therefore no `--profile ci`, therefore no retries. The protection that exists for this exact flake is absent in the job most likely to trigger it. Observed on PR #818: `api_artifacts_search` failed with `left: 0, right: 200`, i.e. no HTTP response at all rather than an error status — verbatim the failure mode `start_server()` documents in its own comment (`status=0 on api_artifacts_unfiltered / api_artifacts_search under Proptest load`). The same suite passed 2257/2257 in the `Test` job on the same commit, so the difference is the runner, not the code. Two costs already paid: #759 carried a red Proptest for 14 days and took a full investigation (including two hypotheses built and discarded) to establish as environmental; and a job that reddens on a known race trains reviewers to merge past it, which is how a real failure eventually gets waved through. Fix: either give the job the same retry semantics (`cargo nextest run --all --profile ci`, which reports a retry-passing test as FLAKY so the signal is kept rather than hidden), or exclude the serve/integration tests from this job entirely — they are not property tests and gain nothing from PROPTEST_CASES=1000, which is arguably cleaner and also cuts the job's runtime."
    release: v0.35.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-08-20T00:00:00Z

  - id: REQ-306
    type: requirement
    title: "check verification-evidence is name-existence, not command-reachability — an empty stub satisfies it (#807 Defect 2)"
    status: verified
    description: "Second of the two defects in #807; Defect 1 (the discarded `--manifest-path`) shipped in #830. `filter_matches_any` is `names.iter().any(|n| n.contains(filter))` — it checks that a function name resembling the filter exists SOMEWHERE in the scanned tree, not that the step's command would actually reach that test. The reporter proved it: dropping an EMPTY `#[test] fn <missing_name>() {}` into the root `tests/` made a finding disappear. So the real test can error while a hollow one passes, and the check is satisfiable by exactly the stub it exists to catch — the same shape as #556 (`a filter matching nothing exits 0 with 0 passed`). Fixing this changes the check's semantics from name-existence to command-reachability: resolve the step's command to its actual target set (per manifest/package/test-target) and match only within that, plus reject empty-bodied test functions as evidence. That is a design change rather than a parser fix, which is why it was deliberately sequenced after Defect 1 — the issue notes that fixing 2 alone would have converted every nested-workspace step from a false failure into a hard failure. With Defect 1 landed, stricter matching now tightens real steps instead. Related: the check exits 0 on an empty scan (REQ-290 added the warning but not the exit code), so a project with no parseable steps still reads as a pass. Shipped as extract_test_fn_names in rivet-core, used by the evidence scan in place of extract_rust_fn_names: a candidate must carry a test-family attribute (test, tokio::test, rstest) AND a body holding more than whitespace and comments. This deliberately reverses the over-approximation the old extractor documents as the SAFE direction; it is not the safe direction, because a gate that can only under-report is a gate you cannot fail. The old function keeps its contract and its callers, so the change is additive. Verified against three fixtures in one file: a real test still counts, an empty-bodied test does not, and a non-test helper sharing the name does not. Full per-target command resolution is NOT implemented and remains unaddressed. The related empty-scan note is deliberately out of scope: REQ-290 decided that exit 0 there is the contract for callers and exposes empty_scan in JSON so a machine can tell a vacuous run from a pass, and that decision is pinned by its own test."
    release: v0.36.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-08-20T00:00:00Z

  - id: REQ-307
    type: requirement
    title: "CLI top-level command list is 52 flat entries — the common path still is not legible (#812 residual)"
    status: proposed
    description: "Residual clause from REQ-298. #812 asked to strip REQ/# refs from help, cap entry length, AND \"tighten the top-level command list so the common path is legible\". The first two are done and measured: `rivet -h` now has 0 REQ ids, 0 issue refs, a longest line of 97 columns and no line over 100 (`trace` came down from 405 characters). The third was implemented as one-sentence-per-ENTRY, which is a defensible reading, but the list itself is unchanged at 52 flat top-level commands with no grouping and no distinction between the handful a new user needs (init, validate, list, coverage, check) and the long tail (variant-*, shard, supplier-pull, ordeal, migrate, templates). `-h` and `--help` print the same 52; there is no short form. REQ-298 was accepted as verified on the entry-length reading rather than blocking the v0.34.0 cut, so this artifact carries the remaining clause explicitly rather than letting it disappear into a closed requirement. Options worth weighing: group commands by concern in the help output; mark advanced commands hidden from `-h` while keeping them in `--help` (clap supports this directly); or promote a short `COMMON COMMANDS` block above the full list. Cross-check against REQ-297 — the same discoverability concern motivated the `rivet context` work, and both come from the same org-wide CLI survey."
