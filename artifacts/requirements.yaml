  - id: REQ-161
    type: requirement
    title: "rivet validate --structural: gate on graph/parse/type integrity only, separate from coverage/lint"
    status: implemented
    description: |
      From issue #408 (and the recurring #353/#355 ask): `rivet validate`'s
      FAIL/PASS lumps structural integrity (broken graph) together with
      coverage/lint findings (incomplete/non-compliant), so a bulk status-flip
      or edit can't tell "did I break the graph?" from "the project is still
      incomplete". spar and sigil both hand-rolled a `0 broken cross-refs` gate
      for exactly this.

      Add `Diagnostic::is_structural()` — an explicit allowlist of the
      structural rule ids: artifact-parse-error, duplicate-artifact-id,
      known-type, unknown-link-type, link-target-type, cardinality, broken-link,
      doc-broken-ref, yaml-type-coercion, conditional-rule-consistency,
      coverage-rule-consistency. Everything else — including required-field,
      unknown-field, status-allowed-values, prose-mention, near-duplicate-intent,
      orphan, and all schema-defined coverage/status-gate rules — is coverage/
      lint. (The three borderline rules required-field / unknown-field /
      status-allowed-values are classified coverage by design: an
      incomplete/extra/typo'd field doesn't break the graph.)

      `rivet validate --structural` retains only structural diagnostics before
      counting/display, so the shown set, counts, and PASS/FAIL exit all reflect
      structural-only. The classification is a method on Diagnostic (no rename
      of validate_structural*, per the #408 option-b).

      Acceptance:
        - `Diagnostic::is_structural()` returns true for exactly the structural
          rule ids; a unit test enumerates every built-in rule and asserts its
          class.
        - On a project whose only error is a broken link, `rivet validate
          --structural` FAILs and shows the broken-link diagnostic; on a project
          whose only issues are coverage/lint, `--structural` PASSes.
        - `rivet validate --structural` on the rivet repo PASSes with 0
          diagnostics shown (its 200+ warnings are all coverage/lint).
        - Unit test `is_structural_classifies_every_builtin_rule` + CLI test
          `validate_structural_gates_on_structural_only` pass.

      Deferred: a per-rule `allow:` config and any rename of the
      `validate_structural*` functions (their name is unrelated to this gate).
    tags: [feature, validation, gating, dx, issue-408, issue-353, issue-355]
    fields:
      priority: should
      category: functional
    links:
      - type: traces-to
        target: REQ-004

  - id: REQ-162
    type: requirement
    title: "Declare the canonical status lifecycle in common.yaml so typo'd statuses fail validation"
    status: implemented
    description: |
      From #352/#355 Finding 1: the `status` base-field had no `allowed-values`,
      so a typo'd or off-vocabulary status (`implmented`, `acitve`) passed
      `rivet validate` silently and the valid set wasn't discoverable. The
      enforcement mechanism (REQ-135 — `status-allowed-values`) shipped but was
      inert until a set was declared.

      Maintainer decision (this session): declare the canonical lifecycle in
      the shared `schemas/common.yaml` `status` base-field —
      `[draft, proposed, approved, implemented, verified, released,
      deprecated, rejected]`. Ordering for promotion gates: draft -> proposed -> approved
      -> implemented -> verified -> released; deprecated/rejected terminal.

      Migrated the rivet repo's own drift to fit the set (the only 7 artifacts
      off-vocabulary): `accepted`/`active` design-decisions -> `approved`
      (a decision in force); the `active` feature FEAT-066 and `partial`
      component ARCH-ADAPT-WASM -> `implemented` (both exist in code). `proposed`
      was already in the set. No-status artifacts are unaffected (the check only
      fires when a status is present).

      Acceptance:
        - `schemas/common.yaml` `status` base-field declares the 8-value canonical set (incl. `released`).
        - An artifact with a typo'd status (`implmented`) fails `rivet validate`
          with a `status-allowed-values` ERROR + remediation; an artifact with
          no status does not.
        - `rivet validate` on the rivet repo PASSes (drift migrated; 0
          `status-allowed-values` errors).

      Deferred (separate, bigger): #355 Finding 2 — the ASPICE promotion gates
      hardcode `(= status "approved")` so approved -> implemented mis-fires;
      fixing it needs a `status-at-least` predicate over the ordering declared
      here. Tracked on #355.
    tags: [schema, status-lifecycle, validation, issue-352, issue-355, maintainer-decision]
    fields:
      priority: should
      category: functional
    links:
      - type: traces-to
        target: REQ-135

  - id: REQ-163
    type: requirement
    title: "Compliance CI must forward the version switcher + back-link inputs to the report action"
    status: implemented
    description: |
      Maintainer reported (#420) that the published compliance report for
      0.15.0 lost the version selector and the "back" navigation that 0.1.0
      has. Root cause traced: `rivet export --format html` still supports
      `--homepage` (back-link), `--versions` (switcher), and `--version-label`,
      and the compliance action exposes them as `homepage` / `other-versions` /
      `report-label`. But the CI never supplied them:
        - the reusable `compliance.yml` workflow passed `version:` (not an
          action input — silently ignored; the action's label input is
          `report-label`) and never exposed `other-versions`, so any caller
          using it could not produce a switcher;
        - `release.yml`'s compliance step passed no `homepage`/`report-label`.

      Fix (this repo's part): `compliance.yml` now maps `version ->
      report-label` and adds an `other-versions` passthrough input; `release.yml`
      labels the report with the release tag and sets a default `homepage`.
      The cross-version switcher inherently needs the full published-version
      list, which only the pulseengine.eu site-publishing pipeline knows — that
      remains the root-cause fix for the live regression (tracked on #420, plus
      the expired site TLS cert).

      Acceptance:
        - `compliance.yml` exposes an `other-versions` input and passes
          `report-label` + `other-versions` to the action.
        - `release.yml` passes `report-label` + `homepage` to the compliance
          action.
        - Both workflow files parse as valid YAML.
    tags: [ci, compliance, reporting, dx, issue-420, maintainer-reported]
