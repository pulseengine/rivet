  - id: REQ-295
    type: requirement
    title: "check verification-evidence is useless as a gate: blind to nested workspaces, and satisfied by an empty stub (#807)"
    status: verified
    description: "Reported externally and confirmed on main. Two independent defects that together make the check unable to gate. Defect 1 — false failures: a step running `cargo test --manifest-path compat/<crate>/Cargo.toml <name>` reports 'no test matching found' though the test exists. `--manifest-path` sits in VALUE_FLAGS purely so its value is not mistaken for the filter, and the value is then discarded; the scan root comes from `default_marker_scan_paths`, which returns the project root only when the root Cargo.toml declares `[workspace]` and otherwise scans just ./src and ./tests — so a nested independent workspace is invisible. Reporter saw 14 false failures, exit 1. Defect 2 — false passes: `filter_matches_any` is `names.iter().any(|n| n.contains(filter))` over every fn name collected from the scan roots, so it asserts only that a function of that name exists SOMEWHERE scanned, never that the step's command reaches it or that it asserts anything. Proven by the reporter: dropping `#[test] fn <missing name>() {}` into the root tests/ took findings 14 to 13. The check built for #556 ('a filter matching nothing exits 0 with 0 passed') is therefore satisfiable by exactly the stub it exists to catch. FIX ORDER IS LOAD-BEARING: Defect 1 must land before or with Defect 2 — fixing 2 alone converts every nested-workspace step from a false failure into a hard failure, making the reporter's 14 strictly worse. Related third property: an empty scan still exits 0, and on rivet's own repo the check examines 0 steps. Both defects are now shipped: Defect 1 (the discarded --manifest-path) in #830, Defect 2 (name-existence rather than test-reachability) under REQ-306. The umbrella is therefore discharged."
    release: v0.36.0
    provenance:
