  - id: REQ-169
    type: requirement
    title: "rivet sync refuses to overwrite uncommitted changes in a git external's cached checkout"
    status: implemented
    description: |
      Self-found while triaging a maintainer question about co-developing two
      synced repos at once. `git:` externals are cloned into
      `.rivet/repos/<prefix>` and `rivet sync` re-runs `git fetch` + `git
      checkout <ref>` over that checkout. If you edited files there while
      working in both repos, the checkout silently moves HEAD out from under
      your edits (or fails cryptically) — uncommitted work is lost with no
      warning. `path:` externals are unaffected (they symlink to the live tree;
      cf. REQ-020), which is the supported way to co-develop both repos.

      Add a guard: before fetch+checkout, `is_working_tree_dirty()` checks `git
      status --porcelain` for staged/unstaged changes to TRACKED files
      (untracked `??` entries are preserved by checkout, so they do not block).
      When dirty and `--force` is not given, `sync` aborts non-zero naming the
      prefix and path, and points to commit+push / `--force` / `path:`. A new
      `rivet sync --force` opts out (discard). Loud-fail over silent loss (F2).

      Acceptance:
        - With a `git:` external whose `.rivet/repos/<prefix>` has an
          uncommitted tracked edit, `rivet sync` exits non-zero and the message
          names the prefix and `--force`; `rivet sync --force` proceeds.
        - `cargo test -p rivet-core --lib
          is_working_tree_dirty_detects_tracked_edits_not_untracked` passes; the
          existing externals tests still pass.
        - `rivet validate` on the rivet repo still PASS.
    tags: [externals, sync, cross-repo, safety, loud-fail, dx, dogfooding, self-found]
    fields:
      priority: should
      category: functional
    links:
      - type: traces-to
        target: REQ-020

  - id: REQ-170
    type: requirement
    title: "validate surfaces un-synced externals so cross-repo cycle/backlink checks aren't silently incomplete"
    status: implemented
    description: |
      Follow-up to the multi-repo co-development design (REQ-169). `rivet
      validate` runs `detect_circular_deps` to catch A->B->A link cycles across
      repos, building the graph by reading each external's own `rivet.yaml` from
      `.rivet/repos/<prefix>`. But that read is `if let Ok(...)`: an external
      that is not synced (or whose config won't parse) is silently skipped, so a
      cycle or broken reference routed through it is invisible and validate
      reports a clean "0 circular deps". The acyclicity guarantee is only as
      good as graph completeness, and the incompleteness was silent (violates
      F2: loud-fail over silent-success).

      Add `unresolved_externals(externals, project_dir) -> Vec<String>` (sorted)
      returning the prefixes whose cached `rivet.yaml` cannot be loaded. `rivet
      validate` reports them: a WARNING naming the un-synced prefixes and
      telling the user to run `rivet sync`, plus an `unresolved_externals` array
      in `--format json`. Externals resolvable via a `path:` (the live tree)
      are not flagged. Warning only — does not change PASS/FAIL.

      Acceptance:
        - `rivet validate` on a project with an un-synced `git:` external prints
          a warning containing "INCOMPLETE" and the prefix; `--format json`
          includes that prefix in `unresolved_externals` while `circular_deps`
          is 0.
        - `cargo test -p rivet-core --lib
          unresolved_externals_lists_only_unsynced_repos` passes.
        - `rivet validate` on the rivet repo still PASS (spar resolves via its
          `path:` fixture, so it is not flagged).
    tags: [externals, sync, cross-repo, validate, loud-fail, f2, dogfooding, self-found]
    fields:
      priority: should
      category: functional
    links:
      - type: traces-to
        target: REQ-020

  - id: REQ-171
    type: requirement
    title: "graph E2E tests must bound node count so dataset growth doesn't trip the render budget"
    status: implemented
    description: |
      Self-found while triaging why Playwright E2E was red. Three graph/diagram
      tests fail reproducibly (through the CI retry), and have been red across
      multiple merges — unnoticed because Playwright E2E is a non-required check
      and main runs are concurrency-cancelled, so it never reports a conclusive
      green. Root cause is dataset growth, not a serve regression:

      - `graph.spec.ts` "custom polygon shapes" hit `/graph?types=requirement,
        design-decision&depth=2` with NO `?limit=`. The dogfood dataset grew
        past the default 200-node render budget for that filter, so the view
        returns the "above node budget" placeholder (no SVG) and the polygon
        assertion gets 0. Verified locally: the same URL with `&limit=2000`
        renders the real graph.
      - `diagram-viewer.spec.ts` graph page used `/graph?limit=2000` (the FULL
        ~871-node graph); that page is now heavy enough that `goto`+settle
        exceeded the timeout, failing the `.svg-viewer` toolbar/fullscreen
        checks. A bounded focused subgraph renders the same wrapper fast.

      Fix (test-only): add `&limit=2000` to the polygon test, and point the
      diagram-viewer graph case at a focused subgraph
      (`/graph?focus=REQ-001&depth=1&limit=2000`). Both verified green in a real
      browser locally (7/7 in the affected specs).

      Acceptance:
        - `cd tests/playwright && npx playwright test graph.spec.ts
          diagram-viewer.spec.ts --project=chromium --grep
          "polygon|toolbar present|fullscreen toggles"` passes (was 3 failing).
        - `rivet validate` on the rivet repo still PASS.
    tags: [serve, dashboard, graph, playwright, e2e, dogfooding, self-found, ci-hygiene]
    fields:
      priority: should
      category: functional
    links:
      - type: traces-to
        target: FEAT-001

  - id: REQ-172
    type: requirement
    title: "serve: filtering/search preserves the active variant scope (don't drop ?variant= on hx-push-url)"
    status: implemented
    description: |
      Maintainer-reported (#430). In the serve dashboard the variant
      `<select id="variant-selector" name="variant">` lives in the context bar,
      OUTSIDE the filter form. The filter controls (search box, type filter,
      per-page, status) issue `hx-get` requests with `hx-include` listing only
      their own form fields and use `hx-push-url`. So filtering/searching a
      variant-scoped view sent NO `variant=` and the pushed URL lost `?variant=`
      — silently resetting the scope, and losing it again on reload.

      Fix: add `#variant-selector` to every filter control's `hx-include`
      (search_input, type_filter, per_page_select, filter_bar form + its inner
      search, and the validate status select), via a shared
      `hx_include_with_variant()` helper. The server already treats an empty
      `variant=` as unscoped, so this is safe when no variant is active, and the
      selector is only in the DOM when a variant model exists. The reverse flow
      (select variant after filtering) was already correct: the change handler
      rewrites only `variant` on the current URL, preserving other params.

