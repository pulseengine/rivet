  - id: REQ-198
    type: requirement
    title: "`rivet add` must emit valid YAML for multi-line/special-char fields (data-integrity bug)"
    status: implemented
    description: |
      Verified data-corruption bug (current main): `rivet add --type requirement
      --title T --description "Line one.<newline>Line two."` writes INVALID YAML
      and breaks the whole artifacts file. `render_artifact_yaml`
      (rivet-core/src/mutate.rs) was a naive serializer:
        - `description: >` folded scalar with only the FIRST line indented — a
          newline put line 2 at column 0 → "could not find expected ':'" parse
          error, so `rivet validate` then FAILs to load the file (2 errors).
        - `title: {raw}` / tag / field values emitted unquoted — a colon (e.g.
          "Multi word: with colon") also produced invalid YAML.
      The `modify`/`set_field` path already serializes safely via
      `yaml_edit::yaml_render_scalar_value`; only the `add` path diverged.

      Fix: route `add`'s title/status/description/tags/field values through the
      same `yaml_edit` safe emitters (`yaml_quote_inline_scalar` +
      `yaml_render_scalar_value`), so newlines become block-literal `|` scalars
      with correct indentation and special chars are quoted.

      Acceptance:
        - `cargo test -p rivet-core --lib mutate::tests::render_artifact_yaml_multiline_and_colon_is_valid_parseable_yaml`
          passes (rendered YAML parses; multi-line description round-trips).
        - In a temp project, `rivet add --type requirement --title X
          --description $'a\nb'` then `rivet validate` → PASS (was FAIL).
        - `rivet validate` on the rivet repo still PASS.
    tags: [mutate, add, yaml, data-integrity, serialization, bugfix, agent-ux]
    fields:
      priority: must
      category: functional
    links:
      - type: traces-to
        target: REQ-031

  - id: REQ-199
    type: requirement
    title: "`rivet add`/batch/MCP serialize nested (list/map) field values as structures, not block-scalar strings"
    status: implemented
    description: |
      Follow-on to REQ-198 (found while verifying its comprehensiveness): in
      `render_artifact_yaml` (rivet-core/src/mutate.rs), a non-scalar field value
      (a sequence or mapping — reachable via `rivet batch` or the MCP add tool,
      where field values aren't restricted to CLI `--field key=value` strings)
      hit the `other =>` arm, which `serde_yaml::to_string`-ed the structure
      (multi-line) and then — after REQ-198 — wrapped it in
      `yaml_render_scalar_value`, collapsing the list/map into a block-literal
      STRING (`owners: |-\n  - alice\n  - bob`). Pre-REQ-198 it was instead
      INVALID YAML (unindented continuation); neither preserved the structure.

      Fix: emit nested field values as properly-indented YAML under the key
      (serde produces valid YAML; shift it right by the field-content indent), so
      a list field round-trips as a list and a map as a map.

      Acceptance:
        - `cargo test -p rivet-core --lib mutate::tests::render_artifact_yaml_nested_field_value_stays_structured`
          passes (a sequence field round-trips as a sequence, not a string).
        - `rivet validate` on the rivet repo still PASS.
    tags: [mutate, add, batch, mcp, yaml, data-integrity, serialization, bugfix]
    fields:
      priority: should
      category: functional
    links:
      - type: traces-to
        target: REQ-198

