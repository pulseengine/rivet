  - id: REQ-140
    type: requirement
    title: "Generic-YAML load is inconsistent across commands: validate loads a file that list/get/export silently drop"
    status: draft
    description: |
      Surfaced while verifying issue #353 against current `main` (the silent
      file-skip of #353 part 1 is already fixed by REQ-062). A file with an
      `artifacts:` list AND an unknown sibling top-level key (the reporter's
      `traceability.yaml` with `loss-coverage:`) is handled inconsistently:

        * `rivet list` / `get` / `export` build the store via the strict
          `load_artifacts` adapter (serde `deny_unknown_fields`) and DROP the
          whole file — its artifacts are invisible to these commands.
        * `rivet validate` builds its store via the lenient
          `yaml_hir::extract_schema_driven` path, which tolerates the unknown
          key and LOADS the artifacts — then ALSO reports the same file as
          `artifact-parse-error` "failed to parse".

      So the same project yields different artifact sets depending on the
      command, and `validate` simultaneously validates an artifact (REQ-2)
      and declares its file unparseable — a contradictory signal. Verified
      empirically: `rivet list` shows only REQ-1; `rivet validate` shows
      REQ-2 as a loaded (mis-typed) artifact plus the parse-error.

      This is a design decision (which parser is canonical, and is the
      tolerant behaviour intended?) — flagging for the maintainer rather than
      unilaterally picking. The fix should make every command agree, on the
      loud-fail side: a file that can't be cleanly parsed as artifacts should
      be treated identically everywhere (either all load-and-warn, or all
      drop-and-error), never load in one command and vanish in another.

      Acceptance:
        - For a fixture file with `artifacts:` + an unknown sibling key,
          `rivet list --format json` and the set `rivet validate` type-checks
          contain the SAME artifact IDs.
        - `rivet validate` does not both load an artifact and report its
          source file as failed-to-parse.
    tags: [bug, consistency, loud-fail, parser, user-reported, issue-353, needs-maintainer-decision]
    fields:
      priority: should
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-062

  - id: REQ-141
    type: requirement
    title: "rivet modify --where <filter>: query-driven bulk status/field set in one race-free pass"
    status: implemented
    description: |
      Feature ask from GitHub issue #353 (dogfooding meld). Bringing a real
      project's requirement statuses in line with shipped code meant a bulk
      `draft`/`planned` -> `implemented` flip, and the only tool was a shell
      loop of per-ID `rivet modify` invocations — which the reporter found
      silently no-op'd under redirection (a suspected reload/rewrite race
      between rapid-succession subprocesses).

      Add `rivet modify --where '<s-expr>' --set-status … ` (and any other
      `--set-*`): select every artifact matching the same s-expression filter
      `rivet query` uses, and apply the change in a SINGLE in-process pass —
      load once, validate every target up front (all-or-nothing), then write
      each affected file once. Because it never re-spawns a subprocess per ID,
      it cannot race the way the shell loop could. `--where` is mutually
      exclusive with a positional `<ID>` (clap-enforced). `--dry-run` previews
      the match set without writing. An empty match set is a loud no-op
      ("no artifacts match the --where filter") so silence is never read as
      success. Reuses the existing `sexpr_eval` engine (design on existing
      patterns, not a new filter dialect).

      Acceptance:
        - `rivet modify --where '(= status "draft")' --set-status implemented
          --dry-run` lists the matching IDs and leaves every file byte-identical.
        - Without `--dry-run` the same command flips exactly the matching
          artifacts (non-matches untouched) and prints "modified N artifacts".
        - `rivet modify <ID> --where '…'` is rejected (mutually exclusive).
        - A `--where` matching nothing prints "no artifacts match" and exits 0.
    tags: [cli, modify, bulk, agent-ux, dx, loud-fail, user-reported, issue-353]
    fields:
      priority: should
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-007

  - id: REQ-142
    type: requirement
    title: "s-expr filter parse error shows the common field-equality example"
    status: implemented
    description: |
      Self-reported via GitHub issue #381 (dogfooding). The s-expression
      filter dialect (shared by `query`, `list --filter`, `export --filter`,
      `modify --where`) puts an OPERATOR in head position, but the single most
      common first attempt is `(status "draft")` — field name in head — which
      fails with `unknown form 'status'`. The error listed every supported
      head form but showed no example of the correct `(= field "value")`
      shape, costing every first-time author (human or agent) a failed
      round-trip + a grep through the test files to discover it.

      The `unknown head symbol` note now states the head is an operator (not a
      field name) and shows the field-equality form inline:
      `(= status "draft")` / `(and (= type "requirement") (has-tag "safety"))`.
      Because the note is generated once in `sexpr_eval`, the improvement
      reaches every command that parses a filter. The `export --filter` help
      also gained an example (it previously had none, unlike `list`/`query`).

      Acceptance:
        - `rivet list --filter '(status "draft")'` (or any command) prints a
          note containing `(= status "draft")`.
        - `cargo test -p rivet-core --lib
          sexpr_eval::tests::parse_error_unknown_head_surfaces_note` passes
          (asserts the example is present).
    tags: [dx, agent-ux, discoverability, sexpr, user-reported, issue-381]
    fields:
      priority: should
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-007

  - id: REQ-143
    type: requirement
    title: "External artifact refs with a hyphenated prefix (kebab project slug) must resolve, not 404"
    status: implemented
    description: |
      User-reported (0.14.0). Browsing `/artifacts/linc-mesh:A-AVTP-STREAM` in
      serve returned "Artifact does not exist", and external `prefix:ID` refs
      with a hyphenated prefix were unresolved in document rendering, even
      though the artifact existed in the external project.

      Root cause: `externals::parse_artifact_ref` required the prefix to be
      PURELY `is_ascii_lowercase()` — no hyphens. A kebab-case project slug
      like `linc-mesh` failed the check, so the ref fell through to
      `ArtifactRef::Local("linc-mesh:A-AVTP-STREAM")` and was looked up as a
      local id (404). But externals are stored as `<prefix>:<id>` with that
      same hyphenated prefix, so the parse no longer round-tripped its own
      stored form. Every external whose prefix contained a hyphen was
      unreachable in serve detail view and in document link resolution.

      Fix: accept a kebab-case slug prefix — starts with a lowercase letter,
      then lowercase letters / digits / hyphens. `parse_artifact_ref` is the
      single shared gate (serve detail handler + document link rendering both
      delegate to it), so one fix restores both surfaces. The Kani
      round-trip proof was updated to the new contract.

      Acceptance:
        - `parse_artifact_ref("linc-mesh:A-AVTP-STREAM")` returns
          `External { prefix: "linc-mesh", id: "A-AVTP-STREAM" }`.
        - A ref whose prefix does not start with a lowercase letter (e.g.
          `H-1:2`) stays `Local`.
        - `cargo test -p rivet-core --lib externals::tests` passes.
    tags: [bug, externals, serve, regression, user-reported, v0.14.0]
    fields:
      priority: must
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-085

  - id: REQ-144
    type: requirement
    title: "Source-view artifact-id linking must match whole tokens, not substrings"
    status: implemented
    description: |
      User-reported. In the source view, an artifact id that is a SUBSTRING of
      another id gets wrongly linked. Example: a doc carrying
      `doc-id: SDV-BCM-SWR-001` also has an artifact `SWR-001` in the store;
      because matching uses `str::contains`, `SWR-001` is detected inside
      `SDV-BCM-SWR-001`, producing a spurious link. For a traceability tool
      this is a correctness bug — a phantom trace edge.

      Location: `rivet-cli/src/render/source.rs` lines ~841 and ~856 use
      `line.contains(id.as_str())`. The fix is a whole-token match: an id only
      matches when it is delimited by non-`[A-Za-z0-9-]` characters (ids
      contain hyphens, so hyphen is part of the token, not a delimiter).

      Acceptance:
        - A source line containing `SDV-BCM-SWR-001` does NOT produce a link
          to a shorter artifact `SWR-001` that is merely a substring.
        - A line containing the exact id `SWR-001` (surrounded by whitespace /
          punctuation) still links to it.
        - Regression test in source.rs covers the substring vs whole-token case.
    tags: [bug, source-view, traceability, correctness, user-reported]
    fields:
      priority: should
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-092

  - id: REQ-145
    type: requirement
    title: "Test-results import: honor a rivet_tc_id property for the testcase artifact id"
    status: implemented
    description: |
      User-reported. When importing JUnit-style test results, rivet derives
      the testcase artifact id from `classname` + `name` (the
      `format!("{}.{}", classname, name)` fallback in
      `rivet-core/src/junit.rs::artifact_id_for`), so the link to the intended
      artifact does not resolve. The user records an explicit id per testcase:
      a `rivet_tc_id` property (e.g. value `SYS-VER-058`) and wants rivet to
      use it.

      The JUnit parser does not currently read `<property>` children of
      `<testcase>` (the `ParsedCase` struct has no properties field; the
      element is silently ignored). Add: parse `<property>` children, and in
      `artifact_id_for` add a highest-priority tier that returns the
      `rivet_tc_id` property value when present, before the existing
      classname/name heuristics.

      Acceptance:
        - A testcase (classname `com.x.Y`, name `t`) carrying a `rivet_tc_id`
          property of `SYS-VER-058` imports with artifact id `SYS-VER-058`,
          not `com.x.Y.t`.
        - A testcase with no such property keeps the current classname/name
          behaviour (back-compatible).
        - Parser test covers the property-present and property-absent cases.
    tags: [feature, test-results, junit, import, traceability, user-reported]
    fields:
      priority: should
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-101

  - id: REQ-146
    type: requirement
    title: "Salsa validate path must evaluate status-gate validation-rules (parity with the direct path)"
    status: implemented
    description: |
      Surfaced verifying issue #355 Finding 3 ("rivet validate and rivet check
      gaps-json disagree"). `rivet validate` runs the incremental salsa path
      (`db::validate_all`), which evaluated structural rules (phases 1-7) and
      conditional rules (phase 8) but NOT the status-gate `validation-rules`
      (phase 9 — the `(implies …)` V-model promotion gates). The direct
      `validate::validate*` path (used by `rivet check gaps-json` and
      `rivet validate --direct`) DID evaluate them. Result: the default
      `rivet validate` silently PASSED a project with a status-gate violation
      that `gaps-json`/`--direct` correctly FAILED — a validation soundness
      gap, since the default surface under-reported.

      Fix: `db::validate_all` and `validate_all_with_extras` now also call
      `validate::evaluate_validation_rules` against the same materialized
      store/schema/graph, so every validation surface agrees.

      Acceptance:
        - On a project whose schema declares a `validation-rules` status gate
          that an artifact violates, `rivet validate` (default/salsa) and
          `rivet validate --direct` report the SAME error count, both
          including the gate diagnostic.
        - `cargo test -p rivet-core --lib
          db::tests::validation_rules_evaluated_in_validate_all` passes.
    tags: [bug, validation, salsa, soundness, consistency, issue-355]
    fields:
      priority: must
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-029

  - id: REQ-147
    type: requirement
    title: "Coverage diagnostics say HOW to satisfy a missing backlink, not just what's missing"
    status: implemented
    description: |
      User-reported via #350. Marking a sw-req `implemented` then running
      `rivet validate` produced "should be verified..." / "missing:
      <types>" diagnostics that named WHAT was missing but not HOW to satisfy
      it — which link type connects the artifacts, and that the listed types
      attach via a specific incoming link. The reporter reverse-engineered the
      required shape from an unrelated link-target rejection ("a whole
      detour").

      Two complementary, schema-agnostic improvements:
        1. The `required-backlink` coverage diagnostic now appends the
           incoming link type and the allowed source types, e.g. "… — needs an
           incoming `verifies` link from one of [sw-verification,
           unit-verification, sw-integration-verification]".
        2. The `Lifecycle coverage gaps` summary now points at
           `rivet validate --explain <ID>`, which lists each rule's
           satisfied/MISSING state with the exact incoming link + source types
           (and any alternates).

      Acceptance:
        - On a sw-req with no verification backlink, `rivet validate` output
          for the coverage rule contains "needs an incoming `verifies` link
          from one of [...]".
        - When lifecycle gaps are present, the validate output prints a
          "run `rivet validate --explain <ID>`" pointer.
        - `cargo test -p rivet-core --lib validate::tests` passes.
    tags: [dx, agent-ux, diagnostics, guidance, traceability, user-reported, issue-350]
    fields:
      priority: should
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-125

  - id: REQ-148
    type: requirement
    title: "Schema-consistency check: flag a required-backlink rule whose from-types cannot form the link"
    status: draft
    description: |
      Surfaced verifying #350 against the aspice schema. The coverage rule
      `swe1-has-verification` declares `source-type: sw-req`,
      `required-backlink: verifies`, `from-types: [sw-verification,
      unit-verification, sw-integration-verification]` — but the link-target
      rules only permit `sw-verification` to `verifies` a `sw-req`
      (unit-verification verifies sw-detail-design; sw-integration-verification
      verifies sw-arch-component/sw-detail-design). So two of the three
      advertised satisfiers can never actually form the backlink, which is
      exactly why the reporter authored a forbidden unit-verification→sw-req
      link and got rejected.

      Add a schema-consistency meta-check (sibling of
      `conditional-rule-consistency`) that flags a `required-backlink` rule
      whose `from-types` include an artifact type that no link-type / rule
      permits to form `<required_backlink>` to the rule's `source-type`. This
      catches the "advertises an unsatisfiable satisfier" class in ANY schema.
      Care needed: target constraints live in both link-type defs and per-type
      link-fields, and the inverse-name convention applies — implement
      conservatively to avoid false positives (prefer false-negatives).

      Note: whether the aspice `from-types` is itself wrong (ASPICE intent:
      SWE.6 sw-verification verifies sw-reqs; unit/integration verify design
      layers) is a maintainer/compliance-semantics call, tracked on #350/#355,
      separate from this generic check.

      Acceptance:
        - A schema with a `required-backlink` rule listing a from-type that
          cannot form the link emits a `coverage-rule-consistency` diagnostic
          naming the rule, the unsatisfiable from-type, and the link.
        - A schema whose from-types are all linkable emits no such diagnostic.
        - Unit test covers both cases.
    tags: [validation, schema-consistency, meta-check, dx, issue-350, issue-355]
    fields:
      priority: should
      category: functional
      baseline: v0.15.0-track
    links:
      - type: traces-to
        target: REQ-004
