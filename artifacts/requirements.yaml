  - id: REQ-189
    type: requirement
    title: "`rivet query --format json` carries the `command` envelope field + ships a query-output JSON schema"
    status: implemented
    description: |
      Dogfooding pass on JSON-output consistency: every machine-readable command
      output carries a top-level `command` field (validate, get, list, stats,
      coverage, supplier all emit it; list/stats/coverage/validate even ship a
      `schemas/json/*-output.schema.json` registered in JSON_SCHEMA_REGISTRY and
      surfaced via `rivet schema list-json`/`get-json`). `rivet query --format
      json` — a primary agent-facing command with the same artifact-collection
      shape as `list` — was the lone exception: its envelope was
      `{filter, count, total, truncated, artifacts}` with NO `command` field and
      NO published output schema. An agent (or a JSON-schema consumer) keying off
      `command` finds query anomalous.

      Fix (additive): emit `"command": "query"` in the query JSON envelope; add
      `schemas/json/query-output.schema.json` (mirroring list-output, with
      query's `filter/total/truncated` and array-valued `links`); register it in
      JSON_SCHEMA_REGISTRY so `schema list-json`/`get-json query` work.

      Acceptance:
        - `rivet query --sexpr '(= type "requirement")' --format json | python3 -c
          'import sys,json;assert json.load(sys.stdin)["command"]=="query"'`
          exits 0.
        - `rivet schema get-json query` prints a path to an existing schema file.
        - `rivet schema list-json --format json` includes a "query" entry.
        - `cargo test -p rivet-cli --test cli_commands query_json_output_has_command_envelope`
          passes.
        - `rivet validate` on the rivet repo still PASS.
    tags: [cli, query, json, schema, consistency, agent-ux, machine-readable]
    fields:
      priority: should
      category: non-functional
    links:
      - type: traces-to
        target: REQ-007

  - id: REQ-190
    type: requirement
    title: "`execute_sexpr` returns deterministic (id-sorted) matches so query output + --limit truncation are reproducible"
    status: implemented
    description: |
      Verified bug (issue #415): `rivet query --format json` for the same filter
      returns results in a DIFFERENT order on every run (run1: REQ-125,166,147...
      run2: REQ-174,011,117...), because the shared `execute_sexpr` engine
      iterated the HashMap-ordered `store.iter()`. Two consequences:
        - match order is nondeterministic across CLI / MCP `rivet_query` / the
          `{{query:...}}` embed (all three share `execute_sexpr`);
        - with `--limit`, the kept subset is an arbitrary HashMap-order slice, so
          an agent paging or sampling gets a different subset each run — a
          correctness bug, not just cosmetics.
      `execute` (the non-sexpr path) already sorted by id; `execute_sexpr` was
      missed. `Store::iter_sorted()` (REQ-159) already exists for exactly this.

      Fix: iterate `store.iter_sorted()` in `execute_sexpr`, making both the
      match order and the `--limit` truncation deterministic (lowest-id N).

      Acceptance:
        - `cargo test -p rivet-core --lib query::tests::execute_sexpr_returns_matches_sorted_by_id`
          passes.
        - `cargo test -p rivet-core --lib query::tests::execute_sexpr_limit_truncates_to_lowest_ids_deterministically`
          passes (limit keeps the lowest-id subset).
        - `rivet query --sexpr '(= type "requirement")' --format ids` produces
          byte-identical output across two consecutive runs.
        - `rivet validate` on the rivet repo still PASS.
    tags: [query, determinism, reproducibility, mcp, embed, bugfix, agent-ux]
    fields:
      priority: should
      category: functional
    links:
      - type: traces-to
        target: REQ-159

