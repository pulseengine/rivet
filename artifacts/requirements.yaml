  - id: REQ-351
    type: requirement
    title: "the liveness probe fires on the nightly mutation matrix every night, so a real outage arrives as the hundredth identical alert"
    status: proposed
    description: "Observed repeatedly and confirmed again on 2026-09-10 by #933. The probe alerts when a run has been queued past QUEUE_THRESHOLD_MINUTES, currently 30. The nightly CI cron at 03:00 runs Mutation Testing as a SIXTEEN-shard matrix, and the fleet has FOUR lean-mem runners, so most shards queue for hours by construction. On #933 the run was progressing normally — eleven shards completed, four in progress, three queued — and the fleet was healthy at online=12 busy=11. Nothing was wrong. NINETY-FIVE such alerts have been filed to date, which is roughly one a day. That is the failure mode this project has spent three releases removing, in its own alarm: a signal that fires on normal operation trains its readers to ignore it, and #855's published misattribution is what that looks like when a real one arrives. The alert is now HONEST about what it does not know, since REQ-342 replaced the false pool-offline claim with runners-unknown and #933 shows that working in production. Honest and frequent is better than wrong and frequent, but it is still frequent. OPTIONS, in cost order, all recorded on #919. Exclude scheduled runs from the probe, a one-line filter on event, which removes the whole class since a cron-triggered matrix is not what the probe exists to catch. Scope the probe to the jobs in CI Gate's needs, which ties the alarm to something with a defined consequence — those are the jobs whose queueing actually blocks a merge, and Mutation Testing is advisory and not among them. Raise the threshold, which is the weakest option because it delays the false alarm rather than removing it and makes the probe slower to report a real outage. Or reduce the shard count or add lean-mem capacity, which changes the workload rather than the signal and presumes the sixteen-way sharding has no reason behind it. RECOMMENDATION: scope to CI Gate's needs. It is more principled than filtering on event because it states what the alarm is FOR rather than what it is not, and it survives a future workflow that queues badly outside the cron. NOT IMPLEMENTED HERE DELIBERATELY: this changes what the alarm MEANS, which is a decision about its purpose rather than a defect fix, and it was surfaced to the maintainer twice without a decision. Filing it so it stops being invisible — per REQ-345, an untracked problem never appears in any readiness query, which is precisely how this one has persisted for ninety-five alerts."
    release: v0.38.0
    tags: [ci, observability, weak-green, alarm-fatigue]
