  - id: REQ-342
    type: requirement
    title: "the liveness probe reports pool-offline for every self-hosted stall, because a failed runner lookup is substituted with an empty pool (#919)"
    status: verified
    description: "Found 2026-09-09 by diagnosing an auto-filed alert rather than trusting it. Issue #919 announced 'the self-hosted pool is OFFLINE (0 runners online)'. Measured at org scope at the same time: total=12 online=12 busy=7. The pool was entirely healthy. The four still-queued jobs all carried the `lean-mem` label, all four `lean-mem` runners existed and were online and BUSY, and the five idle runners carried light, rust-cpu, rust-cpu+light, rust-cpu+netns and rust-cpu+podman — none of them lean-mem. The true mode was label-partitioned saturation; nothing was down. CAUSE, at runner-liveness.yml line 96: the runner lookup was written `gh api ... 2>/dev/null || echo '{\"runners\":[]}'`, so a FAILED call was silently replaced by an EMPTY POOL, which classify_stall reads as every runner being down. Reproduced directly against the shipped classifier — with the empty-pool fallback it answers pool-offline, with the real runner list it answers label-saturated. The failure is not occasional: the lookup needs the `administration` permission, which is NOT a grantable GITHUB_TOKEN scope, so it 403s on every scheduled probe. Since hosted-starvation is decided from the queued jobs' labels alone and is checked first, ubuntu-latest stalls still classify correctly; the defect is confined to the self-hosted path and TOTAL within it — every such stall has been reported as pool-offline whatever its real cause, which is what the alert history looks like. THE WORKFLOW ALSO DOCUMENTED THE OPPOSITE. Its own header said a failed or empty lookup is logged and SKIPPED rather than raised as a false alarm. The code raised the loudest alarm available. A comment describing behaviour the code does not have is worse than no comment, because it stops a reader from checking; the header is corrected and now names what actually happens. FIX: an API failure and a genuinely empty pool are indistinguishable from the response BODY, so the exit code is the only discriminator and it was being discarded. The caller now captures it and passes an empty string for could-not-read, distinct from a successful `{\"runners\":[]}` which still means the pool really is empty and still answers pool-offline. classify_stall gains a `runners-unknown` outcome, and the probe still raises the queued-age alarm — that signal is authoritative and needs no runner data — while naming NO cause. This is the third member of the family REQ-317 and REQ-325 belong to, and the sharpest: the previous two named a cause the classifier could have observed but reasoned about wrongly, whereas this one named a cause it had no data for at all. Negative-controlled in both directions: removing the branch reddens the unavailable case, and making it unconditional reddens five cases including the genuinely-empty-pool guard. SECOND ROUTE, found 2026-09-09 while closing this requirement's own testing residual. The first fix discarded the payload on a non-zero exit code or an empty body, which is not enough: `gh api` can exit 0 while returning a GitHub error object such as a Bad credentials 401 body. That body is NON-EMPTY, so it survives the emptiness check, reaches jq, yields no `.runners` and therefore online=0, and the probe announces the pool is down for what is actually an auth failure. Verified directly — classify_stall answers pool-offline for that exact body. Same false alarm, different route, and the MORE LIKELY one in practice, since the token genuinely lacks the administration scope so a 401-shaped response is the expected failure rather than an exotic one. The original fix caught the case that was imagined and missed the one that actually happens. FIX: a `normalize_runner_fetch <exit_code> <body>` helper that requires the payload to BE a runner list — an object whose `.runners` is an array — and emits an empty string otherwise, which classify_stall answers as runners-unknown. A successful lookup returning an empty runners array passes through unchanged, because that is a genuinely empty pool and must still classify as offline. Extracting this into diagnose.sh is also what closes the testing residual recorded against this requirement: the exit-code handling previously lived only as shell inside runner-liveness.yml, so classify_stall was tested and its caller was not. Nine cases now cover the helper, including two end-to-end ones asserting that an error object reaches runners-unknown while a genuinely empty pool still reaches pool-offline. Negative-controlled both ways: removing the shape check reddens four cases, and discarding unconditionally reddens the three passthrough guards. Worth recording that four of the nine cases would PASS against a non-existent function, because a missing command emits nothing and nothing is what the discard cases expect — the passthrough cases are what make the set non-vacuous, so which cases went red matters and not merely that the oracle went red."
