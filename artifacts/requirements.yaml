  - id: REQ-332
    type: requirement
    title: "strict-mode merge serialization turns a throughput cost into a correctness risk on the two files that always collide"
    status: proposed
    description: "Branch protection sets strict: true, so every merge marks every other open PR out of date and forces a rebase plus a full CI re-run. N queued PRs therefore cost N SEQUENTIAL CI cycles rather than one parallel pass. Measured over the 2026-09-06 to 09 drain: five PRs (#897, #903, #906, #908, #909) were landed one at a time, each requiring a rebase and a fresh cycle, and a single cycle has run past 75 minutes under label-partitioned saturation (REQ-317). The wall-clock cost is the smaller half. The real cost is that serialization MANUFACTURES conflict-resolution events, and this repository's two hottest files collide at the tail on every concurrent branch — requirements.yaml and rivet-cli/tests/cli_commands.rs. Three of those rebases hit mid-statement splits. Two were two artifacts sharing one provenance block, where the naive keep-both resolution produces VALID YAML that rivet validate passes while one artifact silently loses its provenance — no gate in the chain would catch it, and it was found only by checking for the field by name. One was a FALSE overlap where git aligned two different test function bodies because both open with the same line; surgery there yields code that COMPILES and is wrong, and the branch had to be rebuilt from main instead. So the policy converts a throughput problem into a correctness risk, at a rate proportional to how many PRs are in flight. Candidate fix: a GitHub merge queue, which batches candidates and tests them against the prospective merge result without forcing a manual rebase per PR — keeping the guarantee strict mode exists to provide while removing the per-merge rebase. Alternatives worth weighing: relaxing strict and relying on the required CI Gate alone; or keeping the current policy and formalising the one-PR-at-a-time discipline the autonomous loop already follows, which is the status quo made explicit and costs the same time. Whichever is chosen, the mid-statement conflict shapes deserve their own guard independently, since they are latent whenever two branches touch those files. THE FIX ALREADY SHIPS AND RIVET DOES NOT USE IT, found 2026-09-09. SourceLayout::PerId exists in rivet-core, and its own doc comment states the case: one file per artifact id in the source directory, so two PRs adding different artifacts touch different files and never conflict. The SingleFile variant is documented as the historical default where two parallel adds collide on the file's tail. `rivet shard <FILE>` performs the migration, verifies the per-id files load identically before removing the original, and is reversible. rivet's own rivet.yaml sets no layout on any source, so every source is SingleFile, and artifacts/requirements.yaml carries 301 artifacts in one file — which is precisely why five rebases in one drain collided at its tail and why two of them silently dropped a provenance block. This reframes the requirement: a merge queue addresses the THROUGHPUT half by removing the per-merge rebase, but per-id layout removes the CORRECTNESS half outright, because the conflicts stop existing rather than being resolved more carefully. They are complementary and per-id is the cheaper and sharper of the two. Applying it to this repository is dogfooding a shipped feature its author never adopted, and would also remove the collision on artifacts/requirements.yaml that has been the single most common source of manual conflict resolution in this loop. SCOPE DECISION 2026-09-09: deferred from v0.37.0 to v0.38.0. The requirement identifies per-id source layout as the structural fix, and adopting it means migrating a single 311-artifact file into one file per artifact — a repository-wide restructure of the project's own source of truth. That is not work to run inside a release cut, where a mistake in the migration is indistinguishable from a mistake in the release. The cost of waiting is real and should be stated rather than assumed away: three tail collisions occurred in the 2026-09-09 session alone, and one of them placed a single shared `provenance:` block after the conflict's closing marker so that the naive keep-both resolution produced VALID YAML which `rivet validate` and `yamllint` both pass while REQ-339 silently lost its provenance. It was caught only by checking the field by name and reconstructing the block from origin/main. Every further cycle without the migration is another opportunity to lose data in a way no gate in the chain detects, so this should be early in v0.38.0 rather than late."
    release: v0.38.0
    tags: [ci, process, merge-queue]
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-09-09T00:00:00Z
  - id: REQ-333
    type: requirement
    title: "No visual review-and-approval surface for a PR or release, and no typed record of who approved what at which commit"
    status: proposed
    description: "Maintainer request, 2026-09-09, thinking-out-loud captured before design hardens. Wanted: for a PR or a release, see the differences visually in a browser or the VS Code extension, leave approval or comments there and hand it back; a GitHub Action linking to the plugin so a reviewer can see it and get status; the view must invalidate when the commits change; and it should form part of the release view, with a notion of approving in a specific ROLE. Hard constraint: there is no server, so this must run locally or in CI. SURVEY FIRST — most pieces already exist and this is mostly assembly. `rivet check review-signoff <id> --role <role>` is implemented, not a future oracle: it fires when a released artifact lacks a reviewer distinct from its author, optionally matching a role. The aspice schema already carries a review-roles context and per-oracle reviewers lists with change-control: pr-review. `rivet diff --base <dir> --head <dir> --format json` already computes what changed between two artifact trees. `rivet export --format html` already renders a static site with no server. serve has views/api/components, and the VS Code extension has a webview shell. ASPICE PAM v4.1 supplies the vocabulary rather than us inventing it: SPL.2 BP5 requires release approval before delivery, information item 13-13 is Product release approval, 18-06 is Product release criteria (conditions to be satisfied prior to authorizing delivery), and 11-03 lists approval for delivery by responsible roles as release-note content. GP 2.1.7 and GP 2.2.4 are the reviewer-not-author rule already enforced. PROPOSED SHAPE. The store is git and approval is an ARTIFACT, not a server record — it survives the PR, lands in the trace, and works offline. The approval names the exact commit SHA it approved, which makes staleness mechanical and identical to the pattern already shipped three times (REQ-309 exempt-when-field, REQ-320 unmodelled-rules, REQ-331 externals fallback): a declaration that stops being true must FAIL rather than go quiet. If HEAD moves past the approved SHA the approval is stale and the gate reopens, which is exactly the maintainer's requirement that changes must invalidate the view. CI materialises both sides with a git worktree, runs `rivet diff`, renders with `rivet export --format html`, publishes it as a workflow artifact or Pages, and posts a check-run linking to it; the extension renders the same static output locally. OPEN QUESTION, and the reason this is not yet a plan: with no server a browser cannot write to the repository, so 'put my approval in there and hand it back' has two honest routes and they differ in more than plumbing. Either the extension writes the approval artifact locally and the human commits it — traceable and offline, but read-only in a browser — or a GitHub PR review is the input and a CI job translates an approving review into an approval artifact recording reviewer identity and SHA, which works in a browser and matches the hand-it-back flow but makes GitHub the authority for who approved. The second is likely what was meant; it should be a recorded decision rather than an implementation detail, because it determines whether the approval record is verifiable without trusting GitHub. KNOWN CONSTRAINT: the extension webview loads only mermaid and a shell shim, so htmx attributes are inert there — any interactivity must go through the shim, and one anchor can serve both browser and extension. `rivet diff` takes directories rather than git refs, so CI has to materialise the base side itself. CORRECTION, maintainer, 2026-09-09, before any code: writing the approval as an artifact INTO the branch under review is self-defeating. If developer A opens a PR and reviewers B, C and D must commit their approval artifacts to A's branch, then B, C and D become contributors to that PR — and a contributor cannot independently approve it. GitHub blocks the self-approval, and GP 2.1.7 and GP 2.2.4 require reviewer identity distinct from author identity. Committing the approval destroys exactly the independence the approval exists to evidence. Reviewers also typically lack push access to the author's branch, so the flow is not merely wrong but usually impossible. The paradox dissolves once two DIFFERENT approvals are separated, which the first draft conflated. FIRST, peer review of a change: GP 2.1.7 / GP 2.2.4, reviewer not author, happens BEFORE merge and gates the merge. GitHub already implements this and rivet must not re-implement it — rivet's job is to RECORD it as evidence, never to collect it from inside the branch. SECOND, release approval: SPL.2 BP5, information item 13-13, approval for delivery by responsible roles, happens before DELIVERY rather than before merge, and applies to an assembled release of already-merged content. That one is safely an artifact committed on the default branch, because the approver is not the author of the thing being approved and no PR independence is at stake. So: release approval is authored directly as an artifact and gates the release. Peer review is EXTRACTED from the PR after merge by CI — reviewer login, review id, timestamp and the exact reviewed SHA — and written to the default branch by automation, so no reviewer ever commits to the branch they are reviewing. Consequence to accept honestly: an extracted peer-review record cannot gate its own merge, since it does not exist until after that merge. It is evidence, not a gate at that point. The gate that remains available is on the default branch — every merged commit touching traced paths must carry an extracted review record — which catches an extraction that silently failed rather than pretending the record blocked the merge. VERIFIABILITY, which is the residual cost of this route: a bot-written record saying B approved SHA X is only as trustworthy as the bot unless it stores enough to be re-checked — review id, reviewer login, timestamp, commit SHA — and even then it is auditable only while GitHub retains the review, and PR reviews can be dismissed. Anyone needing an approval record that is verifiable without trusting GitHub needs signed approvals, which is a larger decision and is not in scope here. Recording it so the limitation is chosen rather than discovered. SURFACES, maintainer 2026-09-09: the diff and the other review views are needed in the VS Code extension AND in the CLI, not only as rendered HTML, because an AI agent may be asked to perform a review and cannot read a webview. That makes this a CONSISTENCY requirement rather than a convenience one. The review view must be computed ONCE in rivet-core and rendered three ways — CLI text and JSON, extension webview, static HTML — because this repository already has a shipped instance of the opposite: #788, where plain coverage and coverage --tests computed the same evidence separately and disagreed by a hundred points, with nothing telling a release gate it was reading the narrower view. Three surfaces computing a review independently would reproduce that defect with higher stakes, since the thing they would disagree about is what a reviewer approved. The CLI rendering must therefore be a first-class consumer, emitting JSON an agent can act on, not a text pretty-printer bolted on afterwards. AI REVIEWER INDEPENDENCE, which follows directly and is not yet handled: if an agent performs the review, the record must capture WHICH agent — the model identity — and the reviewer-is-not-author rule has to be judged on that, not on a blanket label. rivet already stores provenance.created-by and provenance.model and already compares provenance.reviewed-by against provenance.created-by in `check review-signoff`, and common.yaml already carries an ai-generated-needs-review conditional rule. But that rule fires only when status equals active and its severity is warning, and the comparison is between identity strings, so an artifact created by ai-assisted and reviewed by ai-assisted is caught only because the labels happen to match — while the same model reviewing its own work under two different label spellings, or a second agent of the same model, would pass. For a repository that ships EU AI Act artifacts and stamps every artifact with a model name, an AI reviewing its own output is exactly the independence failure GP 2.1.7 exists to prevent, and the data to detect it is already stored. Scope note: this is adjacent to REQ-308, which is about evidence sufficiency rather than reviewer identity, and should not be folded into it. REVIEWER-AUTHORED APPROVAL PRs, maintainer 2026-09-09, and this supersedes the CI-extraction route above for peer review. Each reviewer commits their OWN approval as a separate pull request rather than into the branch under review, referencing the reviewed commit SHA. Independence is preserved because no reviewer touches the author's branch; the complete review assembles afterwards, and the maintainer has explicitly accepted that timing. The decisive advantage over CI extraction is verifiability: the reviewer's own commit — and its signature, since this project already signs tags with an ED25519 key — IS the approval evidence, so the record no longer depends on trusting a bot or on GitHub retaining a review that can be dismissed. That was the residual cost recorded above and this route removes it. It also needs no new conflict machinery, because SourceLayout::PerId already exists and is documented as one file per artifact id so two PRs adding different artifacts never conflict. Concurrent approvals from reviewers B, C and D therefore land as three separate files with no tail collision, which is the same mechanism REQ-332 identifies for requirements.yaml. An approval source should be per-id from the start rather than migrated later. SCHEMA NEEDED, as the maintainer put it — a way to approve an artifact and store it elsewhere. The type must carry at minimum: what is approved (artifact ids, or a commit SHA, or a release tag), the reviewer identity, the ROLE approved in, a timestamp, the exact reviewed SHA, and a verdict distinguishing approved from changes-requested. Stored in its own source path so approvals never share a file with the artifacts they approve. The SHA field is what makes staleness mechanical, per the invalidate-on-change requirement. AI REVIEWER INDEPENDENCE IS THE PRIMARY JUSTIFICATION, NOT AN ADJACENT ONE — maintainer, 2026-09-09: this machinery is needed even if the review is delegated to an AI, and more strongly so. That inverts the usual reading. With human reviewers, independence is self-evident and the record is bookkeeping: B is visibly not A, permanently. With an AI reviewer independence becomes UNOBSERVABLE WITHOUT A RECORD, because four situations that differ enormously all report identically as a review performed — a different model on fresh context, the same model on fresh context, the same model with the AUTHOR'S CONTEXT INHERITED, and the same session at a later turn. The last two are the author reviewing itself, and nothing in a rendered review distinguishes them from the second. The tooling makes the bad case one flag away: a forked subagent inherits the parent's full conversation by design, which is the natural reach when a reviewer should know what the work is about, and is precisely the inherited framing a clean-room review exists to exclude. So the fields this requirement already demands — reviewer identity, role, SHA, verdict — are necessary but not sufficient for an AI reviewer. The record must also carry MODEL IDENTITY rather than a generic ai-assisted label, since two agents of one model are not two reviewers, and an explicit statement of whether context was inherited plus a run identity distinct from the author's. A review lacking those is unrecorded rather than merely undocumented, which matters because this is consumed at a release gate. AND IT NEEDS A NEGATIVE CONTROL, which is the half with no analogue in human review: an AI reviewer that structurally cannot dissent yields independent-review-present forever, which is exactly the weak-green class v0.36.0 was themed around. Periodically hand the reviewer a known-bad artifact — a cited test that does not exist, a verified status with no verifying evidence — and require that it DISSENTS; record when that control was last exercised. A reviewer that passes the poisoned artifact is not a reviewer. The methodology half of this is filed upstream as pulseengine.eu#196; this requirement owns the schema half, and the schema cannot repair a practice that records the wrong thing. ASPICE grounding read from source: SUP.1.BP1 Note 1 carries the parenthetical (no self-monitoring), which is the standard's own one-phrase statement of the rule."
    release: v0.39.0
    tags: [review, release, approval, aspice, vsix]
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-09-09T00:00:00Z
  - id: REQ-334
    type: requirement
    title: "No inverse of `rivet shard` — per-id sources accumulate files with no consolidation, and no honest signal for when it matters"
    status: proposed
    description: "Maintainer proposal, 2026-09-09, as the counterpart to `rivet shard`. Per-id layout removes write conflicts by giving every artifact its own file, but nothing brings them back together, so a long-lived source accumulates files without bound. The maintainer's framing is the right one: this is git's loose-objects-then-packfiles shape. Pack what is cold, keep what is hot loose. `rivet shard` exists and is one-way; there is no inverse today. WHEN CONSOLIDATION IS SAFE is the load-bearing question, and it has a precise answer: exactly when future concurrent writes are unlikely. That makes the natural grouping key a SHIPPED RELEASE. Artifacts scoped to a cut release are settled — nobody edits v0.36.0's requirements concurrently after the tag — so packing them into one file per release reintroduces no conflict risk, while artifacts in the open release stay per-id where the concurrent writes actually happen. Grouping by type would simply restore the original problem, and grouping by status is weaker because status still moves. SAFETY PROPERTY, inherited from shard, which verifies the per-id files load identically before removing the original and is reversible: consolidation must do the same in reverse — write the packed file, verify the store loads identically artifact for artifact, and only then remove the per-id files. Without that it is a destructive rewrite of the project's own source of truth. THE WARNING NEEDS CARE, because a file count is a proxy for the thing that actually degrades. Measured on this repository today: 301 artifacts, 491 KB in a single file, and `rivet list --format json` completes in 0.26 seconds. So 301 files is nowhere near a real threshold, and a count-based warning fired at some invented number would be a figure that does not mean what it says — the defect class this project spent a whole release removing. What degrades in practice is load time, git status and directory listing on very large sources, so the honest trigger is a measured one: warn when load time crosses a threshold, and report the measurement alongside the advice so a reader can judge it. A count may be a cheap secondary signal but should not be the primary one, and whatever is chosen must be stated in the message rather than left implicit."
    release: v0.38.0
    tags: [storage, layout, dogfooding]
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-09-09T00:00:00Z
  - id: REQ-335
    type: requirement
    title: "A review surface that lists every check uniformly trains reviewers to tick blind — the proven and the unproven must be partitioned, and the partition must itself be auditable"
    status: proposed
    description: "Presentation half of REQ-333, from two grounded research passes commissioned 2026-09-09 after the maintainer left visual appearance open for the first version. THE MEASURED CASE, from the Automotive SPICE PAM v4.1 read from source: information item 13-19 Review evidence — the standard's own record of what a review produced — documents ten characteristics, and SEVEN of them are already proven mechanically by checks rivet ships today. Only three need a human: justification, non-conformances found, and improvement suggestions. Rendering all ten as a uniform checklist therefore asks a reviewer to attest to seven things a machine already decided, which is precisely how a reviewer learns to tick without reading, and it buries the three that carry the entire value of the review. This is the weak-green class of v0.36.0 relocated into the UI: a surface that reports more assurance than it has. THE PAM LICENSES HIDING THE PROVEN CHECKS IN ITS OWN WORDS, which matters because the instinct in a regulated context is to show everything defensively. Table B.1 states that it is not intended to use the listed characteristics as a checklist. GP 2.2.1 Note 2 states there may be types of work products for which no review or approval is required. And attached to every bidirectional-traceability base practice, recurring eighteen times, is the sentence that traceability alone, for example the existence of links, does not necessarily mean that the information is consistent — which is the standard itself distinguishing a mechanical link check from the judgement a reviewer owes. So an assessor-facing surface that SUPPRESSES what is proven is more standard-conformant than one that lists it, not less. REQUIRED SHAPE: partition rather than a flat list. Four buckets — what BLOCKS, what NEEDS JUDGEMENT, what is SETTLED MECHANICALLY, and what is NOT REVIEWABLE here. Settled and not-reviewable collapse by default and are counted rather than enumerated. THE PARTITION RULE IS THE LOAD-BEARING PART AND MUST BE AUDITABLE, because a surface that hides items is only safe if a reader can ask why a specific item was hidden and get the name of the check that settled it plus its result. An item may enter SETTLED only by naming the mechanical check that discharged it; anything without such a check is NEEDS JUDGEMENT by construction, so the failure direction is toward showing too much rather than hiding something unproven. Absent that rule this requirement would ship the very defect it exists to remove. THE HUMAN RESIDUE IS A SHORT AND STABLE VOCABULARY, which is what makes the judgement pane designable at all: across every information item examined it reduces to rationale or justification, adequacy, intended use, impact, root cause, summary, non-conformances found, and improvement suggestions, plus the four adjectives information item 17-00 demands of a requirement — unambiguous, testable, measurable, necessary. The judgement pane should therefore be organised around those words rather than around item identifiers, because the reviewer's task is the same shape regardless of which item raised it. DENSITY IS WILDLY ASYMMETRIC AND THAT ASYMMETRY IS THE LAYOUT: information item 13-16 Change request is nine of twelve human and wants a prose pane; 13-07 Problem is two of twelve; 13-08 Baseline has exactly one human element and it sits in the definition sentence rather than the bullets, so it wants a single line, not a form. A uniform per-type template would be wrong for all three. GROUNDING NOTE, recorded so a later reader does not assume the research was exhaustive: Annex C.4 Figures 9 and 10, the software and hardware consistency maps and the most on-point content in the PAM for a traceability tool, did NOT extract from the PDF and were deliberately not reconstructed from memory. DO NOT MECHANIZE information item 13-52 Communication evidence — its documented characteristics include chat protocols and verbal statements, so the pull-request conversation IS that item; link to it rather than building a form that would duplicate it worse."
    release: v0.39.0
    tags: [review, ui, aspice, weak-green]
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-09-09T00:00:00Z
  - id: REQ-336
    type: requirement
    title: "rivet cannot answer what a change forces you to re-verify — the PAM requires re-verification criteria and coverage against release scope, and no shipped check computes either"
    status: proposed
    description: "Highest-value UNBUILT check found by the Automotive SPICE PAM v4.1 research pass, 2026-09-09, and filed separately from REQ-333 and REQ-335 because it is a core traceability capability rather than a review-surface concern. Two places in the PAM demand it. Information item 08-58 lists among its documented characteristics the criteria for re-verification, for example in the case of changes. And SWE.4.BP2 together with SWE.6.BP2 both require sufficient coverage according to the release scope — a scoped judgement, not a global percentage. rivet ships seven mechanical checks and none of them answers either question. The capability is squarely within what rivet already models and is arguably the sharpest thing it could compute that no adjacent tool can: GIVEN A CHANGE SET AND THE LINK GRAPH, DERIVE WHICH VERIFICATION MEASURES THE CHANGE INVALIDATES. Everything needed is present — the typed link predicates give reachability from changed artifacts to the tests and oracles that verify them, `rivet diff` already computes what changed between two artifact trees, and the release field already delimits scope. Today a reviewer or release manager infers that set by hand, which is guesswork that fails silently and in the unsafe direction, since an unrecognised invalidation looks exactly like a requirement that is still verified. Note the shape it shares with the rest of this release line: a declaration that has quietly stopped being true must FAIL rather than go quiet, the pattern already shipped in REQ-309, REQ-320 and REQ-331. A verified status whose supporting evidence predates a change to what it verifies is exactly such a declaration. Scope note: this is adjacent to REQ-308, which concerns whether evidence is SUFFICIENT, whereas this concerns whether existing evidence is still CURRENT with respect to a change; they should not be folded together. Design question to settle before implementation, and the reason this is proposed rather than planned: whether the invalidation set is computed from artifact-tree diffs alone, which rivet can do offline today, or must also incorporate source-file changes reached through the verification markers, which is more faithful to what actually invalidates a test result but requires the change set to span code as well as artifacts."
    release: v0.39.0
    tags: [coverage, verification, aspice, traceability]
