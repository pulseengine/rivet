  - id: REQ-344
    type: requirement
    title: "no artifact tracks the sigil-attestation / SBOM / AIBOM traceability bridge (#107)"
    status: draft
    description: "Triage of an issue open since 2026-04-02 and genuinely untracked — verified by reading artifact titles for sigil, supply-chain and SBOM rather than by pattern-matching the issue number, which produces both false positives and false negatives. The nearest existing artifacts are SL-5 and SLS-5, which are supply-chain HAZARDS in the STPA model rather than the integration, and REQ-327, which is release notes. THE ASK: three regulatory deadlines converge and require overlapping evidence that currently lives in separate places — EU AI Act (2026-08-02) for AI system documentation and traceability, EU Cyber Resilience Act (2026-09-11) for vulnerability reporting with machine-readable SBOMs mandated from December 2027, and IEC 62304 Ed.2 for AI lifecycle in health software. The issue proposes bridging sigil attestations, SBOM/AIBOM and rivet traceability so one body of evidence serves all three rather than three parallel ones. WHAT ALREADY EXISTS AND SHOULD BE READ BEFORE DESIGNING: rivet already ships supply-chain.yaml with release-artifact, build-attestation and vulnerability types, and REQ-327 records that rivet's own releases produce exactly this evidence and discard it — a CycloneDX SBOM, a cosign bundle, per-asset SHA256 digests and cargo-audit ignore entries each carrying a written rationale. The v0.37.0 release published all of those as assets. So the gap is not that the schema is missing; it is that nothing consumes or emits it, which makes this closely related to REQ-327's unshipped supply-chain half rather than a separate build. SCOPED to v0.39.0 rather than left unassigned, which is the condition that let this sit for five months: an artifact with no release field never appears in a readiness query, so nothing ever surfaces it for a decision. Deliberately draft rather than proposed — the first deliverable is a decision on whether this is one feature or the completion of REQ-327, and that should be made after reading supply-chain.yaml against the three standards rather than assumed now."
