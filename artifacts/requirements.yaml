      This is the traceability/completeness-rule analogue of REQ-124
      (which covers link-target-type / broken-link / etc. but
      deliberately deferred the traceability rules, since those key on a
      dynamic `rule.id`). Extend the remediation pass to completeness/
      traceability diagnostics: emit a "how to satisfy" line naming the
      intermediate artifact chain and the link types that connect it,
      derived deterministically from the schema's link-fields +
      traceability rules.

