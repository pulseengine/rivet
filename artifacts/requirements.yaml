      timestamp: 2026-09-09T00:00:00Z
  - id: REQ-340
    type: requirement
    title: "assess autoformalizing NL requirements to Lean with a proved biconditional as certification evidence (#508)"
    status: draft
    description: "Triage of an untracked research lead open since 2026-06-06 (#508), filed from a web-research pass. THE TECHNIQUE: translate a natural-language requirement into a Lean proposition and PROVE the biconditional PA <-> PB, which decides requirement equivalence and consistency mechanically rather than by review. Demonstrated on automotive safety requirements with DeepSeek-Prover-V2. THE CLAIM WORTH TESTING, and the reason this is a lead rather than a curiosity: that work's largest manual bottleneck is VARIABLE GROUNDING — establishing that differently-named symbols in two requirements denote the same thing — and rivet's requirements are already typed and pre-grounded, which would turn their bottleneck into an automated step. If that holds, rivet is ahead of the published state of the art on the expensive half of the problem, and the gap the report identifies as publishable is that nobody packages autoformalized requirements as certification evidence. SCOPE OF THIS ARTIFACT: assessment, not adoption. The deliverable is a recorded decision — whether rivet pursues this, interoperates with it, or acknowledges it — with the grounding claim actually tested on rivet artifacts rather than assumed. Deliberately NOT scoped to v0.38.0: a research outcome cannot gate a release, and putting it in the cutting scope would make the release wait on a decision rather than on verified work. Assigned to v0.39.0 as a commitment to decide by then. Note the standing rule that this kind of work must be grounded in SOURCE rather than in a summary — the claim about the bottleneck comes from the linked paper and should be checked against it before any effort is committed."
