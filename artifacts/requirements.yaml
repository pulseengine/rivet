      timestamp: 2026-09-10T00:00:00Z
  - id: REQ-348
    type: requirement
    title: "rivet parses its own artifacts with TWO different YAML parsers selected by source format, with different accepted grammars and nothing checking they agree"
    status: implemented
    description: "Maintainer observation, 2026-09-10, on reading that rivet has both its own YAML machinery and a deprecated external parser: this looks like a Frankenstein. It is, and the concern is structural rather than aesthetic. VERIFIED FROM THE CODE. lib.rs dispatches on the source format string. `stpa-yaml` routes to import_with_schema, which calls yaml_hir::extract_schema_driven and therefore rivet's OWN rowan CST at yaml_cst.rs. `generic` and `generic-yaml` route to GenericYamlAdapter, whose parse is serde_yaml::from_str at formats/generic.rs:191. rivet.yaml then declares safety/stpa as stpa-yaml and artifacts, safety/stpa-sec and safety/tool-qualification as generic-yaml. So this repository parses its own artifacts with two different YAML implementations depending on which directory the file sits in. THE TWO GRAMMARS DIFFER BY CONSTRUCTION, not by accident: yaml_cst.rs documents that it parses block mappings, block sequences, flow sequences, scalars and comments, and that it does NOT handle anchors, aliases, tags, flow mappings, complex keys, multi-document streams or merge keys, which produce Error nodes. serde_yaml handles most of those. So a document valid under one path may be rejected under the other, and the deciding factor is the directory it happens to live in rather than anything about the document. This is the defect class the project has spent two releases removing — two representations of the same thing with nothing asserting they agree — instantiated in the parse layer, which is the lowest and least visible place it could sit. WHAT IS VERIFIED AND WHAT IS NOT. The dispatch and the two parsers are verified by reading lib.rs, formats/generic.rs and rivet.yaml. The differing grammars are verified from yaml_cst.rs own documentation. NOT VERIFIED: whether the two paths actually disagree on a real document. A test placing an identical artifact with a flow-style provenance mapping under both a generic-yaml and an stpa-yaml source loaded successfully in both, but the comparison could not be completed because `rivet get` does not render provenance at all — confirmed by a control against REQ-346 in this repository, which carries provenance and shows none. So the tool cannot currently surface the field the test needed, and the equivalence question is open rather than answered either way. Establishing it is the first piece of work here, not an afterthought: a differential corpus test over all 706 artifacts through both paths would answer it and would be needed anyway before any parser change. NOTE THE INTERACTION WITH REQ-346. That requirement covers serde_yaml being unmaintained. This one would remain a defect even if serde_yaml were actively maintained, because the problem is having two grammars for one data format rather than the health of either. They resolve together — consolidating onto the rowan CST removes both — but they are separate arguments and should not be collapsed, since a migration to another external crate would fix REQ-346 and leave this untouched. THERE ARE THREE IMPLEMENTATIONS, NOT TWO, and rivet already owns the write path — maintainer observation, and it makes the charge precise rather than merely aesthetic. On artifacts/ specifically: READING into the store goes through serde_yaml via GenericYamlAdapter, while EDITING and WRITING go through yaml_edit.rs, which is rivet's own line-oriented comment-preserving editor at 2514 lines and 49 tests. Its only serde_yaml use is one narrow case at line 1057, parsing a flow mapping when setting a field inside one, plus test assertions. `rivet stamp`, `rivet modify` and `rivet release move` all write artifacts through it — this session alone used it to move five artifacts between releases and to rewrite provenance on 1026. So rivet ALREADY loads and writes the YAML in artifacts/ with its own code. The third implementation is yaml_cst.rs, the rowan CST at 1419 lines and 34 tests, reachable only for stpa-yaml sources. MEASURED SPLIT: 265 artifacts, 27 percent, load through rivet's own rowan CST via safety/stpa; 711 artifacts, 73 percent, load through serde_yaml via artifacts/, safety/stpa-sec and safety/tool-qualification. An earlier count of this said zero percent for the rowan path and was wrong — STPA files use hazards, sub-hazards and similar as top-level keys rather than artifacts, so a counter looking only for `artifacts:` missed all 265. WHAT THIS DOES TO THE SCOPE. The remaining dependency is narrower than replace-a-YAML-parser suggests. rivet already parses artifact files for editing, already writes them, and already owns a lossless CST for a quarter of them. The single thing serde_yaml still does that rivet does not is DESERIALIZE INTO TYPED STRUCTS for the store. That is a serde Deserializer over an existing CST, not a parser. Three implementations of one data format in one codebase, with the deprecated one holding the read path while the project's own code holds the write path, is the strongest argument for consolidation — and consolidating onto the CST resolves this requirement and REQ-346 together. MEASURED AND GATED 2026-09-11, AND THE FIRST VERSION OF THIS MEASUREMENT OVERCLAIMED TWICE. A differential gate now parses the corpus through both paths and compares a fingerprint of id, type, title, status, release, tags, sorted links and provenance, rather than ids alone, because matching id sequences would agree while the two disagreed about everything else. CORRECTION ONE, SCOPE. The gate first walked artifacts/ only, which is one of the four sources rivet.yaml declares, and the record then claimed every artifact file. It covered 644 of the corpus. The gate now drives its file list from the sources list in rivet.yaml, so it cannot drift from what the tool actually loads, and it partitions on a mechanical rule rather than on a path literal: a document with no top-level artifacts key is outside the serde path's grammar by construction, so comparing the two there would manufacture a divergence that does not exist. Present partition, printed by the gate rather than implied: 43 files across 4 sources, 26 compared, 12 rowan-only by shape which is the safety/stpa set keyed on hazards and similar, 5 config documents such as bindings and the variant files. Totals serde 715, rowan 1062. Both totals and the compared count are asserted non-zero, because two paths that find nothing agree vacuously. CORRECTION TWO, AND IT IS THE FINDING. The earlier record asserted that flow-style FIELD values, naming the eighteen provenance blocks specifically, were handled by both paths. That was asserted on no evidence and it is false, on exactly the eighteen cited. Adding provenance to the fingerprint reddened the gate immediately. THE CORPUS DOES NOT AGREE: 24 files agree, 2 differ, and every difference is one class, provenance, on 18 artifacts. Measured directly on requirements.yaml: serde reads provenance on 205 of 321 artifacts and rowan on 195, while the corpus writes provenance block-style 900 times and flow-style 18 times. The 10-artifact gap in that one file is precisely its flow-style share. THE MECHANISM, AND WHY IT IS THE DANGEROUS KIND. yaml_cst has a FlowSequence node and no FlowMapping node. A flow-mapped VALUE therefore yields no provenance and NO PARSE ERROR, while the artifact itself survives — which is why the artifact counts match at 321 and 321 and the loss is invisible to anything counting artifacts. This is distinct from, and more subtle than, an artifact written ITSELF as a flow mapping, where rowan loses the whole artifact. Both are pinned: the first by flow_style_field_value_silently_loses_provenance, which carries a block-style control so it cannot pass merely because rowan never reads provenance at all; the second by divergence_probe. THE PROBE NOW ASSERTS RATHER THAN PRINTS. It recorded the two paths' counts for five constructs as println output, so closing any of those gaps would have flipped a line from DIVERGE to agree with nothing reddening and no prompt to update this record. Each case now asserts its recorded pair: plain and quoted-key agree; flow-mapping is serde 1 rowan 0; an anchor with a merge key fails on both, differently, serde erroring and rowan yielding nothing; a multi-document stream errors under serde while rowan parses the first document, so rowan is the MORE permissive path there. Neither parser is a superset of the other. WHAT THE GATE ASSERTS, given the corpus genuinely diverges. Not zero differences — that would require dropping the field that disagrees, which is the weak-green move this requirement exists to catch. It asserts that the divergence set is EXACTLY the one characterized above: no divergence class other than provenance, and provenance on exactly 18 artifacts. A nineteenth reddens it, because someone has written data rivet's own CST cannot read. Eighteen becoming fewer reddens it too, because either the CST gained FlowMapping or the corpus was normalized, and either way this record must be updated rather than re-baselined. Artifact-count mismatches carry their own assertion and their own message, because losing an artifact is a worse failure than losing a field on one. CONSEQUENCE FOR REQ-346, NOW STRONGER THAN A LATENT RISK. That requirement proposes migrating the artifact read path onto the rowan CST. On this evidence the migration would today drop provenance on 18 artifacts in this repository alone — live data, not a hypothetical shape the corpus happens not to use. FlowMapping support in yaml_cst is therefore a precondition of REQ-346, not a follow-up to it. NEGATIVE CONTROLS, all four reddening on the specific message each claims: dropping provenance from the fingerprint reddens on the count changing, rather than passing with fewer differences; perturbing a title on one path reddens as a new divergence class; skipping one artifact on the rowan path reddens on the artifact-count assertion; collapsing the shape partition reddens on the stpa files being swallowed. A DIFFERENTIAL TEST ALREADY EXISTED AND COULD NOT HAVE FOUND THIS, which is worth recording because it is the reason the divergence survived. rivet-core/tests/differential_yaml.rs is proptest-based and states its purpose as any discrepancy between the two is a bug in one or the other. It generates documents from arb_artifact_yaml, which emits id, type, title and an optional status, in block style, and nothing else — no links, no tags, no provenance, no flow mappings — and compares them through an ExpectedArtifact carrying those same four fields. So the generator cannot produce the construct on which the two parsers differ, and the comparison could not see it even if it did. A differential test whose generator is confined to the subset both implementations already agree on is not a differential test; it is a shared-subset test with a differential name, and its green is the weak kind. The gate added here is complementary rather than duplicative: it is corpus-driven rather than generator-driven, so it is bounded by what the project actually wrote rather than by what a strategy was taught to write, and that is precisely what surfaced the eighteen. Widening the generator belongs with the fix in REQ-346, where it will go green, rather than here, where it would only redden. A GUARD THAT THE FIX ITSELF ALMOST REMOVED, recorded because it is a general hazard rather than a one-off. While the corpus diverged on 18 artifacts, the strongest negative control was narrowing the fingerprint: dropping provenance from it changed the divergence count and reddened the survey on its own. When REQ-353 closed the gap and the expected count became zero, that control stopped working — with the count at zero, dropping a component moves nothing and the survey passes clean. Re-running the four controls after the refactor is what caught it; the one guarding against hiding a divergence by narrowing the comparison had gone vacuous, which is the same weak-green shape this requirement exists to name, reintroduced by its own fix. The guard is now asserted on its own terms rather than as a side effect of the count. fingerprint_carries_every_component_it_claims builds a synthetic artifact with every component populated and asserts each one appears, so dropping any of id, type, title, status, release, tags, links or provenance reddens regardless of what the corpus holds or how many differences there are — confirmed for provenance, tags and release individually. Its corpus-side companion asserts that compared artifacts actually contributed provenance, 591 of them, so both paths quietly ceasing to read the field cannot leave the survey green over an unchecked comparison. WHAT THIS DISCHARGES. The defect named in the title is that nothing checked the two agreed. Something does now, it runs in the workspace test suite, and it reports a real disagreement rather than a comfortable zero. The remaining half, that there are two parsers at all, is REQ-346's consolidation and is not claimed here."
    release: v0.38.0
    tags: [yaml, architecture, weak-green]
    provenance:
      created-by: ai-assisted
