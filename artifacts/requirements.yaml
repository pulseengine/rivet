  - id: REQ-109
    type: requirement
    title: "Variant scoping for documents (in/out-of-scope per variant)"
    status: draft
    description: |
      User question: a variant can scope which artifacts are in/out of
      scope (via `out-of-scope-for:` / binding), but there is no
      equivalent control for *documents* — a variant cannot currently
      declare which documents are in or out of scope. Assess whether
      document-level variant scoping is wanted, and if so design it on
      the existing variant-scope mechanism (not a new directive), so a
      variant's exported/served document set narrows with the variant.

      DESIGN DECISION (recorded 2026-05-30):
      YES — documents should get optional per-variant scoping, designed
      on the EXISTING binding mechanism rather than a new directive
      (per the reuse-binding-patterns principle). Mechanism:

        - A feature-binding entry's per-feature payload, today
          `{feature: {artifacts: [...]}}`, gains an optional sibling
          `documents: [DOC-ID, ...]`. A document bound to a feature is
          in-scope exactly when that feature is effective in the active
          variant — identical to how `collect_bound_ids` resolves
          artifacts (rivet-cli/src/serve/variant.rs). No new file kind,
          no new top-level directive.

        - DEFAULT POLICY: opt-in narrowing, NOT opt-out. A document
          NOT bound to any feature stays in scope for EVERY variant.
          Rationale: most documents (README, getting-started, glossary)
          are variant-agnostic; mirroring artifacts (which require an
          explicit binding to be scoped) keeps the model consistent and
          avoids silently hiding global docs.

        - `rivet validate` always sees the full document set (scoping is
          a serve/export view concern, never a validation gate) — same
          contract as artifact variant scope.

      Implementation is a follow-up (priority `could`); this REQ records
      the decision + mechanism so the build has no open product question.

      Acceptance:
        - [DONE] Decision recorded: documents DO get per-variant scoping,
          opt-in via the binding's `documents:` list, default-in for
          unbound docs.
        - [follow-up] A variant binding with a `documents:` list narrows
          the served/exported document set under that variant; unbound
          docs remain; `rivet validate` still sees the full set.
    tags: [variant, documents, scoping, design-question, user-reported, decision-recorded]
    fields:
      priority: could
      category: functional
      baseline: v0.14.0-track
    links:
      - type: traces-to
        target: REQ-083

  - id: REQ-110
    type: requirement
    title: "Coverage HTML display counts per-rule totals, not distinct artifacts, mislabeled as 'artifacts covered'"
    status: implemented
    description: |
      Bug-hunt finding (cross-command-consistency, 3/3 lens-
      confirmed).

      The line '{total_covered} / {total_items} artifacts covered
      across {} rules' uses per-rule sums (line 238: `e.covered`
      summed, line 238: `e.total` summed). When the same artifact
      appears in multiple traceability rules, the HTML overview counts
      it multiple times. This differs fundamentally from the
      'Artifacts' stat card (line 115) which shows store.len() — each
      artifact counted once.

      Evidence: Lines 237-238 sum coverage entry counts: `let
      total_covered: usize = cov_report.entries.iter().map(|e|
      e.covered).sum(); let total_items: usize =
      cov_report.entries.iter().map(|e| e.total).sum();`. Each
      CoverageEntry.total is computed per-rule from store.by_type(),
      so an artifact satisfying multiple rules increments total_items
      multiple times. But the label on line 252 implies these are
      artifact counts: '{total_covered} / {total_items} artifacts
      covered'. By contrast, rivet stats (lines 5919-5923) sums per-
      type counts ensuring each artifact is counted once.

      Location: /Users/r/git/pulseengine/rivet/rivet-
      cli/src/render/stats.rs:237-252

      Acceptance:
        - In a project where an artifact type appears in 2+
      traceability rules, run `rivet serve` and view the overview
      card. The 'N/M artifacts covered' denominator (M) will not match
      the total artifacts count when rules overlap on source type.
      Compare against `rivet coverage` text output (line 6172) which
      shows only rule-level totals, not distinct artifacts.
        - the inconsistency/incorrectness above is resolved and a
      regression test pins the corrected behaviour.
