  - id: REQ-339
    type: requirement
    title: "the dev schema's verification type cannot verify a feature and does not declare the fields projects actually record (#748)"
    status: verified
    description: "Reported from spar (#748) against dev@0.2.0, where the dev schema had NO verification type at all and the only ones rivet shipped were ASPICE's, whose required link fields point back into the ASPICE process model — so adopting unit-verification for a unit test forced adopting sw-detail-design and transitively sw-req and sw-arch-component. There was no I-use-dev-and-I-have-tests path. spar worked around it by hand-rolling a verification type on top of `feature` using undeclared fields, which put test suites on the IMPLEMENTATION side of the V and inflated implementation coverage: 194 of 311 requirements showed feature-stage coverage, but 172 of those were covered only by an artifact whose fields.test-name named a cargo test. PARTIALLY FIXED ALREADY, which is why this was re-measured rather than implemented from the report: #721 added a `verification` type to dev, so `requirement-verification` is no longer structurally unsatisfiable and a dev-only project can close the right side of its V. Re-measuring against dev@0.3.0 on a fresh `rivet init --preset dev` showed the residual precisely, and it is exactly what would have kept spar's workaround alive. FIRST, `verification.verifies` declared target-types of [requirement] only, so a verification measure could not verify a feature or a design decision — an acceptance test for a feature is a legitimate verification measure and was rejected with a link-target error. SECOND, the declared field set was [baseline, cited-source, method], so `test-name`, `test-location` and `steps` were all undeclared-field warnings. spar carries steps on 142 artifacts and test-name and test-location on 64 each, so migrating off the `feature` workaround would have swapped undeclared-field warnings on feature for the same warnings on verification — relocating the workaround rather than removing it. `method` was already declared with automated-test among its allowed values, so that field migrated cleanly. FIX: the three fields are declared, with `steps` typed `structured` and spelled the same as ASPICE unit-verification.steps so the two schemas agree on the field's shape and a project can move between them; and `verifies` is widened to [requirement, feature, design-decision]. Enumerated rather than left open, even though the report asked for [any], because an open target list stops the rule saying anything — a `verifies` link pointing INTO a verification is still wrong and should still be caught. dev bumped 0.3.0 to 0.4.0. Both halves negative-controlled independently: reverting target-types reddens the link assertion, removing the three field declarations reddens the field assertions. The first attempt at the second control did NOT redden, because the removal script anchored on `- name: cited-source`, which occurs under several artifact types, and so corrupted the file instead of removing the block — a reminder that a negative control which fails to redden must be examined before it is believed, since the fault is as likely to be in the control as in the assertion."
    release: v0.37.0
    tags: [schema, dev, verification, v-model]
    provenance:
      created-by: ai-assisted
