      timestamp: 2026-09-09T00:00:00Z
  - id: REQ-337
    type: requirement
    title: "rivet stamp replaces the provenance block entirely, deleting model on 270 artifacts and rewriting the creation timestamp on 575 (#912)"
    status: verified
    description: "Found 2026-09-09 while investigating why `rivet docs check` disagreed between the PATH binary and a fresh build. `yaml_edit::set_provenance` states its own semantics — if a provenance section already exists, it is replaced entirely — and `cmd_stamp` was its only production caller. So every sub-field the caller did not pass was dropped. Measured against this repository's own tree with rivet 0.36.0 and `rivet stamp all --created-by ai-assisted`, which is verbatim the PostToolUse hook in .claude/settings.json: provenance.model DELETED on 270 artifacts, session-id DELETED on 4, timestamp rewritten on 575, across 1026 stamped artifacts. The model field is the worse loss. CLAUDE.md documents the manual form as carrying --model, so the documented automatic invocation erased the field the documented manual invocation exists to set. For a repository shipping EU AI Act artifacts, which model generated an artifact IS the provenance, and it is the same field reviewer-independence checking depends on — two agents of one model are not two reviewers — so losing it silently removes the only evidence that could distinguish an independent AI review from an artifact reviewing itself. The timestamp is create-only by two independent in-tree definitions: model.rs documents the field as the ISO 8601 timestamp OF CREATION, and docs/design/polarion-reqif-fidelity.md maps it to Polarion's WorkItem.created. Advancing it therefore falsifies a creation date rather than updating a modification one, and a compliance timestamp that silently advances to now on every run is worse than an absent one because it looks authoritative. THE HARM WAS ALREADY NAMED IN THIS FUNCTION and only half fixed: a comment inside cmd_stamp records that a no-op filter had been causing `stamp all --missing-provenance` to overwrite timestamps on every existing artifact. That fix was applied to the filter and not to the behaviour underneath it, leaving the same harm reachable by the shorter command. FIX: a new `merge_provenance` alongside `set_provenance` rather than a change to it, since replace-entirely is deliberate, separately tested, and semver-relevant. Merge rules — created-by always written as a required argument; model, session-id and reviewed-by taken from the caller when supplied and preserved from the file when not; timestamp create-only so an existing value survives even an explicit one, with set_provenance remaining the deliberate re-stamp path; and any unrecognised sub-field carried over verbatim including nested continuation lines. That last rule exists for provenance.federation from `rivet supplier pull`, which has no parameter and therefore could not round-trip at all. No artifact carries a federation block today, which is why it is covered by a test rather than by the measurement. FLOW-STYLE PROVENANCE was the residual: 18 artifacts are written as `provenance: {created-by: x, model: y}` on one line, so a line-based walk of the block body sees nothing and dropped every sub-field. Handled by parsing the inline mapping; a flow mapping that does not close on its own line is REFUSED with an explanatory error rather than silently reformatted, since merging it would require rewriting the author's chosen layout. VERIFIED by re-running the measurement that found the defect: the same `stamp all` over the same 1026 artifacts now reports zero sub-field losses and zero timestamp changes. The only remaining differences are provenance ADDED to artifacts that had none, which is what stamp is for, and the 18 flow-style blocks normalised to block style with every value preserved."
    release: v0.37.0
    tags: [provenance, data-integrity, eu-ai-act, weak-green]
