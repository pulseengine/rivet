  - id: REQ-330
    type: requirement
    title: "next-id strips hyphens from a literal prefix, and add --field misfiles a base field into custom fields (#887)"
    status: verified
    description: "Reported from fathom/gale (#887) as three papercuts in add and next-id. The first — no way to choose an id — shipped separately as `add --id` (#899, #880). These are the other two. PART 2: `next-id` given a hyphenated PREFIX stripped the hyphens, returning REQDRV-001 for REQ-DRV and REQDRVGRAPH-001 for REQ-DRV-GRAPH, neither of which matches a project whose convention is REQ-DRV-COMPONENT-NNN. Cause: the POSITIONAL argument routes through prefix_for_type, whose fallback flattens hyphens — correct for a type name (sw-req becomes SWREQ), wrong for a prefix. The --prefix flag was already verbatim and correct, so the tool could name the series, just not by the route the reporter took; the fix makes the positional agree rather than adding a third spelling. An argument that is already prefix-shaped, meaning uppercase alphanumerics and hyphens, is now taken literally, so a lowercase type name still resolves through the type and learns the project's convention. PART 3: `add --field release=v0.7.1` misfiled a first-class base field into custom fields. The value was not lost and `rivet get` displayed it, but `rivet list --release v0.7.1` returned zero artifacts — because release readiness is a query over the top-level release key. An artifact invisible to the very thing the field exists for, which looks correct on inspection, is the worst of the three possible outcomes. Now rejected with a message naming the field and the flag that works, following the reporter's own judgement that a rejection would have been fine and silence was not. Rejected rather than silently rerouted, because rerouting would make --field mean two different things depending on the name. Genuinely custom fields are unaffected. Both negative-controlled: removing the literal-prefix path reddens the next-id test, disabling the base-field guard reddens the add test."
