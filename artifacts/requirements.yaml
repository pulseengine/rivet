  - id: REQ-308
    type: requirement
    title: "`rivet verify` advances on the existence of evidence, not its sufficiency (#838)"
    status: proposed
    description: "Reported from varve, where rivet is the release-readiness gate, and reproduced in rivet's own v0.34.0 cut the same day. `rivet verify REQ-X` correctly refuses when there is NO evidence — that guard works and stopped the reporter twice. But when a `verifies` marker exists it advances unconditionally, and a marker is cheap: one comment line above one `#[test]`. The structural problem is granularity: a requirement is a set of clauses, a marker attaches to the requirement, so the evidence link is coarser than the claim and the gap is invisible. The failure is not a missing check but a graph that LOOKS complete, which is worse — readers stop reading the requirement text once status says `verified`. In varve three requirements had markers and undischarged clauses (a gate that cannot detect the failure mode its clause names; a clause implemented for one transport but not another; a clause parsing a field nothing consumes). In rivet, REQ-298 was flipped to `verified` during the v0.34.0 release with its third clause ('tighten the top-level command list so the common path is legible') knowingly undischarged — 52 flat top-level commands remain — and `coverage --tests` reported `REQ-298  1 test marker`, indistinguishable from full discharge. The residual was hand-carried into REQ-307 plus commit prose, i.e. the reporter's option (3) improvised manually, and crucially the trace graph does NOT carry that caveat, so the caveat is not traceable. Degenerate variant found the same day: a marker that matches nothing is reported as neither present nor broken — the scanner regex accepts only word characters and hyphens after `verifies`, and `#` is neither, so `rivet: verifies #808` silently is not a marker at all; six such markers existed against 593 valid ones. Options in cost order: (1) per-clause markers `rivet: verifies REQ-X clause 3`, the real fix, but needs clauses addressable rather than prose inside `description` — a schema migration across every artifact; (2) make `partially-verifies` BLOCK rather than annotate, so `verify` refuses to advance past `implemented` without explicit override — no schema change, converts the common case into a refusal, and is therefore the right first move; (3) record the human judgement explicitly (`--clauses-discharged 1,2,4 --note ...`) so an unexamined default becomes a stated claim — cheap, but only meaningful if clause numbering is stable, and prose clauses renumber on any description edit, so record clause TEXT alongside the index or do (1) first."
    release: backlog
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-08-21T00:00:00Z

  - id: REQ-309
    type: requirement
    title: "coverage: a goal declared `undeveloped: true` counts identically to one that was forgotten (#848)"
    status: implemented
    description: "Reported from scry's safety case. `rivet coverage` returns a true number that is not measuring what a reader assumes. Three of five safety goals carried GSN's `undeveloped: true` — the diamond notation for a goal DELIBERATELY not yet decomposed, a declaration of known incompleteness that is correct practice to write down — and coverage did not read the field at all, so a declared gap and an oversight contributed identically. Reproduced in rivet with a three-goal fixture: goal-has-support scored 1/3 = 33.3% with one supported goal, one declared undeveloped and one simply forgotten. The safety-case schema's own rule description already promised the exemption (\"unless marked undeveloped\") while `undeveloped` appeared in no Rust file — the semantics were documented and unimplemented. The figure misled in BOTH directions. False alarm: a project doing the right thing scored as if it had drifted, and the natural remedy is to add links until the number goes green, which is the cosmetic move a coverage gate exists to prevent. False comfort, the one that bites: a genuinely forgotten goal hides among the declared ones, because three accepted gaps becoming four reads as more of the same. Same shape as scry#117, where an MC/DC gate's green was real and measured a population that was 49% Rust stdlib. Fix landed as a schema-declared rule field `exempt-when-field`, NOT a hardcoded field name, so any schema can express its own notion of a declared accepted gap; safety-case wires it to `undeveloped` on goal-has-support. An exempt source leaves the denominator and is reported as its own named count with ids, never silently dropped. Only an explicit `true` exempts — `false` or absent keeps the source in scope, so an exemption is always something an author wrote on purpose. Measured after: the same fixture reports 1/2 = 50.0% plus \"1 declared exempt (not counted): G-002\", and with the forgotten goal removed 1/1 = 100.0% — so a forgotten goal now moves the figure 100% -> 50% where it is loud. Deliberately NOT applied to goal-has-context: `undeveloped` states that a goal is not yet decomposed into evidence and says nothing about whether it has context, so exempting that rule too would silently weaken a separate check. Reporter's remaining asks, not done here: `--fail-under` treating exemptions as a policy choice (allowed in development, blocking for a qualification claim, since an undeveloped ASIL D goal is fine in-flight and is a release blocker for certification)."
    release: v0.35.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-08-26T00:00:00Z

  - id: REQ-310
    type: requirement
    title: "validate --explain reports the allowed-source set as [] for a rule that IS satisfiable (#852)"
    status: implemented
    description: "`rivet validate --explain REQ-001` prints \"needs an incoming 'verifies' from one of []\", which reads unambiguously as 'no artifact type may source this link' — i.e. the rule is structurally unsatisfiable. The reporter concluded exactly that and was about to file a schema gap before testing it. The `verification` type in `dev` declares `verifies -> [requirement]`, and its own description documents that it was ADDED to fix precisely this class (#721); adding one `verification` artifact flips the line to `[satisfied]` immediately. So the rule is satisfiable and the explain output simply does not consult the type registry for types whose LINK-FIELDS can source the required link — it appears to look only at an explicit from-types list on the rule and renders an empty list rather than deriving the set. The failure mode is a diagnostic that actively causes a wrong diagnosis: an empty `[]` is indistinguishable from 'unsatisfiable', which is a real and different condition rivet should be able to report. Fix shape: derive the allowed-source set from the schema's types (any type declaring a link-field of that link-type targeting this source-type) and render it; if the derived set is genuinely empty, say so explicitly ('no type in the loaded schemas can source this link — the rule is unsatisfiable') rather than printing bare brackets, so the two cases are distinguishable in the output rather than only in the reader's head."
    release: v0.35.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-08-26T00:00:00Z

  - id: REQ-311
    type: requirement
    title: "rivet sync ignores rivet.lock — no --locked mode, so federated CI floats with sibling heads (#853)"
    status: implemented
    description: "Reported from synth's federated CI (synth#1012). `rivet lock` writes and commits exact commit pins for each external, but `rivet sync` always fetches the external's `ref:` head and never reads the lockfile — confirmed at HEAD: `rivet-core/src/externals.rs` `sync_all`/`sync_external` never call `read_lockfile`, and `rivet sync --help` offers only `--local` / `--force`. The consequence is that a consumer's committed lock pins for provenance and impact tooling while the graph CI actually validates against whatever the sibling repos' heads are at that moment: a sibling force-push, artifact rename or bad commit silently changes what the consumer's CI sees, and a run cannot be reproduced later. It also means `rivet lock` followed by `rivet sync` on two machines can disagree about the same lock. This is a reproducibility gap in the cross-repo story rather than a cosmetic one — the reporter's workaround was to make synth's federated job deliberately NON-required and document the coupling in a job comment, which is the tell that the tool cannot express what the workflow needs. Fix shape: `rivet sync --locked` that resolves each external to the sha recorded in `rivet.lock` and fails rather than floating when the lock is absent or stale, mirroring `cargo --locked`; consider making it the default in CI-detected environments, and have `rivet sync` report which sha each external resolved to so a log makes the state auditable."
    release: v0.35.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-08-26T00:00:00Z

  - id: REQ-312
    type: requirement
    title: "A dead externals path: poisons cross-repo resolution and validate still reports '0 broken cross-refs' (#854)"
    status: implemented
    description: "Reported from synth (synth#1012) and reproduced locally at HEAD with a single external declaring both `git:` and a nonexistent `path:`. Two compounding behaviours. FIRST, a dead `path:` poisons resolution instead of falling back to the declared `git:` — one nonexistent path is enough that external artifacts are never loaded, so every cross-repo ref degrades into a local `link 'traces-to' targets 'X' which does not exist` error, INCLUDING refs into repos that synced fine. On the reporter's tree 38 of 50 errors were artifacts of the poisoned state and 12 real dangling refs were invisible behind them. `rivet lock` fails outright with `IO error: git rev-parse: No such file or directory (os error 2)` naming neither the external nor the path (measured exit 1). SECOND, and the more dangerous half, the summary line reports `FAIL (N errors, 0 warnings, 0 broken cross-refs)` in that state. `0 broken cross-refs` beside N unresolved-target errors means resolution never RAN, but it reads as 'the cross-repo graph is clean' — the same shape as REQ-309, where a zero denominator rendered as 100%, and as the `empty_scan` case in REQ-290. Measured locally: 1 unresolved-target ERROR alongside `0 broken cross-refs`, and the summary also reports `0 warnings` while printing a `warning:` line, so the cross-repo INCOMPLETE warning is excluded from its own count. Fix shape, in value order: (1) render the cross-ref figure as NOT CHECKED rather than 0 whenever external loading failed, so an unrun check can never read as a clean one; (2) count the INCOMPLETE warning in the warning total; (3) fall back to `git:` when `path:` does not resolve, or fail loudly naming the external and the path instead of degrading every downstream ref; (4) name the external and path in the `rivet lock` error."
    release: v0.35.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-08-26T00:00:00Z

  - id: REQ-313
    type: requirement
    title: "No way to declare an acceptance criterion as not-yet-dischargeable, so gates deadlock or silently pass (#856)"
    status: implemented
    description: "Reported from scry. `acceptance-criteria` is `list<string>`, so an author who KNOWS a criterion cannot yet be discharged has nowhere to record that except inside the string in shouty caps, where the tool cannot act on it. The reporter's case is a genuine deadlock: a feature scoped to `release: v3.2.6` carried an AC that could only be discharged BY that release completing, so the release cannot become cuttable until the feature is verified and the feature cannot be verified until the release ships. `rivet validate` passes, `rivet release status` says 'not yet verified', and nothing indicates why it will stay that way forever; it was caught only by re-reading the artifact three weeks later. The author's two options are both invisible: write the criterion and stall the release with no machine-readable reason, or omit it and let the gate go green on something nobody can discharge. Same family as REQ-309/#848 one level down — a DECLARED incompleteness the tool has no home for. Two things measured here at HEAD that the report does not mention. First, the object form ALREADY validates clean: `type: list<string>` is not enforced per element, so a list of mappings passes `rivet validate` today with no diagnostic. Second, and worse, `rivet export --format gherkin` SILENTLY DROPS such a criterion — the generated .feature file for an object-form AC contains a header and no scenarios at all, so an author who adopts the shape the reporter proposes loses the criterion from the export with no error. Scope for this artifact: (a) recognise the object form `{text, status, blocked-by}` alongside bare strings, keeping strings working unchanged; (b) render it in the gherkin export instead of dropping it; (c) a criterion whose `blocked-by` names the release its own artifact is scoped to is a circular deadlock and is mechanically detectable — a clean error, not a heuristic; (d) report declared-blocked criteria as their own category so 'declared blocked' is distinguishable from 'not yet verified'. Explicitly OUT of scope on the reporter's own advice: detecting a requirement written as a conjunction of independent obligations — that needs to tell an AND of two obligations from ordinary prose containing 'and', and a false positive on every requirement would be worse than the occasional real one. It is a review problem, not a validation problem."
    release: v0.35.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-08-26T00:00:00Z

  - id: REQ-314
    type: requirement
    title: "27 integration tests resolve the rivet binary at RUNTIME, so nextest with a custom CARGO_TARGET_DIR cannot find it"
    status: verified
    description: "Found while verifying REQ-304/305 locally. `rivet_bin()` in 27 of 28 integration-test files reads `std::env::var(\"CARGO_BIN_EXE_rivet\")` — a RUNTIME lookup — and falls back to a hardcoded `<workspace_root>/target/debug/rivet`. Cargo sets that variable in the test process environment, so `cargo test` works. nextest spawns test processes itself and does NOT set it, so every one of those files falls through to the hardcoded path, which ignores `CARGO_TARGET_DIR` entirely. Measured: `cargo nextest run --all --profile ci` with `CARGO_TARGET_DIR=/tmp/rivet-build` gives 2304 tests run, 387 failed, every failure `spawn rivet: Os { code: 2, kind: NotFound }`; copying the binary to `<workspace>/target/debug/rivet` makes the same suite pass 8/8 on a sampled crate. The single file that uses the COMPILE-TIME macro `env!(\"CARGO_BIN_EXE_rivet\")` — mcp_integration.rs, changed in #834 for REQ-293 — passes under nextest untouched, which is the clean discriminator. CI does not hit this because it sets no CARGO_TARGET_DIR, so the fallback happens to resolve; the cost lands on local verification, where the documented workflow for this repo IS a custom target dir, meaning nextest-based CI changes cannot be validated locally without a workaround. Fix is mechanical: replace the runtime lookup with `env!(\"CARGO_BIN_EXE_rivet\")`, which cargo substitutes at compile time for integration tests and which is correct under any runner and any target directory, and delete the hardcoded fallback rather than repairing it — a fallback that silently resolves to the wrong path is how #293 shipped four releases of empty compliance bundles."
    release: v0.36.0
    tags: [test-infrastructure, weak-green]
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-08-27T00:00:00Z

  - id: REQ-315
    type: requirement
    title: "An artifact named in a merged commit's trailers can stay `proposed` forever — nothing reconciles trailer to status"
    status: verified
    description: "Observed five times in one release cycle, every time by the same author, and caught only by manual audit: REQ-309 (shipped #850), REQ-299 (shipped 6b3be3c), REQ-295 (Defect 1 shipped #830), REQ-304 and REQ-305 (shipped #863, found still `proposed` within the hour), and REQ-303 (shipped #864). In each case the merge commit carried a correct `Implements:`/`Fixes:` trailer naming the artifact, and the artifact's `status` was never advanced. The root cause is that a trailer is a LINK, not a state transition — `rivet commits` validates that trailers reference real artifacts, and nothing asserts the converse: that an artifact which a merged commit claims to implement is no longer sitting at `proposed`/`draft`. The consequence is that release readiness, which is defined as a query over `release:` + `status`, reports scope as unshipped when it has shipped, so a release looks further away than it is and a human has to re-derive the truth by reading git log. This is the same defect class the tool exists to prevent, in the tool's own artifacts. Proposed check: a `rivet commits` (or `rivet check`) rule that walks merge commits on the default branch, collects artifacts named in `Implements:`/`Fixes:` trailers, and reports any that remain `proposed` or `draft` — Warning by default so a genuinely-partial implementation can carry a trailer without failing the gate, Error under `--strict` so CI can enforce it. Deliberately NOT auto-advancing status: whether shipped code discharges every acceptance clause is a judgement (REQ-308), and a tool that flipped `proposed` to `verified` on a trailer would manufacture exactly the false confidence REQ-308 is about. The check should say the artifact and the commit and let a human decide which status is right. Shipped as a `rivet commits` section listing the artifact, its status, and the commit that claims it, plus a `status_drift` array in --format json; only `implements`/`fixes` count, since `verifies` and `traces-to` make no claim that the artifact is done. Advisory by default and an error under --strict. Run against rivet own history on landing it reported 30 artifacts, including DD-064, FEAT-071 and REQ-030, that a commit claims to implement while they sit at draft. CI is unaffected: its commits gate reads only the orphans and broken-refs counts out of the JSON and does not pass --strict, so the default exit code is unchanged."
    release: v0.36.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-08-27T00:00:00Z

  - id: REQ-316
    type: requirement
    title: "The self-hosted fleet restarts mid-run, killing in-flight jobs and reporting them as failures (#862)"
    status: verified
    description: "Twice confirmed within two days, and each time it presents as a set of unrelated red checks that look like real regressions. On 2026-08-27 three jobs on three DIFFERENT runners (Code Coverage on 01-10, Mutation Testing rivet-cli on 01-9, Mutation Testing rivet-core PR-diff on 01-6) all started 04:54:38 and died within ten seconds of each other at 04:56:37 with `The runner has received a shutdown signal`; all three had been green on the previous commit of the same PR. On 2026-08-26 the same message at 04:33:47 killed WASM seam build, Test and Proptest across two labels within one second, and all three passed on re-run. The cost is not the re-run. The jobs report `failure`, not `cancelled`, and there is no failed STEP — the steps end `skipped` — so the GitHub UI shows a red X that is indistinguishable from a broken test, and only the raw log carries the reason. That indistinguishability has already produced one published misattribution (PR #855, where duplicate pull_request runs were blamed and a correction had to be issued) and it is the mechanism by which a genuinely red mutation gate could be waved through. Two things needed. First, find the cause: unattended upgrades, a systemd timer, a config-management run or an autoscaler reclaim would all produce this, and if it is scheduled, moving it outside working hours costs nothing. Second, make the state legible without opening logs — a post-job step that detects the shutdown and annotates the job would let a reader distinguish 'the runner went away' from 'the test failed' at a glance. Related: this same message is emitted by the HOSTED pool too, which is why the Kani attribution in #839 was wrong; the message alone does not identify which pool restarted. SCOPE SPLIT, decided with the maintainer on 2026-09-05: this artifact now covers only the SECOND half — making the state legible without opening logs. Shipped as classify_failure in tools/ci-diagnose/diagnose.sh, which separates three outcomes a red X conflates: a job that failed with NO failed step is the fleet-restart signature (runner-vanished), a step that failed with work still skipped after it never ran the work (setup-failed), and an ordinary failure that names its step (job-failed). Validated against a real Kani job on PR #888, which classifies as setup-failed — the same discriminator applied by hand all cycle, now mechanical. The FIRST half, finding the cause on the runner hosts, needs shell access to those machines and is deferred to REQ-323 at v0.37.0. It is recorded rather than dropped."
    release: v0.36.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-08-27T00:00:00Z

  - id: REQ-317
    type: requirement
    title: "The runner-liveness probe misdiagnoses in three distinct ways and re-fires instead of being fixed (#839, #849, #860, #867)"
    status: verified
    description: "The scheduled liveness probe auto-files an issue when a run sits queued, and it has now fired four times with guidance that sends the reader to the wrong conclusion. Three separate defects, each verified. (1) Its own diagnose hint says to run `gh api repos/pulseengine/rivet/actions/runners --jq .total_count` and reads `0 = pool offline`; runners here are registered at the ORG, so that command returns 0 on a perfectly healthy pool and can never say otherwise — measured repo-scope 0 against org-scope 12. (2) GitHub-hosted capacity appears in the runners API at NO scope, so no `total_count` query can distinguish 'self-hosted offline' from 'hosted starved', and hosted starvation is the mode this alert most often fires on — every queued job was `[ubuntu-latest]` on both #860 and #867 while self-hosted sat idle. (3) It counts queue age on runs that were CANCELLED: #867 reported 'queued 177m — runners are not picking up jobs' for run 33078970036, which was `completed/cancelled` and therefore never going to start. The compounding problem is that each alert auto-closes when the symptom clears, so the probe's own defects survive every occurrence and the next reader starts from the same wrong hint. Fix: skip completed runs when computing queue age; report the LABELS of the still-queued jobs rather than a duration alone; and branch the guidance — `[self-hosted, …]` plus a low online count is a pool problem, `[ubuntu-latest]` is hosted starvation and the self-hosted numbers are irrelevant. Four distinct runner failure modes are now documented across these issues (pool offline, pool saturated, hosted starvation, fleet restart) and this probe describes only the first. All three defects fixed. The queued-age loop now skips runs whose own status is completed, so a cancelled run can no longer be reported as stuck. The alarm classifies from the LABELS of the still-queued jobs via classify_stall and branches its guidance per mode instead of printing a duration. The diagnose hint that told every reader to run a repo-scope total_count query — which returns 0 on a healthy org-registered pool and can never say otherwise — is replaced by an org-scope PER-LABEL idle count compared against the labels of what is queued. A FIFTH mode was found while fixing this and is now covered: label-partitioned saturation, measured 2026-09-02 as online=12 busy=8, a third of the fleet idle, while every rust-cpu job queued because those idle runners carried only lean-mem. A global busy-versus-online count cannot see that. Validated against live data: with 5 hosted and 3 rust-cpu jobs queued and only lean-mem and light idle it returns label-saturated, and the control filtering to only hosted jobs returns hosted-starved."
    release: v0.36.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-08-27T00:00:00Z

  - id: REQ-318
    type: requirement
    title: "Externally-owned verification: a criterion only another project can run has no home but prose (#800)"
    status: proposed
    description: "A requirement can carry a verification criterion that only a DIFFERENT project can run. `rivet verify` already refuses to promote without evidence, which is the correct block, so the mechanism is present; what is missing is a way to say WHY it is unrun and WHO owns it, so the set is queryable rather than living in a description field. `external-anchor` is not it — that models the INBOUND boundary, requirements handed to us by a supplier, with `source-of-truth`, `expected-derived-types` and `received-status`. This is the outbound direction: evidence we are waiting on from someone else. Same family as REQ-313, which gave a declared-blocked acceptance criterion a machine-readable home instead of shouty caps inside the string, and as REQ-308, which is about `verify` advancing on the existence of evidence rather than its sufficiency. Deliberately NOT scheduled into a release yet: the three overlap enough that solving them piecemeal risks three near-identical mechanisms for 'this obligation is declared, owned elsewhere, and not yet discharged'. REQ-308 already needs clauses to become addressable, which is a schema migration across every artifact; this should be designed alongside it rather than bolted on first. Backlog pending that design decision."
    release: backlog
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-08-27T00:00:00Z

  - id: REQ-319
    type: requirement
    title: "coverage --tests skips shell scripts, so a gate-verified requirement cannot close its V (#870)"
    status: verified
    description: "`rivet coverage --tests` read `# rivet: verifies REQ-X` from a Python file but not the identical comment from a shell script — same convention, different extension. `detect_language` had no entry for `sh` at all, so `scan_file` returned before any pattern ran and the file was skipped silently. Reproduced: three files in one directory with one marker each; the .rs and .py markers were found, the .sh one reported `No test markers found`. This costs real evidence rather than tidiness. Not every falsifiable check is a unit test, and the ones that are not tend to guard the nastiest failures — the reporter's two examples are a gate that refuses any workflow redirecting key material into a file (proved by rejecting four shapes including one their own deposit workflow shipped) and one asserting the installer warns when a different binary wins the PATH lookup. Both run in CI, both have negative controls proving they can go red, and both are the sole evidence for their requirement, which therefore could not reach `verified` by any honest route. Fixed by giving shell its own language category rather than aliasing it to python — the comment pattern is the same but the enclosing-function regex differs (`name() {` and `function name` rather than `def`). Also added a shebang fallback for EXTENSIONLESS scripts, since a gate is frequently `tools/no-key-on-disk` rather than `tools/no-key-on-disk.sh`; the fallback is consulted only when a file has no extension, so a tree of images and binaries is not read looking for one, and a plain text file with no shebang is still correctly skipped. Verified by two markers in `rivet-core/src/test_scanner.rs`, hardened after the PR-diff mutation gate found three survivors in the new code: the zsh/ksh disjunct, the word-boundary sh match, and the shell arm of the enclosing-function lookup. The third is the instructive one — the test already exercised that arm and already passed, but projected every marker down to its target id and discarded the attributed name, so deleting the arm silently degraded a marker from its function name to a bare file-and-line and nothing noticed. Line coverage reported the arm fully covered. Each mutant was re-applied by hand and confirmed to redden exactly the assertion written for it."
    release: v0.36.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-08-28T00:00:00Z

  - id: REQ-320
    type: requirement
    title: "No way to subset an embedded preset's rules, so an unmodelled process level renders as an empty row forever (#871)"
    status: verified
    description: "Reported from scry. Part (1) of #871 — an empty-population rule rendering as 100.0% — was ALREADY FIXED in v0.34.0 by REQ-294 and verified on current main: both the per-rule table and the V-closure lines render `n/a%`, and `coverage --format json` emits `percentage: null` alongside `empty_scope: true`, which is exactly the shape the issue asks for. The reporter is on scry's vendored copy, which predates that release. Part (2) is real and unaddressed: the `aspice` preset is embedded and there is no way to subset its rules, so a project adopting it for SWE.1/SWE.6 necessarily inherits SWE.2/SWE.3/SWE.4 rows it can never satisfy. scry deliberately does not model those levels — its design intent lives in a parallel dev spine, and authoring a unit-verification artifact per absent detail-design element would be fabricated traceability, which is the outcome a coverage gate exists to prevent. Their workaround is the tell: a checked-in file declaring the unmodelled levels, gated in CI to fail both when an empty population is undeclared and when a declaration goes stale. That is a mechanism rivet should own, and it is the same shape as REQ-309 (`exempt-when-field` gave a DECLARED exemption a machine-readable home so it stops reading as an oversight) and REQ-313 (a declared-undischargeable criterion). Shape to consider: let a project declare in `rivet.yaml` which preset rules it does not model, with the declaration itself validated — an unmodelled level that later acquires artifacts should fail, so the declaration cannot go stale silently. Deliberately grouped with those two rather than solved standalone: three near-identical mechanisms for `this is declared, not forgotten` would be worse than one. Shipped as coverage.unmodelled-rules in rivet.yaml: a list of rule plus reason, where the reason is REQUIRED because a declaration without one is indistinguishable from suppressing an inconvenient row. The declared rule STAYS in the report, annotated — hiding it is the failure this replaces, not the fix. Two ways a declaration can fail, and both are errors that fail the run: it is STALE when the rule now has source artifacts, so the project said it does not model something and then modelled it; and it is UNKNOWN when no such rule exists in the active schemas, because silently ignoring a typo would let a project believe it had declared something. The staleness half is the point, and is what was promised to the reporter: an exemption that outlives its reason is the same defect as the 100 percent it replaced, a number that stopped meaning what it says. Implemented additively as mark_unmodelled rather than as a parameter on compute_coverage, whose signature is public. Grouped with REQ-309 (exempt-when-field, artifact declares itself out of a rule population) and REQ-313 (declared-blocked criteria): three levels of the same idea, and this is the project-scope one. Negative-controlled at --lib scope: never detecting stale, ignoring an unknown rule, and not annotating each redden exactly one test."
    release: v0.36.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-08-28T00:00:00Z
  - id: REQ-321
    type: requirement
    title: "The rowan YAML parser silently drops every document after the first, while serde rejects the same input"
    status: verified
    description: "Found empirically by the `yaml_footguns` fuzz target on a push-to-main run, from a six-byte input. `yaml_cst::parse_root` skips one LEADING `---` document-start marker, parses the first document, then bumps every remaining token into the Root node as trivia. A second document therefore vanished with no diagnostic: `extract_generic_artifacts` on a source declaring two artifacts across two documents returned exactly one, with an empty diagnostics list. This is a two-parser disagreement, which is the specific thing rivet cannot afford. The serde path already rejects the same input with `deserializing from YAML containing more than one document is not supported`, so a reader consuming the rowan path (the incremental, LSP and span-aware surfaces) saw a different file than a reader consuming the serde path, and neither was told. The shipped CLI was NOT affected, because it reads through the serde path and correctly exits 1; the divergence was confined to rivet-core. Fixed by making the two parsers agree rather than by implementing multi-document support: a DirectiveMarker reached in the trailing consume loop is a document SEPARATOR rather than the document START already skipped, so it now raises an Error. Loading both documents would have been a feature, and would silently widen what validate accepts. The rowan path additionally reports a line number, which the serde path does not. Pinned by two tests: one asserting the multi-document case is diagnosed, and one asserting a leading `---` remains ordinary single-document YAML, which is what forces the guard to distinguish separator from start. Negative-controlled by removing the guard and confirming the first test reddens while the second stays green. Regression-checked against rivet's own tree: 1035 artifacts still load and validate passes."
    release: v0.36.0
    tags: [silent-accept, parser, fuzz-found]
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-09-01T00:00:00Z
  - id: REQ-322
    type: requirement
    title: "schema validate reports false errors on a built-in preset, and cannot fail the process either way (#876)"
    status: verified
    description: "Reported against the built-in safety-case preset with no local customisation. Two defects, and the reported one is the smaller. FIRST, `required-backlink` was checked against the set of FORWARD link-type names, but a backlink names the INVERSE of a declared type — `supported-by` for `supports`, `scoped-by` for `scopes` — so two rules in a shipped preset were reported as naming unknown link types. The reporter's decisive observation is that the coverage engine resolves those same names and returns real counts, which is what rules out the schema being the wrong end; `inverse_map` is populated in both directions and is the index coverage already uses. `required-link` is left forward-only, because rules genuinely do name the forward type there. SECOND, and worse, `rivet schema validate` printed `Result: 2 error(s)` and exited 0: `cmd_validate` returned only a String, and its single caller printed it and returned Ok(true) unconditionally, so the command could never fail whatever it found. The report frames this as a check that cries wolf, but it could not gate anything at all — the same weak-green class as a check that never fires. Both halves are pinned by tests that redden independently: dropping the inverse lookup fails only the built-in-preset test, and restoring the always-succeed return fails only the process-exit test, which uses a backlink that is neither a forward name nor a declared inverse so widening the accepted set cannot quietly turn the check into a no-op. Warnings deliberately remain a pass, since an unknown target type can legitimately belong to a preset the project has not enabled. Confirmed no workflow invokes `schema validate`, so the exit-code change cannot break rivet's own gates, and rivet's own schemas report 0 errors. Cross-checked that `coverage --format json` still emits supported-by and scoped-by as backward rules, so the fix changed only what the validator ACCEPTS, not what a backlink resolves to. Out of scope and filed as observation only: `alternate-backlinks` link types are not validated at all, so that hole is a check that does not fire rather than one that fires wrongly."
    release: v0.36.0
    tags: [weak-green, validation, schema]
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-09-02T00:00:00Z
  - id: REQ-323
    type: requirement
    title: "Find why the self-hosted fleet restarts mid-run (deferred half of REQ-316)"
    status: implemented
    description: "Split out of REQ-316 on 2026-09-05 with the maintainer, because it cannot be discharged from the repository. REQ-316 shipped the legibility half — a red X caused by a vanished runner is now mechanically distinguishable from a failed test. This is the other half: WHY the fleet restarts. Twice confirmed within two days, each time killing jobs across several runners within seconds of one another: 2026-08-27 at 04:56:37 across runners 01-10, 01-9 and 01-6, and 2026-08-26 at 04:33:47 across two labels. Both windows fall around 04:30-05:00 UTC, which is consistent with a scheduled task rather than with load. Candidates, each of which would produce exactly this signature: unattended-upgrades restarting the runner service, a systemd timer, a config-management run, or an autoscaler reclaiming instances. Requires shell access to the Hetzner hosts — inspect systemctl list-timers, the unattended-upgrades configuration and any autoscaler policy, then correlate against the two timestamps above. If it is scheduled, moving it outside working hours costs nothing and removes the failure mode entirely rather than making it legible. Until then the cost is bounded but real: every occurrence spends a re-run and invites a misattribution, and one has already been published and corrected (#855). ROOT CAUSE FOUND 2026-09-05 by the infrastructure maintainer on #862, not from this repository. `needrestart` is wired into dpkg via /etc/apt/apt.conf.d/99needrestart as a DPkg::Post-Invoke hook; running without a TTY under unattended-upgrades it restarts every service mapping an upgraded library, and github-runner@*.service was never excluded, so a library upgrade stops and starts all twelve runners mid-dpkg. apt-daily-upgrade.timer fires 06:00-06:45 CEST, which is 04:00-04:45 UTC — the window both incidents fall in. All three occurrences were matched to the second, each upgrading a library Runner.Listener links for HTTPS: 2026-08-26 curl and libcurl at +13s, 2026-08-27 libssl3t64 and openssl at +21s, 2026-09-02 libssh-4 and libgcrypt20 at +30s. The mechanism was negative-controlled: on 2026-09-04 the upgrade installed only gnupg, which the runners do not map, and no restart followed — it explains the non-events as well as the events. Fix deployed: an override_rc drop-in at /etc/needrestart/conf.d/90-github-runner.conf, chosen over blacklist_rc so the units stay visible in needrestart -b -r l and it remains possible to see which runners carry stale libraries. Stated trade-off: a runner keeps pre-upgrade shared libraries mapped until it next restarts, so security updates including openssl are patched on next restart rather than immediately; a drain-aware refresh timer is the follow-up if that proves too loose. NOT YET VERIFIED, which is why this artifact is implemented rather than verified: suppression of a real restart has not been demonstrated because that needs an actual library upgrade, and the maintainer is watching the next apt-daily-upgrade. This also corrects #839 — exit 143 on Kani in that window is this needrestart, not hosted-runner reclaim, confirming the note in REQ-316 that the shutdown message alone does not identify which pool restarted. Note that this removes A cause, not THE cause: runners also vanish on a broker-service wedge (8 of 12 offline for 4h49m on 2026-09-02) and under host memory pressure, so REQ-316 legibility remains worth having independently. SCOPE DECISION 2026-09-09: moved out of v0.37.0 to backlog. The work is DONE — #862 is closed, the root cause was found by the infrastructure maintainer and the suppression was demonstrated under a forced libssl3t64 reinstall, with 12 of 12 runners flagged by needrestart and 0 restarted while six other services were restarted in the same dpkg run. This is not a deferral of the work. It is a deferral of the VERIFICATION, because the evidence is externally owned and rivet cannot consume it: `rivet verify` accepts only an incoming `verifies` link or a source marker, and while `cited-source` could record a github reference, only kind `file` is actually verified, so citing the issue would turn the gate green on something rivet cannot check. That is exactly REQ-318 (#800), which is `proposed` and in backlog; this requirement is blocked on it and belongs in the same place until it lands. Leaving it in v0.37.0 would have made the release permanently uncuttable on a requirement whose work is complete."
    release: backlog
    tags: [ci, infrastructure, deferred]
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-09-05T00:00:00Z
  - id: REQ-324
    type: requirement
    title: "The mutation gate reports mutants in #[cfg(kani)] code that no test it runs can ever kill"
    status: verified
    description: "Found on PR #893 while shipping REQ-320. The PR-diff mutation gate reported one survivor: rivet-core/src/proofs.rs:209, replacing the proof harness proof_coverage_percentage_bounds with unit. That module is gated behind `#[cfg(kani)]` at line 9, so `cargo test` never compiles it, and the gate runs `cargo mutants -- --lib`. No test the gate executes can observe the mutation, so the finding is unkillable by construction — it appeared only because the PR touched the file to add a struct field. This is the same defect class as the release it was found in: a gate that reports something nothing can act on trains its readers to ignore it, and the next real survivor in that report costs nothing to dismiss. Two candidate fixes. Exclude cfg-gated modules from the mutants scope, either via an `--exclude` argument in the workflow or a mutants.toml, which is cheap and honest about what the gate covers. Or run a separate mutation pass under `cargo kani`, which is the thorough answer and almost certainly not worth its runtime for four proof harnesses. Prefer the first. Note that the same file has already caused one real incident in the other direction: a struct field added without updating the cfg(kani) literal broke the Kani proofs, and the resulting CI signal was written off as flake six times, so the file needs to stay visible to SOMETHING even if the mutation gate stops reporting on it. IMPLEMENTED 2026-09-09 by the preferred route: a cargo-mutants config excluding cfg(kani) code, which fixes all three `cargo mutants` call sites in ci.yml from one place rather than editing each. THE CONFIG PATH IS THE WHOLE TRAP. cargo-mutants 27.0.0 reads `.cargo/mutants.toml` and SILENTLY IGNORES a root-level `mutants.toml`; the first version of this fix put the file at the root, the accompanying test passed, and `cargo mutants -p rivet-core --list` still enumerated 236 mutants in proofs.rs. A test that asserts a config exists proves nothing about whether the tool reads it, so the fix was verified by LISTING MUTANTS before and after: 236 to 0 in proofs.rs, total still 5610, and rivet-core/src/lib.rs retaining its 61 — that last number being the check that the exclusion did not quietly drop live code. THE ORACLE HAD TO BE NARROWED TWICE. Scanning for files that CONTAIN the string `#[cfg(kani)]` matches three files, and two are false positives whose exclusion would be actively harmful: rivet-core/src/lib.rs merely DECLARES the module and is ordinary code that must stay in scope, and rivet-cli/src/docs.rs contains the string inside a documentation topic. The invariant is therefore narrower — a file named by a `#[cfg(kani)] mod X;` declaration — and the test additionally asserts that those two files are NOT excluded, so a future broadening cannot silently remove real code from the gate. Then the exclusion assertion itself was found VACUOUS: it substring-matched the whole config file and so matched the rationale comment naming proofs.rs, not the exclude_globs entry, and deleting the real exclusion left the test green. Found because the negative control failed to redden. It now parses the exclude_globs array. RESIDUAL, STATED RATHER THAN CLOSED: this requirement warned that proofs.rs must stay visible to SOMETHING, because a struct field added without updating a cfg(kani) literal once broke the proofs and the signal was written off as flake six times. After this change the only thing compiling proofs.rs is `cargo kani`, and that job fails at its install action roughly half the time (#839 — measured 5 success, 6 failure, 11 absent over 22 CI runs on main, every failure at model-checking/kani-github-action@v1 with `cargo kani` skipped). A cheap type-check guard was attempted and does not exist: `RUSTFLAGS='--cfg kani' cargo check -p rivet-core` fails with unresolved import `kani`, because the kani crate is injected by the Kani compiler rather than resolvable from the registry. So the drift guard is genuinely weaker after this change, not merely relocated, and closing #839's install flakiness is what would restore it."
    release: v0.37.0
    tags: [ci, weak-green, mutation-testing]
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-09-05T00:00:00Z
  - id: REQ-325
    type: requirement
    title: "classify_stall reports a dependency-blocked job as a capacity stall, naming the wrong cause"
    status: verified
    description: "Found on 2026-09-06 while watching the v0.36.0 release run, in the code REQ-317 shipped one day earlier. `create-release` sat queued behind its `needs` while `build-compliance` was still running, and `classify_stall` returned `hosted-starved` — because every queued job carried the `ubuntu-latest` label and the classifier reasons only about labels and runner capacity. The fleet was almost entirely idle at the time: online=12, busy=1, with spare capacity under every label. Nothing was starved; the job was simply waiting its turn. This is the same defect REQ-317 exists to fix, in its own fix: a diagnostic that confidently names a cause it cannot actually observe. It is reachable in production rather than theoretical, because the probe fires on a run queued longer than thirty minutes and this release's builds legitimately take that long — a slow release would have auto-filed an issue blaming GitHub-hosted capacity for a dependency wait. The fixture set had no dependency-blocked case, which is why it passed. Fix: a queued job whose `needs` are not all complete is not a stall at all and must be excluded before any capacity reasoning runs; the GitHub jobs API does not expose `needs`, so the workflow definition has to be read, or the classifier must take the set of still-incomplete job names and treat a queued job as blocked when the run has any incomplete job that is not itself queued for capacity. Prefer reading the workflow. Add `dependency-blocked` as an outcome so the distinction is visible rather than folded into `capacity-available`. IMPLEMENTED 2026-09-09. `classify_stall` gains a fourth outcome, `dependency-blocked`, and two optional arguments — the run's jobs with their status, and the workflow's needs graph. Jobs whose needs are not all complete are removed BEFORE any capacity reasoning; if that empties the queue the answer is dependency-blocked. With two arguments the function answers exactly as before, so a caller that cannot supply the graph gets the old answer rather than a silent reclassification. The needs graph is read from the workflow definition as the requirement preferred, by tools/ci-diagnose/workflow-needs.py, because the jobs API does not expose needs. TWO SUBTLETIES FOUND WHILE BUILDING IT, both of which would have made the fix inert rather than wrong. FIRST, `needs:` names job KEYS while the jobs API reports DISPLAY names, so a naive graph compares two different namespaces and matches nothing — every dependency wait would have continued to read as a capacity stall while appearing fixed. The extractor now resolves needs through the key-to-name map. SECOND, a matrix job is declared once as `Build ${{ matrix.target }}` and reported under many concrete names, so its template matches nothing; templated names are emitted as a prefix glob and matched by prefix. Both directions are negative-controlled: without the new branch the dependency case reports hosted-starved, and with the branch made unconditional the needs-complete case wrongly reports dependency-blocked. A need matching NO job is treated as complete, so an unknown or stale name can only cost the dependency-blocked answer and never invent one — verified by its own case. The liveness workflow consumes the new outcome by NOT filing an issue for it, emitting a notice instead, which is the behaviour change that matters: the incident that prompted this would have auto-filed an issue blaming GitHub-hosted capacity for a dependency wait. Validated end to end against a live run, where the extractor returned CI Gate's needs as display names matching what the jobs API reports."
    release: v0.37.0
    tags: [ci, weak-green, self-inflicted]
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-09-06T00:00:00Z
  - id: REQ-326
    type: requirement
    title: "coverage --tests attributed every marker to the PRECEDING function, so each evidence line named the wrong test (#892, #787)"
    status: verified
    description: "Reported twice, from meld (#892) and earlier as #787. `find_enclosing_function` only ever scanned BACKWARDS from the marker line, so a marker written in the conventional place — on the line above the `#[test]` it annotates — was attributed to the function before it. Reproduced in three lines: a marker above `the_test_that_actually_verifies_it` reported `first_unrelated_test`. The damage is narrow and bad. The requirement mapping stays correct, so `rivet verify` still advances and coverage percentages are unaffected; what is wrong is the EVIDENCE LINE, which names a different test than the one that verifies the requirement. For a reader auditing the right-hand side of the V that line is the entire product — following it leads to a test that does not test the thing. Fixed by walking FORWARD first, but only across lines that may legitimately separate a marker from the item it annotates: attributes, comments and blank lines. The bound is what makes it correct rather than merely different — a marker INSIDE a function body has real code on the next line, so the walk stops and the existing backward scan returns the enclosing function, which is the shell convention REQ-319 relies on. Negative-controlled both ways at --lib scope: removing the forward walk reddens one test (the reported bug returns) and making the walk unbounded reddens two (the in-body case and the shell case), so the boundedness is load-bearing rather than decorative. Found while fixing it: the insertion of these tests spliced a doc comment into the middle of REQ-319 own doc comment, orphaning its marker onto the wrong function. cargo test and clippy both passed — doc comments concatenate harmlessly — and only `rivet coverage --tests` caught it, by reporting REQ-319 against the wrong test. The tool found a defect the compiler could not see."
    release: v0.37.0
