      model: claude-opus-4-8
      timestamp: 2026-08-19T00:00:00Z

  - id: REQ-296
    type: requirement
    title: "Mutation-safety property harness for the YAML write path — one invariant, four data-loss bugs, no property test (#809)"
    status: proposed
    description: "Every mutating command writes through `rivet-core/src/yaml_edit.rs`, a ~2000-line line-oriented editor built on indentation heuristics. Hand-rolled deliberately (it preserves comments, key order and human formatting, which a serde round-trip destroys in version-controlled files) — but it has produced four data-loss bugs, each found by a user rather than a test: #573 flow-style `fields:` maps, #618/#625 block-list orphaning, REQ-287 unquoted tag emission, and #806 multi-line values in `fields:`. All four violate one invariant: replacing a key must consume that key's ENTIRE on-disk extent and change nothing else. #806 is the proof that examples are not enough — `set_field` upholds the invariant via `field_block_end` + `splice` and its comment names the history, while the custom-fields loop 700 lines below did a single-line assignment and had no multi-line-value test at all. The property must be stated as EXACT equality: parse before, mutate, parse after must succeed, every path except the target must be byte-identical, and the target must equal the intended value. 'It parses' is only a precondition — #806 mode 1 produced a perfectly parseable file whose value silently became 'short first body line second body line', so a parse-only assertion would green on the data loss. Corpus axis is scalar STYLE, not field name: plain, single/double-quoted, folded, literal, |- / |+ / |2, empty value, flow map, flow seq, block seq, nested block map, body containing colon / hash / leading dash, internal blank line, anchors, CRLF, tabs, last-field-of-last-artifact, unicode. Mutations: every --set-* flag, --add-tag/--remove-tag, --where bulk, plus `rivet add` and the MCP/batch writers. Lands as a proptest in rivet-core (fast, shrinks, runs in CI) plus a thin CLI-level test for flag wiring. Deliberately does NOT include migrating the writer to the in-tree rowan-yaml CST: that is an architecture decision with real cost for the maintainer to weigh, and the harness is the right thing to have in place BEFORE such a migration so it can prove behavior is preserved."
    release: backlog
    provenance:
      created-by: ai-assisted
      model: claude-opus-4-8
      timestamp: 2026-08-19T00:00:00Z

  - id: REQ-297
    type: requirement
    title: "rivet context needs a stdout mode so a session hook can consume it without mutating the working tree (#811)"
    status: verified
    description: "`rivet context` exists to give an agent the project's real state instead of hand-parsing artifact YAML, but it takes no arguments beyond --help and unconditionally writes `.rivet/agent-context.md`. A SessionStart hook that only wants to READ state therefore causes a working-tree mutation, and `.rivet/` is gitignored in rivet's own repo but not in consumers (checked varve and relay) — so the side effect is invisible to us and visible to everyone else, with an easy accidental commit behind it. Reporter dropped the command from their hook and rebuilt a 25-line summary from validate/stats/coverage, reimplementing a slice of a command that already exists. Deliver: (a) `--stdout` so the document can be consumed without writing; (b) `--format json` alongside it so hooks select fields instead of regexing Markdown; (c) `--brief` — at 282 lines / 17.7 KB the document is large for per-session injection and roughly 60 percent of it is the stable schema/link-type reference, which belongs behind `rivet docs` on demand; (d) `rivet init` adds `.rivet/` to .gitignore, since whether the cache directory is ignored should not depend on the repo. Upstream context: pulseengine.eu#166 found the agent skills named 8 of rivet's 52 commands and never pointed at docs/quickstart/context, which is why agents kept hand-parsing YAML — a capability nothing points at is close to one that does not exist."
