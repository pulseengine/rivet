  - id: REQ-299
    type: requirement
    title: "Per-PR mutation gate covers rivet-cli only — rivet-core changes get zero coverage while a mutation check reports on them (#816)"
    status: implemented
    description: "`mutants-core` is schedule-only (3677 mutants, moved off the every-push path to stop saturating runners); `mutants-cli` is the per-PR hard gate. So a PR changing rivet-core gets no mutation coverage at all, while the checks list shows a mutation job reporting on it. Made concrete by PR #810, a P0 data-loss fix in `rivet-core/src/yaml_edit.rs`: the rivet-core job was SKIPPED and the rivet-cli job FAILED with nothing in scope. A reviewer reading the checks would conclude mutation testing covered that PR; it did not. The original reasoning no longer holds: full-scope cost is what made mutants-core schedule-only, but `--in-diff` (REQ-288) made per-push cost proportional to CHANGED LINES rather than crate size, which is exactly what made mutants-cli affordable. Add a diff-scoped `mutants-core-pr` job mirroring mutants-cli — same fetch-depth 0, same fail-closed evidence check, same exit-status handling — and keep the schedule-only full-scope run for the long tail. Decide hard-gate vs advisory explicitly rather than by default: rivet-core has known-surviving mutants at full scope, but diff-scoped only asks whether the code this PR changed is covered, which is a fair bar; suggest advisory for one or two releases, then promote once the noise level is known. Particularly pointed because the current campaign (#806, #809) is specifically about mutation-path correctness in rivet-core — the code a mutation gate should be interrogating is the code it cannot see."
