    title: "assess Google's Open Knowledge Format — adopt, interoperate, or acknowledge (#549)"
    status: draft
    description: "Triage of an untracked research request open since 2026-06-19 (#549). The maintainer's question: whether Google's Open Knowledge Format is a format rivet could use, or could converge on, or whether it is not structured enough for the purpose. SCOPE: an assessment producing a recorded decision among adopt, interoperate, and acknowledge — the same three-way outcome used for other external-format questions. The comparison must be against what rivet's schemas actually express — typed link predicates with cardinality and target-type constraints, traceability rules with severities, and the base-field mechanism — rather than against a description of them, because a format that looks adjacent at the level of README prose may be unable to carry the constraints that make a trace checkable. Prior art in this repository is the reqif and Polarion fidelity analyses under docs/design, which state field by field what survives a round trip and what does not; that is the shape this should take. Deliberately NOT scoped to v0.38.0, for the same reason as the other research triage: a decision is not a verifiable release artifact, and scoping it to the cutting release would make the release wait on a judgement. Assigned to v0.39.0."
