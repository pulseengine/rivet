  - id: REQ-346
    type: requirement
    title: "serde_yaml is unmaintained and reads every artifact in every PulseEngine repo — the parser under the assessor evidence chain has no upstream (#930)"
    status: proposed
    description: "Raised from varve (#930) and confirmed. Cargo.lock resolves serde_yaml 0.9 to 0.9.34+deprecated, last published 2024-03-25, archived upstream. THE EXPOSURE IS TOTAL, NOT PARTIAL. rivet.yaml declares artifacts, safety/stpa-sec and safety/tool-qualification as format generic-yaml; that format is served by GenericYamlAdapter at lib.rs:329, whose parse is `serde_yaml::from_str` at formats/generic.rs:191. So serde_yaml reads every artifact, which is exactly what the report said. AN EARLIER VERSION OF THIS REQUIREMENT CLAIMED OTHERWISE AND WAS WRONG, and the failure mode is worth recording because it is the one this project keeps finding in its own gates. rivet does contain yaml_cst.rs, a rowan-based lossless parser of 1419 lines, and yaml_hir.rs which extracts artifacts from it. Seeing those modules and finding extract_schema_driven called in lib.rs, I concluded that was the artifact load path — without checking which adapter the CONFIGURED sources actually use. extract_schema_driven is reached from import_with_schema, a separate route the generic-yaml sources do not take. The reproduction I ran to demonstrate a parser divergence PRINTED the answer, `[WARN rivet_core::formats::generic]`, naming the module, and I read it as confirmation because the conclusion was already formed. Evidence in hand, read for agreement rather than for refutation. THE DIVERGENCE IS REAL AND NOW HAS A SIMPLER EXPLANATION. A spec-valid document with an anchor and a merge key resolves in PyYAML to two complete artifacts and is rejected by rivet with `missing field type at line 7`. serde_yaml does not implement merge keys, and serde_yaml is what reads the file. rivet fails LOUDLY here — a warning, an explicit artifacts-are-NOT-loaded line, and validate exiting FAIL — so this is not the silent case, but two tools do disagree about a valid document and the message blames the author rather than naming the limitation. That gap will never be fixed where it lives. WHAT OWNING IT WOULD MEAN, given the maintainer prefers taking this on-side rather than depending outside. The base is genuine: 1419 lines and 34 tests in yaml_cst.rs, 2564 lines and 36 tests in yaml_hir.rs, 2514 lines and 49 tests in yaml_edit.rs. What is missing is not a parser but a serde Deserializer over that CST, after which every derive(Deserialize) keeps working while the read path becomes rivet own. The usual argument against hand-rolling a YAML parser is sound for general-purpose parsers; rivet parses a constrained artifact format and already REFUSES what it does not handle, emitting Error nodes for anchors, aliases, tags, flow mappings, complex keys, multi-document streams and merge keys. A subset parser that enforces its subset is a different risk class from one that guesses. But note the scope correction: because serde_yaml is on the whole artifact read path rather than only on field values, this is a larger change than swapping some scalar deserialization, and GenericYamlAdapter is the first thing that has to move. SAFETY MECHANISM, which should gate removal rather than follow it: the repository holds 706 artifacts plus schema and config documents. Parse every one through both paths and assert structural equality before serde_yaml is dropped. A migration to any other external crate would need the same corpus, so the cost is not specific to owning it. NOT DECIDED HERE, and cross-repo: whether the shared org crate is the artifact model rather than the parser. PRECONDITION MEASURED 2026-09-11 (REQ-348's differential gate). The safety mechanism this requirement asks for now exists and it has already found the blocker. yaml_cst has a FlowSequence node and no FlowMapping node, so a flow-mapped value is dropped with NO parse error while the surrounding artifact survives. On this repository's own corpus that is 18 artifacts whose provenance the rowan path does not see — serde reads provenance on 205 of the 321 artifacts in requirements.yaml, rowan on 195, and the 10-artifact gap is exactly that file's flow-style share. So migrating GenericYamlAdapter onto the CST today would silently lose live data here, not merely risk it on a shape the corpus happens not to use. FlowMapping support in yaml_cst is a precondition of this migration, not a follow-up to it, and the gate will redden the moment it lands so the record has to be updated rather than re-baselined. Carry with the fix: rivet-core/tests/differential_yaml.rs generates only block-style id/type/title/status and compares only those four fields, so it agrees by construction and did not find this. Widen its generator to flow mappings, links, tags and provenance as part of landing FlowMapping — it can go green only once the gap is closed, which makes it the fix's oracle rather than a separate chore. PRECONDITION DISCHARGED 2026-09-11. yaml_cst now parses flow mappings and the corpus divergence is gone: 26 comparable files, 26 agree, 0 differ, where it was 24 agree and 2 differ on 18 artifacts. THE IMPLEMENTATION IS DELIBERATELY SMALL. `{` and `}` become tokens exactly as `[` and `]` already were, and parse_flow_mapping emits a **Mapping** node — the same kind a block mapping produces, with MappingEntry, Key and Value children — rather than a distinct FlowMapping kind. That choice is the point: every HIR walker, extract_provenance and the generic and schema-driven extractors alike, already looks for Mapping, so all of them gained flow support without knowing flow exists. A separate kind would have meant each consumer that forgot to handle it silently reads nothing, which is the exact failure being fixed. The tree stays lossless — braces and commas are kept as tokens — so the style is recoverable and the text round-trips. Flow entry values terminate at a comma or closing brace rather than at end of line, which is the whole difference from the block form, and each is wrapped in its own Value node so scalar_text's sibling collection stops at the entry boundary instead of swallowing the rest of the mapping into the first value. Flow mappings nest in flow mappings, in flow sequences, and as sequence items. TWO THINGS THE NEGATIVE CONTROLS FOUND, both of which would otherwise have shipped. First, removing `{` from lex_plain_scalar's break bytes was caught by no test. The rule is that a surviving mutant means the assertion is missing — but probing both lexer variants side by side showed the opposite: the break byte was WRONG. `a{b: c}` is a block mapping whose key contains a brace, and breaking on `{` made it lex as `a`, `{`, `b`, `:` and emit two spurious diagnostics, expected ':' after mapping key and expected mapping key found Some(LBrace). Removing it fixes that and shrinks the lexer change to two token arms. A test written to cover the mutant would have frozen a bug in place. Second, the same probe showed a flow mapping inside a flow SEQUENCE, `[a, {b: c}, d]`, producing three unexpected-token-in-flow-sequence errors; parse_flow_sequence already recursed for a nested `[` and `{` fell to the error arm. Both are now fixed and each is caught by exactly the test that claims it. EVIDENCE. The oracle was written first and watched go red: the proptest generator in differential_yaml.rs was widened to emit provenance in both flow and block style and to compare it, and proptest shrank the failure to `provenance: {created-by: ai-assisted, model: A}` — the corpus shape exactly. It passes now. Eleven unit tests live IN yaml_cst.rs rather than in tests/, because the mutation gate runs --lib and cannot see integration tests, and five deliberate mutations of the new code each redden only the test that names them. Workspace 2389 passing, cli_commands 216, fmt, clippy --all-targets -D warnings on 1.97.0, validate, docs check and yamllint all zero. Scope note, since it narrows the work: the two paths agree on everything else. 26 comparable files, 24 fully agree, and the only divergence class across 715 serde-read and 1062 rowan-read artifacts is provenance."
    release: v0.38.0
    tags: [yaml, dependencies, supply-chain, architecture]
    provenance:
      created-by: ai-assisted
      model: claude-opus-5
      timestamp: 2026-09-10T00:00:00Z
  - id: REQ-347
    type: requirement
    title: "nothing automated can flag serde_yaml: it has no unmaintained advisory, CI never runs the advisories check, and cargo-audit is not in CI Gate (#930)"
    status: verified
    description: "Written after testing the assumption rather than asserting it, which falsified both #930 recommendation 2 and this requirement as first drafted. THE CLAIM WAS that deny.toml lacks an `unmaintained` policy and that adding one would have surfaced serde_yaml. Both halves are wrong. cargo-deny 0.20.2 treats unmaintained as an ERROR BY DEFAULT — running `cargo deny check advisories` on the current tree exits 1 with three unmaintained errors, on bitmaps 2.1.0, im 15.1.0 and sized-chunks 0.6.5, none of which appear in the thirteen-entry ignore list. And serde_yaml is NOT among them, because THERE IS NO UNMAINTAINED ADVISORY FOR IT: the only advisory-db entry is RUSTSEC-2018-0005, a crash patched in 0.8.4 and irrelevant to 0.9.34. So no setting of any kind would have caught serde_yaml. Its deprecation is signalled only by the version string 0.9.34+deprecated and by the upstream repository being archived — neither of which is a machine-checkable fact any gate consumes. That is worth stating plainly, because the instinct on reading #930 is to reach for a configuration change, and the configuration change does not exist. WHAT IS ACTUALLY BROKEN, found while checking the above, is adjacent and larger. The Cargo Deny job runs `cargo deny check bans licenses sources` — the advisories check is NOT RUN IN CI AT ALL. The [advisories] section of deny.toml, including all thirteen carefully-reasoned RUSTSEC ignores, is therefore dead configuration for that job: it is never exercised, so the reasoning recorded in those comments protects nothing. The job name, Cargo Deny (licenses, bans, sources), is honest about this, which is why it went unnoticed. Advisory checking does exist as a separate Security Audit (RustSec) job running cargo-audit, but that job is NOT among CI Gate the eleven needs, so it cannot block a merge. The net position is that a tree which fails `cargo deny check advisories` locally merges cleanly. FIX, in order: run the advisories check in CI; expect it to fail immediately on the three unmaintained crates above and treat that as the point rather than an obstacle, since the existing ignore list shows the project already has a mechanism for accepting a known advisory with a written reason; then decide whether the check gates CI Gate or stays advisory, which is a policy question rather than a technical one. Negative control for whoever implements it: with the advisories check wired in and the three crates not yet ignored, CI must FAIL on the current tree. If it passes, the check is not running and the gate asserts nothing — which is precisely the state being repaired. NOTE FOR REQ-346: none of this changes the serde_yaml decision, it only removes one argument from it. The case for owning the deserialization path rests on the measured merge-key divergence and on the crate being archived, not on any gate having flagged it — because none can. IMPLEMENTED 2026-09-10. The deny job now runs `cargo deny check advisories bans licenses sources` and is renamed to Cargo Deny (advisories, licenses, bans, sources), because a job whose name omits what it checks is the same defect one level up. It is in CI Gate's needs, so advisory checking is now BLOCKING rather than absent. THE VERSION SKEW WAS THE REAL RISK AND IS HANDLED. CI pinned cargo-deny 0.16.4 while the policy was verified on 0.20.2, which treats unmaintained as an ERROR by default. Adding the advisories check while pinning a version whose behaviour was never tested is exactly how a gate passes vacuously, so CI is bumped to 0.20.2 — the version the behaviour was measured on. ROOT CAUSE OF THE THREE FAILURES IS A SINGLE CHAIN: gluesql-core to im to sized-chunks to bitmaps, all unmaintained, reached through the default-on sql feature that ships `rivet sql`. The minimal --no-default-features build of REQ-202 excludes the whole chain. Accepted rather than fixed, with the reason written into deny.toml: gluesql has not moved off im, and swapping the SQL engine is far larger than the exposure warrants. TWO THINGS FOUND WHILE DOING IT. First, the RUSTSEC ids were GUESSED on the first attempt and were wrong — cargo-deny answered with advisory-not-encountered warnings and the three errors persisted, so the ids were read from the tool's own output instead: RUSTSEC-2026-0247 for bitmaps, 0248 for im, 0251 for sized-chunks. Guessing an identifier into an ignore list produces an entry that silences nothing while appearing to, which is the failure this requirement is about. Second, and larger: TWELVE OF THE SIXTEEN EXISTING IGNORES WERE DEAD. RUSTSEC-2026-0085 through 0096 and 0103 all reported advisory-not-encountered, meaning they match nothing in the tree — resolved by the wasmtime 44 to 45 bump and by salsa moving off the affected thin-vec. Their rationale comments still said things like upgrade to wasmtime >=43 when available and remove when salsa >= 0.27 lands, instructions for work already done. So the section was dead configuration in a second sense beyond not being run: three quarters of it recorded history rather than decisions. All twelve removed, leaving four live entries each with a current reason. VERIFIED: cargo deny check advisories exits 0 with zero errors and zero advisory-not-encountered warnings; the full four-check command exits 0 reporting advisories ok, bans ok, licenses ok, sources ok. Negative-controlled by removing the im ignore, which reddens with exit 1 and the unmaintained error, and restoring it, which returns exit 0."
    release: v0.38.0
    tags: [supply-chain, ci, weak-green]
