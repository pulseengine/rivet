  - id: REQ-350
    type: requirement
    title: "the rowan fork now has a defined expiry: upstream is rewriting and the new code should pass Miri — watch for it rather than plan around a permanent fork"
    status: proposed
    description: "PRIMARY EVIDENCE, from the rowan maintainer closing our own pull request. rust-analyzer/rowan#211, opened by avrabe and titled fix: address Miri UB in Arc, ThinArc, green types, and cursor, was CLOSED on 2026-09-07 with: We are about to rewrite rowan anyway and the new code should pass Miri (and is also a change of pretty much all code). Thanks for your interest in contributing. Three things follow, and together they change the posture from maintaining a permanent fork to watching for a defined expiry. FIRST, THE UB IS REAL AND REPRODUCIBLE, so the fork earns its keep today rather than being defensive. phall1 independently confirmed it on the same PR against a NodeCache rehash reproduction from cyrs: GreenTokenData::text hits Stacked Borrows UB at green/token.rs:104 because GreenToken::deref hands out a narrow reference whose retag covers only sizeof ReprThin, so the from_raw_parts on the slice tail trips a retag error. Two deterministic CI failures were linked as evidence. phall1 also recorded a SEPARATE pre-existing hit on that branch — GreenNodeData::to_owned via from_raw and ThinArc::clone, where the narrow reference does not cover the count field — which is not addressed by the token DST fix. SECOND, UPSTREAMING IS CLOSED AS A PATH. #210, #211 and #212 are all closed, and the stated reason is not disagreement about the fix but that the rewrite changes pretty much all code, so a patch against the current implementation is wasted effort by construction. That is a better reason than the previous reading of will not take a patch and should be recorded as such. THIRD, THE FORK HAS AN EXPIRY CONDITION rather than being permanent: the new code should pass Miri. The Cargo.toml comment currently describes the fork as permanent until that rewrite lands, which was accurate when written and is now more precisely dated. WHAT THIS MEANS FOR RIVET, measured locally. Both Miri jobs — Miri (safety surface), which runs exactly the yaml_cst and sexpr tests, and Miri (full, nightly) — are ADVISORY: neither appears in CI Gate's eleven needs. rivet's own unsafe surface is three blocks, all the same assert-guarded transmute in a rowan::Language kind_from_raw impl, in yaml_cst.rs, sexpr.rs and bazel.rs, which is the standard rowan integration pattern. So the Stacked Borrows exposure is entirely inside the dependency, and the fork buys a green advisory signal over 46 tests rather than a merge gate or a correctness property verified nowhere else. Dropping it today would turn an advisory job red while changing nothing about what can ship. THE ACTION IS TO WATCH, NOT TO ACT. No date was given, and about to is not a schedule, so removing the fork now would trade a working soundness position for an unbounded wait. Concretely: track rust-analyzer/rowan for the rewrite landing and for a release carrying it; when one appears, re-run the two Miri jobs against unforked upstream and compare, since the maintainer said the new code SHOULD pass Miri and should is not a verified claim about our surface; and only then retire the fork. That test is cheap and is the same differential shape used elsewhere in this project — run both, compare, do not assume. DEPENDENCY NOTE: REQ-252 schedules publishing the fork to crates.io so varve can consume it without a git dependency. If the rewrite lands first, that publication may become unnecessary; if it does not, the publication stands. Neither blocks the other, but whoever picks up REQ-252 should check this requirement first rather than publishing a fork that is about to be obsolete. RESEARCH 2026-09-10, and four findings change the position. FIRST, TWO OF OUR OWN NOTES WERE FACTUALLY WRONG. There is no Future Rowan GSoC project: GSoC 2026's rust-analyzer project was Migrating rust-analyzer assists to SyntaxEditor, which is the stated PREREQUISITE for the rewrite and closed completed on 2026-06-20 as rust-analyzer#18285. rust-analyzer#15710, the rewrite issue itself, has been open and untouched since 2024-09-02. Cargo.toml has been corrected. SECOND, THE FORK IS TWO LINES BEHIND AND COVERS LESS THAN ASSUMED. Upstream published rowan 0.17.0 on 2026-08-02, which rust-analyzer master consumes UNFORKED with its patch override commented out; our fork is based on 0.16.2. Worse, this repository's lock file contains TWO rowans — rivet-core and rivet-cli on the forked 0.16.2, and spar 0.10.0 pulling UNFORKED rowan 0.16.1 from the registry through spar-syntax, spar-parser, spar-hir-def, spar-annex and spar-base-db, all reachable via the default-on aadl feature. The Miri jobs run only rivet-core's yaml_cst and sexpr tests, so spar's rowan usage is never Miri-tested. The soundness position therefore covers rivet's CST surface and not spar's, in the same binary, which is materially less than the Cargo.toml comment implied. THIRD, THE STATED REASON FOR CLOSING OUR PULL REQUESTS DOES NOT HOLD ON 0.17.0. Closing #212 the maintainer wrote that rowan should pass Tree Borrows and that the Stacked Borrows rule in question is unlikely to reach the final aliasing model. Running Miri against rowan 0.17.0 fails BOTH models: Stacked Borrows at arc.rs:264, the same header-fattening cast reported in #108 in 2021, and Tree Borrows at arc.rs:164 in Arc::drop reached through cursor::free, the same site as #192. A minimal new_root plus kind plus drop program of about fifteen lines reproduces the Tree Borrows failure. Corroborated independently by dnbln on #192 in 2025 and BenjaminBrienen on #163. CAVEAT, and it matters before anyone acts on this: the nightly used was 2026-04-19, roughly five months stale, and Tree Borrows is itself experimental and moves — re-run on current Miri before citing it upstream. Note also that #217, merged 2026-08-02, removed the mutable syntax API entirely, which makes #163's specific trace unreachable BY API REMOVAL rather than by any soundness fix; the fattening cast and the thin GreenTokenData remain. FOURTH, OUR FORK IS ONE COMMIT BEHIND THE MOST COMPLETE KNOWN BRANCH. phall1/rowan at fix/rowan-miri-complete, head d271e048, is a strict superset of our v3 at 9e7abd11: the same six commits plus one rebuilding in to_owned rather than forging a ThinArc from a narrow reference. That is exactly the fourth failure phall1 flagged on our #211 as a separate fix from #212 and which our own notes do not list. ALTERNATIVE WORTH KNOWING ABOUT: cstree 0.14.0, published 2026-04-22, is the only credible drop-in-shaped replacement — its historical Stacked Borrows violations were fixed in 2022, it runs a dedicated Miri job across three platforms in CI, and it passed both models on a build-and-walk program. Its token text is interned so reading text back needs a Resolver, which is an API-shape change rather than a swap. Nobody gates on rowan's soundness upstream: rowan's own CI has no Miri job, and rust-analyzer's Miri job covers only the intern crate, never the rowan-based syntax crate. ACTIONS THAT FOLLOW, none of them urgent: consider rebasing onto phall1's head to pick up the missing commit; decide whether spar should consume the fork so the tree has one rowan rather than two, which interacts with REQ-252 since publishing would make that possible; and if reopening the conversation upstream is wanted, the fifteen-line Tree Borrows reproduction against 0.17.0 is the strongest available argument, re-run on a current nightly first. DECISIVE TEST RUN 2026-09-10, and it answers the question directly on OUR surface rather than on rowan's internals. An isolated worktree was pinned to crates.io rowan 0.17.0 instead of the fork. FIRST RESULT: rivet-core COMPILES CLEAN against unforked 0.17.0 with no code changes, cargo check exit 0. rivet touches only the immutable core — GreenNodeBuilder, GreenNode, SyntaxNode, SyntaxKind, Language, NodeOrToken, TextRange — and uses none of the mutable API that #217 removed, so the 0.16 to 0.17 break does not reach us. The fork is therefore NOT what keeps this project on 0.16.x. SECOND RESULT, and it settles the posture: the Miri gate FAILS UNDER BOTH ALIASING MODELS against upstream 0.17.0, with exit codes captured directly rather than read from a piped tail. Stacked Borrows exits 1 at rowan-0.17.0/src/arc.rs:264, trying to retag for SharedReadOnly permission where the tag does not exist in the borrow stack — the same header-fattening cast reported upstream as #108 in 2021. Tree Borrows exits 1 at rowan-0.17.0/src/cursor.rs:136, deallocation forbidden — the site of #192. Both are reached through OUR code: yaml_cst::tests::block_scalar_folded calls yaml_cst::parse, which drives parse_root, parse_block_mapping and parse_mapping_entry into rowan's builder. That makes this a real-consumer reproduction rather than a synthetic exercise of rowan's own tests, and it independently confirms the same Stacked Borrows site by a different route. CONSEQUENCES. The fork earns its keep: dropping it today would turn the Miri gate red on our own parser under both models, not merely under the stricter one. The maintainer's stated rationale for closing #212 — that rowan should pass Tree Borrows and the Stacked Borrows rule in question is unlikely to reach the final aliasing model — does not hold for our usage either, now confirmed twice independently. And the reproduction is a stronger upstream artifact than a synthetic one, because it is a downstream parser failing on ordinary construction and traversal, which is what any rowan consumer does. CAVEATS THAT TRAVEL WITH THIS: the toolchain is miri 0.1.0 on nightly 2026-04-19, roughly five months stale, and Tree Borrows is experimental and moves — re-run on a current nightly before citing it upstream. The run covered yaml_cst only; spar's rowan 0.16.1 remains untested under any model, and no decision about our fork changes that, since spar pulls its own unforked copy. REVISED POSTURE: watch, unchanged, but now on measured grounds rather than on the maintainer's assurance. The expiry condition stated earlier stands — when the rewrite ships, re-run exactly this test and compare — and this run establishes the baseline it will be compared against."
