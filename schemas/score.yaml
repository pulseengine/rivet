# ──────────────────────────────────────────────────────────────────────────
# SCORE-specific link types
#
# Link types already defined in common.yaml and reused here:
#   satisfies / satisfied-by
#   implements / implemented-by
#   mitigates / mitigated-by
#   verifies / verified-by
#
# The following are SCORE-specific additions.
# ──────────────────────────────────────────────────────────────────────────
link-types:
  - name: complies
    inverse: complied-by
    description: Source complies with the target (standard, regulation, norm)

  - name: fulfils
    inverse: fulfilled-by
    description: Source fulfils the target (e.g. tool support function fulfils a tool requirement)
    source-types: [tsf, test-verdict]
    target-types: [tool-req, test-spec]

  - name: belongs-to
    inverse: consists-of
    description: Source belongs to / is part of the target (compositional containment)

  - name: uses
    inverse: used-by
    description: Source uses or depends on the target at runtime or build time
    target-types: [comp, mod, logic-arc-int, real-arc-int, feat, tsf, guidance]

  - name: violates
    inverse: violated-by
    description: >
      Source violates the target (failure mode contradicts a requirement
      or violates an architecture element). Eclipse safety analyses
      (`feat_saf_fmea`, `comp_saf_fmea`, `*_saf_dfa`) `:violates:` the
      architecture element whose property the failure breaks — usually
      a dynamic arch view — so target-types must cover the arch layer.
    source-types: [fmea-entry, dfa-entry]
    target-types:
      - comp-req
      - feat-req
      - feat
      - comp
      - feat-arc-sta
      - feat-arc-dyn
      - comp-arc-sta
      - comp-arc-dyn
      - logic-arc-int
      - real-arc-int

  - name: fully-verifies
    inverse: fully-verified-by
    description: Source fully verifies the target (complete verification coverage)
    source-types: [test-spec]
    target-types: [stkh-req, feat-req, comp-req, aou-req]

  - name: partially-verifies
    inverse: partially-verified-by
    description: Source partially verifies the target (incomplete verification coverage)
    source-types: [test-spec]
    target-types: [stkh-req, feat-req, comp-req, aou-req]

  - name: realizes
    inverse: realized-by
    description: Source realizes the target (component realizes a feature or document realizes a workproduct)
    source-types: [comp, doc]
    target-types: [feat, workproduct]

  # ── Eclipse S-CORE additions (schema-deltas, 2026-05) ──────────────────

  - name: is-mitigated-by
    inverse: provides-mitigation-for
    description: Source failure mode is mitigated by the target (FMEA/DFA → requirement/design/unit)
    source-types: [fmea-entry, dfa-entry]
    target-types: [comp-req, feat-req, aou-req, dd-sta, dd-dyn, sw-unit]

  - name: provides
    inverse: provided-by
    description: Source provides the target interface (eclipse `:provides:`)
    source-types: [feat, comp]
    target-types: [logic-arc-int, real-arc-int]

  - name: includes
    inverse: included-by
    description: Source architecture element includes a logical or real interface (eclipse `:includes:`)
    source-types: [feat-arc-sta, comp-arc-sta]
    target-types: [logic-arc-int, real-arc-int]

  - name: covers
    inverse: covered-by
    description: Requirement covers an assumption of use (eclipse `:covers:`)
    source-types: [feat-req, comp-req]
    target-types: [aou-req]

  - name: responsible
    inverse: responsible-for
    description: Workflow is the responsibility of a role (eclipse `:responsible:`)
    source-types: [workflow]
    target-types: [role]

  - name: approved-by
    inverse: approves
    description: Workflow is approved by a role (eclipse `:approved_by:`)
    source-types: [workflow]
    target-types: [role]

  - name: supported-by
    inverse: supports
    description: Workflow is supported by other roles (eclipse `:supported_by:`)
    source-types: [workflow]
    target-types: [role]

  - name: input
    inverse: input-to
    description: Workflow consumes a workproduct as input (eclipse `:input:`)
    source-types: [workflow]
    target-types: [workproduct]

  - name: output
    inverse: output-of
    description: Workflow produces a workproduct as output (eclipse `:output:`)
    source-types: [workflow]
    target-types: [workproduct]

  - name: contains-guidance
    inverse: guidance-of
    description: Workflow contains guidance, templates, or checklists (eclipse `:contains:`)
    source-types: [workflow]
    target-types: [guidance, doc]

  - name: has-document
    inverse: document-of
    description: Workflow has supporting concept / getting-started / tool documents (eclipse `:has:`)
    source-types: [workflow]
    target-types: [doc, guidance]

  - name: fulfils-process-req
    inverse: fulfilled-by-guidance
    description: Guidance fulfils a process / tool requirement (eclipse `:satisfies:` on gd_req → workflow)
    source-types: [guidance]
    target-types: [workflow, tool-req]

# ──────────────────────────────────────────────────────────────────────────
# SCORE traceability rules
#
# These encode the SCORE V-model traceability chain.
# `rivet validate` checks these automatically.
# ──────────────────────────────────────────────────────────────────────────
traceability-rules:

  # ── Requirement chain (top-down) ───────────────────────────────────────

  - name: stkh-req-has-feat-req
    description: Every stakeholder requirement must be satisfied by at least one feature requirement
    source-type: stkh-req
    required-backlink: satisfies
    from-types: [feat-req]
    severity: warning

  - name: feat-req-derives-from-stkh
    description: Every feature requirement should satisfy at least one stakeholder requirement
    source-type: feat-req
    required-link: satisfies
    target-types: [stkh-req]
    severity: warning

  - name: feat-req-has-comp-req
    description: Every feature requirement must be satisfied by at least one component requirement
    source-type: feat-req
    required-backlink: satisfies
    from-types: [comp-req]
    severity: warning

  - name: comp-req-derives-from-feat
    description: Every component requirement should satisfy at least one feature requirement
    source-type: comp-req
    required-link: satisfies
    target-types: [feat-req]
    severity: warning

  # ── Design implementation ──────────────────────────────────────────────

  - name: comp-req-has-design
    description: Every component requirement must be implemented by a static or dynamic design
    source-type: comp-req
    required-backlink: implements
    from-types: [dd-sta, dd-dyn]
    severity: warning

  # ── Architecture realization ───────────────────────────────────────────

  - name: feat-has-comp
    description: Every feature must be realized by at least one component
    source-type: feat
    required-backlink: realizes
    from-types: [comp]
    severity: warning

  - name: comp-realizes-feat
    description: Every component should realize at least one feature
    source-type: comp
    required-link: realizes
    target-types: [feat]
    severity: warning

  # ── Verification coverage ──────────────────────────────────────────────

  - name: test-spec-verifies-req
    description: >
      Every test specification must fully or partially verify at least one
      requirement (stakeholder, feature, component, or assumption of use)
    source-type: test-spec
    required-link: fully-verifies
    target-types: [stkh-req, feat-req, comp-req, aou-req]
    severity: warning

  - name: feat-req-has-verification
    description: Every feature requirement should be verified by at least one test specification
    source-type: feat-req
    required-backlink: fully-verifies
    from-types: [test-spec]
    severity: warning

  - name: comp-req-has-verification
    description: Every component requirement should be verified by at least one test specification
    source-type: comp-req
    required-backlink: fully-verifies
    from-types: [test-spec]
    severity: warning

  # ── Module containment ─────────────────────────────────────────────────

  - name: mod-belongs-to-comp
    description: Every module should belong to at least one component
    source-type: mod
    required-link: belongs-to
    target-types: [comp]
    severity: warning

  # ── Safety analysis ────────────────────────────────────────────────────

  - name: fmea-has-mitigation
    description: Every FMEA entry should have at least one mitigation
    source-type: fmea-entry
    required-link: is-mitigated-by
    target-types: [comp-req, feat-req, aou-req, dd-sta, dd-dyn, sw-unit]
    severity: warning

  - name: dfa-has-mitigation
    description: Every DFA entry should have at least one mitigation
    source-type: dfa-entry
    required-link: is-mitigated-by
    target-types: [comp-req, feat-req, aou-req, dd-sta, dd-dyn, sw-unit]
    severity: warning

  # ── Test verdict chain ─────────────────────────────────────────────────

  - name: verdict-has-exec
    description: Every test verdict must belong to a test execution
    source-type: test-verdict
    required-link: belongs-to
    target-types: [test-exec]
    severity: error

  - name: verdict-fulfils-spec
    description: Every test verdict must fulfil a test specification
    source-type: test-verdict
    required-link: fulfils
    target-types: [test-spec]
    severity: error
