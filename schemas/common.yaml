# Common schema definitions shared across all domain profiles.
#
# This file defines base fields present on every artifact and the common
# link types used for cross-domain traceability.  Domain schemas (STPA,
# ASPICE, …) extend these definitions with domain-specific artifact types
# and link types.
#
# The schemas are both human-readable documentation AND machine-parseable
# rules consumed by `trace validate`.

schema:
  name: common
  version: "0.1.0"
  description: >
    Base field definitions and common link types for lifecycle traceability.
    All domain schemas implicitly extend this schema.

# ──────────────────────────────────────────────────────────────────────────
# Base fields — present on every artifact regardless of type.
# The trace-core model enforces these structurally (they are not in the
# free-form `fields` map but are first-class struct members).
# ──────────────────────────────────────────────────────────────────────────
base-fields:
  - name: id
    type: string
    required: true
    description: Unique identifier for the artifact

  - name: title
    type: string
    required: true
    description: Human-readable title

  - name: description
    type: text
    required: false
    description: Detailed description (supports markdown)

  - name: status
    type: enum
    required: false
    description: Current lifecycle status

  - name: tags
    type: list<string>
    required: false
    description: Arbitrary tags for categorization

  - name: provenance
    type: mapping
    required: false
    description: AI provenance metadata (created-by, model, session-id, timestamp, reviewed-by)

# ──────────────────────────────────────────────────────────────────────────
# Common link types — reusable across all domains.
#
# Each link type defines:
#   name          — predicate name used in YAML files
#   inverse       — auto-computed backlink name
#   description   — what this relationship means
#   source-types  — (optional) restrict which artifact types may originate
#   target-types  — (optional) restrict which artifact types may be targeted
#
# When source/target-types are omitted the link type is unrestricted and
# any artifact type may use it.  Domain schemas may add restrictions.
# ──────────────────────────────────────────────────────────────────────────
link-types:
  - name: traces-to
    inverse: traced-from
    description: General traceability link between any two artifacts

  - name: satisfies
    inverse: satisfied-by
    description: Source satisfies or fulfils the target

  - name: refines
    inverse: refined-by
    description: Source is a refinement or decomposition of the target

  - name: verifies
    inverse: verified-by
    description: Source verifies or validates the target

  - name: implements
    inverse: implemented-by
    description: Source implements the target

  - name: derives-from
    inverse: derived-into
    description: Source is derived from the target

  - name: derives-from-external
    inverse: derived-into-external
    description: >
      Cross-organizational derivation: the source artifact derives from an
      upstream document owned by another organization. The link target is
      a mapping `{org, contract, doc-id, last-synced, sha256, anchor}`
      that names the supplier, the contract, the upstream ID, and a local
      `external-anchor` artifact for graph navigation. See
      docs/design/cross-org-supplier-traceability.md §4.2 and issue #288.

  - name: mitigates
    inverse: mitigated-by
    description: Source mitigates or prevents the target

  - name: allocated-to
    inverse: allocated-from
    description: Source is allocated to the target (e.g. requirement to architecture component)

  - name: constrained-by
    inverse: constrains
    description: Source is constrained by the target

  # ── AI-provenance and tool-qualification links (#127, TCL design §7.2) ──
  - name: defect-against
    inverse: has-defect
    description: >
      An `ai-found-defect` is filed against the artifact it relates to
      (a requirement, design-decision, or any other type). The defect's
      triage state gates whether the target may transition to `released`.
  - name: corrects
    inverse: corrected-by
    description: >
      A commit / artifact corrects a previously-reported `ai-found-defect`.
      Used to trace from the fix back to the defect record.
  - name: produced-by
    inverse: produced
    description: >
      An artifact (or commit) was produced by an `ai-session`. The
      audit-side equivalent of git's `Co-Authored-By` trailer.

# ──────────────────────────────────────────────────────────────────────────
# Cross-organizational / AI-provenance / tool-qualification artifact types.
# See docs/design/cross-org-supplier-traceability.md, docs/design/
# tool-confidence-level.md, and issue #127 for the rationale.
# ──────────────────────────────────────────────────────────────────────────
artifact-types:

  # ── AI session provenance (#127) ────────────────────────────────────
  - name: ai-session
    description: >
      A Claude Code (or other AI assistant) session whose work product
      landed in the repo. Pins the session to a commit so the auditor
      can reconstruct *who/what* authored a change. Each `ai-session`
      is the unit of authorship that AI provenance trailers (created-by,
      model, session-id) ultimately resolve back to.
    fields:
      - name: session-id
        type: string
        required: true
        description: Stable ID from the AI assistant (e.g. Claude Code session UUID).
      - name: session-hash
        type: string
        required: false
        description: >
          SHA-256 of the session transcript file at the time of commit.
          Lets the auditor verify the session log hasn't been tampered with.
      - name: model-id
        type: string
        required: true
        description: 'Model used (e.g. "claude-opus-4-7", "claude-sonnet-4-6").'
      - name: tool-version
        type: string
        required: false
        description: 'AI tool version (e.g. "claude-code-1.0.0").'
      - name: commit-sha
        type: string
        required: false
        description: >
          Git commit SHA that captured this session's work product. May
          be absent before the session commits.
      - name: started-at
        type: string
        required: false
        description: ISO-8601 timestamp.
      - name: ended-at
        type: string
        required: false
        description: ISO-8601 timestamp.
      - name: invoker
        type: string
        required: false
        description: >
          Human operator who ran the session (login or email). When set,
          this field is PERSONAL DATA under DSGVO Art. 4 — the artifact
          should link to a `dpia` artifact (use `derives-from` link
          type) or be classified `lawful-basis: anonymised`. v0.10.0
          ships the schema but does not yet enforce the link at
          validate time (tracked).
      - name: lawful-basis
        type: string
        required: false
        allowed-values:
          - art-6-1-a-consent
          - art-6-1-b-contract
          - art-6-1-c-legal-obligation
          - art-6-1-f-legitimate-interest
          - art-9-2-research
          - anonymised
        description: >
          DSGVO Art. 6(1) (or Art. 9(2) for special categories) lawful
          basis for processing `invoker`. Required when `invoker` is
          set and not classified `anonymised`.
      - name: retention-period
        type: string
        required: false
        description: >
          ISO 8601 duration after which `invoker` must be erased (e.g.
          "P2Y" for 2 years). DSGVO Art. 5(1)(e) — storage limitation.
      - name: erasure-mechanism
        type: string
        required: false
        description: >
          Machine-readable mechanism that performs the erasure when the
          retention period elapses (e.g. `git-replace-author-rewrite`,
          `tombstone-only`, `none`). DSGVO Art. 17.
    link-fields: []

  # ── Data Protection Impact Assessment (DSGVO Art. 35) ───────────────
  - name: dpia
    description: >
      Data Protection Impact Assessment per DSGVO Art. 35. Required
      when a project's AI-provenance workflow systematically processes
      personal data (e.g. `ai-session.invoker`). The artifact captures
      the assessment outcome, the responsible Data Protection Officer
      sign-off, and the categories of personal data processed. Link
      `ai-session` artifacts to one or more `dpia` records via
      `derives-from`.
    fields:
      - name: dpo-sign-off
        type: string
        required: true
        description: >
          DPO sign-off identifier (e.g. internal ticket ID or signed
          document hash). Free-form at the schema level; project
          policy may narrow.
      - name: personal-data-categories
        type: list<string>
        required: true
        description: >
          Categories of personal data processed (e.g. ["login",
          "email", "session-content"]). DSGVO Art. 35(7)(b).
      - name: risk-assessment
        type: string
        required: true
        allowed-values: [low, medium, high]
        description: >
          DSGVO Art. 35(7)(c) — assessment of necessity and
          proportionality.
      - name: mitigation-measures
        type: text
        required: false
        description: DSGVO Art. 35(7)(d) — measures to address risks.
      - name: consultation-date
        type: string
        required: false
        description: >
          ISO-8601 date when the DPO/supervisory authority was
          consulted (DSGVO Art. 35(2), Art. 36 for prior consultation
          when residual risk is high).
    link-fields: []

  # ── AI-found defect (TCL design §6.2, A3) ───────────────────────────
  - name: ai-found-defect
    description: >
      A defect introduced by an AI authoring step that rivet's detection
      machinery (validate, oracles, mutation, proofs, cited-source
      verification) caught. Closes the loop between "AI made an error"
      and "the tool reflected it back" — the operational primitive that
      raises rivet's TD claim (Tool error Detection per ISO 26262-8
      §11.4.5.4) when the upstream author is non-human.
    fields:
      - name: severity
        type: string
        required: true
        allowed-values: [critical, major, minor, info]
        description: Engineering severity at time of triage.
      - name: triage-status
        type: string
        required: true
        allowed-values: [open, accepted, rejected, deduplicated]
        description: >
          Triage state. `open` means awaiting human review; the other
          three are terminal. The `ai-defects-open` oracle gates release
          on this field.
      - name: detected-by
        type: string
        required: true
        description: >
          Rivet machinery that caught it (e.g. `validate`,
          `oracle:cited-source-fresh`, `kani:proof_NN`, `mutation`,
          `docs-check`, `human-review`).
      - name: discovered-at
        type: string
        required: false
        description: ISO-8601 timestamp.
      - name: triaged-at
        type: string
        required: false
        description: ISO-8601 timestamp.
      - name: triaged-by
        type: string
        required: false
        description: Reviewer who triaged the finding.
      - name: notes
        type: text
        required: false
    link-fields: []

  - name: external-anchor
    description: >
      A typed leaf marking the point at which an in-house traceability
      chain hands off to an external supplier or organization. The chain
      is intentionally not followed further — the supplier owns what's
      downstream. Used to keep coverage honest at the organizational
      boundary (3-state coverage: satisfied / external-boundary /
      uncovered) instead of conflating "missing in our store" with
      "delegated to a supplier".
    fields:
      - name: source-of-truth
        type: mapping
        required: true
        description: >
          Who owns it: supplier name, contract reference, doc ID. Free-form
          mapping at the MVP stage; expected keys are `org`, `contract`,
          `doc-id`.
      - name: expected-derived-types
        type: list<string>
        required: true
        description: >
          What we expect the supplier to produce (e.g. ["sw-req",
          "verification"]). This is the *contract*: it tells coverage
          which downstream types count as "the supplier has delivered."
      - name: received-status
        type: string
        required: true
        allowed-values:
          - not-received
          - received-as-reqif
          - received-as-pdf
          - received-as-oslc
          - received-as-polarion-export
          - received-as-arxml
          - received-other
        description: >
          Lifecycle state of the supplier delivery. `not-received` flags
          an open delivery (counted as boundary in coverage but visible
          as outstanding); the `received-as-*` variants stamp what the
          auditor saw.
      - name: contract-reference
        type: string
        required: false
        description: >
          Optional contract / PO / DIA reference for traceability into
          the legal artefact (ISO 26262-8 §5 DIA, ASPICE SUP.10).
    link-fields: []

# ──────────────────────────────────────────────────────────────────────────
# Conditional rules — cross-field validation rules that fire when a
# condition is met and check for additional requirements.
# ──────────────────────────────────────────────────────────────────────────
conditional-rules:
  - name: ai-generated-needs-review
    description: AI-generated artifacts with active/approved status must have a reviewer
    condition:
      field: provenance.created-by
      matches: "^(ai|ai-assisted)$"
    when:
      field: status
      equals: active
    then:
      required-fields: [provenance.reviewed-by]
    severity: warning
