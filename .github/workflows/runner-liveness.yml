name: Runner Liveness

# #509 slice 1 — liveness alert for the self-hosted runner pool.
#
# Every gating CI job runs on `[self-hosted, …]`, so when the pool goes offline
# every gate queues forever with no fallback and no alarm (the multi-day outage
# in #509 was invisible until someone noticed by hand). This workflow is
# GitHub-HOSTED (`ubuntu-latest`), so it keeps firing even when the self-hosted
# pool is down, and turns that silent failure into a durable tracking issue.
#
# Signals (in order of reliability):
#   1. Queued-run age — authoritative. Needs only `actions: read`, works
#      regardless of whether runners are registered at repo or org level, and
#      directly measures the symptom (jobs stuck in `queued`).
#   2. Runner list — best-effort. `GET /repos/{repo}/actions/runners` needs the
#      `administration` permission, which is NOT a grantable `GITHUB_TOKEN`
#      scope, so the default token gets 403 (and an org-level pool returns empty
#      anyway). A failed lookup yields the `runners-unknown` classification: the
#      queued-age alarm still fires, but NO cause is named, because none can be
#      observed without the runner list. Wire a PAT into `GH_TOKEN` if a hard
#      runner count is wanted. The queued-age signal above is the real alarm.
#
#      This paragraph used to claim a failed/empty lookup was "logged and
#      SKIPPED rather than raised as a false alarm". It was not: the code
#      substituted an empty pool, which the classifier read as every runner
#      being down, so EVERY self-hosted stall reported `pool-offline` whatever
#      its cause (#919, REQ-342). Keep this description and the code in step — a
#      comment describing behaviour the code does not have is worse than none.

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes
  workflow_dispatch:

permissions:
  actions: read # list workflow runs (queued-age check — the authoritative signal)
  issues: write # open / update / close the tracking issue
  # NB: listing self-hosted runners needs the `administration` scope, which is
  # not grantable to GITHUB_TOKEN — that check is best-effort and self-skips.

concurrency:
  group: runner-liveness
  cancel-in-progress: false

env:
  QUEUE_THRESHOLD_MINUTES: "30"
  TRACKING_LABEL: "runner-down"
  TRACKING_TITLE: "🚨 CI runner pool liveness alert"

jobs:
  liveness:
    # SELF-HOSTED, deliberately (REQ-343). A probe cannot report a stall of the
    # runner class it runs on, so the choice is which blindness to accept — and
    # the two modes are not equally silent:
    #
    #   * A self-hosted outage is LOUD. #855 moved `CI Gate` and all eleven of
    #     its needs to self-hosted, so an outage blocks every merge and a
    #     maintainer finds out within one pull request.
    #   * Hosted starvation is SILENT. It blocks only advisory jobs and the
    #     release workflows, which are ubuntu-latest only — invisible until a
    #     release is attempted, and then it blocks that.
    #
    # An alarm should watch the mode that does not announce itself. Observed
    # 2026-09-09T22:30Z on the old placement: the probe itself sat queued ten
    # minutes on ubuntu-latest while twelve self-hosted runners were idle
    # (online=12 busy=0), i.e. blind during exactly the condition it exists to
    # report.
    #
    # A `needs`-based fallback cannot express "run on the other class if this
    # one is starved": a starved job stays QUEUED rather than failing, so a
    # dependent job waits on it forever instead of falling through.
    # rivet: verifies REQ-343
    runs-on: [self-hosted, linux, x64, light]
    steps:
      - uses: actions/checkout@v6
      - name: Ensure gh is available
        # `gh` ships preinstalled on GitHub-hosted images but NOT on this
        # fleet — before REQ-343 no self-hosted job in this repository used it,
        # so its presence cannot be assumed. Installed into the runner temp
        # dir: no sudo, no apt, nothing persisted on the host.
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            echo "gh already present: $(gh --version | head -1)"
            exit 0
          fi
          ver=2.63.2
          curl -fsSL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${ver}_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Assert gh is on PATH
        # Mirrors the zola guard in ci.yml. Without this, a failed install
        # leaves every `gh` call erroring and the probe reports nothing — an
        # alarm that is silently dead is worse than one that is merely wrong.
        run: |
          command -v gh >/dev/null 2>&1 || {
            echo "::error::gh is not on PATH — the install step did not take \
          effect, so this probe would report nothing and the alarm would be \
          silently dead"
            exit 1
          }
          gh --version | head -1
      - name: Probe runner pool and queued runs
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          problems=()

          # --- Runner list (best-effort) -------------------------------------
          if runners=$(gh api "repos/$REPO/actions/runners" 2>/dev/null); then
            total=$(jq '.total_count' <<<"$runners")
            online=$(jq '[.runners[]? | select(.status=="online")] | length' <<<"$runners")
            echo "runners: total=$total online=$online"
            if [ "${total:-0}" -gt 0 ] && [ "${online:-0}" -eq 0 ]; then
              problems+=("All ${total} registered runner(s) are offline.")
            fi
          else
            echo "note: could not list repo runners (org-level pool or missing administration:read) — skipping runner check"
          fi

          # --- Queued-run age (authoritative) --------------------------------
          threshold="${QUEUE_THRESHOLD_MINUTES}"
          now=$(date -u +%s)
          queued=$(gh api "repos/$REPO/actions/runs?status=queued&per_page=100" 2>/dev/null || echo '{}')
          oldest_age=0
          oldest_id=""
          # REQ-317 defect 3: `status=queued` returns runs that have since
          # COMPLETED, and #867 reported "queued 177m — runners are not picking
          # up jobs" for a run that was cancelled and was never going to start.
          # Filter on the run's own status, not on the query that produced it.
          while read -r id created; do
            [ -n "$id" ] || continue
            age=$(( (now - $(date -u -d "$created" +%s)) / 60 ))
            if [ "$age" -gt "$oldest_age" ]; then
              oldest_age=$age
              oldest_id=$id
            fi
          done < <(jq -r '.workflow_runs[]? | select(.status != "completed") | "\(.id) \(.created_at)"' <<<"$queued")
          echo "oldest queued run: id=${oldest_id:-none} age=${oldest_age}m (threshold ${threshold}m)"
          if [ "$oldest_age" -gt "$threshold" ]; then
            # REQ-317 defects 1 and 2: a duration alone does not name a cause,
            # and the guidance built on it sent readers to count self-hosted
            # runners even when every queued job was `ubuntu-latest` — capacity
            # the runners API cannot see at any scope. Classify from the LABELS
            # of the still-queued jobs plus PER-LABEL idle counts.
            . tools/ci-diagnose/diagnose.sh
            qjobs=$(gh api "repos/$REPO/actions/runs/${oldest_id}/jobs" --paginate \
                      --jq '[.jobs[] | select(.status == "queued") | {name, labels}]' 2>/dev/null || echo '[]')
            # REQ-342: tell "could not read the runner list" apart from "the
            # pool is empty". They are indistinguishable from the response
            # body, so the EXIT CODE is the only discriminator — and the old
            # `|| echo '{"runners":[]}'` discarded it, reporting `pool-offline`
            # for every self-hosted stall whatever the real cause. #919
            # announced "0 runners online" while the org reported
            # online=12 busy=7 and four `lean-mem` shards were simply queued
            # behind four busy `lean-mem` runners. The lookup needs the
            # `administration` scope, which is NOT grantable to GITHUB_TOKEN,
            # so this fails on every scheduled probe.
            set +e
            runners_raw=$(gh api "orgs/${REPO%%/*}/actions/runners" --paginate 2>/dev/null)
            runners_rc=$?
            set -e
            # Checking the exit code and emptiness is not enough: `gh api` can
            # exit 0 while returning {"message":"Bad credentials"}, which is
            # non-empty, survives a -z test, and yields online=0 — the same
            # false "pool is OFFLINE" by a different route. normalize_runner_fetch
            # also requires the payload to BE a runner list.
            allr=$(normalize_runner_fetch "$runners_rc" "$runners_raw")
            if [ -z "$allr" ]; then
              echo "::notice::runner list unavailable or not a runner list (exit ${runners_rc}); capacity will NOT be assessed"
            fi
            # REQ-325: a job waiting on its `needs` is not stalled, and every
            # capacity answer given about it names a cause we cannot observe.
            # The jobs API does not expose `needs`, so read it from the
            # workflow definition at the checked-out ref. Best-effort: a
            # missing file or parser yields `{}`, and classify_stall then
            # answers exactly as it did before rather than reclassifying.
            alljobs=$(gh api "repos/$REPO/actions/runs/${oldest_id}/jobs" --paginate \
                        --jq '[.jobs[] | {name, status}]' 2>/dev/null || echo '[]')
            wfpath=$(gh api "repos/$REPO/actions/runs/${oldest_id}" --jq '.path' 2>/dev/null || echo '')
            needs=$(python3 tools/ci-diagnose/workflow-needs.py "$wfpath" 2>/dev/null || echo '{}')
            mode=$(classify_stall "$allr" "$qjobs" "$alljobs" "$needs")
            echo "stall mode: $mode"
            labels=$(jq -r '[.[] | "\(.name) [\(.labels | join(","))]"] | join("; ")' <<<"$qjobs")
            case "$mode" in
              runners-unknown)
                # Still an alarm — the queued-age symptom is authoritative and
                # is what this probe exists to measure — but it names NO cause,
                # because none can be observed without the runner list.
                problems+=("Run ${oldest_id} queued ${oldest_age}m. The runner list could NOT be read (it needs the \`administration\` scope, which is not grantable to GITHUB_TOKEN), so capacity was NOT assessed and no cause is claimed here. Diagnose by hand with the org-scope query below. Queued: ${labels}") ;;
              dependency-blocked)
                # Deliberately NOT appended to `problems`: this is not a
                # stall. Every queued job is waiting on a `needs` that has
                # not finished. Filing an issue here is what REQ-325 exists
                # to stop — on 2026-09-06 this exact shape was reported as
                # GitHub-hosted starvation while the fleet sat at online=12,
                # busy=1.
                echo "::notice::Run ${oldest_id} queued ${oldest_age}m waiting on job dependencies, not capacity. Queued: ${labels}" ;;
              hosted-starved)
                problems+=("Run ${oldest_id} queued ${oldest_age}m — GITHUB-HOSTED starvation. Every queued job is \`ubuntu-latest\`; the self-hosted pool is irrelevant here and hosted capacity appears in the runners API at NO scope. Queued: ${labels}") ;;
              pool-offline)
                problems+=("Run ${oldest_id} queued ${oldest_age}m — the self-hosted pool is OFFLINE (0 runners online). Queued: ${labels}") ;;
              label-saturated)
                idle=$(jq -r '[.runners[] | select(.status=="online" and .busy==false) | [.labels[].name] | join(",")] | group_by(.) | map("\(length)x \(.[0])") | join("; ")' <<<"$allr")
                problems+=("Run ${oldest_id} queued ${oldest_age}m — no IDLE runner carries the labels these jobs need. A global online/busy count does not show this. Queued: ${labels} | idle by label: ${idle:-none}") ;;
              capacity-available)
                problems+=("Run ${oldest_id} queued ${oldest_age}m although capable runners are idle — scheduling delay or a job-level dependency, NOT a capacity problem. Queued: ${labels}") ;;
              *)
                problems+=("Run ${oldest_id} queued ${oldest_age}m with no queued jobs left — likely already resolved.") ;;
            esac
          fi

          # --- Result --------------------------------------------------------
          if [ ${#problems[@]} -gt 0 ]; then
            {
              echo "status=down"
              echo "summary<<SUMEOF"
              printf -- '- %s\n' "${problems[@]}"
              echo "SUMEOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "status=up" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update tracking issue
        if: steps.probe.outputs.status == 'down'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SUMMARY: ${{ steps.probe.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          stamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          body=$(cat <<EOF
          <!-- runner-liveness-tracker -->
          The scheduled runner-liveness probe detected a problem at ${stamp}:

          ${SUMMARY}

          This issue auto-updates on each probe and auto-closes when the pool recovers.
          Diagnose (the classification above already did this):
          \`\`\`bash
          # runners are registered at the ORG. Repo scope returns 0 on a
          # perfectly healthy pool and can never say otherwise — the hint this
          # alert used to print was itself the trap (REQ-317).
          gh api orgs/${REPO%%/*}/actions/runners --paginate \\
            --jq '[.runners[]|select(.status=="online" and .busy==false)|[.labels[].name]|join(",")]|group_by(.)|map("\(length)x \(.[0])")'
          # ... and compare against the LABELS of what is still queued:
          gh api repos/${REPO}/actions/runs/RUN_ID/jobs \\
            --jq '.jobs[]|select(.status=="queued")|"\(.name) [\(.labels|join(","))]"'
          \`\`\`
          Probe run: ${RUN_URL}
          EOF
          )
          existing=$(gh issue list --repo "$REPO" --label "$TRACKING_LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "updated tracking issue #$existing"
          else
            gh label create "$TRACKING_LABEL" --repo "$REPO" --color B60205 --description "CI runner pool liveness" 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$TRACKING_TITLE" --label "$TRACKING_LABEL" --body "$body"
          fi

      - name: Close tracking issue on recovery
        if: steps.probe.outputs.status == 'up'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          stamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          for n in $(gh issue list --repo "$REPO" --label "$TRACKING_LABEL" --state open --json number --jq '.[].number'); do
            gh issue comment "$n" --repo "$REPO" --body "✅ Runner pool healthy again as of ${stamp} (probe run ${{ github.run_id }}). Auto-closing."
            gh issue close "$n" --repo "$REPO" --reason completed
            echo "closed recovered tracking issue #$n"
          done

      - name: Fail the run when the pool is down
        if: steps.probe.outputs.status == 'down'
        run: |
          echo "::error title=Runner pool down::Self-hosted runner pool liveness check failed — see the '$TRACKING_LABEL' tracking issue."
          exit 1
