name: CI

# Cancel superseded PR runs; keep every main commit's run conclusive.
# On PRs, `head_ref` groups per source branch so cancel-in-progress supersedes
# stale runs. On push, the fallback is `github.sha` (NOT `github.ref`): keying
# every main commit to its own group means a later push never supersedes an
# earlier main run — even queued ones (#436). With a shared `refs/heads/main`
# group, rapid merges left main's runs `cancelled` and Playwright never reached
# a conclusive result, hiding real regressions.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly + manual: drives the runner-heavy rivet-core mutation matrix
  # (mutants-core) off the every-push path so it stops saturating the
  # self-hosted pool and queueing the gating jobs for hours (#498).
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Gate the compile-heavy Rust jobs so artifact/docs-only PRs stop running the
  # full matrix and saturating the shared self-hosted pool. Pure `git diff` — no
  # third-party action, so the supply chain stays auditable. On push/main,
  # schedule and workflow_dispatch the filter always reports rust=true, so a
  # merge or the nightly run still exercises everything. Content-validating jobs
  # (traceability = `rivet validate`, docs-check, yaml-lint) are deliberately
  # NOT gated on this — they must run on artifact/doc PRs.
  changes:
    name: Detect changed areas
    runs-on: [self-hosted, linux, x64, light]
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "non-PR event (${{ github.event_name }}) → full matrix"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          changed="$(git diff --name-only "$base"...HEAD)"
          echo "changed files:"; echo "$changed"
          if echo "$changed" | grep -qE '(\.rs$)|((^|/)Cargo\.(toml|lock)$)|(^\.github/workflows/)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "→ Rust/Cargo/workflow changes present; running full matrix"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "→ no Rust/Cargo/workflow changes; skipping compile-heavy jobs"
          fi

  # ── Fast checks ───────────────────────────────────────────────────────
  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, light]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      # REQ-202 / #456: the minimal validate/list/commit-check binary must keep
      # compiling without the serve+MCP+LSP stack. Without this guard, the next
      # serve-coupled change in an ungated path silently rots the minimal build.
      - name: Minimal build (--no-default-features) stays clean
        run: cargo clippy -p rivet-cli --no-default-features -- -D warnings

  yaml-lint:
    name: YAML Lint
    runs-on: [self-hosted, linux, x64, light]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yamllint
      - run: yamllint -c .yamllint.yaml schemas/ artifacts/ rivet.yaml .github/
      # #671 regression coverage — the compliance-report size guard is a
      # shell script exercised by a shell test; run it here (no compile
      # cost) so a broken guard fails PRs early.
      - name: Compliance report size-guard tests (#671)
        run: bash .github/actions/compliance/verify_archive_size_test.sh

  # ── Schema version-bump advisory (#485) ───────────────────────────────
  # Warn (don't fail) when a PR changes a schema's rules but leaves its
  # `version:` untouched — embedded schemas validate silently differently on
  # upgrade unless the version tracks content (#431). Warn-only matches the
  # docs-check coverage gate; flip to STRICT=1 once schema versions are
  # disciplined. PRs only (needs a base to diff against).
  schema-version-bump:
    name: Schema version bump
    runs-on: [self-hosted, linux, x64, light]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so we can diff against the PR base
      - name: Check schema version bumps (warn-only)
        run: scripts/check-schema-version-bump.sh "origin/${{ github.base_ref }}" HEAD

  # ── Docs-vs-reality gate (REQ-054) ────────────────────────────────────
  # A real gate — no continue-on-error.  Budget <1 minute on cached runs.
  docs-check:
    name: Docs Check
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run rivet docs check
        run: cargo run --release -p rivet-cli -- docs check
      # Subcommand-coverage gate — `--warn-only` emits a
      # `::warning::` GitHub Actions annotation per uncovered subcommand
      # so they surface inline on the PR without failing the build. Flip
      # to `--strict` once the existing inventory of uncovered
      # subcommands (variant, baseline, snapshot, runs, pipelines,
      # templates, close-gaps) is filled. See issue #248 for the design.
      - name: Subcommand-coverage gate (warn-only)
        run: cargo run --release -p rivet-cli -- docs check --coverage --warn-only

  # ── Traceability gate (REQ-051) ───────────────────────────────────────
  # The project that BUILDS the traceability tool must gate its own PRs on
  # traceability — dogfooding, and the CI half REQ-051 mandates (local git
  # hooks are convenience only; only CI enforcement is auditor-grade).
  #
  # NOTE (operator step): this job RUNS on every push/PR, but it only
  # *blocks* a merge once it is added to branch protection's required status
  # checks (currently empty — see #436). The job is the mechanism; marking it
  # required is a repo-settings action that cannot live in this file.
  traceability:
    name: Traceability (rivet validate + commits)
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v6
        with:
          # `commits --range base..HEAD` needs real history, not a shallow clone.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Gate 1: the trace graph must carry no ERRORs (broken links, duplicate
      # ids, bad link targets, cardinality, schema-rule inconsistencies).
      # Coverage/lint WARNINGS do not fail — `validate` exits 1 only at or
      # above `--fail-on` (default: error).
      - name: rivet validate (fail on errors)
        run: cargo run --release -p rivet-cli -- validate
      # Gate 2: no ORPHAN commits and no BROKEN trailer refs introduced by
      # THIS PR. Scoped to the PR's own commits (base..HEAD). NOT `--strict`,
      # which promotes whole-store "artifact has no commit coverage" findings
      # to errors and so can never pass on a narrow range. CLAUDE.md makes
      # artifact trailers mandatory for rivet-core/src + rivet-cli/src: an
      # orphan is a non-exempt code commit missing them; a broken ref is a
      # trailer pointing at an unknown id (e.g. a reverted REQ).
      - name: rivet commits — no orphan/broken trailers in this PR
        if: github.event_name == 'pull_request'
        run: |
          range="${{ github.event.pull_request.base.sha }}..HEAD"
          echo "Commit traceability over ${range}"
          json="$(cargo run --release -q -p rivet-cli -- commits --range "${range}" --format json)"
          counts="$(printf '%s' "${json}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(len(d.get("orphans",[])), len(d.get("broken_refs",[])))')"
          orphans="${counts% *}"
          broken="${counts#* }"
          echo "orphan commits: ${orphans}, broken trailer refs: ${broken}"
          if [ "${orphans}" -gt 0 ] || [ "${broken}" -gt 0 ]; then
            echo "::error::Commit traceability gate failed: ${orphans} orphan commit(s), ${broken} broken trailer ref(s). Add artifact trailers (Implements/Fixes/Verifies/Refs) or 'Trace: skip'. See CLAUDE.md 'Commit Traceability'."
            cargo run --release -q -p rivet-cli -- commits --range "${range}"
            exit 1
          fi

  # ── Tests ─────────────────────────────────────────────────────────────
  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, rust-cpu]
    env:
      RIVET_ACTIONLINT: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          # smithy: install to $HOME/.local/bin (writable) instead of
          # /usr/local/bin (needs sudo, which the runner user doesn't have).
          # Same actionlint binary, just a different filesystem location.
          mv /tmp/actionlint "$HOME/.local/bin/actionlint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/actionlint" --version
      - name: Run tests (JUnit XML output)
        run: |
          cargo install cargo-nextest --locked 2>/dev/null || true
          if command -v cargo-nextest &>/dev/null; then
            cargo nextest run --all --profile ci
          else
            cargo test --all
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # ── Playwright E2E ────────────────────────────────────────────────────
  playwright:
    name: Playwright E2E
    # Decoupled from `test` (#299): Playwright runs the release binary
    # end-to-end and is independent of cargo-test passing. Keeping it
    # gated on `test` blocked an ubuntu-latest job behind self-hosted
    # rust-cpu saturation (2026-05-17 incident).
    # Stays on ubuntu-latest: `npx playwright install --with-deps` runs
    # `apt-get install` (sudo needed) and pulls in Chromium + a slate
    # of system libraries. Smithy runners have no sudo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright dependencies
        working-directory: tests/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: tests/playwright
        run: npx playwright test
        env:
          CI: true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright/test-results/
          if-no-files-found: ignore

  # ── Zola export build smoke (#392) ───────────────────────────────────
  # Exports the corpus to a scaffolded Zola site under a sub-directory
  # base_url, runs a real `zola build`, and fails on a broken shortcode or a
  # dangling/absolute internal link (the REQ-115/116/118 regression class —
  # and front-matter escaping bugs like an unescaped `\` in a description).
  # ubuntu-latest because it downloads a pinned zola release. Advisory
  # (continue-on-error) until the install proves stable on the runners.
  zola-export-smoke:
    name: Zola export smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --bin rivet
      - name: Install zola
        env:
          ZOLA_VERSION: "0.19.2"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/zola.tar.gz \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/zola.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          zola --version
      - name: Run zola export smoke
        run: RIVET_BIN="$PWD/target/release/rivet" scripts/zola-export-smoke.sh

  # ── VS Code Extension ────────────────────────────────────────────────
  vscode-extension:
    name: VS Code Extension
    needs: [test]
    # Stays on ubuntu-latest: `xvfb-run` headless display + downloaded
    # VS Code Test environment expects sudo apt-get for system libs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build rivet binary
        run: cargo build --release
      - name: Add rivet to PATH
        run: echo "$PWD/target/release" >> $GITHUB_PATH
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install extension dependencies
        working-directory: vscode-rivet
        run: npm ci
      - name: Compile extension
        working-directory: vscode-rivet
        run: npm run compile
      - name: Run extension tests (headless VS Code)
        working-directory: vscode-rivet
        run: xvfb-run -a npm test
        env:
          DISPLAY: ':99.0'

  # VSIX build + publish live in release.yml now so the extension attaches
  # to the GitHub Release on tag push AND flows to the Marketplace in the
  # same pipeline. The previous `publish-vsix` here depended on a
  # non-existent `release-results` job, so the Marketplace push never
  # actually ran (which is why only the spar extension is currently on the
  # Marketplace — its workflow is scoped differently). See release.yml.

  # ── Security audits ──────────────────────────────────────────────────
  audit:
    name: Security Audit (RustSec)
    # Stays on ubuntu-latest: smithy ships cargo-audit v0.21.2 whose
    # bundled rustsec parser rejects RUSTSEC-2026-0037 ("unsupported
    # CVSS version: 4.0"). v0.22.1 fixes it but the install trips on
    # smithy's sccache-on-cc setup. Move back once smithy bumps
    # cargo-audit (tracked).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        # wasmtime advisories ignored — behind optional wasm feature gate
        # (not built by default). RUSTSEC-2026-0149 (wasmtime-wasi 43,
        # high) has no fix in the 43.x line; clearing it needs a wasmtime
        # 43->45 major bump, tracked separately.
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0085
          --ignore RUSTSEC-2026-0086
          --ignore RUSTSEC-2026-0087
          --ignore RUSTSEC-2026-0088
          --ignore RUSTSEC-2026-0089
          --ignore RUSTSEC-2026-0091
          --ignore RUSTSEC-2026-0092
          --ignore RUSTSEC-2026-0093
          --ignore RUSTSEC-2026-0094
          --ignore RUSTSEC-2026-0095
          --ignore RUSTSEC-2026-0096
          --ignore RUSTSEC-2026-0103
          --ignore RUSTSEC-2026-0104
          --ignore RUSTSEC-2026-0149

  deny:
    # Renamed: skipping advisories until smithy ships an upgraded
    # rustsec parser (see audit job comment). Same workaround as spar.
    name: Cargo Deny (licenses, bans, sources)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, light]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # cargo-deny v0.16.4 is pre-installed on smithy via the toolchains
      # role; the `cargo install` line below becomes a no-op when the
      # same version is already present. Kept here so the workflow
      # still works on hosted if the runner pool changes.
      - name: Install cargo-deny (no-op when smithy version matches)
        run: cargo install cargo-deny --locked --version 0.16.4 || true
      # Skip `advisories` because the rustsec parser shared with
      # cargo-audit rejects CVSS 4.0 advisories (RUSTSEC-2026-0037).
      # bans / licenses / sources still gate. The audit job (on
      # ubuntu-latest) covers vulnerability matching meanwhile.
      - name: Run cargo-deny (bans + licenses + sources)
        run: cargo deny check bans licenses sources

  # ── Public API stability (semver drift gate) ────────────────────────
  # Runs only on pull_request so main can move freely between tags.
  # Fails the PR if the public API of rivet-core changes in a way that
  # would require a semver major/minor bump relative to the base branch.
  # SCRC Phase 2 (DD-063): catch accidental breaking changes before they
  # escape to a release.
  semver-checks:
    name: Semver Checks (rivet-core public API)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The previous obi1kenobi/cargo-semver-checks-action@v2 wrapper
      # bundled an older cargo-semver-checks that didn't recognise the
      # rustdoc JSON v57 format that current stable rustdoc emits, so it
      # failed every run with `unsupported rustdoc format v57`. Going
      # direct: install the latest cargo-semver-checks at runtime and
      # invoke it. Slightly slower (compile cost on a cold cache) but
      # tracks the rustdoc format upstream emits.
      - name: Install cargo-semver-checks
        run: cargo install --locked cargo-semver-checks
      - name: Check rivet-core public API
        run: cargo semver-checks check-release -p rivet-core --default-features

  # ── Code coverage (Rust nightly for source-based instrumentation) ───
  coverage:
    name: Code Coverage
    needs: [changes, test]
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v6
      # REQ-267: nightly pinned to 2026-07-11 (last known-good) across every
      # nightly job (this Coverage job + both Miri jobs + Fuzz). Nightlies from
      # 2026-07-14 on ICE the compiler while building rivet-core (rustc panic in
      # rustc_ast/src/attr/mod.rs), reddening those jobs and masking the Miri UB
      # signal. The pin keeps them ENFORCING on a working compiler. UNPIN back
      # to @nightly once a newer nightly no longer ICEs (retry periodically).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-11
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage (LCOV + HTML)
        run: |
          cargo llvm-cov -p rivet-core --lcov --output-path lcov.info
          cargo llvm-cov -p rivet-core --html --output-dir coverage-html
      - name: Enforce minimum coverage threshold
        run: cargo llvm-cov -p rivet-core --fail-under-lines 40
      - name: Upload LCOV to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html/

  # ── Miri (undefined behavior, pointer provenance) ───────────────────
  # PR/push: Miri over the actual UB SURFACE only. Measured (PR #521): the full
  # 678-test sweep is ~930 test-minutes of mostly safe business logic (regex,
  # glob, HTML) that Miri runs ~100-1000x slower than native — it can't fit a
  # per-PR budget at any thread count, and provides ~no memory-safety value.
  # Miri exists to validate `unsafe`; in rivet-core that's the SyntaxKind
  # `transmute`s in the rowan-based CST parsers. Scope the PR gate to those
  # (sexpr + yaml_cst); the FULL sweep runs nightly (miri-full, #498 pattern).
  miri:
    name: Miri (safety surface)
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, lean-mem]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-11
          components: miri
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run Miri over the unsafe/CST surface
        # sexpr.rs + yaml_cst.rs hold the only real `unsafe` in rivet-core
        # (`std::mem::transmute` of raw SyntaxKind for the rowan parsers).
        # bazel.rs has the third transmute but its tests touch salsa/process
        # internals — covered by the nightly full sweep, not the PR gate.
        #
        # Runs under STACKED BORROWS (Miri default, the strictest model). This
        # is sound thanks to rowan fork v3 (= v2 + phall1's #212: GreenToken as a
        # DST + cursor SB fixes), which widens the token retag past the slice
        # tail. The pre-v3 pin hit a SharedReadOnly zero-size-retag UB here and
        # needed `-Zmiri-tree-borrows` to dodge it; v3 makes both SB and TB pass,
        # so we gate on the stricter one. (rust-analyzer/rowan #210/#211/#212 are
        # all closed-unmerged; upstream is rewriting rowan — Cargo.toml.)
        run: |
          cargo miri nextest run -p rivet-core --lib --test-threads 24 \
            -E 'test(sexpr::) | test(yaml_cst::)'
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        timeout-minutes: 20

  # Nightly + manual: the FULL Miri sweep — every Miri-compatible test (all but
  # the externals/process-spawning + rowan#211 multi-item failures the suite
  # has always skipped). Off the per-PR path (#498) so its ~50-min runtime
  # never blocks a PR; 24 threads on the 125 GiB runner, generous timeout.
  miri-full:
    name: Miri (full, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, lean-mem]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-11
          components: miri
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run full Miri sweep
        run: |
          cargo miri nextest run -p rivet-core --lib --test-threads 24 \
            -E 'not (test(bazel) | test(db) | test(externals) | test(export) | test(providers) | test(test_scanner) | test(yaml_edit) | test(markdown) | test(parse_actual_hazards) | test(stpa_hazard) | test(yaml_hir) | test(feature_model) | test(doc_check) | test(sexpr_eval) | test(query_embed) | test(parse_query) | test(execute_sexpr))'
        timeout-minutes: 90
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-tree-borrows"

  # ── Property-based testing (extended) ───────────────────────────────
  proptest:
    name: Proptest (extended)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run proptest with 10x cases
        run: cargo test --all
        env:
          PROPTEST_CASES: "1000"
      # The extended run uses 1000 random cases, so it can surface a rare
      # counterexample that the default Test job (100 cases) misses. proptest
      # writes the failing seed to `<crate>/proptest-regressions/*.txt` — upload
      # it so the failure is REPRODUCIBLE after the fact (drop the file in the
      # tree + `cargo test`). Without this, a CI-only proptest red is
      # undiagnosable once the log rotates (and unreachable while a run is stuck
      # queued on self-hosted runner capacity). #495
      - name: Upload proptest regressions (failing seeds, for reproduction)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions
          path: "**/proptest-regressions/*.txt"
          if-no-files-found: warn

  # ── Mutation testing ─────────────────────────────────────────────────
  # Split per-crate into parallel jobs so each has its own 45-min budget.
  #
  # rivet-cli: hard gate (0 surviving mutants as of this commit).
  # rivet-core: NOT a hard gate — 3677 mutants, known-surviving ones in
  # lib.rs (collect_yaml_files, import_with_schema branches) and bazel.rs
  # lex(). Need targeted tests before this can be flipped. See the
  # per-crate `continue-on-error` below.
  mutants-core:
    name: Mutation Testing (rivet-core ${{ matrix.shard_id }})
    needs: [test]
    # NON-GATING (continue-on-error) and runner-heavy: 16 shards x 45min on the
    # self-hosted lean-mem pool. Run it NIGHTLY (+ manual) only, not every push —
    # on every push it saturated the pool and queued the gating jobs for hours
    # (#498). The hard-gate rivet-cli mutants run per-push in `mutants-cli` below.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, lean-mem]
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: rivet-core, shard: '0/16', shard_id: '00-of-16' }
          - { crate: rivet-core, shard: '1/16', shard_id: '01-of-16' }
          - { crate: rivet-core, shard: '2/16', shard_id: '02-of-16' }
          - { crate: rivet-core, shard: '3/16', shard_id: '03-of-16' }
          - { crate: rivet-core, shard: '4/16', shard_id: '04-of-16' }
          - { crate: rivet-core, shard: '5/16', shard_id: '05-of-16' }
          - { crate: rivet-core, shard: '6/16', shard_id: '06-of-16' }
          - { crate: rivet-core, shard: '7/16', shard_id: '07-of-16' }
          - { crate: rivet-core, shard: '8/16', shard_id: '08-of-16' }
          - { crate: rivet-core, shard: '9/16', shard_id: '09-of-16' }
          - { crate: rivet-core, shard: '10/16', shard_id: '10-of-16' }
          - { crate: rivet-core, shard: '11/16', shard_id: '11-of-16' }
          - { crate: rivet-core, shard: '12/16', shard_id: '12-of-16' }
          - { crate: rivet-core, shard: '13/16', shard_id: '13-of-16' }
          - { crate: rivet-core, shard: '14/16', shard_id: '14-of-16' }
          - { crate: rivet-core, shard: '15/16', shard_id: '15-of-16' }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants-${{ matrix.crate }}-${{ matrix.shard_id }}
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      # Prevent ENOSPC during artifact upload — cargo-mutants writes a
      # per-mutant target directory under `mutants-out/`. With 17 shards
      # landing on the same lean-mem runner pool and Swatinem cache keeping
      # `~/.cargo` + `target/` hot, each shard previously left ~5-15 GB
      # behind. The next shard's `Upload mutants report` step then died
      # with "No space left on device". Prune before we start.
      - name: Prune stale mutants artefacts
        run: |
          rm -rf mutants-out
          find target -maxdepth 2 -name 'mutants.out*' -mtime +1 -exec rm -rf {} + 2>/dev/null || true
      - name: Run cargo-mutants
        # Per-mutant timeout 30s (was 90): the dogfood corpus's long-tail
        # mutants were eating most of each shard's 45-min budget. 30s
        # still catches genuine slow cases via cargo-mutants's automatic
        # "x3 baseline" rule — anything slower than that is reported as
        # `timeout` (counts as caught) rather than `missed`. With 30s
        # cap and 16-way sharding, each shard finishes in ~12-20 min.
        #
        # `--jobs 2` (was 4): smithy operator flagged on 2026-05-18 that
        # lean-mem runners were hitting their 32G cgroup ceiling
        # (runner3 31.0G/32G with 996MB headroom, ~3GB swap). Each
        # cargo-mutants worker compiles a fresh target dir and runs the
        # full test suite — at 4-way parallel that's ~8G per worker on
        # a 32G runner, which is at or above cargo-rustc's compile peak
        # for rivet-core's larger crates and triggers the same swap-
        # death-spiral pattern the cgroup bump was meant to break.
        # Halving concurrency gives ~16G per worker, comfortable for
        # the compile peak with headroom for the test suite. Trade-off:
        # each shard takes ~2x as long (was 12-20 min, now 20-40 min),
        # but the lean-mem pool stops needing emergency cgroup-ceiling
        # bumps every quarter.
        # #590 memory guard: cap per-process virtual address space at 48 GiB
        # (RLIMIT_AS) so a memory-runaway MUTANT — cargo-mutants can delete an
        # allocation bound and produce a rivet_core test binary that allocates
        # ~100 G in seconds, faster than the 30 s timeout — aborts with ENOMEM
        # inside its own process instead of tripping the system-wide OOM-killer
        # and taking down neighboring jobs on the shared lean-mem host. The
        # `|| true` already records a clipped mutant as timeout/error, not a
        # gate failure. Defense-in-depth alongside the infra cgroup MemoryMax.
        run: |
          ulimit -v 50331648
          cargo mutants -p ${{ matrix.crate }} --shard ${{ matrix.shard }} --timeout 30 --jobs 2 --output mutants-out -- --lib || true
      - name: Check surviving mutants
        run: |
          MISSED=0
          if [ -f "mutants-out/missed.txt" ]; then
            MISSED=$(wc -l < "mutants-out/missed.txt" | tr -d ' ')
          fi
          echo "Surviving mutants in ${{ matrix.crate }}: $MISSED"
          if [ "$MISSED" -gt 0 ]; then
            echo "::error::$MISSED mutant(s) survived in ${{ matrix.crate }} — add tests to kill them"
            head -30 mutants-out/missed.txt
            exit 1
          fi
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report-${{ matrix.crate }}-${{ matrix.shard_id }}
          # Only human-readable reports; skip per-mutant target dirs that
          # bloat the artifact to GB-scale and trigger ENOSPC on upload.
          path: |
            mutants-out/*.txt
            mutants-out/*.json
            mutants-out/outcomes.json
          if-no-files-found: warn

  # rivet-cli mutation — HARD GATE (0 surviving mutants), single shard, every
  # push + PR. Split from the rivet-core matrix (mutants-core) so the gate stays
  # fast and per-push while the heavy 16-shard rivet-core sweep moved to nightly
  # (#498). Tuning rationale (timeout 30 / --jobs 2) is documented on
  # mutants-core's identical step.
  # Runner pool: `rust-cpu`, not `lean-mem` (#523). `rivet-cli` is the small
  # crate with `--jobs 2`; rust-cpu's 16 G `MemoryHigh` headroom + 7 idle
  # runners handle it comfortably, and pinning a per-PR job to the 4-runner
  # lean-mem pool was starving Miri/Verus (median lean-mem wait ~64 min,
  # p95 ~23 h on a 14-day audit). Keep `lean-mem` reserved for the genuinely
  # RAM-bound gating jobs (Miri, Verus) and the nightly mutants-core fan-out.
  mutants-cli:
    name: Mutation Testing (rivet-cli)
    needs: [changes, test]
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, rust-cpu]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants-rivet-cli-0-of-1
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Prune stale mutants artefacts
        run: |
          rm -rf mutants-out
          find target -maxdepth 2 -name 'mutants.out*' -mtime +1 -exec rm -rf {} + 2>/dev/null || true
      - name: Run cargo-mutants
        # #590 memory guard (see mutants-core above): cap address space at
        # 48 GiB so a memory-runaway mutant aborts ENOMEM process-local instead
        # of OOM-killing the shared host. `|| true` keeps a clipped mutant as
        # error, not a gate failure.
        run: |
          ulimit -v 50331648
          cargo mutants -p rivet-cli --shard 0/1 --timeout 30 --jobs 2 --output mutants-out -- --lib || true
      - name: Check surviving mutants
        run: |
          MISSED=0
          if [ -f "mutants-out/missed.txt" ]; then
            MISSED=$(wc -l < "mutants-out/missed.txt" | tr -d ' ')
          fi
          echo "Surviving mutants in rivet-cli: $MISSED"
          if [ "$MISSED" -gt 0 ]; then
            echo "::error::$MISSED mutant(s) survived in rivet-cli — add tests to kill them"
            head -30 mutants-out/missed.txt
            exit 1
          fi
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report-rivet-cli-0-of-1
          path: |
            mutants-out/*.txt
            mutants-out/*.json
            mutants-out/outcomes.json
          if-no-files-found: warn

  # ── Fuzz testing (main only — too slow for PRs) ───────────────────
  fuzz:
    name: Fuzz Testing
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, rust-cpu]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-11
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run fuzz targets (30s each)
        run: |
          if [ ! -d fuzz ]; then
            echo "::notice::No fuzz directory found — skipping"
            exit 0
          fi
          cd fuzz
          TARGETS=$(cargo +nightly fuzz list 2>/dev/null || true)
          if [ -z "$TARGETS" ]; then
            echo "::notice::No fuzz targets defined — skipping"
            exit 0
          fi
          for target in $TARGETS; do
            echo "::group::Fuzzing $target"
            cargo +nightly fuzz run "$target" -- -max_total_time=30 || true
            echo "::endgroup::"
          done

  # ── Supply chain verification ───────────────────────────────────────
  supply-chain:
    name: Supply Chain (cargo-vet)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, light]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-vet
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet
      # Self-hosted runners on the `light` pool get cycled by ops
      # automation (kernel patches, systemd restarts, Ansible
      # convergence). When that happens mid-job we see "The runner
      # has received a shutdown signal". Wrap the actual work in a
      # retry — re-attempting a fast cargo-vet against a different
      # runner is cheaper than waiting for a human to click "Re-run
      # failed jobs". Two attempts is enough; a third shutdown in
      # ten minutes points at runner-pool sizing, not this job.
      - name: Vet
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 2
          retry_on: error
          command: |
            if [ ! -d supply-chain ]; then
              cargo vet init
              echo "::notice::cargo-vet initialized — run 'cargo vet' locally to audit dependencies"
            fi
            cargo vet --locked

  # ── Kani bounded model checking ────────────────────────────────────
  # Not yet a hard gate: the 27-harness suite exceeds the 30-minute budget.
  # Either needs scoping (run a subset on PRs, full suite nightly) or
  # harness-by-harness unwind tuning. TODO: flip to hard gate once a
  # PR-sized subset completes in <20 min.
  kani:
    name: Kani Proofs
    # Decoupled from `test` (#299): Kani harnesses are bounded model
    # checks against rivet-core; they don't read cargo-test status.
    # Keeping the gate blocked an ubuntu-latest job behind self-hosted
    # rust-cpu saturation (2026-05-17 incident).
    # Stays on ubuntu-latest: kani-verifier bundles CBMC (~100 MB),
    # not pre-installed on smithy. Move once toolchains role ships kani.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      # PR runs: smoke-test only (--only-codegen, ~5 min). Full Kani
      # runs on push to main (still 45 min budget). The 27-harness
      # full suite was overrunning the 45 min budget mid-unwind.
      - if: github.event_name == 'pull_request'
        uses: model-checking/kani-github-action@v1
        with:
          args: '-p rivet-core --only-codegen'
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: model-checking/kani-github-action@v1
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo kani -p rivet-core

  # ── Verus SMT verification ──────────────────────────────────────────
  # Toolchain + workspace are now correct (rules_verus@fc7b636 past the
  # CcInfo bump; root MODULE.bazel lets //verus see //rivet-core/src).
  # But the specs themselves fail verification ("FAIL in 0.1s" — Verus
  # rejects at least one proof obligation). That's a genuine SMT result,
  # not a plumbing issue, and it needs spec-level work separate from
  # the CI hard-gate PR. Soft-gate with a clear TODO until the specs
  # are green under the unified workspace.
  verus:
    name: Verus Proofs
    # Decoupled from `test` (mirrors `rocq`, #299): Verus runs the proof specs
    # via Bazel, independent of cargo-test status. With `needs: [test]` this
    # ubuntu-latest (always-available) job sat blocked behind the contended
    # self-hosted rust-cpu `test` job — the exact saturation Rocq decoupled to
    # avoid (#509).
    # ubuntu-latest (GitHub-hosted): mirrors the green `rocq` job — full sudo,
    # no NoNewPrivileges, so the standard cachix Nix installer works. Moved off
    # the self-hosted lean-mem pool (#509): there the no-sudo daemonless
    # nix-installer broke on a version bump and chronically failed at install,
    # so this advisory job was perma-red regardless of the proofs. 16 GB on the
    # hosted runner is ample for the rivet Verus specs.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      # Nix is required because the unified root MODULE.bazel registers
      # the Rocq toolchain, which depends on rules_nixpkgs_core. Bazel
      # resolves all registered toolchains at analysis time regardless
      # of which target is being built, so Nix must be on PATH even for
      # Verus-only invocations.
      #
      # ubuntu-latest is GitHub-hosted (full sudo, no NoNewPrivileges), so the
      # standard cachix multi-user installer works — matching the green `rocq`
      # job. The DeterminateSystems daemonless variant was only needed for the
      # self-hosted NoNewPrivileges runner, and an installer version bump broke
      # its no-sudo path (it escalated to sudo and failed at install); #509.
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Verify Verus specs
        run: bazel test //verus:rivet_specs_verify
      - name: Upload Verus test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verus-test-log
          path: |
            bazel-out/*/testlogs/verus/rivet_specs_verify/test.log
            bazel-testlogs/verus/rivet_specs_verify/test.log
          if-no-files-found: warn

  # ── Rocq metamodel proofs ─────────────────────────────────────────
  # Not yet a hard gate: the proofs were written against an older Rocq and
  # hit multiple 9.0.1 compatibility issues (length/++ scope resolution —
  # fixed; `apply` constructor inference — fixed via `eapply`; `No such
  # contradiction` on some destructures — unfixed; vmodel_chain_two_steps
  # has a real proof gap, currently Admitted with note). Needs systematic
  # port. TODO: flip to hard gate after the Rocq 9 port PR.
  rocq:
    name: Rocq Proofs
    # Decoupled from `test` (#299): Rocq theorem proving runs against
    # vendored .v files; it doesn't read cargo-test status. Keeping
    # the gate blocked an ubuntu-latest job behind self-hosted rust-cpu
    # saturation (2026-05-17 incident).
    # Stays on ubuntu-latest: Rocq (Coq) install is heavy and
    # not pre-provisioned on smithy. Migrate once toolchains role ships it.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      # `ubuntu-latest` is GitHub-hosted (full sudo, no NoNewPrivileges) so
      # the standard cachix multi-user installer works here — matches the
      # green `synth` pattern (`pulseengine/synth/.github/workflows/ci.yml`,
      # `bazel` job). The DeterminateSystems daemonless variant we used
      # before emitted `unknown setting 'build-provenance-tags'` and then
      # failed with `Permission denied` on `/nix/var/nix/db/big-lock` —
      # that constraint was copied from the self-hosted verus job (which
      # IS NoNewPrivileges) and never applied to this `ubuntu-latest` job.
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Verify Rocq proofs
        run: bazel test //proofs/rocq:rivet_metamodel_test

  # ── MSRV check ──────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.89)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all

  # ── Attach test results + attestation to releases ───────────────────
  #
  # VSIX packaging moved to release.yml so the extension ships together
  # with the platform binaries on tag push. This job now only attaches
  # the JUnit, coverage lcov, and attested rivet binary for the tag.
  release-results:
    name: Publish Test Results on Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, coverage, miri, proptest, playwright]
    runs-on: [self-hosted, linux, x64, light]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Build release binary
        run: cargo build --release
      - name: Run tests with JUnit output
        run: cargo nextest run --all --profile ci
      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/release/rivet
      - name: Package results
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          mkdir -p release-results
          cp target/nextest/ci/junit.xml release-results/test-results-${VERSION}.xml 2>/dev/null || true
          cp lcov.info release-results/coverage-${VERSION}.lcov
          cp target/release/rivet release-results/rivet-linux-x86_64
          TSTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg v "$VERSION" --arg c "$GITHUB_SHA" --arg t "$TSTAMP" \
            '{version: $v, commit: $c, timestamp: $t}' \
            > release-results/metadata.json
          tar czf release-results-${VERSION}.tar.gz release-results/
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-results-*.tar.gz
            target/release/rivet
