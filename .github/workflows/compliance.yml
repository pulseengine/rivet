name: Compliance Report

# Compliance variant: produces compliance reports / signed artifacts. Group
# for serialization but never cancel — partially-completed compliance runs
# leave registries / attestations in inconsistent state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      version:
        description: 'Version label shown in the report header + version switcher current entry'
        type: string
        default: ''
      homepage:
        description: 'Homepage URL for the report "back" navigation link'
        type: string
        default: ''
      other-versions:
        description: >
          JSON array of OTHER report versions for the switcher dropdown, each
          {"label","path"} — e.g. [{"label":"v0.1.0","path":"../v0.1.0/"}].
          Required for the cross-version selector; the caller must enumerate
          the published versions (a single run can't know them). REQ-163 / #420.
        type: string
        default: '[]'
      theme:
        description: 'Color theme (dark or light)'
        type: string
        default: 'dark'
      offline:
        description: 'Use system fonts only'
        type: boolean
        default: false
    outputs:
      archive-path:
        description: 'Path to the compliance archive'
        value: ${{ jobs.compliance.outputs.archive-path }}
      validation-result:
        description: 'PASS or FAIL'
        value: ${{ jobs.compliance.outputs.validation-result }}

jobs:
  compliance:
    name: Generate compliance report
    runs-on: ubuntu-latest
    outputs:
      archive-path: ${{ steps.report.outputs.archive-path }}
      validation-result: ${{ steps.report.outputs.validation-result }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Generate report
        id: report
        uses: pulseengine/rivet/.github/actions/compliance@main
        with:
          # The action's label input is `report-label`; passing `version`
          # here was silently ignored (REQ-163 / #420).
          report-label: ${{ inputs.version }}
          homepage: ${{ inputs.homepage }}
          other-versions: ${{ inputs.other-versions }}
          theme: ${{ inputs.theme }}
          offline: ${{ inputs.offline }}

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compliance-report
          path: ${{ steps.report.outputs.archive-path }}
