name: Release

# Release variant: serialize per-tag, never cancel. A cancelled release
# mid-publish leaves the GitHub Release page, registries, and per-target
# binary archives in inconsistent state.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required for sigstore keyless signing (cosign): GitHub OIDC token
  # is the trust anchor — Fulcio mints a short-lived signing cert from
  # the workflow's identity, the signature is recorded in Rekor, and
  # consumers verify via the issuer + identity (no long-lived keys to
  # rotate). See `Sign release assets with cosign` step below.
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Cross-platform binary builds ──────────────────────────────────────
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p rivet-cli

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p rivet-cli

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip "target/${{ matrix.target }}/release/rivet" 2>/dev/null || true

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          ARCHIVE="rivet-${VERSION}-${TARGET}.tar.gz"
          mkdir -p staging
          cp "target/${TARGET}/release/rivet" staging/
          tar -czf "$ARCHIVE" -C staging .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          ARCHIVE="rivet-${VERSION}-${TARGET}.zip"
          mkdir -p staging
          cp "target/${TARGET}/release/rivet.exe" staging/
          cd staging && 7z a "../$ARCHIVE" . && cd ..
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  # ── Docs-vs-reality gate (release-time rerun of the CI check) ─────────
  docs-check:
    name: Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p rivet-cli -- docs check

  # ── Baseline snapshot ─────────────────────────────────────────────────
  capture-snapshot:
    name: Capture baseline snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Capture snapshot
        env:
          TAG: ${{ github.ref_name }}
        run: cargo run --release -- snapshot capture --name "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: snapshots/

      - name: Commit snapshot to main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          git diff --cached --quiet && exit 0
          git commit -m "chore: capture baseline snapshot for $TAG"
          git push origin HEAD:main || true

  # ── Compliance report (HTML export) ───────────────────────────────────
  # Uses snapshots already committed from PREVIOUS releases (not the one
  # just captured). The new snapshot is for future release comparisons.
  build-compliance:
    name: Build compliance report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Generate compliance report
        id: report
        uses: ./.github/actions/compliance
        with:
          theme: dark
          # REQ-090: ship the full audit-deliverable bundle, not the
          # single-page nav-shell form. Multi-page emission is now
          # ~50 MB total on the rivet corpus (REQ-088's shared-assets
          # fix landed in #319), well within a GitHub Release artifact
          # budget — and it's what auditors actually use (rendered
          # specs with resolved artifact tables, per-rule coverage,
          # matrix, validation).
          single-page: false
          # REQ-090: also include ReqIF 1.2 + generic-yaml + README in
          # the same tarball so DOORS / Polarion / codeBeamer users
          # get importable data alongside the rendered docs.
          include-data-formats: true

      - uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: ${{ steps.report.outputs.archive-path }}

  # ── Test evidence bundle ──────────────────────────────────────────────
  # Non-blocking: this job pulls in the spar wasm32-wasip2 build, which
  # transitively requires the highs-sys C++ solver. WASI cross-compile of
  # highs-sys has been flaky (CMake Threads::Threads target unavailable in
  # the WASI sysroot — see v0.10.0 release run 25966236046). Until that
  # upstream issue is resolved (tracked separately), this job must NOT
  # block `create-release` from publishing the binaries that DID build.
  # Test evidence is a desirable add-on, not a required gate; cargo test
  # already ran on the merge commit before the tag was pushed.
  build-test-evidence:
    name: Build test evidence
    runs-on: ubuntu-latest
    continue-on-error: true  # NB: doesn't block create-release; see note above.
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      # The spar wasm32-wasip2 build pulls in highs-sys (a C++ solver), and
      # building C/C++ for that target needs a full WASI toolchain:
      #   - wasm-component-ld: the WASI Preview 2 component linker that cargo
      #     uses as the wasm32-wasip2 linker (recent nightlies stopped bundling
      #     it with the target's tools — #269);
      #   - wasm-ld: the LLVM wasm linker wasm-component-ld and clang++ shell
      #     out to (`lld` package — #271; also in wasi-sdk's bin/);
      #   - a WASI sysroot + libc/libc++/libc++abi + libclang_rt.builtins-wasm32.a
      #     (the runner image no longer ships these, so wasm-ld errored on
      #     crt1.o / -lc / -lc++).
      # wasi-sdk supplies the sysroot + clang/clang++/llvm-ar/wasm-ld. Put its
      # bin/ on PATH (so wasm-component-ld can find wasm-ld and the `cc`/`cmake`
      # build scripts pick up the right clang), and pin CC_/CXX_/AR_<target> +
      # the wasip2 sysroot so the CMake CXX-ABI probe and the highs-sys compile
      # both resolve their headers/libs. `lld` stays as a belt-and-braces
      # wasm-ld source.
      - name: Install wasm-component-ld + lld
        run: |
          sudo apt-get update
          sudo apt-get install -y lld
          cargo install --locked wasm-component-ld

      - name: Install WASI SDK
        env:
          WASI_SDK_VERSION: "25.0"
        run: |
          set -euo pipefail
          major="${WASI_SDK_VERSION%%.*}"
          url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${major}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL "$url" -o /tmp/wasi-sdk.tar.gz
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
          sysroot="/opt/wasi-sdk/share/wasi-sysroot"
          echo "/opt/wasi-sdk/bin" >> "$GITHUB_PATH"
          {
            echo "WASI_SDK_PATH=/opt/wasi-sdk"
            echo "CC_wasm32_wasip2=/opt/wasi-sdk/bin/clang"
            echo "CXX_wasm32_wasip2=/opt/wasi-sdk/bin/clang++"
            echo "AR_wasm32_wasip2=/opt/wasi-sdk/bin/llvm-ar"
            echo "CFLAGS_wasm32_wasip2=--target=wasm32-wasip2 --sysroot=${sysroot}"
            echo "CXXFLAGS_wasm32_wasip2=--target=wasm32-wasip2 --sysroot=${sysroot}"
          } >> "$GITHUB_ENV"

      - name: Build spar WASM assets
        run: |
          git clone --depth 1 https://github.com/pulseengine/spar.git ../spar
          npm install -g @bytecodealliance/jco
          ./scripts/build-wasm.sh ../spar

      - name: Run tests with JUnit XML
        run: |
          mkdir -p test-evidence/test-results
          cargo nextest run --all --profile ci
          cp target/nextest/ci/junit.xml test-evidence/test-results/junit.xml

      - name: Generate coverage
        run: |
          mkdir -p test-evidence/coverage
          cargo llvm-cov --all-features --workspace --lcov --output-path test-evidence/coverage/lcov.info
          cargo llvm-cov report > test-evidence/coverage/summary.txt

      - name: Run benchmarks
        run: |
          cargo bench --bench core_benchmarks -- --output-format=criterion
          mkdir -p test-evidence/benchmarks
          cp -r target/criterion/* test-evidence/benchmarks/ 2>/dev/null || true

      - name: Run rivet validate
        run: |
          mkdir -p test-evidence/validation
          set +e
          cargo run --release -- validate > test-evidence/validation/validate-output.txt 2>&1
          rc=$?
          set -e
          echo "exit_code=${rc}" >> test-evidence/validation/validate-output.txt

      - name: Generate metadata
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          jq -n \
            --arg tag "${TAG}" \
            --arg commit "${GITHUB_SHA}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg rust_version "$(rustc --version)" \
            --arg os "$(uname -srm)" \
            '{tag: $tag, commit: $commit, timestamp: $timestamp, rust_version: $rust_version, os: $os}' \
            > test-evidence/metadata.json

      - name: Package
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          tar czf "rivet-${VERSION}-test-evidence.tar.gz" test-evidence/

      - uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: rivet-*-test-evidence.tar.gz

  # ── VS Code Extension VSIX ────────────────────────────────────────────
  # Builds the VSIX so it can be attached to the GitHub Release and
  # separately published to the VS Code Marketplace.
  build-vsix:
    name: Build VS Code Extension VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install extension dependencies
        working-directory: vscode-rivet
        run: npm ci
      - name: Compile extension
        working-directory: vscode-rivet
        run: npm run compile
      - name: Package VSIX
        working-directory: vscode-rivet
        run: npx @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-rivet/*.vsix

  # ── Create GitHub Release ─────────────────────────────────────────────
  # Note: build-test-evidence is intentionally NOT in `needs` — that job
  # depends on a flaky WASI cross-compile (spar → highs-sys) and a failure
  # there must not block publication of the cross-platform binaries. If
  # the test-evidence tarball does build, it will be available as a
  # workflow artifact and can be attached to the release manually.
  create-release:
    name: Create GitHub Release
    needs: [build-binaries, build-compliance, build-vsix, docs-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.vsix" \) -exec mv {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ── Sigstore keyless signing (Supply-Chain-Pentester finding) ──
      # Closes the gap called out in the v0.10.0 adversarial review:
      # SHA256SUMS shipped unsigned, so an attacker who could replace
      # the release-page asset could also replace the checksum file.
      # Sigstore keyless flow binds the signature to the GitHub-Actions
      # OIDC identity (workflow ref + commit SHA + actor); no long-lived
      # keys to rotate. Verification:
      #   cosign verify-blob \
      #     --certificate-identity-regexp "https://github.com/pulseengine/rivet/.github/workflows/release.yml@.*" \
      #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      #     --signature SHA256SUMS.txt.sig \
      #     --bundle SHA256SUMS.txt.cosign.bundle \
      #     SHA256SUMS.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign SHA256SUMS with cosign (keyless OIDC)
        run: |
          cd release
          cosign sign-blob \
            --yes \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem \
            SHA256SUMS.txt
          echo "::notice::SHA256SUMS signed via sigstore keyless flow."
          echo "::notice::Bundle: SHA256SUMS.txt.cosign.bundle (verifier-friendly)."
          echo "::notice::Detached: SHA256SUMS.txt.sig + SHA256SUMS.txt.pem."

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          # Idempotent: if a release already exists for this tag (e.g.
          # the maintainer ran `gh release create` manually after pushing
          # the tag), upload assets to the existing release. Otherwise
          # create the release with assets. `--clobber` lets re-runs
          # overwrite assets that a previous failed attempt partially
          # uploaded.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release $VERSION already exists; uploading assets"
            gh release upload "$VERSION" --clobber release/*
          else
            echo "::notice::Creating Release $VERSION with assets"
            gh release create "$VERSION" \
              --title "Rivet $VERSION" \
              --generate-notes \
              release/*
          fi

  # ── Publish VS Code Extension to Marketplace ──────────────────────────
  # Runs after create-release so the VSIX is always on the Release page
  # even if Marketplace publish fails or VSCE_PAT isn't set. The
  # conditional guard prints a visible warning rather than silently
  # skipping, which is how the previous ci.yml flow made "rivet extension
  # never reaches Marketplace" invisible.
  publish-vsix-marketplace:
    name: Publish VSIX to VS Code Marketplace
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT secret is not configured. VSIX is attached to the GitHub Release but WILL NOT be published to the Marketplace."
            echo "::warning::See https://code.visualstudio.com/api/working-with-extensions/publishing-extension for PAT setup."
            exit 0
          fi
          npx @vscode/vsce publish --packagePath vsix/*.vsix
