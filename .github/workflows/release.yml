name: Release

# Release variant: serialize per-tag, never cancel. A cancelled release
# mid-publish leaves the GitHub Release page, registries, and per-target
# binary archives in inconsistent state.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required for sigstore keyless signing (cosign): GitHub OIDC token
  # is the trust anchor — Fulcio mints a short-lived signing cert from
  # the workflow's identity, the signature is recorded in Rekor, and
  # consumers verify via the issuer + identity (no long-lived keys to
  # rotate). See `Sign release assets with cosign` step below.
  id-token: write
  # Required for actions/attest-build-provenance@v2: writes the in-toto
  # SLSA v1 provenance statement to GitHub's attestation store so a
  # consumer can `gh attestation verify <asset> --repo pulseengine/rivet`.
  # Mirrors the synth/sigil/spar/witness release pattern.
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Cross-platform binary builds ──────────────────────────────────────
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p rivet-cli

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p rivet-cli

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip "target/${{ matrix.target }}/release/rivet" 2>/dev/null || true

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          ARCHIVE="rivet-${VERSION}-${TARGET}.tar.gz"
          mkdir -p staging
          cp "target/${TARGET}/release/rivet" staging/
          tar -czf "$ARCHIVE" -C staging .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          ARCHIVE="rivet-${VERSION}-${TARGET}.zip"
          mkdir -p staging
          cp "target/${TARGET}/release/rivet.exe" staging/
          cd staging && 7z a "../$ARCHIVE" . && cd ..
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  # ── Docs-vs-reality gate (release-time rerun of the CI check) ─────────
  docs-check:
    name: Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p rivet-cli -- docs check

  # ── Baseline snapshot ─────────────────────────────────────────────────
  capture-snapshot:
    name: Capture baseline snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Capture snapshot
        env:
          TAG: ${{ github.ref_name }}
        run: cargo run --release -- snapshot capture --name "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: snapshots/

      - name: Commit snapshot to main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          git diff --cached --quiet && exit 0
          git commit -m "chore: capture baseline snapshot for $TAG"
          git push origin HEAD:main || true

  # ── Compliance report (HTML export) ───────────────────────────────────
  # Uses snapshots already committed from PREVIOUS releases (not the one
  # just captured). The new snapshot is for future release comparisons.
  build-compliance:
    name: Build compliance report
    # REQ-371: the bundle is the audit deliverable and carried no release
    # note, so an assessor handed it alone got no 11-03 item. The note is
    # generated once, at the tag, by build-release-note — regenerating it here
    # could disagree with the copy that ships as a release asset, which is the
    # drift REQ-327 exists to remove.
    needs: [build-release-note]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Fetch the generated release note
        uses: actions/download-artifact@v4
        with:
          name: release-note
          path: release-note

      - name: Resolve the release-note path
        id: note
        run: |
          set -euo pipefail
          f="$(find release-note -name 'rivet-*-release-note.md' | head -1)"
          # A note that is absent here would produce a bundle silently missing
          # its 11-03 item — the defect being closed. Fail instead.
          test -n "$f"
          test -s "$f"
          echo "path=$(realpath "$f")" >> "$GITHUB_OUTPUT"
          echo "::notice::bundle will carry $(basename "$f")"

      - name: Generate compliance report
        id: report
        uses: ./.github/actions/compliance
        with:
          theme: dark
          # REQ-163 / #420: label the report with the release tag and give it
          # a "back" navigation link, so even the GitHub-artifact bundle isn't
          # nav-less. The cross-version switcher (`other-versions`) still has
          # to come from the site-publishing pipeline, which is the only layer
          # that knows the full set of published versions.
          report-label: ${{ github.ref_name }}
          homepage: https://pulseengine.eu/projects/
          # REQ-090: ship the full audit-deliverable bundle, not the
          # single-page nav-shell form. Multi-page emission is now
          # ~50 MB total on the rivet corpus (REQ-088's shared-assets
          # fix landed in #319), well within a GitHub Release artifact
          # budget — and it's what auditors actually use (rendered
          # specs with resolved artifact tables, per-rule coverage,
          # matrix, validation).
          single-page: false
          # REQ-090: also include ReqIF 1.2 + generic-yaml + README in
          # the same tarball so DOORS / Polarion / codeBeamer users
          # get importable data alongside the rendered docs.
          include-data-formats: true
          # REQ-371: the same generated 11-03 release note that ships as a
          # signed release asset, so the bundle stands alone as an audit
          # deliverable.
          extra-files: ${{ steps.note.outputs.path }}

      - uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: ${{ steps.report.outputs.archive-path }}

  # ── Test evidence bundle ──────────────────────────────────────────────
  # #293: the comment that used to live here blamed a flaky highs-sys WASI
  # cross-compile. That was stale. This job went red at v0.31.0 and stayed
  # red through v0.33.1, and the failing step was `Run tests with JUnit XML`
  # — not the WASI build. Root cause: `mcp_integration.rs` derived the
  # `rivet` binary path by walking up from `current_exe()`, and on this
  # runner that guess resolved into a build-script OUT_DIR
  # (target/debug/build/rivet-cli/<hash>/out/rivet), so the existence assert
  # fired on every test in the file. Fixed by using `CARGO_BIN_EXE_rivet`,
  # as the other 27 integration tests already did.
  #
  # `continue-on-error` is retained ONLY so a green-binaries release is not
  # blocked by an evidence-bundle hiccup — but note what it cost: it hid a
  # real failure for four consecutive releases, each of which shipped a
  # compliance bundle with no test evidence. If this job goes red again,
  # treat it as a release blocker and investigate rather than shipping past
  # it; the flag is a convenience, not a verdict that the failure is benign.
  build-test-evidence:
    name: Build test evidence
    runs-on: ubuntu-latest
    continue-on-error: true  # NB: doesn't block create-release; see note above.
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      # The spar wasm32-wasip2 build pulls in highs-sys (a C++ solver), and
      # building C/C++ for that target needs a full WASI toolchain:
      #   - wasm-component-ld: the WASI Preview 2 component linker that cargo
      #     uses as the wasm32-wasip2 linker (recent nightlies stopped bundling
      #     it with the target's tools — #269);
      #   - wasm-ld: the LLVM wasm linker wasm-component-ld and clang++ shell
      #     out to (`lld` package — #271; also in wasi-sdk's bin/);
      #   - a WASI sysroot + libc/libc++/libc++abi + libclang_rt.builtins-wasm32.a
      #     (the runner image no longer ships these, so wasm-ld errored on
      #     crt1.o / -lc / -lc++).
      # wasi-sdk supplies the sysroot + clang/clang++/llvm-ar/wasm-ld. Put its
      # bin/ on PATH (so wasm-component-ld can find wasm-ld and the `cc`/`cmake`
      # build scripts pick up the right clang), and pin CC_/CXX_/AR_<target> +
      # the wasip2 sysroot so the CMake CXX-ABI probe and the highs-sys compile
      # both resolve their headers/libs. `lld` stays as a belt-and-braces
      # wasm-ld source.
      - name: Install wasm-component-ld + lld
        run: |
          sudo apt-get update
          sudo apt-get install -y lld
          cargo install --locked wasm-component-ld

      - name: Install WASI SDK
        env:
          WASI_SDK_VERSION: "25.0"
        run: |
          set -euo pipefail
          major="${WASI_SDK_VERSION%%.*}"
          url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${major}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL "$url" -o /tmp/wasi-sdk.tar.gz
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
          sysroot="/opt/wasi-sdk/share/wasi-sysroot"
          echo "/opt/wasi-sdk/bin" >> "$GITHUB_PATH"
          {
            echo "WASI_SDK_PATH=/opt/wasi-sdk"
            echo "CC_wasm32_wasip2=/opt/wasi-sdk/bin/clang"
            echo "CXX_wasm32_wasip2=/opt/wasi-sdk/bin/clang++"
            echo "AR_wasm32_wasip2=/opt/wasi-sdk/bin/llvm-ar"
            echo "CFLAGS_wasm32_wasip2=--target=wasm32-wasip2 --sysroot=${sysroot}"
            echo "CXXFLAGS_wasm32_wasip2=--target=wasm32-wasip2 --sysroot=${sysroot}"
          } >> "$GITHUB_ENV"

      - name: Build spar WASM assets
        run: |
          git clone --depth 1 https://github.com/pulseengine/spar.git ../spar
          npm install -g @bytecodealliance/jco
          ./scripts/build-wasm.sh ../spar

      - name: Run tests with JUnit XML
        run: |
          mkdir -p test-evidence/test-results
          cargo nextest run --all --profile ci
          cp target/nextest/ci/junit.xml test-evidence/test-results/junit.xml

      - name: Generate coverage
        run: |
          mkdir -p test-evidence/coverage
          cargo llvm-cov --all-features --workspace --lcov --output-path test-evidence/coverage/lcov.info
          cargo llvm-cov report > test-evidence/coverage/summary.txt

      - name: Run benchmarks
        run: |
          cargo bench --bench core_benchmarks -- --output-format=criterion
          mkdir -p test-evidence/benchmarks
          cp -r target/criterion/* test-evidence/benchmarks/ 2>/dev/null || true

      - name: Run rivet validate
        run: |
          mkdir -p test-evidence/validation
          set +e
          cargo run --release -- validate > test-evidence/validation/validate-output.txt 2>&1
          rc=$?
          set -e
          echo "exit_code=${rc}" >> test-evidence/validation/validate-output.txt

      - name: Generate metadata
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          jq -n \
            --arg tag "${TAG}" \
            --arg commit "${GITHUB_SHA}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg rust_version "$(rustc --version)" \
            --arg os "$(uname -srm)" \
            '{tag: $tag, commit: $commit, timestamp: $timestamp, rust_version: $rust_version, os: $os}' \
            > test-evidence/metadata.json

      - name: Package
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          tar czf "rivet-${VERSION}-test-evidence.tar.gz" test-evidence/

      - uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: rivet-*-test-evidence.tar.gz

  # ── VS Code Extension VSIX ────────────────────────────────────────────
  # Builds the VSIX so it can be attached to the GitHub Release and
  # separately published to the VS Code Marketplace.
  build-vsix:
    name: Build VS Code Extension VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install extension dependencies
        working-directory: vscode-rivet
        run: npm ci
      - name: Compile extension
        working-directory: vscode-rivet
        run: npm run compile
      - name: Package VSIX
        working-directory: vscode-rivet
        run: npx @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-rivet/*.vsix

  # ── Release note (Automotive SPICE 11-03) ─────────────────────────────
  # REQ-369: REQ-327 taught rivet to GENERATE an 11-03 release note from
  # the artifact store and the commit trailers, but nothing published it
  # — the release body was `--generate-notes`, a flat pull-request list.
  # The note is generated HERE, in CI, at the tagged commit, so what ships
  # is what the trace says; a note pasted from a local run could disagree
  # with the tag it claims to describe.
  build-release-note:
    name: Generate release note (ASPICE 11-03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # `rivet release notes --since` walks the commit trailers
          # between two tags. A shallow clone has neither the tags nor the
          # log, and the command would quietly emit a note whose commit
          # section is empty — a note that looks generated and says
          # nothing.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Generate release note
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          BARE="${VERSION#v}"
          OUT="rivet-${BARE}-release-note.md"
          # REQ-369: the logic lives in a sourceable script with its own
          # oracle (tools/release/release-note_test.sh, run by CI's YAML
          # Lint job). This workflow fires only on tag push, so inline
          # shell here is unreachable by any pull request and would ship
          # having never run once.
          . tools/release/release-note.sh
          PREV="$(previous_release_tag "$VERSION")"
          if [ -n "$PREV" ]; then
            echo "::notice::Generating release note for $VERSION since $PREV"
            cargo run --release -p rivet-cli -- release notes "$VERSION" --since "$PREV" > "$OUT"
          else
            echo "::warning::No preceding tag; the note omits its commit section"
            cargo run --release -p rivet-cli -- release notes "$VERSION" > "$OUT"
          fi
          # An empty note is worse than no note: it would ship as the
          # release body and read as though nothing had been delivered.
          test -s "$OUT"
          if ! head -1 "$OUT" | grep -q '^# Release note'; then
            echo "::error::generated file is not a release note"
            exit 1
          fi
          echo "--- generated release note ---"
          cat "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-note
          path: rivet-*-release-note.md

  # ── Create GitHub Release ─────────────────────────────────────────────
  # Note: build-test-evidence is intentionally NOT in `needs` — that job
  # depends on a flaky WASI cross-compile (spar → highs-sys) and a failure
  # there must not block publication of the cross-platform binaries. If
  # the test-evidence tarball does build, it will be available as a
  # workflow artifact and can be attached to the release manually.
  #
  # build-release-note IS required, by contrast: it is deterministic,
  # costs one cached build, and a release published without its 11-03
  # item is the exact defect REQ-369 exists to close. Letting it fail
  # open would ship that defect quietly.
  create-release:
    name: Create GitHub Release
    needs:
      - build-binaries
      - build-compliance
      - build-vsix
      - docs-check
      - build-release-note
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.vsix" -o -name "rivet-*-release-note.md" \) -exec mv {} release-assets/ \;
          ls -la release-assets/

      # ── Toolchain SBOM (CycloneDX) ─────────────────────────────────────
      # Phase 6 of the synth/spar/sigil/witness shared release pattern.
      # The SBOM is generated *before* SHA256SUMS so its digest is
      # captured in the checksum manifest; the cosign signature over
      # SHA256SUMS.txt therefore transitively covers the SBOM.
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      - name: Generate toolchain SBOM (CycloneDX)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          BARE="${VERSION#v}"
          # cargo-cyclonedx doesn't proxy cargo's `-p` package-selection
          # flag (caught the hard way on synth's first v0.6.0 attempt);
          # use --manifest-path to target rivet-cli's Cargo.toml directly.
          # The generated SBOM lands next to that Cargo.toml.
          cargo cyclonedx \
            --manifest-path rivet-cli/Cargo.toml \
            --format json \
            --spec-version 1.5
          SBOM_SRC="rivet-cli/rivet-cli.cdx.json"
          if [ ! -f "$SBOM_SRC" ]; then
            SBOM_SRC=$(find rivet-cli -maxdepth 2 -name '*.cdx.json' | head -1)
          fi
          test -n "$SBOM_SRC" && test -f "$SBOM_SRC"
          cp "$SBOM_SRC" "release-assets/rivet-${BARE}.cdx.json"
          echo "::notice::Toolchain SBOM written to release-assets/rivet-${BARE}.cdx.json"
          ls -la release-assets/

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ── SLSA build provenance (GitHub-native) ──────────────────────────
      # actions/attest-build-provenance generates an in-toto SLSA v1
      # provenance statement for every binary archive, signs it keyless
      # via Sigstore (Fulcio cert bound to this workflow's OIDC identity),
      # and records it in the Rekor transparency log. Consumers verify
      # with `gh attestation verify <file> --repo pulseengine/rivet`.
      # GitHub-native attestation (not the standalone SLSA generator)
      # keeps the workflow self-contained — mirrors synth's pattern.
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-assets/*.tar.gz"

      # ── Sigstore keyless signing (Supply-Chain-Pentester finding) ──
      # Closes the gap called out in the v0.10.0 adversarial review:
      # SHA256SUMS shipped unsigned, so an attacker who could replace
      # the release-page asset could also replace the checksum file.
      # Sigstore keyless flow binds the signature to the GitHub-Actions
      # OIDC identity (workflow ref + commit SHA + actor); no long-lived
      # keys to rotate. Verification:
      #   cosign verify-blob \
      #     --certificate-identity-regexp \
      #       'https://github.com/pulseengine/rivet/.github/workflows/release.yml@.*' \
      #     --certificate-oidc-issuer \
      #       'https://token.actions.githubusercontent.com' \
      #     --bundle SHA256SUMS.txt.cosign.bundle \
      #     SHA256SUMS.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign SHA256SUMS with cosign (keyless OIDC)
        run: |
          set -euo pipefail
          cd release-assets
          cosign sign-blob \
            --yes \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem \
            SHA256SUMS.txt
          echo "::notice::SHA256SUMS signed via sigstore keyless flow."
          echo "::notice::Bundle: SHA256SUMS.txt.cosign.bundle (verifier-friendly)."
          echo "::notice::Detached: SHA256SUMS.txt.sig + SHA256SUMS.txt.pem."

      # ── Build-environment record ───────────────────────────────────────
      # Captures the toolchain versions every release was actually
      # produced with. Belongs alongside the binaries so a consumer
      # reproducing a release can pin the same rustc/cargo/cosign — a
      # cheap reproducibility-aid and a prerequisite for REQ-094
      # (`rivet release-verify`).
      - name: Capture build environment
        run: |
          set -euo pipefail
          {
            echo "rustc: $(rustc --version)"
            echo "cargo: $(cargo --version)"
            echo "cosign: $(cosign version 2>&1 | head -1)"
            echo "runner: $(uname -srm)"
          } > release-assets/build-env.txt
          cat release-assets/build-env.txt

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          # Idempotent: if a release already exists for this tag (e.g.
          # the maintainer ran `gh release create` manually after pushing
          # the tag), upload assets to the existing release. Otherwise
          # create the release with assets. `--clobber` lets re-runs
          # overwrite assets that a previous failed attempt partially
          # uploaded.
          BARE="${VERSION#v}"
          NOTE="release-assets/rivet-${BARE}-release-note.md"
          test -s "$NOTE"

          # REQ-369: compose the body OURSELVES rather than combining
          # --notes-file with --generate-notes. gh documents no interaction
          # between those two flags — neither precedence nor concatenation —
          # so relying on it would make the body depend on the gh build that
          # happens to be on the runner, and a build that preferred the
          # generated notes would silently ship the pull-request-list body
          # this requirement exists to replace. The generate-notes REST
          # endpoint is read-only and returns exactly what --generate-notes
          # would have produced, so asking for it explicitly and pasting it
          # under the trace-derived note is deterministic.
          . tools/release/release-note.sh
          GEN="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                   -f tag_name="$VERSION" --jq .body 2>/dev/null || true)"
          if [ -z "$GEN" ]; then
            echo "::warning::generate-notes returned nothing; the body carries the release note alone"
          fi
          compose_release_body "$NOTE" "$GEN" > release-body.md

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release $VERSION already exists; uploading assets"
            gh release upload "$VERSION" --clobber release-assets/*
            # REQ-369: this is the LIVE path, not a hypothetical one — the
            # maintainer tags after main is green and may create the release
            # by hand. Setting the body only on the create path would leave
            # this requirement doing nothing where it counts. Anything they
            # wrote is PRESERVED below the generated note rather than lost.
            EXISTING="$(gh release view "$VERSION" --json body -q .body)"
            if body_carries_note "$EXISTING"; then
              echo "::notice::existing body already carries the generated note"
            else
              compose_release_body "$NOTE" "$EXISTING" > release-body.md
              gh release edit "$VERSION" --notes-file release-body.md
            fi
          else
            echo "::notice::Creating Release $VERSION with assets"
            gh release create "$VERSION" \
              --title "Rivet $VERSION" \
              --notes-file release-body.md \
              release-assets/*
          fi

          # REQ-369: assert the body actually carries the note. The
          # composition above is deterministic, so this is a regression
          # guard rather than a bet — but a release published without its
          # 11-03 item is exactly the defect being closed, and absence is
          # not success, so the check is positive and by name.
          if ! body_carries_note "$(gh release view "$VERSION" --json body -q .body)"; then
            echo "::error::release body does not carry the generated 11-03 note"
            exit 1
          fi
          echo "::notice::release body carries the generated release note"

  # ── Publish VS Code Extension to Marketplace ──────────────────────────
  # Runs after create-release so the VSIX is always on the Release page
  # even if Marketplace publish fails or VSCE_PAT isn't set. The
  # conditional guard prints a visible warning rather than silently
  # skipping, which is how the previous ci.yml flow made "rivet extension
  # never reaches Marketplace" invisible.
  publish-vsix-marketplace:
    name: Publish VSIX to VS Code Marketplace
    needs: [create-release]
    runs-on: ubuntu-latest
    # The VS Code Marketplace is a SEPARATE distribution channel (RELEASING.md):
    # a failure here (e.g. an expired VSCE PAT) must NOT fail the overall Release
    # run, because `release-npm.yml` triggers on `workflow_run.conclusion ==
    # 'success'` — so a red marketplace job was silently SKIPPING the npm publish
    # (v0.17.0 shipped binaries but npm froze at 0.16.1 until a manual backfill).
    # `build-test-evidence` is already continue-on-error for the same reason; the
    # core release (binaries + GitHub Release via create-release) still gates.
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT secret is not configured. VSIX is attached to the GitHub Release but WILL NOT be published to the Marketplace."
            echo "::warning::See https://code.visualstudio.com/api/working-with-extensions/publishing-extension for PAT setup."
            exit 0
          fi
          npx @vscode/vsce publish --packagePath vsix/*.vsix
