# temper's gate probe (pulseengine/temper docs/gate-probe.md): runs
# tools/ci/detect-changes.sh on control paths and fails if a declared output
# (.github/gate-probe.json) fails open. Report-only: it is not a required
# check. Making it one is a later, per-repo step smithy applies after the
# owner approves; keep the check name `gate-probe` stable for that.
#
# temper's rules for this workflow: no path filter, no `if:`, no
# continue-on-error, never pull_request_target. Control paths live only in
# .github/gate-probe.json.
name: gate-probe
on:
  pull_request:
permissions:
  contents: read
jobs:
  gate-probe:
    name: gate-probe
    # The probe executes the PR's own detector script, so a fork PR must not
    # reach the self-hosted pool (which accepts public repos): one mistaken
    # fork approval would run untrusted code there. Forks go to a GitHub-hosted
    # runner; the job still runs on every PR, so it cannot be skipped.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","light"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # temper 308848d1 (main, CI run 42897869007 green, 2026-11-10): the
      # gate-probe contract with negative_controls and exempt_outputs, plus
      # the fork-routing rule above; no tracked Python bytecode.
      - uses: pulseengine/temper/.github/actions/gate-probe@308848d151a0fdd0fc5eb8af0531addbf6f36ef4
