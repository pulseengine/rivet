name: Benchmarks

# Cancel superseded PR runs; keep every main commit's run conclusive.
# On push the group falls back to `github.sha` (not `github.ref`) so a later
# main push never supersedes an earlier main run (incl. queued ones) — #436.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # REQ-412: run the benchmarks only when Rust build inputs changed, using the
  # same detector as ci.yml (tools/ci/detect-changes.sh). Job-level `if:`, not
  # workflow-level `paths:`: a workflow that never starts leaves its checks
  # pending. Push to main always reports rust=true, so the gh-pages baseline
  # still gets a data point on every merge. The detector runs on ubuntu-latest
  # like the benchmark itself, so this workflow does not take the self-hosted
  # light runner that ci.yml's detector and CI Gate use.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: bash tools/ci/detect-changes.sh

  benchmark:
    name: Criterion Benchmarks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run criterion benchmarks
        run: cargo bench --bench core_benchmarks -- --output-format=bencher | tee benchmark-output.txt

      - name: Store and compare benchmark results
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Rivet Criterion Benchmarks
          tool: cargo
          output-file-path: benchmark-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Push results to gh-pages on main branch pushes
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Comment on PRs when there is a regression
          comment-on-alert: true
          # Alert threshold: warn at 120% of baseline
          alert-threshold: "120%"
          # Do not fail the workflow on regressions for now (baseline is being established)
          fail-on-alert: false
          # Keep benchmark data for the last 30 entries
          max-items-in-chart: 30
          # Only save data points on pushes to main (not on PRs)
          save-data-file: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
