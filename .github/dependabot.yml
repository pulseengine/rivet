version: 2
# Grouped monthly updates (fleet template, owner decision 2026-11-21).
# One entry per ecosystem, its directories in one `directories:` list, so a
# release opens one PR and not one per directory. Every entry runs monthly
# (the 1st, 02:00 UTC), keeps at most 2 PRs open, and waits 7 days after a
# release (cooldown). Lockstep groups come first because Dependabot puts a
# dependency in the FIRST group it matches; then one minor-patch group.
# Majors stay ungrouped, one PR each, so a breaking change is read on its own.
# Security updates ignore the schedule and the limit.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directories:
      - /
      - /etch
      - /fuzz
      - /rivet-cli
      - /rivet-core
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      wasm-tools-family:
        patterns:
          - "wasmparser"
          - "wasm-encoder"
          - "wasmprinter"
          - "wit-component"
          - "wit-parser"
          - "wasm-metadata"
          - "wat"
          - "walrus"
      wasmtime:
        patterns:
          - "wasmtime"
          - "wasmtime-*"
      # spar-hir and spar-analysis come from one spar tag and must move together.
      spar:
        patterns:
          - "spar-*"
      minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directories:
      - /npm
      - /vscode-rivet
      - /platform-packages/darwin-arm64
      - /platform-packages/linux-arm64
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    ignore:
      # /npm: the platform packages are rivet's own release artifacts;
      # release-npm.yml sets their versions at publish time, so the committed
      # pins are not bumped.
      - dependency-name: "@pulseengine/rivet-*"
      # /vscode-rivet: @types/vscode must not exceed engines.vscode (^1.91.0),
      # or vsce refuses to package. Raise both together, by hand.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
