version: 2
# One PR per logical release across all directories: version-locked families
# (wasm-tools, wasmtime) and all github-actions pins in / must not split into
# one PR per directory. (Learned from loom/witness/mcp/relay/rules_wasm_component,
# where one release arrived as 4-8 PRs.)
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions-all:
        patterns:
          - "*"
  # One cargo entry over every directory, so a grouped release opens one PR
  # and not one per directory.
  - package-ecosystem: cargo
    directories:
      - /
      - /etch
      - /fuzz
      - /rivet-cli
      - /rivet-core
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      wasm-tools-family:
        patterns:
          - "wasmparser"
          - "wasm-encoder"
          - "wasmprinter"
          - "wit-component"
          - "wit-parser"
          - "wasm-metadata"
          - "wat"
          - "walrus"
      wasmtime:
        patterns:
          - "wasmtime"
          - "wasmtime-*"
      # spar-hir and spar-analysis come from one spar tag and must move together.
      spar:
        patterns:
          - "spar-*"
  - package-ecosystem: npm
    directory: /npm
    schedule:
      interval: weekly
    # The platform packages are rivet's own release artifacts: release-npm.yml
    # sets their versions at publish time, so the committed pins are not bumped.
    ignore:
      - dependency-name: "@pulseengine/rivet-*"
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /vscode-rivet
    schedule:
      interval: weekly
    labels:
      - dependencies
    # @types/vscode must not exceed engines.vscode (^1.91.0), or vsce
    # refuses to package. Raise both together, by hand.
    ignore:
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: npm
    directory: /platform-packages/darwin-arm64
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /platform-packages/darwin-x64
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /platform-packages/linux-arm64
    schedule:
      interval: weekly
    labels:
      - dependencies
