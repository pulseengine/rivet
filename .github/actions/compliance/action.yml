name: Rivet Compliance Report
description: >
  Generate a self-contained HTML compliance report from rivet-managed artifacts.
  Produces an archive with traceability matrix, coverage, validation, requirements
  spec, and rendered documents — ready for audit evidence or static hosting.

  See https://github.com/pulseengine/rivet for documentation.

inputs:
  # ── Report configuration ───────────────────────────────────────────
  report-label:
    description: >
      Display label shown in the report header and version switcher
      (e.g., "v0.1.0", "Sprint 42", "2026-Q1 Release"). This is purely
      cosmetic — it does not select which code to build.
      Defaults to the git tag if triggered by a tag push, or "dev".
    required: false
    default: ''

  homepage:
    description: >
      URL for the "back" link in the report navigation bar. When set,
      a "← {project}" link appears in the header pointing to this URL.
      Example: "https://pulseengine.eu/projects/"
    required: false
    default: ''

  other-versions:
    description: >
      JSON array of other report versions for the version switcher dropdown.
      Each entry has "label" (display name) and "path" (relative URL to
      that version's report directory).
      Example: [{"label":"v0.1.0","path":"../v0.1.0/"},{"label":"latest","path":"../latest/"}]
    required: false
    default: '[]'

  theme:
    description: 'Color theme for the report: "dark" (PulseEngine style) or "light" (print-friendly).'
    required: false
    default: 'dark'

  offline:
    description: 'When true, uses system fonts instead of loading Google Fonts. For air-gapped environments. Defaults to true for compliance reports — auditors typically open the bundle disconnected.'
    required: false
    default: 'true'

  single-page:
    description: >
      When true, emits a single self-contained `index.html` (typically
      1-5 MB) with all sections inline — index / requirements / documents
      / STPA / EU AI Act / coverage / matrix / validation / graph. This
      is the audit-bundle shape: one file, no per-page navigation, no
      external resources, browser-openable offline.

      When false, emits the full multi-page dashboard mirror (hundreds
      of pages, ~100s of MB). Useful for browseable hosted docs but
      oversized for an audit deliverable.
    required: false
    default: 'true'

  # ── Rivet tool ─────────────────────────────────────────────────────
  rivet-version:
    description: >
      Which rivet release to use for generating the report. Set to a
      release tag (e.g., "v0.1.0") to download a pre-built binary, or
      "source" to build from the repo's own rivet-cli crate (for
      dogfooding). Defaults to "source" since rivet is not yet on crates.io.
    required: false
    default: 'source'

  # ── Output ─────────────────────────────────────────────────────────
  output:
    description: 'Output directory for the generated HTML files.'
    required: false
    default: 'compliance'

  archive:
    description: 'When true, creates a tar.gz archive of the report directory.'
    required: false
    default: 'true'

  archive-name:
    description: >
      Filename for the archive (without .tar.gz extension). Defaults to
      "{project}-{label}-compliance-report" derived from rivet.yaml.
    required: false
    default: ''

  project-dir:
    description: 'Path to the directory containing rivet.yaml.'
    required: false
    default: '.'

  # ── Audit bundle additions (REQ-090) ───────────────────────────────
  include-data-formats:
    description: >
      When true, the report directory also includes a ReqIF 1.2 export
      (`requirements.reqif`, OMG standard importable into DOORS /
      Polarion / codeBeamer) and a generic-yaml export (`artifacts.yaml`,
      human-readable diff-friendly) plus a `README.md` documenting the
      bundle layout. This is the v0.13.0 audit-bundle shape: rendered
      docs + coverage + matrix + validate + machine-importable data
      side-by-side — what compliance reviewers actually need.

      Defaults to `false` so existing callers see no behaviour change.
    required: false
    default: 'false'

outputs:
  report-dir:
    description: 'Path to the directory containing the generated HTML files.'
    value: ${{ steps.export.outputs.report-dir }}
  archive-path:
    description: 'Path to the tar.gz archive (only set when archive=true).'
    value: ${{ steps.archive.outputs.archive-path }}
  artifact-count:
    description: 'Total number of artifacts found in the project.'
    value: ${{ steps.stats.outputs.artifact-count }}
  validation-result:
    description: 'Validation outcome: "PASS" or "FAIL".'
    value: ${{ steps.validate.outputs.result }}

runs:
  using: composite
  steps:
    - name: Install Rivet
      shell: bash
      env:
        RIVET_VERSION: ${{ inputs.rivet-version }}
      run: |
        if [ "$RIVET_VERSION" = "source" ]; then
          echo "Building rivet from source..."
          cargo build --release -p rivet-cli
          cp target/release/rivet "$HOME/.cargo/bin/rivet"
        else
          echo "Downloading rivet ${RIVET_VERSION}..."
          ARCH="$(uname -m)"
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          case "${OS}-${ARCH}" in
            linux-x86_64)  TARGET="x86_64-unknown-linux-gnu" ;;
            linux-aarch64) TARGET="aarch64-unknown-linux-gnu" ;;
            darwin-x86_64) TARGET="x86_64-apple-darwin" ;;
            darwin-arm64)  TARGET="aarch64-apple-darwin" ;;
            *) echo "Unsupported platform: ${OS}-${ARCH}"; exit 1 ;;
          esac
          URL="https://github.com/pulseengine/rivet/releases/download/${RIVET_VERSION}/rivet-${RIVET_VERSION}-${TARGET}.tar.gz"
          curl -sL "$URL" | tar xz -C "$HOME/.cargo/bin/"
          chmod +x "$HOME/.cargo/bin/rivet"
        fi
        rivet --version

    - name: Validate
      id: validate
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: |
        set +e
        OUTPUT=$(rivet validate 2>&1)
        RC=$?
        set -e
        echo "$OUTPUT"
        if echo "$OUTPUT" | grep -q "Result: PASS"; then
          echo "result=PASS" >> "$GITHUB_OUTPUT"
        else
          echo "result=FAIL" >> "$GITHUB_OUTPUT"
        fi

    - name: Stats
      id: stats
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: |
        COUNT=$(rivet stats 2>&1 | grep TOTAL | awk '{print $2}')
        echo "artifact-count=${COUNT}" >> "$GITHUB_OUTPUT"

    - name: Determine report label
      id: label
      shell: bash
      env:
        INPUT_LABEL: ${{ inputs.report-label }}
      run: |
        LABEL="$INPUT_LABEL"
        if [ -z "$LABEL" ]; then
          LABEL="${GITHUB_REF#refs/tags/}"
          if [ "$LABEL" = "$GITHUB_REF" ]; then
            LABEL="dev"
          fi
        fi
        echo "value=${LABEL}" >> "$GITHUB_OUTPUT"

    - name: Export HTML report
      id: export
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      env:
        REPORT_LABEL: ${{ steps.label.outputs.value }}
        REPORT_THEME: ${{ inputs.theme }}
        REPORT_OUTPUT: ${{ inputs.output }}
        REPORT_HOMEPAGE: ${{ inputs.homepage }}
        REPORT_VERSIONS: ${{ inputs.other-versions }}
        REPORT_OFFLINE: ${{ inputs.offline }}
        REPORT_SINGLE_PAGE: ${{ inputs.single-page }}
      run: |
        ARGS="--format html --output ${REPORT_OUTPUT}"
        ARGS="$ARGS --theme ${REPORT_THEME}"
        ARGS="$ARGS --version-label ${REPORT_LABEL}"

        if [ -n "$REPORT_HOMEPAGE" ]; then
          ARGS="$ARGS --homepage ${REPORT_HOMEPAGE}"
        fi

        if [ "$REPORT_VERSIONS" != "[]" ]; then
          ARGS="$ARGS --versions '${REPORT_VERSIONS}'"
        fi

        if [ "$REPORT_OFFLINE" = "true" ]; then
          ARGS="$ARGS --offline"
        fi

        if [ "$REPORT_SINGLE_PAGE" = "true" ]; then
          ARGS="$ARGS --single-page"
        fi

        eval rivet export $ARGS
        echo "report-dir=${REPORT_OUTPUT}" >> "$GITHUB_OUTPUT"

    - name: Add ReqIF + generic-yaml + README (REQ-090 audit bundle)
      if: inputs.include-data-formats == 'true'
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      env:
        REPORT_OUTPUT: ${{ inputs.output }}
        REPORT_LABEL: ${{ steps.label.outputs.value }}
      run: |
        set -euo pipefail
        # ReqIF (OMG standard) — importable into DOORS, Polarion, codeBeamer.
        rivet export --format reqif --output "${REPORT_OUTPUT}/requirements.reqif"
        # generic-yaml — diff-friendly, machine-readable, complete.
        rivet export --format generic-yaml --output "${REPORT_OUTPUT}/artifacts.yaml"
        # Bundle README — tells the reviewer what each piece is.
        cat > "${REPORT_OUTPUT}/README.md" <<EOF
        # Rivet compliance bundle — ${REPORT_LABEL}

        This tarball is the full audit-deliverable view of the rivet
        project at this release. It is meant to be opened on disk
        (no web server required) and to feed downstream tools.

        ## What's here

        | Path                  | What it is                                        |
        |-----------------------|---------------------------------------------------|
        | \`index.html\`        | Project overview + navigation entry point.        |
        | \`documents/\`        | Rendered SRS / SDD / SAD / STPA / etc. specs with resolved artifact tables. |
        | \`coverage/\`         | Coverage percentage per traceability rule.        |
        | \`matrix/\`           | Traceability matrix (type × type).                |
        | \`validate/\`         | Validation diagnostics — same set \`rivet validate\` emits. |
        | \`graph/\`            | Artifact dependency graph view.                   |
        | \`stpa/\`             | STPA hierarchy (losses → hazards → constraints → controls). |
        | \`eu-ai-act/\`        | EU AI Act compliance view (when the schema is loaded). |
        | \`help/\`             | Per-schema-type help pages.                       |
        | \`artifacts/\`        | Per-artifact detail pages — drilldown only.       |
        | \`_assets/\`          | Shared CSS + JS (one copy, referenced by every page — REQ-088). |
        | \`requirements.reqif\` | OMG ReqIF 1.2 export — importable into DOORS / Polarion / codeBeamer. |
        | \`artifacts.yaml\`    | generic-yaml export — diff-friendly, complete.    |

        ## Importing into a requirements-management tool

        \`requirements.reqif\` is the OMG-standard ReqIF 1.2 format. In
        DOORS, Polarion, and codeBeamer it imports as a new module
        carrying every artifact, link, and field. \`artifacts.yaml\` is
        the same data in rivet's native YAML — useful for grep, diff,
        and re-ingestion into another rivet project.

        ## Provenance

        Generated from rivet ${REPORT_LABEL} by
        \`.github/actions/compliance\` with \`include-data-formats: true\`.
        Asset deduplication via REQ-088. ReqIF/generic-yaml exports
        per REQ-090.
        EOF
        echo "Audit bundle additions emitted to ${REPORT_OUTPUT}/"

    - name: Create archive
      id: archive
      if: inputs.archive == 'true'
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      env:
        REPORT_LABEL: ${{ steps.label.outputs.value }}
        ARCHIVE_NAME: ${{ inputs.archive-name }}
        REPORT_OUTPUT: ${{ inputs.output }}
      run: |
        NAME="$ARCHIVE_NAME"
        if [ -z "$NAME" ]; then
          PROJECT=$(grep 'name:' rivet.yaml | head -1 | awk '{print $2}' | tr -d '"')
          NAME="${PROJECT:-project}-${REPORT_LABEL}-compliance-report"
        fi
        tar -czf "${NAME}.tar.gz" -C "$REPORT_OUTPUT" .
        echo "archive-path=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
        echo "Created ${NAME}.tar.gz"
