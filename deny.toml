# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Vulnerabilities are denied by default in cargo-deny >=0.16.
# Yanked crates produce warnings by default.
ignore = [
    # `instant` is unmaintained (RUSTSEC-2024-0384) but pulled in transitively
    # by notify 7.0.0 → notify-types. No fix available upstream yet.
    "RUSTSEC-2024-0384",
    # (wasmtime 42.x advisories removed 2026-09-10: resolved by the 44->45 bump;
    # cargo-deny reported them as advisory-not-encountered, i.e. matching nothing.)
    # (thin-vec RUSTSEC-2026-0103 removed 2026-09-10: no longer matches the tree.)
    # The gluesql-core chain: gluesql-core -> im -> sized-chunks -> bitmaps.
    # All three are unmaintained (bmwill/im-rs archived). gluesql-core is the
    # `sql` feature's engine, default-on so `rivet sql` ships; the minimal
    # `--no-default-features` build (REQ-202) excludes the whole chain.
    # Accepted rather than fixed: there is no upstream im replacement gluesql
    # has moved to, and swapping the SQL engine is a far larger change than the
    # exposure warrants. Revisit if gluesql bumps, or if an advisory upgrades
    # from unmaintained to a vulnerability. Recorded as a DECISION rather than
    # left as an absence (REQ-347).
    "RUSTSEC-2026-0247",  # bitmaps
    "RUSTSEC-2026-0248",  # im
    "RUSTSEC-2026-0251",  # sized-chunks
]

[licenses]
# Confidence threshold for license detection
confidence-threshold = 0.8
# List of allowed licenses (anything not listed is denied)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]

[bans]
# Lint level for multiple versions of the same crate
multiple-versions = "warn"
# Lint level for wildcard dependencies
wildcards = "allow"
# Deny specific crates known to be problematic
deny = [
    # Use rustls instead of openssl for TLS
    # { name = "openssl-sys" },
]

[sources]
# Lint level for crates not from crates.io
unknown-registry = "deny"
unknown-git = "warn"
# Allow crates from these registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
