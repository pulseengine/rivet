# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Vulnerabilities are denied by default in cargo-deny >=0.16.
# Yanked crates produce warnings by default.
ignore = [
    # `instant` is unmaintained (RUSTSEC-2024-0384) but pulled in transitively
    # by notify 7.0.0 → notify-types. No fix available upstream yet.
    "RUSTSEC-2024-0384",
    # (wasmtime 42.x advisories removed 2026-09-10: resolved by the 44->45 bump;
    # cargo-deny reported them as advisory-not-encountered, i.e. matching nothing.)
    # (thin-vec RUSTSEC-2026-0103 removed 2026-09-10: no longer matches the tree.)
    # The gluesql-core chain: gluesql-core -> im -> sized-chunks -> bitmaps.
    # All three are unmaintained (bmwill/im-rs archived). gluesql-core is the
    # `sql` feature's engine, default-on so `rivet sql` ships; the minimal
    # `--no-default-features` build (REQ-202) excludes the whole chain.
    # Accepted rather than fixed: there is no upstream im replacement gluesql
    # has moved to, and swapping the SQL engine is a far larger change than the
    # exposure warrants. Revisit if gluesql bumps, or if an advisory upgrades
    # from unmaintained to a vulnerability. Recorded as a DECISION rather than
    # left as an absence (REQ-347).
    # The same chain also carries two UNSOUND advisories with no patched
    # version: RUSTSEC-2023-0126 (im OrdSet insertion aliasing) and
    # RUSTSEC-2026-0255 (sized-chunks panic-safety). They need no ignore here
    # because cargo-deny reports `unsound` only for crates the workspace
    # depends on directly, but they are part of what this decision accepts.
    "RUSTSEC-2026-0247",  # bitmaps
    "RUSTSEC-2026-0248",  # im
    "RUSTSEC-2026-0251",  # sized-chunks
    # (salsa RUSTSEC-2026-0308 removed 2026-11-12: fixed by salsa 0.28.5,
    # which came with the spar v0.48.1 bump; REQ-376.)
    # rmcp 1.5.0 — RUSTSEC-2026-0462, unbounded response-body buffering in
    # the Streamable HTTP CLIENTS. Fixed in rmcp >= 3.9.0.
    #
    # ASSESSED NOT APPLICABLE, not deferred. The advisory names the affected
    # code: the `transport-streamable-http-client-reqwest` and
    # `transport-streamable-http-client-unix-socket` features. rivet enables
    # neither: rivet-cli's `mcp` feature takes `server`, `transport-io`,
    # `macros` and `transport-streamable-http-server`, and its dev-dependency
    # takes `client` and `transport-child-process` (a stdio client over a
    # child process, used by the MCP tests). Measured 2026-11-10 with
    # `cargo tree -e features -i rmcp`: no `transport-streamable-http-client*`
    # feature is enabled anywhere in the graph.
    #
    # WHY NOT JUST UPGRADE: 1.5 -> 3.9 is two major versions of the MCP SDK
    # under rivet's MCP server (FEAT-080), a migration rather than a bump.
    #
    # RE-CHECK THIS before enabling any `transport-streamable-http-client*`
    # feature, and by 2027-02-01 at the latest (owner: rivet maintainers).
    # The real fix is the rmcp 3.x migration.
    "RUSTSEC-2026-0462",  # rmcp (assessed not applicable — see above)
]

[licenses]
# Confidence threshold for license detection
confidence-threshold = 0.8
# List of allowed licenses (anything not listed is denied)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]

[bans]
# Lint level for multiple versions of the same crate
multiple-versions = "warn"
# Lint level for wildcard dependencies
wildcards = "allow"
# Deny specific crates known to be problematic
deny = [
    # Use rustls instead of openssl for TLS
    # { name = "openssl-sys" },
]

[sources]
# Lint level for crates not from crates.io
unknown-registry = "deny"
unknown-git = "warn"
# Allow crates from these registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Analyse every feature, not only the defaults (#1034, REQ-402). wasmtime is
# optional (rivet-core's `wasm` feature); with default features cargo-deny never
# saw it and passed `advisories ok` on wasmtime 48.0.3 while cargo audit, which
# reads all of Cargo.lock, reported seven advisories.
[graph]
all-features = true
