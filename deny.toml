# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Vulnerabilities are denied by default in cargo-deny >=0.16.
# Yanked crates produce warnings by default.
ignore = [
    # `instant` is unmaintained (RUSTSEC-2024-0384) but pulled in transitively
    # by notify 7.0.0 → notify-types. No fix available upstream yet.
    "RUSTSEC-2024-0384",
    # (wasmtime 42.x advisories removed 2026-09-10: resolved by the 44->45 bump;
    # cargo-deny reported them as advisory-not-encountered, i.e. matching nothing.)
    # (thin-vec RUSTSEC-2026-0103 removed 2026-09-10: no longer matches the tree.)
    # The gluesql-core chain: gluesql-core -> im -> sized-chunks -> bitmaps.
    # All three are unmaintained (bmwill/im-rs archived). gluesql-core is the
    # `sql` feature's engine, default-on so `rivet sql` ships; the minimal
    # `--no-default-features` build (REQ-202) excludes the whole chain.
    # Accepted rather than fixed: there is no upstream im replacement gluesql
    # has moved to, and swapping the SQL engine is a far larger change than the
    # exposure warrants. Revisit if gluesql bumps, or if an advisory upgrades
    # from unmaintained to a vulnerability. Recorded as a DECISION rather than
    # left as an absence (REQ-347).
    "RUSTSEC-2026-0247",  # bitmaps
    "RUSTSEC-2026-0248",  # im
    "RUSTSEC-2026-0251",  # sized-chunks
    # salsa 0.26.1 — RUSTSEC-2026-0308, use-after-free in interned values and
    # cached function results. Fixed in salsa >= 0.28.5.
    #
    # ASSESSED NOT APPLICABLE, not deferred. The advisory states its own
    # exemption: "Applications that disable garbage collection for all
    # explicitly declared interned structs ... and do not use implicitly
    # interned query arguments are not affected." Both clauses hold here:
    #   - rivet-core declares NO `#[salsa::interned]` struct (only
    #     `#[salsa::input]` and `#[salsa::tracked]`), so the first clause is
    #     vacuously satisfied. Same for spar, the other salsa consumer.
    #   - every one of the 17 tracked functions in `rivet-core/src/db.rs`
    #     takes `db` plus salsa INPUT structs only (SourceFile,
    #     SourceFileSet, SchemaInputSet, ExtraArtifactSet, FilterInput).
    #     None takes a plain value, so nothing is implicitly interned.
    #
    # WHY NOT JUST UPGRADE: rivet cannot move alone. spar v0.10.0 pins
    # `salsa = "0.26"` and rivet-core shares salsa types with spar-hir /
    # spar-analysis across the crate boundary. Bumping rivet to 0.28 resolves
    # to TWO salsa versions in one tree and rivet-core then fails to compile
    # with E0308/E0271 type mismatches — measured, not assumed. The upgrade is
    # a cross-repo change: spar must move first and cut a tag. Tracked as
    # REQ-376.
    #
    # RE-CHECK THIS when spar bumps, and BEFORE adding any interned struct or
    # any tracked function that takes a non-salsa argument — either of those
    # ends the exemption and makes this a live vulnerability.
    "RUSTSEC-2026-0308",  # salsa (assessed not applicable — see above)
]

[licenses]
# Confidence threshold for license detection
confidence-threshold = 0.8
# List of allowed licenses (anything not listed is denied)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]

[bans]
# Lint level for multiple versions of the same crate
multiple-versions = "warn"
# Lint level for wildcard dependencies
wildcards = "allow"
# Deny specific crates known to be problematic
deny = [
    # Use rustls instead of openssl for TLS
    # { name = "openssl-sys" },
]

[sources]
# Lint level for crates not from crates.io
unknown-registry = "deny"
unknown-git = "warn"
# Allow crates from these registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
