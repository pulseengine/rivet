# =============================================================================
# Tool Qualification — rivet's own typed confidence claim
# =============================================================================
#
# This file holds the rivet-on-rivet dogfood for the `tool-confidence`
# artifact type (TCL design A2, schemas/iso-26262.yaml). It pairs with
# `safety/stpa/tool-qualification.yaml` (the hazard analysis that
# justifies the claim) and `docs/design/tool-qualification-dossier.md`
# (the prose-shaped dossier).
#
# Why three files for one claim:
# - The STPA captures *why* tool errors are hazardous (Step 1).
# - The dossier explains the qualification argument in prose.
# - This file is the *machine-readable* claim that `rivet stats
#   --qualification` reads to emit a configuration baseline.
#
# Numbering follows ISO 26262-8 §11.4.7 Table 3: TCL1 = lowest demand,
# TCL3 = highest. Cross-walk to DO-330/TQL lives in
# docs/design/tool-confidence-level.md §2.7.
# =============================================================================

artifacts:

  - id: TQ-CONF-RIVET
    type: tool-confidence
    title: Rivet — tool confidence claim (ISO 26262-8 Part 8 §11.4.7)
    status: draft
    description: >
      Rivet's typed tool-qualification claim. **`claim-status:
      self-claimed`** — this is the *target shape* the maintainers aim
      to defend, not an externally-qualified credential. The TI/TD
      analysis points at the STPA in `safety/stpa/tool-qualification.yaml`
      (losses L-TQ-001..003, hazards H-TQ-001..007) and the mechanical
      detection layer (validate, oracle gating including
      `rivet check ai-defects-open`, Kani/Verus, mutation testing,
      cited-source verification, ai-found-defect triage). The dossier
      prose, including §0 "Honest scope statement" enumerating what is
      NOT yet defensible (no independent confirmation reviewer,
      unverified cross-walks, unproven independence, 29-mutant testing,
      one `Admitted` Rocq theorem, no signed SHA256SUMS, no DPIA
      enforcement), lives in `docs/design/tool-qualification-dossier.md`.
    tags: [safety, dogfood, iso-26262]
    fields:
      tool-id: rivet
      ti: TI2
      td: TD1
      tcl: TCL1
      regime: iso-26262
      claim-status: self-claimed
      scope: |
        Covered by this claim (in-scope subcommands):
          rivet validate, rivet commits (trailer audit), rivet coverage
          (single-org + supplier 3-state), rivet supplier {list,check},
          rivet check ai-defects-open (TCL workstream B TD1 gate).

        OUT OF SCOPE (NOT qualified): rivet sync, rivet supplier pull
          (Phase 2), rivet migrate, rivet serve, MCP write tools.

        ALSO NOT DEFENDED by this claim (see dossier §0):
          no independent confirmation reviewer; unverified
          DO-330/IEC 62304/EN 50128 cross-walks; unproven five-layer
          independence; 29-mutant testing; one `Admitted` Rocq theorem;
          one `assume`'d Verus obligation; unsigned SHA256SUMS;
          unsigned git tag; no validate-time enforcement of DPIA
          linkage from `ai-session.invoker`-bearing artifacts.
