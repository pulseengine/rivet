        target: H-TQ-001
      - type: verifies
        target: H-TQ-002
      - type: verifies
        target: H-TQ-003
      - type: verifies
        target: H-TQ-004
      - type: verifies
        target: H-TQ-005
      - type: verifies
        target: H-TQ-006
